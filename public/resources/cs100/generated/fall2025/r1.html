<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="3-%E5%BC%80%E5%A7%8B-1">3. 开始</h2>
<h4 id="31-%E4%B8%BA%E4%BB%80%E4%B9%88%E8%A6%81%E5%AD%A6-cc">3.1. 为什么要学 C/C++ ？</h4>
<ul>
<li>为什么要学微积分/离散数学/XXXX/......？</li>
</ul>
<p><strong>重走一个学科/领域从无到有的发现历程</strong></p>
<ul>
<li>理解学科中的基本思想、基本方法、里程碑、走过的弯路</li>
<li>锻炼学习的能力</li>
<li>应用、创新、革命 ......</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="3-%E5%BC%80%E5%A7%8B-2">3. 开始</h2>
<h4 id="32-%E6%80%8E%E6%A0%B7%E5%AD%A6%E5%A5%BD%E8%BF%99%E9%97%A8%E8%AF%BE">3.2. 怎样学好这门课</h4>
<p>关键：<strong>把课件、课本等资料上的示例代码独立地实现一遍</strong></p>
<ul>
<li>作业也会有很多直接来自于课件（包括习题课）的题目
<ul>
<li>看懂、掌握基本的知识</li>
<li>（尝试）独立地实现</li>
<li>对比课件上的写法，有什么区别？哪种更好？</li>
</ul>
</li>
<li>仅仅做到能“看懂”是<strong>不够的</strong>，只有独立实现才能内化为自己的知识。
<ul>
<li>学数学也是如此。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="3-%E5%BC%80%E5%A7%8B-3">3. 开始</h2>
<h4 id="33-%E5%85%B3%E4%BA%8E%E5%AD%A6%E6%9C%AF%E8%AF%9A%E4%BF%A1">3.3. 关于学术诚信</h4>
<p>我们采取相对宽松的规则。</p>
<ul>
<li>简单题、教学题不查重，鼓励模仿和借鉴<strong>好的写法</strong>、<strong>好的思路</strong>。
<ul>
<li>部分题目会设置与 TA 的线下 check 。</li>
</ul>
</li>
<li><strong>允许</strong>帮别人 debug 。</li>
<li>鼓励使用 AI 工具辅助学习，比如让 ChatGPT/Copilot 帮你解释代码。
<ul>
<li>注意谨慎求证。</li>
</ul>
</li>
<li>但是禁止<strong>直接抄袭</strong>来自他人、网络、 AI 生成的代码。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-class="cols-2" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="cols-2" data-marpit-pagination="12" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--class:cols-2;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="about-tas-responsibilities">About TA's responsibilities...</h2>
<div class="ldiv">
<h4 id="you-can-ask-tas-to">You can ask TAs to:</h4>
<ul>
<li>帮你看看你代码可能存在的问题</li>
<li>帮助你理解课程内容</li>
<li>向 TA 寻求学习建议</li>
<li>...</li>
</ul>
</div>
<div class="rdiv">
<h4 id="tas-can-refuse-you-to">TAs can refuse you to:</h4>
<ul>
<li><strong>给 AI 生成的代码 Debug</strong></li>
<li>在你没有进行<strong>任何有意义的探索</strong>的情况下帮你 Debug</li>
<li>咨询请假事务和其他事务</li>
<li>在 Deadline 之前提供你正确的代码</li>
<li>延长作业 Deadline</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-class="trans" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="trans" style="--class:trans;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-size="16:9">
<h2 id="4-review">4. Review</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="4-review-1">4. Review</h2>
<h4 id="41-%E7%8E%AF%E5%A2%83%E9%85%8D%E7%BD%AE">4.1. 环境配置</h4>
<ul>
<li>Option 1 : Code editor + Compiler
<ul>
<li>Code editor（代码编辑器）: VS Code</li>
<li>Compiler（编译器）: MinGW (Minimal GNU for Windows) is suggested for Windows users.</li>
</ul>
</li>
<li>Option 2 : IDE（Integrated Development Environment，集成开发环境）
<ul>
<li>CLion, Virtual Studio...</li>
</ul>
</li>
</ul>
<p><strong>如果你刚刚开始，建议使用 <code>VS Code</code></strong>，因为它通常可以满足你作为初学者的所有需求。</p>
<p>随着项目的增长和任务的变得更加复杂，您可能需要考虑在工具链中添加一个 IDE，因为它们可以帮助您完成一些非常具有挑战性的日常任务。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="4-review-2">4. Review</h2>
<h4 id="42-introduction-to-cc">4.2. Introduction to C/C++</h4>
<ul>
<li>C / C++ 和 Python 有什么不同
<ul>
<li>C / C++ 的<strong>编译</strong>（Compile）</li>
<li>Python <strong>解释</strong>（Inteprete）</li>
</ul>
</li>
<li>如何运行一个 C 语言程序？</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="4-review-3">4. Review</h2>
<h4 id="43-%E7%BC%96%E8%AF%91%E8%AF%AD%E8%A8%80%E5%92%8C%E8%A7%A3%E9%87%8A%E8%AF%AD%E8%A8%80">4.3. 编译语言和解释语言</h4>
<p><img src="img/20240923020319.png" alt="#c " /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-class="cols-2" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="cols-2" data-marpit-pagination="17" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--class:cols-2;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="43-%E7%BC%96%E8%AF%91%E8%AF%AD%E8%A8%80%E5%92%8C%E8%A7%A3%E9%87%8A%E8%AF%AD%E8%A8%80-1">4.3. 编译语言和解释语言</h2>
<div class="ldiv">
<h4 id="%E7%BC%96%E8%AF%91%E6%80%A7%E8%AF%AD%E8%A8%80%E4%BC%9A%E6%9B%B4%E6%9C%89%E6%95%88%E7%8E%87">编译性语言会更有效率</h4>
<ul>
<li>C 语言会把程序在编译的时候编译成二进制执行文件（<code>.exe</code> / <code>.o</code>）</li>
<li>为了方便有时候程序员会把万行代码拆成几百份小文件（<code>.c</code> / <code>.h</code>）
<ul>
<li>几百个源代码文件可以编译为几百个二进制执行文件（<code>.o</code>）</li>
<li>修改一行代码不需要编译所有的代码，只用编译那一行代码所在的一个文件</li>
</ul>
</li>
</ul>
</div>
<div class="rdiv">
<h4 id="%E8%A7%A3%E9%87%8A%E6%80%A7%E8%AF%AD%E8%A8%80%E4%BC%9A%E6%9B%B4%E6%9C%89%E7%81%B5%E6%B4%BB%E6%80%A7">解释性语言会更有灵活性</h4>
<ul>
<li>java 和 python 的源文件会在它们被运行的时候被<strong>解释</strong>成字节码</li>
<li>字节码是与平台无关的指令</li>
<li>因此，解释型语言通常具有“一次编写，到处运行”的特性</li>
</ul>
<p><img src="img/20240923124212.png" alt="#c" style="width:500px;" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-class="trans" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="trans" style="--class:trans;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-size="16:9">
<h2 id="5-%E7%BC%96%E8%AF%91%E8%BF%90%E8%A1%8C%E4%B8%80%E4%B8%AA-c-%E7%A8%8B%E5%BA%8F">5. 编译、运行一个 C 程序</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="5-%E7%BC%96%E8%AF%91%E8%BF%90%E8%A1%8C%E4%B8%80%E4%B8%AA-c-%E7%A8%8B%E5%BA%8F-1">5. 编译、运行一个 C 程序</h2>
<h4 id="51-%E7%BC%96%E8%AF%91%E5%92%8C%E8%BF%90%E8%A1%8C%E7%9A%84%E5%9F%BA%E6%9C%AC%E6%B5%81%E7%A8%8B">5.1. 编译和运行的基本流程</h4>
<p>假设我们现在有一个文件 &quot;hello.c&quot;.</p>
<ul>
<li>首先，我们需要编译它。
<ul>
<li>Command: <code>gcc hello.c -o hello</code>
<ul>
<li><code>-o</code>&quot; 即为指定输出文件的名字。如果没有<code>-o</code>，文件名就默认为&quot;a&quot;</li>
</ul>
</li>
<li>编译之后，<strong>可执行文件</strong>被生成
<ul>
<li>On Windows, it will be named &quot;<code>hello.exe</code>&quot;.</li>
<li>On Linux/MacOS, it will be named &quot;<code>hello</code>&quot;.</li>
</ul>
</li>
</ul>
</li>
<li>接下来，我们需要运行可执行文件：
<ul>
<li>Command: Linux/MacOS: <code>./hello</code>; Windows: <code>.\hello</code></li>
<li>当然你也可以双击它，但它会“一闪而过”。（因为运行结束后窗口就会关闭）</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-class="bq-red" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="bq-red" data-marpit-pagination="20" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--class:bq-red;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="5-%E7%BC%96%E8%AF%91%E8%BF%90%E8%A1%8C%E4%B8%80%E4%B8%AA-c-%E7%A8%8B%E5%BA%8F-2">5. 编译、运行一个 C 程序</h2>

<h4 id="52-%E5%9C%A8%E7%BB%88%E7%AB%AF%E4%B8%AD%E7%BC%96%E8%AF%91%E5%92%8C%E8%BF%90%E8%A1%8C">5.2. 在终端中编译和运行</h4>
<blockquote>
<p>将编译和运行的命令一同进行</p>
<p>We should type <code>gcc hello.c -o hello</code> and <code>./hello</code> in the <strong>terminal（终端）</strong> to compile and run.</p>
</blockquote>
<ul>
<li>终端是一个CLI（命令行界面），允许您与操作系统通信。您必须要求<strong>操作系统</strong>为您运行可执行文件。</li>
</ul>
<p><strong>在 VSCode/CLion 的终端中执行以上指令：</strong></p>
<ul>
<li>VSCode: <code>ctrl</code>+<code>`</code> 开启终端，默认 working directory 为当前打开的文件夹。
<ul>
<li>这就是为什么我们建议在 VSCode 中打开一个文件夹而不是单个文件。</li>
</ul>
</li>
<li>CLion: 最下面 &quot;Terminal&quot;/“终端”，或 <code>Alt</code>+<code>F12</code></li>
<li>可以先 <code>cd</code> 到方便的位置（如果需要的话）。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="5-%E7%BC%96%E8%AF%91%E8%BF%90%E8%A1%8C%E4%B8%80%E4%B8%AA-c-%E7%A8%8B%E5%BA%8F-3">5. 编译、运行一个 C 程序</h2>
<h4 id="53-%E7%8E%AF%E5%A2%83%E5%8F%98%E9%87%8F-path">5.3. 环境变量 <code>PATH</code></h4>
<p>当你执行 <code>gcc hello.c -o hello</code> 的时候，你唤醒的 <code>gcc</code> 是你安装在某处的 <code>gcc</code> (Linux/Mac) / <code>gcc.exe</code> (Windows)</p>
<p>例如，Windows 上的 <code>D:\mingw64\bin\gcc.exe</code></p>
<p>终端如何认识到你想找的 <code>gcc</code> 是 <code>D:\mingw64\bin\gcc.exe</code>？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="5-%E7%BC%96%E8%AF%91%E8%BF%90%E8%A1%8C%E4%B8%80%E4%B8%AA-c-%E7%A8%8B%E5%BA%8F-4">5. 编译、运行一个 C 程序</h2>
<h4 id="53-%E7%8E%AF%E5%A2%83%E5%8F%98%E9%87%8F-path-1">5.3. 环境变量 <code>PATH</code></h4>
<p>当你执行 <code>gcc hello.c -o hello</code> 的时候，你唤醒的 <code>gcc</code> 是你安装在某处的 <code>gcc</code> (Linux/Mac) / <code>gcc.exe</code> (Windows)</p>
<p>例如，Windows 上的 <code>D:\mingw64\bin\gcc.exe</code></p>
<p>终端如何认识到你想找的 <code>gcc</code> 是 <code>D:\mingw64\bin\gcc.exe</code>？</p>
<ul>
<li>将 <code>D:\mingw64\bin</code> 添加到环境变量 <code>PATH</code>。</li>
<li><code>PATH</code> 存储了一系列目录，当你在终端中输入一个命令时，系统会在这些目录中依次查找对应的可执行文件。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-class="cols-2-46" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="cols-2-46" data-marpit-pagination="23" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--class:cols-2-46;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="5-%E7%BC%96%E8%AF%91%E8%BF%90%E8%A1%8C%E4%B8%80%E4%B8%AA-c-%E7%A8%8B%E5%BA%8F-5">5. 编译、运行一个 C 程序</h2>
<div class="ldiv">
<p><strong>VSCode/CLion 本身不具备任何编译、运行、调试的功能！</strong></p>
<p>它只是把编译器、可执行文件和 GDB 的结果打在公屏上，然后给你提供一些方便操作的按钮。</p>
<p>请分清编辑器、编译器和 IDE 的区别！</p>
</div>
<div class="rimg">
<p><img src="img/does_vscode_support_cpp11.jpg" alt="#c" style="width:500px;" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-class="trans" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="trans" style="--class:trans;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-size="16:9">
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0">6. 初识函数</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-1">6. 初识函数</h2>
<h4 id="61-%E5%AE%9A%E4%B9%89%E4%B8%80%E4%B8%AA%E5%87%BD%E6%95%B0">6.1. 定义一个函数</h4>
<p>语法：<code>ReturnType FunctionName(Parameters) { FunctionBody }</code></p>
<ul>

}
</code></pre>
<p>和数学函数不同，C 函数不仅仅是“接受一些参数、返回一个值”，它实际上就是<strong>将一小段具有特定功能的代码单独拎出来，并且给它起个名字</strong>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-class="bq-red" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="bq-red" data-marpit-pagination="28" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--class:bq-red;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-4">6. 初识函数</h2>

<h4 id="62-c-%E7%9A%84%E5%8E%86%E5%8F%B2%E9%81%97%E7%95%99%E9%97%AE%E9%A2%98%E4%BB%AC">6.2. C 的历史遗留问题们</h4>
<blockquote>
<p>遗留问题 1</p>
<p>函数参数列表空着并不代表不接受参数</p>
</blockquote>
<p>和 C++ 不同，C 的参数列表为空，并不代表不接受参数，而是表示 &quot;accepting unknown parameters&quot;。这项规则自 C23 起才被删除。</p>
<ul>
<li>这是 C 的一个历史遗留问题。上古时期的 C 并不注重参数类型检查，这可能更接近汇编的风格，但也更容易出错。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-class="bq-red" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="bq-red" data-marpit-pagination="29" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--class:bq-red;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-5">6. 初识函数</h2>

<h4 id="62-c-%E7%9A%84%E5%8E%86%E5%8F%B2%E9%81%97%E7%95%99%E9%97%AE%E9%A2%98%E4%BB%AC-1">6.2. C 的历史遗留问题们</h4>
<blockquote>
<p>遗留问题 2</p>
<p>函数如果不写返回值类型，则返回值类型默认为 <code>int</code></p>
</blockquote>
<p>在 C99 之前，一个函数如果不写返回值类型，则返回值类型默认为 <code>int</code>。</p>
<p>事实上在旧的 C 语言中存在着大量的“默认为 <code>int</code>”的规则，在很多场合下这种写法极易引发难以预料的问题。</p>
<ul>
<li>不幸的是，为了兼容已经存在的上亿行旧代码，编译器大概率会允许这种写法，并仅仅给出一个 warning。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-class="bq-red" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="bq-red" data-marpit-pagination="30" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--class:bq-red;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-6">6. 初识函数</h2>

<h4 id="62-c-%E7%9A%84%E5%8E%86%E5%8F%B2%E9%81%97%E7%95%99%E9%97%AE%E9%A2%98%E4%BB%AC-2">6.2. C 的历史遗留问题们</h4>
<blockquote>
<p>遗留问题 2</p>
<p>函数如果不写返回值类型，则返回值类型默认为 <code>int</code></p>
</blockquote>
<p>你可能见过一些人写这样的 <code>main</code> 函数：</p>
<pre><code class="language-c">main() {
  <span class="hljs-comment">// ...</span>
}
</code></pre>
<p><strong>这不符合现代 C 语言的语法，也是极不推荐的写法。</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-class="bq-red" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="bq-red" data-marpit-pagination="31" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--class:bq-red;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-7">6. 初识函数</h2>

<h4 id="62-c-%E7%9A%84%E5%8E%86%E5%8F%B2%E9%81%97%E7%95%99%E9%97%AE%E9%A2%98%E4%BB%AC-3">6.2. C 的历史遗留问题们</h4>
<blockquote>
<p>遗留问题 3</p>
<p><strong>函数如果未经声明就被调用，C 和 C++ 的行为不同</strong></p>
</blockquote>
<p>调用一个未经声明的函数会发生什么？</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> x = my_mysterious_function();
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, x);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-class="bq-red" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="bq-red" data-marpit-pagination="32" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--class:bq-red;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-8">6. 初识函数</h2>

<h4 id="62-c-%E7%9A%84%E5%8E%86%E5%8F%B2%E9%81%97%E7%95%99%E9%97%AE%E9%A2%98%E4%BB%AC-4">6.2. C 的历史遗留问题们</h4>
<blockquote>
<p>遗留问题 3</p>
<p><strong>函数如果未经声明就被调用，C 和 C++ 的行为不同</strong></p>
</blockquote>
<p>C++ 编译器会给出一个十分正常的报错: &quot;... was not declared in this scope&quot;</p>
<pre><code>a.cpp: In function ‘int main()’:
a.cpp:4:11: error: ‘my_mysterious_function’ was not declared in this scope
    4 |   int x = my_mysterious_function();
      |           ^~~~~~~~~~~~~~~~~~~~~~
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-class="bq-red" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="bq-red" data-marpit-pagination="33" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--class:bq-red;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-9">6. 初识函数</h2>

<h4 id="62-c-%E7%9A%84%E5%8E%86%E5%8F%B2%E9%81%97%E7%95%99%E9%97%AE%E9%A2%98%E4%BB%AC-5">6.2. C 的历史遗留问题们</h4>
<blockquote>
<p>遗留问题 3</p>
<p><strong>函数如果未经声明就被调用，C 和 C++ 的行为不同</strong></p>
</blockquote>
<p>C 编译器会允许，并且给出一个令人困惑的 warning: &quot;implicit declaration&quot;（隐式的声明）</p>
<pre><code>a.c: In function ‘main’:
a.c:4:11: warning: implicit declaration of function ‘my_mysterious_function’
[-Wimplicit-function-declaration]
    4 |   int x = my_mysterious_function();
      |           ^~~~~~~~~~~~~~~~~~~~~~
</code></pre>
<p>当然，它是无法运行的，链接器会抱怨“找不到名为 <code>my_mysterious_function</code> 的函数”。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-class="bq-red" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="bq-red" data-marpit-pagination="34" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--class:bq-red;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-10">6. 初识函数</h2>

<h4 id="62-c-%E7%9A%84%E5%8E%86%E5%8F%B2%E9%81%97%E7%95%99%E9%97%AE%E9%A2%98%E4%BB%AC-6">6.2. C 的历史遗留问题们</h4>
<blockquote>
<p>遗留问题 3</p>
<p><strong>函数如果未经声明就被调用，C 和 C++ 的行为不同</strong></p>
</blockquote>
<p>C 标准认为你“隐式地声明” (implicitly declare) 了这个函数，于是压力全都给到链接器。</p>
<p>这一规则 C99 起被删除，但为了向后兼容 (backward compatibility)，编译器很可能仍然支持，只是给一个 warning。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-class="cols-2" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="cols-2" data-marpit-pagination="35" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--class:cols-2;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-11">6. 初识函数</h2>
<div class="ldiv">
<h4 id="63-main-%E5%87%BD%E6%95%B0%E7%9A%84%E8%BF%94%E5%9B%9E%E5%80%BC">6.3. <code>main</code> 函数的返回值</h4>
<p>函数的<strong>返回值</strong>是传给它的调用者的。</p>
<ul>
<li><code>main</code> 的“调用者”是谁？——程序的调用者/“宿主环境” (hosted environment)
<ul>
<li><code>main</code> 函数返回 <code>0</code> ——程序<strong>正常退出</strong></li>
<li><code>main</code> 函数返回其它值——代表<strong>某种错误</strong></li>
</ul>
</li>
<li>一些程序会用不同的返回值表达不同的含义。</li>
<li>也有的程序只在“任何错误”发生时都返回 <code>1</code> 。</li>
</ul>
</div>
<div class="rimg">
<p><img src="img/exp-ret.png" alt="#c" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-12">6. 初识函数</h2>
<h4 id="64-scanf-%E5%92%8C-printf-%E5%87%BD%E6%95%B0">6.4. <code>scanf</code> 和 <code>printf</code> 函数</h4>
<p><code>scanf</code> 和 <code>printf</code> 是 C 语言中最常用的输入输出函数，分别用于从标准输入读取数据和向标准输出打印数据。</p>
<blockquote>
<p>虽然文档有点复杂，但也要试着在这里检索你需要的信息。——GKxx</p>
<ul>
<li><a href="https://en.cppreference.com/w/c/io/fscanf">CPP Reference: <code>scanf</code></a></li>
<li><a href="https://en.cppreference.com/w/c/io/fprintf">CPP Reference: <code>printf</code></a></li>
</ul>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-fragments="2" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-13">6. 初识函数</h2>
<h4 id="64-scanf-%E5%92%8C-printf-%E5%87%BD%E6%95%B0-1">6.4. <code>scanf</code> 和 <code>printf</code> 函数</h4>
<p><strong><code>printf</code> 函数</strong></p>
<ul>
<li><strong>功能</strong>：向标准输出设备打印格式化的文本。</li>
<li><strong>基本语法</strong>：<pre><code class="language-c">include &lt;stdio.h&gt; <span class="hljs-comment">// 必须包含头文件</span>
<span class="hljs-type">int</span> <span class="hljs-title function_">printf</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">char</span> *format, ...)</span>;
</code></pre>
<ul>
<li data-marpit-fragment="1"><strong><code>format</code></strong>：字符串，包含要打印的文本和<strong>格式控制说明符</strong>。</li>
<li data-marpit-fragment="2"><strong><code>...</code></strong>：可变参数，其数量和类型必须与 <code>format</code> 中的格式控制说明符匹配。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-14">6. 初识函数</h2>
<h4 id="64-scanf-%E5%92%8C-printf-%E5%87%BD%E6%95%B0-2">6.4. <code>scanf</code> 和 <code>printf</code> 函数</h4>
<p><strong><code>printf</code> 函数的格式控制说明符</strong></p>
<table>
<thead>
<tr>
<th style="text-align:left">说明符</th>
<th style="text-align:left">用途</th>
<th style="text-align:left">示例</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>%d</code></td>
<td style="text-align:left">输出有符号十进制整数</td>
<td style="text-align:left"><code>printf(&quot;%d&quot;, 10);</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%f</code></td>
<td style="text-align:left">输出单精度浮点数</td>
<td style="text-align:left"><code>printf(&quot;%f&quot;, 3.14f);</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%lf</code></td>
<td style="text-align:left">输出双精度浮点数</td>
<td style="text-align:left"><code>printf(&quot;%lf&quot;, 3.14);</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%c</code></td>
<td style="text-align:left">输出单个字符</td>
<td style="text-align:left"><code>printf(&quot;%c&quot;, 'A');</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%s</code></td>
<td style="text-align:left">输出字符串</td>
<td style="text-align:left"><code>printf(&quot;%s&quot;, &quot;Hello&quot;);</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%p</code></td>
<td style="text-align:left">输出指针地址</td>
<td style="text-align:left"><code>printf(&quot;%p&quot;, &amp;var);</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-15">6. 初识函数</h2>
<h4 id="64-scanf-%E5%92%8C-printf-%E5%87%BD%E6%95%B0-3">6.4. <code>scanf</code> 和 <code>printf</code> 函数</h4>
<p><strong><code>printf</code> Example</strong></p>
<pre><code class="language-c">include &lt;stdio.h&gt;

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">()</span> {
    <span class="hljs-type">int</span> age = <span class="hljs-number">20</span>;
    <span class="hljs-type">float</span> height = <span class="hljs-number">1.75f</span>;
    <span class="hljs-type">char</span> grade = <span class="hljs-string">&#x27;A&#x27;</span>;
    <span class="hljs-type">char</span> name[] = <span class="hljs-string">&quot;Li Hua&quot;</span>;
    
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Hello, my name is %s.\n&quot;</span>, name);
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;I am %d years old and %.2f meters tall.\n&quot;</span>, age, height);
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;I got an %c in the last exam.\n&quot;</span>, grade);
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">

<h4 id="64-scanf-%E5%92%8C-printf-%E5%87%BD%E6%95%B0-4">6.4. <code>scanf</code> 和 <code>printf</code> 函数</h4>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-fragments="2" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-17">6. 初识函数</h2>
<h4 id="64-scanf-%E5%92%8C-printf-%E5%87%BD%E6%95%B0-5">6.4. <code>scanf</code> 和 <code>printf</code> 函数</h4>
<p><strong><code>scanf</code> 函数</strong></p>
<ul>
<li><strong>功能</strong>：从标准输入设备（通常是键盘）读取格式化的输入。</li>
<li><strong>基本语法</strong>：<pre><code class="language-c">include &lt;stdio.h&gt; <span class="hljs-comment">// 必须包含头文件</span>

<span class="hljs-type">int</span> <span class="hljs-title function_">scanf</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">char</span> *format, ...)</span>;
</code></pre>
<ul>
<li data-marpit-fragment="1"><strong><code>format</code></strong>：格式控制字符串，指定要读取的数据类型。</li>
<li data-marpit-fragment="2"><strong><code>...</code></strong>：可变参数，必须是<strong>变量的地址</strong>（使用 <code>&amp;</code> 取地址操作符，字符串数组名称本身即是地址）。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-18">6. 初识函数</h2>
<h4 id="64-scanf-%E5%92%8C-printf-%E5%87%BD%E6%95%B0-6">6.4. <code>scanf</code> 和 <code>printf</code> 函数</h4>
<p><strong><code>scanf</code> 函数的格式控制说明符</strong></p>
<table>
<thead>
<tr>
<th style="text-align:left">说明符</th>
<th style="text-align:left">用途</th>
<th style="text-align:left">示例</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>%d</code></td>
<td style="text-align:left">读取有符号十进制整数</td>
<td style="text-align:left"><code>scanf(&quot;%d&quot;, &amp;num);</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%f</code></td>
<td style="text-align:left">读取单精度浮点数</td>
<td style="text-align:left"><code>scanf(&quot;%f&quot;, &amp;score);</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%lf</code></td>
<td style="text-align:left">读取双精度浮点数</td>
<td style="text-align:left"><code>scanf(&quot;%lf&quot;, &amp;pi);</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%c</code></td>
<td style="text-align:left">读取单个字符</td>
<td style="text-align:left"><code>scanf(&quot;%c&quot;, &amp;ch);</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%s</code></td>
<td style="text-align:left">读取字符串（遇空白停止）</td>
<td style="text-align:left"><code>scanf(&quot;%s&quot;, str);</code></td>
</tr>
</tbody>
</table>
<p><strong>注意</strong>：除 <code>%s</code>（字符串存储在字符数组中）外，其他基本类型变量前<strong>必须</strong>加 <code>&amp;</code>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-19">6. 初识函数</h2>
<h4 id="64-scanf-%E5%92%8C-printf-%E5%87%BD%E6%95%B0-7">6.4. <code>scanf</code> 和 <code>printf</code> 函数</h4>
<p><strong><code>scanf</code> Example</strong></p>
<pre><code class="language-c">include &lt;stdio.h&gt;

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">()</span> {
    <span class="hljs-type">int</span> num1, num2;
    <span class="hljs-type">double</span> price;

    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Enter two integers and a double: &quot;</span>);
    <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d %d %lf&quot;</span>, &amp;num1, &amp;num2, &amp;price);
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;You entered: %d, %d, %.2f\n&quot;</span>, num1, num2, price);
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-20">6. 初识函数</h2>
<h4 id="64-scanf-%E5%92%8C-printf-%E5%87%BD%E6%95%B0-8">6.4. <code>scanf</code> 和 <code>printf</code> 函数</h4>
<p><strong>重要注意事项</strong></p>
<ol>
<li><strong><code>&amp;</code> 运算符</strong>：对于 <code>int</code>, <code>float</code>, <code>char</code> 等基本类型变量，<strong>必须</strong>使用 <code>&amp;</code> 获取其地址。<strong>错误示例</strong>：<code>scanf(&quot;%d&quot;, num);</code> (会导致未定义行为)。</li>
<li><strong><code>scanf</code> 的返回值</strong>：返回成功读取的数据项个数。可用于检查输入是否正确。<pre><code class="language-c"><span class="hljs-keyword">if</span> (<span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d %d&quot;</span>, &amp;a, &amp;b) != <span class="hljs-number">2</span>) { 
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Input error! Please enter two integers.\n&quot;</span>);
    <span class="hljs-comment">// 清理输入缓冲区等后续处理</span>
}
</code></pre>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-21">6. 初识函数</h2>
<h4 id="65-ab-problem">6.5. &quot;A+B&quot; problem</h4>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> a, b;
  <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d%d&quot;</span>, &amp;a, &amp;b);
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, a + b);
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-22">6. 初识函数</h2>
<h4 id="65-ab-problem-1">6.5. &quot;A+B&quot; problem</h4>
<p>约定输入格式：两行，每行一个整数，分别表示 <code>a</code> 和 <code>b</code>。</p>
<ul>
<li><code>scanf(&quot;%d\n%d\n&quot;, &amp;a, &amp;b)</code> 会发生什么？试一试。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-23">6. 初识函数</h2>
<h4 id="65-ab-problem-2">6.5. &quot;A+B&quot; problem</h4>
<p>约定输入格式：两行，每行一个整数，分别表示 <code>a</code> 和 <code>b</code>。</p>
<ul>
<li><code>scanf(&quot;%d\n%d\n&quot;, &amp;a, &amp;b)</code> 会卡住，<strong>直到你输入了一个非空白字符为止</strong>。</li>
<li>看看标准：
<blockquote>
<p>格式字符串中的任何一个空白字符都会消耗掉输入中所有可用的连续空白字符​（其行为类似于通过循环调用 <code>isspace</code> 函数来判断）。需要注意的是，在格式字符串中，&quot;<code>\n</code>&quot;、&quot;<code> </code>&quot;、&quot;<code>\t</code>&quot;或其他任何空白字符之间没有区别。</p>
</blockquote>
<ul>
<li>whitespace character: “空白字符”，包括空格、换行、回车、制表等。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-24">6. 初识函数</h2>
<h4 id="65-ab-problem-3">6.5. &quot;A+B&quot; problem</h4>
<p>让我们一步步模拟程序的执行过程：</p>
<ol>
<li>程序执行到 <code>scanf</code>，等待用户输入。</li>
<li>用户输入 <code>10</code> 然后按下回车（回车键输入了换行符 <code>\n</code>）。此时输入缓冲区的内容是：'<code>1</code>' '<code>0</code>' '<code>\n</code>'。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-25">6. 初识函数</h2>
<h4 id="65-ab-problem-4">6.5. &quot;A+B&quot; problem</h4>
<ol start="3">
<li><code>scanf</code> 开始解析格式字符串 &quot;<code>%d\n%d\n</code>&quot;：
<ul>
<li><code>%d</code>：成功读取整数 10 并存入变量 a。读取完成后，输入缓冲区只剩下：'\n'。</li>
<li><code>\n</code>（格式字符串中的第一个换行符）：这是一个空白字符。根据规则，它要求 <code>scanf</code> “丢弃输入缓冲区中所有的连续空白字符”。
<ul>
<li>当前缓冲区里正好有一个 '<code>\n</code>'，它被读取并丢弃了。现在缓冲区空了。</li>
</ul>
</li>
<li>由于格式字符串中的 <code>\n</code> 是一个指令，而不是一个必须匹配的字符，<code>scanf</code> 在清空缓冲区中的空白后，并不会停止，因为它还在等待格式字符串中 \n 所隐含的“任意非空白字符”来结束这个空白指令。</li>
<li>程序因此继续等待用户输入，因为缓冲区是空的，它需要读取更多内容来判断在哪里停止。</li>
</ul>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-26">6. 初识函数</h2>
<h4 id="65-ab-problem-5">6.5. &quot;A+B&quot; problem</h4>
<ol start="4">
<li>用户继续输入 <code>20</code> 然后按下回车。现在缓冲区的内容是：'<code>2</code>' '<code>0</code>' '<code>\n</code>'。</li>
<li>scanf 继续执行：
<ul>
<li>它终于遇到了非空白字符 '<code>2</code>'。这个 '<code>2</code>' 满足了 <code>\n</code> 指令的停止条件（遇到非空白字符）。</li>
<li>根据规则，这个 '<code>2</code>' 不会被消耗，它被放回（push back）到输入缓冲区中。现在缓冲区的内容变回：'<code>2</code>' '<code>0</code>' '<code>\n</code>'。</li>
<li><code>scanf</code> 继续处理格式字符串的下一部分：<code>%d</code>。<code>%d</code> 正好从缓冲区中顺利地读取了整数 <code>20</code> 并存入变量 <code>b</code>。读取完成后，缓冲区剩下：'<code>\n</code>'。</li>
</ul>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-27">6. 初识函数</h2>
<h4 id="65-ab-problem-6">6.5. &quot;A+B&quot; problem</h4>
<ol start="6">
<li><code>scanf</code> 继续处理格式字符串的最后一部分：<code>\n</code>（第二个换行符）。
<ul>
<li>同样，它读取并丢弃缓冲区中已有的 '<code>\n</code>'，缓冲区再次变空。</li>
<li>同样，它因为这条指令而再次等待，希望用户输入一个非空白字符来“结束”这个指令。</li>
</ul>
</li>
<li>程序现在卡住了。它还在执行 <code>scanf</code> 函数，等待用户输入一个非空白字符（比如一个数字、一个字母等）。只有当你再输入一些内容（例如随便按一个字母 x 然后回车），<code>scanf</code> 遇到了非空白字符 '<code>x</code>'，才会结束整个读取过程。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-28">6. 初识函数</h2>
<h4 id="65-ab-problem-7">6.5. &quot;A+B&quot; problem</h4>
<p>约定输入格式：两行，每行一个整数，分别表示 <code>a</code> 和 <code>b</code>。</p>
<ul>
<li><code>scanf(&quot;%d%d&quot;, &amp;a, &amp;b)</code> 可以吗？</li>
<li>可以！但这是为什么呢？看看标准：
<ul>
<li>
<blockquote>
<p><code>&quot;%d&quot;</code> 匹配一个十进制整数。该数字的格式与 <code>strtol</code> 函数以 10 为基数参数时所期望的格式相同。</p>
</blockquote>
</li>
</ul>
</li>
<li><code>strtol</code> 是什么鬼？<a href="https://en.cppreference.com/w/c/string/byte/strtol">点进去看看</a>：
<blockquote>
<p><code>strtol</code> 解释由 <code>str</code> 指向的字节字符串中的整数值。<code>strtol</code> 会<strong>丢弃所有前导的空白字符</strong>（通过调用<code>isspace</code>识别）直到找到第一个非空白字符，然后...</p>
</blockquote>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-29">6. 初识函数</h2>
<h4 id="65-ab-problem-8">6.5. &quot;A+B&quot; problem</h4>
<p><strong>关于 <code>printf</code></strong></p>
<p><code>double</code> 需要用 <code>%lf</code> 输出。如果我用 <code>%d</code> 输出，会怎样？</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">double</span> pi = <span class="hljs-number">3.14</span>;
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, pi);
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-30">6. 初识函数</h2>
<h4 id="65-ab-problem-9">6.5. &quot;A+B&quot; problem</h4>
<p><strong>关于 <code>printf</code></strong><br />
它和先将 <code>pi</code> 转换为 <code>int</code>（小数部分截去）再输出的效果一样吗？</p>
<pre><code class="language-c"><span class="hljs-type">double</span> pi = <span class="hljs-number">3.14</span>;
<span class="hljs-type">int</span> pi_int = pi; <span class="hljs-comment">// pi_int 值为 3</span>
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, pi_int);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-31">6. 初识函数</h2>
<h4 id="65-ab-problem-10">6.5. &quot;A+B&quot; problem</h4>
<p><strong>关于 <code>printf</code></strong></p>
<p>在 <code>scanf</code> 和 <code>printf</code> 中，conversion specifier 与对应的变量类型不匹配是 <a href="https://en.cppreference.com/w/c/language/behavior"><strong>undefined behavior</strong></a>：<strong>你不能对程序的行为做任何假定。</strong></p>
<p>以下说法统统是错的：</p>
<ul>
<li><s>它会进行某种类型转换再输出</s></li>
<li><s>它会输出一个值，只是我不知道它是多少罢了</s></li>
</ul>
<p>程序完全有可能在这里直接崩溃。此外，<strong>编译器可以假定你的程序不含 undefined behavior</strong>，所以它如果发现这里有 undefined behavior，就可以直接把这行代码删掉，<strong>这完全符合语言标准</strong>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-32">6. 初识函数</h2>
<h4 id="66-undefined-behavior">6.6. Undefined Behavior</h4>
<p>Undefined Behavior​ (未定义行为，简称 UB) 是指程序中的一种行为，​对于这种行为，本国际标准（C/C++ Standard）没有施加任何要求。</p>
<blockquote>
<p>​​&quot;Undefined behavior&quot;​: behavior for which this International Standard imposes ​no requirements.</p>
<ul>
<li>ISO/IEC 9899:2017 (§3.4.3) (C17 Standard)</li>
<li>ISO/IEC 14882:2017 (§3.27) (C++17 Standard)</li>
</ul>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="6-%E5%88%9D%E8%AF%86%E5%87%BD%E6%95%B0-33">6. 初识函数</h2>
<h4 id="66-undefined-behavior-1">6.6. Undefined Behavior</h4>
<p>这意味着，当程序执行中出现未定义行为时：</p>
<ul>
<li>​标准不做规定​：标准文档不会、也无需预测或规定程序的后续行为或输出结果。</li>
<li>​无需诊断​：编译器不一定需要为此发出编译错误或警告（尽管好的编译器通常会尝试发出警告）。符合标准的编译器可以静默地接受包含UB的代码。</li>
<li>​任何结果都是“符合标准”的​：从标准的角度看，可能发生的任何情况都是可以接受的，包括但不限于：
<ul>
<li>产生一个不可预测的、无意义的结果。</li>
<li>表现出看似正常但实际错误的行为。</li>
<li>在运行时崩溃（例如， segmentation fault）。</li>
<li>表现出与时间、环境或平台相关的怪异行为。</li>
<li>在优化编译下，导致之前或之后的代码被消除或重新排序，从而引发更难以理解的错误。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-class="trans" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="trans" style="--class:trans;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-size="16:9">
<h2 id="7-tools">7. Tools</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="7-tools-1">7. Tools</h2>
<ul>
<li>CppReference/Textbook: C/C++ 的编程语言参考资料</li>
<li>VS Code / Clion: 写代码，debug的工具</li>
<li>*Debugger: 帮助你写代码和 debug 的工具</li>
<li>*CMake / XMake: 一个跨平台的项目构建工具，可以方便的代替 Makefile 进行大型项目的管理。</li>
<li>*Git:  一个帮助你管理代码版本和查看代码改动的工具</li>
<li>...</li>
</ul>
<p><strong>Note:</strong> 标有星号（*）的工具很重要，但将在我们的课程中进行功能介绍。为了更深入地了解它们的用法，<strong>我们鼓励您独立探索</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="7-tools-2">7. Tools</h2>
<h4 id="debugger">Debugger</h4>
<ul>
<li><strong>breakpoint</strong>：在特定代码行设置暂停执行，以便更仔细地查看<strong>程序在某一行代码执行前的状态</strong>。</li>
<li><strong>监视变量</strong>：在程序运行时监视变量或表达式的值。</li>
<li><strong>逐步执行</strong>：一步一步地运行程序，可以逐行（Step Over），进入函数（Step into），也可以执行函数的剩余部分并在该函数执行结束之后暂停（Step Out）。</li>
<li>...</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="7-tools-3">7. Tools</h2>
<h4 id="git">Git</h4>
<ul>
<li><code>git init</code> : 初始化一个git仓库</li>
<li><code>git commit</code> : 本地保存仓库更改</li>
<li><code>git reset</code> : 回溯到某个版本</li>
<li><code>git log</code> : 显示历史提交记录</li>
<li><code>git push</code> : 把本地的更改上传远程云端</li>
<li><code>git pull</code> : 从云端拉取远端最新的更改使得和云端仓库一致</li>
<li>...</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 1</em> <em>Fall 2025</em></header>
<h2 id="7-tools-4">7. Tools</h2>
<h4 id="makefile--cmake--xmake">Makefile / CMake / XMake</h4>
<ul>
<li><strong>Makefile</strong>：一个文本文件，包含了一系列的规则和指令，用于指导 <code>make</code> 工具如何编译和链接程序。
<ul>
<li>简单的说：帮我们将刚才的 <code>gcc hello.c -o hello</code> 这种命令，以及更复杂的其他命令，进行自动化</li>
<li>你可以简单的通过 <code>make</code> 来编译你的项目。</li>
</ul>
</li>
<li><strong>CMake</strong>：一个跨平台的开源构建系统，使用 <code>CMakeLists.txt</code> 文件来定义项目的构建过程。CMake 可以生成适用于不同平台和编译器的 Makefile 或项目文件。</li>
<li><strong>XMake</strong>：一个轻量级的跨平台构建工具，使用 <code>xmake.lua</code> 文件来定义项目的构建过程。XMake 提供了简洁的语法和强大的功能，适合快速构建和管理项目。
<ul>
<li>相比于 CMake，XMake 更加轻量和易用。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header=" *CS100* *Tutorial 1* *Fall 2025*" data-class="lastpage" data-theme="eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn" lang="en-US" class="lastpage" data-marpit-pagination="63" style="--paginate:true;--header: *CS100* *Tutorial 1* *Fall 2025*;--class:lastpage;--theme:eos0cp17bcs26aob3cmb9w5lfpan4ihp2t7oz2k35iqn;" data-marpit-pagination-total="63" data-size="16:9">
