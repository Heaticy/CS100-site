<h2 id="1-control-flow-3">1. Control Flow</h2>
<div class = "ldiv">
<h4 id="12-conditional-statementsif-else">1.2. Conditional Statements<code>if</code>-<code>else</code></h4>
<p><strong>Syntax：</strong></p>
<pre><code class="language-c"><span class="hljs-keyword">if</span> (condition) statement_T <span class="hljs-keyword">else</span> statement_F
</code></pre>
<p><strong><code>condition</code></strong>：一个标量类型（算术类型或指针类型）的<strong>表达式</strong>。</p>
<ul>
<li><a href="https://en.cppreference.com/w/c/language/arithmetic_types">算术类型</a>：包括整数类型（Integer types）和浮点数类型（floating-point types）。
<ul>
<li>示例：<code>if (a &gt; 0)</code></li>
</ul>
</li>
<li><a href="https://en.cppreference.com/w/c/language/pointer">指针类型</a>：指向对象（objects）、函数（functions）等的指针。
<ul>
<li>示例：<code>if (ptr) {...}</code> 等价于 <code>if (ptr != NULL)</code>。</li>
</ul>
</li>
</ul>
</div>
<div class = "rimg">
<p><img src="img/if-else-statement.jpg" alt="#c" style="width:500px;" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2-46" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2-46" data-marpit-pagination="8" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2-46;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="1-control-flow-4">1. Control Flow</h2>
<div class = "ldiv">
<h4 id="exercise-1">Exercise 1</h4>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> i;

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-keyword">if</span> (i) {
        <span class="hljs-comment">// Do nothing</span>
    } 
    <span class="hljs-keyword">else</span> {
        <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Else&quot;</span>);
    }
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</div>
<div class = "rdiv">
<p><strong>Question: What is correct about the above program?</strong></p>
<ol>
<li>执行 <code>if</code> 代码块。</li>
<li>执行 <code>else</code> 代码块。</li>
<li>由于 <code>i</code> 未初始化，结果不可预测。</li>
<li>Error：<code>else</code> 的位置不正确。</li>
</ol>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2-46" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2-46" data-marpit-pagination="9" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2-46;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">

<div class = "ldiv">
<h4 id="exercise-1-1">Exercise 1</h4>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> i;

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-keyword">if</span> (i) {
        <span class="hljs-comment">// Do nothing</span>
    } 
    <span class="hljs-keyword">else</span> {
        <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Else&quot;</span>);
    }
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</div>
<div class = "rdiv">
<p><strong>Question: What is correct about the above program?</strong></p>
<ol>
<li>执行 <code>if</code> 代码块。</li>
<li><strong>执行 <code>else</code> 代码块。</strong></li>
<li>由于 <code>i</code> 未初始化，结果不可预测。</li>
<li>Error：<code>else</code> 的位置不正确。</li>
</ol>
<blockquote>
<p>变量i为全局变量，默认初始化为0，因此执行else代码块，输出&quot;Else&quot;。</p>
</blockquote>

<pre><code class="language-c"><span class="hljs-keyword">switch</span> (expression)
{

      <span class="hljs-comment">// statements</span>

      <span class="hljs-comment">// statements</span>

<h4 id="12-conditional-statementsswitch-case">1.2. Conditional Statements<code>switch</code>-<code>case</code></h4>
<ul>
<li><strong>Expression</strong>：任何整数类型的表达式（char, signed/unsigned int, Enum）</li>
<li><code>case</code> 标签中的表达式：
<ul>
<li><a href="https://en.cppreference.com/w/c/language/">Integer Constants Expression</a></li>
<li><a href="https://en.cppreference.com/w/c/language/integer_constant">Integer Constants</a>: <code>42</code></li>
<li><a href="https://en.cppreference.com/w/c/language/character_constant">Character Constants</a>: <code>a</code></li>
<li><code>true</code>, ...</li>
</ul>
</li>
<li><code>constant</code>的值在编译时是已知的。</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="11" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="1-control-flow-7">1. Control Flow</h2>
<div class = "ldiv">
<h4 id="12-conditional-statementsswitch-case-1">1.2. Conditional Statements<code>switch</code>-<code>case</code></h4>
<p>一旦 Control Flow 跳转到与 <code>case</code> 标签对应的语句，它会继续<strong>向下执行</strong>，直到遇到 <code>break;</code> 或达到 <code>switch</code> 块的末尾。</p>
<ul>
<li>如果在下一个 <code>case</code> 之前没有 <code>break;</code>，则控制流程将<strong>不会停止</strong>。</li>
</ul>
</div>
<div class = "rdiv">
<p><img src="img/switch-case.png" alt="#c" style="width:450px;" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">

<h2 id="1-control-flow-8">1. Control Flow</h2>
<h4 id="exercise-2-what-the-output-of-the-following-program">Exercise 2: What the output of the following program?</h4>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-type">void</span> <span class="hljs-title function_">func</span><span class="hljs-params">(<span class="hljs-type">int</span> x)</span>{
   <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;func(%d): &quot;</span>, x);
   <span class="hljs-keyword">switch</span>(x){
      <span class="hljs-keyword">case</span> <span class="hljs-number">1</span>: <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;case 1, &quot;</span>);
      <span class="hljs-keyword">case</span> <span class="hljs-number">2</span>: <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;case 2, &quot;</span>);
      <span class="hljs-keyword">case</span> <span class="hljs-number">3</span>: <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;case 3.\n&quot;</span>); <span class="hljs-keyword">break</span>;
      <span class="hljs-keyword">case</span> <span class="hljs-number">4</span>: <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;case 4, &quot;</span>);
      <span class="hljs-keyword">case</span> <span class="hljs-number">5</span>:
      <span class="hljs-keyword">case</span> <span class="hljs-number">6</span>: <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;case 5 or case 6, &quot;</span>);
      <span class="hljs-keyword">default</span>: <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;default.\n&quot;</span>);
   }
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>{
   <span class="hljs-keyword">for</span>(<span class="hljs-type">int</span> i = <span class="hljs-number">1</span>; i &lt; <span class="hljs-number">9</span>; ++i) func(i);
}
</code></pre>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="1-control-flow-10">1. Control Flow</h2>
<h4 id="13-switch-case-scope-%E4%BD%9C%E7%94%A8%E5%9F%9F">1.3. <code>switch</code>-<code>case</code>: Scope (作用域)</h4>
<p><a href="https://en.cppreference.com/w/c/language/scope">Block Scope</a>:</p>
<ul>
<li>由 <code>if</code>、<code>switch</code>、<code>for</code>、<code>while</code>、<code>do-while</code>、函数定义等建立。</li>
<li>作用域从声明点开始，到声明它的代码块或语句的末尾结束。</li>
<li>通常，代码块通过 <code>{}</code> 标记。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>

<h4 id="13-scope-%E4%BD%9C%E7%94%A8%E5%9F%9F--the-block-is-maked-by">1.3. Scope (作用域)--the block is maked by {}</h4>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>
{
    {
        <span class="hljs-type">int</span> x = <span class="hljs-number">1</span>;
    }
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d&quot;</span>, x);
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">

<pre><code class="language-bash">heaticy@heaticy-ThinkStation-P320 ~/CS100 (master) [1]&gt; gcc a.c -o a.out

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="1-control-flow-13">1. Control Flow</h2>
<h4 id="13-switch-case-scope">1.3. <code>switch</code>-<code>case</code>: Scope</h4>
<pre><code class="language-c"><span class="hljs-keyword">switch</span> (expr) {
  <span class="hljs-keyword">case</span> <span class="hljs-number">1</span>: 
    <span class="hljs-type">int</span> x = <span class="hljs-number">42</span>;
    do_something(x, expr);
  <span class="hljs-keyword">case</span> <span class="hljs-number">2</span>:
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, x); 
}
</code></pre>
<ul>
<li>What happens if <code>expr</code> evaluates to <code>2</code>?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="1-control-flow-14">1. Control Flow</h2>
<h4 id="13-switch-case-scope-1">1.3. <code>switch</code>-<code>case</code>: Scope</h4>
<ul>
<li>
<p>如果 <code>expr == 2</code>，控制流会跳过 <code>int x = 42;</code>，但由于名称查找规则，<code>x</code> 仍然可见。</p>
<ul>
<li><code>x</code> 的声明仍然在 <code>switch</code> 作用域内，因为它位于 <code>{}</code> 块中。</li>
</ul>
</li>
<li>
<p>为了避免这种情况，应在 <code>case</code> 中为变量声明使用单独的代码块。</p>
<ul>
<li>简而言之，使用 <code>{}</code> 来限制作用域。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="1-control-flow-15">1. Control Flow</h2>
<h4 id="13-switch-case-scope-2">1.3. <code>switch</code>-<code>case</code>: Scope</h4>
<pre><code class="language-c"><span class="hljs-keyword">switch</span> (expr) {
  <span class="hljs-keyword">case</span> <span class="hljs-number">1</span>: { <span class="hljs-comment">// Use {} to limit `x` to this block.</span>
    <span class="hljs-type">int</span> x = <span class="hljs-number">42</span>;
    do_something(x, expr);
  }
  <span class="hljs-keyword">case</span> <span class="hljs-number">2</span>:
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, x); <span class="hljs-comment">// Error: `x` is not declared in this scope.</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="20" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="1-control-flow-16">1. Control Flow</h2>
<div class = "ldiv">
<h4 id="exercise-3">Exercise 3</h4>
<pre><code class="language-c"><span class="hljs-meta"># <span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> i = <span class="hljs-number">0</span>;
  <span class="hljs-keyword">for</span> (i = <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">20</span>; i++){
    <span class="hljs-keyword">switch</span>(i){
      <span class="hljs-keyword">case</span> <span class="hljs-number">0</span>: i += <span class="hljs-number">5</span>; 
      <span class="hljs-keyword">case</span> <span class="hljs-number">1</span>: i += <span class="hljs-number">2</span>;
      <span class="hljs-keyword">case</span> <span class="hljs-number">5</span>: i += <span class="hljs-number">5</span>;
      <span class="hljs-keyword">default</span>: i += <span class="hljs-number">4</span>;
        <span class="hljs-keyword">break</span>;
    }
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, i);
  }
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</div>
<div class = "rdiv">
<p><strong>Question: What is the output?</strong></p>
<ul>
<li><code>5 10 15 20</code></li>
<li><code>7 12 17 22</code></li>
<li><code>16 21</code></li>
<li><code>Compile Error</code></li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="21" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="1-control-flow-17">1. Control Flow</h2>
<div class = "ldiv">
<h4 id="exercise-3-1">Exercise 3</h4>
<pre><code class="language-c"><span class="hljs-meta"># <span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> i = <span class="hljs-number">0</span>;
  <span class="hljs-keyword">for</span> (i = <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">20</span>; i++){
    <span class="hljs-keyword">switch</span>(i){
      <span class="hljs-keyword">case</span> <span class="hljs-number">0</span>: i += <span class="hljs-number">5</span>; 
      <span class="hljs-keyword">case</span> <span class="hljs-number">1</span>: i += <span class="hljs-number">2</span>;
      <span class="hljs-keyword">case</span> <span class="hljs-number">5</span>: i += <span class="hljs-number">5</span>;
      <span class="hljs-keyword">default</span>: i += <span class="hljs-number">4</span>;
        <span class="hljs-keyword">break</span>;
    }
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, i);
  }
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</div>
<div class = "rdiv">
<p><strong>Question: What is the output?</strong></p>
<ul>
<li><code>5 10 15 20</code></li>
<li><code>7 12 17 22</code></li>
<li><strong><code>16 21</code></strong></li>
<li><code>Compile Error</code></li>
</ul>
<blockquote>
<p>最初，i = 0。由于 case 0 为真，i 变成了 5，并且由于在 switch 块中的 case 语句后没有 break 语句，程序会继续执行直到 switch 块的最后一条语句，i 变成了 16。然后在下一次迭代中，没有任何 case 为真，所以程序执行到了 default，i 变成了 21。</p>
</blockquote>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2-37" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2-37" data-marpit-pagination="22" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2-37;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">

<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

</li>

<div class = "rdiv">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">

<h4 id="21-overview-of-preprocessor-directives">2.1. Overview Of Preprocessor Directives</h4>
<ul>
<li>预处理器（Preprocessor）</li>
<li>预处理指令（Preprocessor Directives）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-1">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="22-preprocessor--preprocessor-directives">2.2. Preprocessor &amp; Preprocessor Directives</h4>
<ul>
<li>在编译 C/C++ 程序时，编译器首先会调用 <strong>预处理器</strong> 来处理所有的预处理指令。
<ul>
<li>有时预处理器被认为属于编译器的一部分。</li>
</ul>
</li>
<li><strong>预处理指令</strong> 控制预处理器的行为。</li>
</ul>
<p><img src="img/Preprocessor-In-C.png" alt="#c" style="width:600px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="35" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-2">2. Preprocessor Directives（预处理指令）</h2>
<div class = "ldiv">
<h4 id="exercise-7-try-the-following-commands">Exercise 7: Try the following commands.</h4>
<ul>
<li>
<p><code>gcc a.c --save-temps</code></p>
<ul>
<li>永久保存中间文件。</li>
</ul>
</li>
<li>
<p><code>gcc a.c -E</code>: <a href="https://gcc.gnu.org/onlinedocs/gcc-9.2.0/gcc/Developer-Options.html">GCC Options</a></p>
<ul>
<li>
<p><code>-E</code>告诉 GCC 在预处理阶段结束后停止。</p>
</li>
<li>
<p>它将预处理后的源代码输出到控制台。</p>
</li>
</ul>
</li>
</ul>
</div>
<div class = "rdiv">
<p><img src="img/Compilation-Process-in-C.png" alt="#c" style="width:300px;" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-3">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="22-%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4---%E6%8E%A7%E5%88%B6%E9%A2%84%E5%A4%84%E7%90%86%E5%99%A8">2.2. 预处理指令  - 控制预处理器</h4>
<p><strong>Examples:</strong></p>
<ul>
<li>
<p><strong>Source file inclusion</strong>: <code>#include</code></p>
</li>
<li>
<p><strong>Replacing text macros（宏）</strong>: <code>#define</code>, *<code>#undef</code>(cancels a previous definition by <code>#define</code>)</p>
<ul>
<li><strong>Macro</strong>:  程序中一段代码，该代码会被 Macro 的 Value 所替换</li>
</ul>
</li>
<li>
<p><strong>Conditional inclusion</strong>: <code>#if</code>, <code>#ifdef</code>, <code>#ifnef</code>, <code>#else</code>, etc.</p>
</li>
<li>
<p>*实现定义行为控制: <code>#pragma</code></p>
</li>
<li>
<p>*<strong>文件名和行信息</strong>: <code>#line</code>（非常有用）, *Diagnostic directives: <code>#error</code>, etc.</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-4">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="23-source-file-inclusion-include">2.3. Source File Inclusion: <code>#include</code></h4>
<p><strong>Syntax</strong>:</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;filename&gt;</span> (newline)</span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&quot;filename&quot;</span> (newline)</span>
</code></pre>
<p><code>#include</code> 指令在 C 语言编程中用于<strong>文本替换</strong>。它会找到指定的文件，将<strong>该文件的内容插入到源文件中指令所在的位置</strong>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-5">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="23-source-file-inclusion-include-1">2.3. Source File Inclusion: <code>#include</code></h4>
<ul>
<li><strong><code>#include</code> 和 <code>import</code> 的区别</strong>：<br />
<strong><code>import</code></strong> 是其他编程语言（如 Python 和 Java）中的关键字，用于引入模块或包。它通常包含一些额外的功能，例如命名空间管理和模块加载。<strong>C++ 自 C++20 标准开始<a href="https://en.cppreference.com/w/cpp/language/modules">支持模块</a></strong>。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-6">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="24-search-path-of-include">2.4. Search Path of <code>#include</code></h4>
<ul>
<li><strong><code>#include &lt;file&gt;</code></strong>: 这种形式通常用于<strong>标准库头文件</strong>。
<ul>
<li><strong>默认行为（GCC 预处理器）</strong>：它只在标准系统目录中搜索，这些目录是预先配置的，可能因系统和 GCC 配置而异。</li>
<li><strong>命令行选项</strong>可以用来将额外的目录添加到搜索路径中。最常用的选项是 <code>-Idir</code>，可以如下指定：<code>gcc a.c -o a -I/home/liuxiao/my_awesome_library/include</code></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-7">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="24-search-path-of-include-1">2.4. Search Path of <code>#include</code></h4>
<ul>
<li><strong><code>#include &quot;file&quot;</code></strong>: 这种形式通常用于<strong>用户自定义的头文件</strong>。
<ul>
<li>预处理器首先在当前文件所在的目录中查找，将文件视为<strong>相对路径</strong>，然后继续在标准系统目录中查找。</li>
<li>示例：<code>#include &quot;../my_library/include/my_header.h&quot;</code></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-8">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="25-replacing-text-macros-define">2.5. Replacing text macros: <code>#define</code></h4>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">define</span> N 1000</span>
<span class="hljs-meta">#<span class="hljs-keyword">define</span> MAX(A, B) A &lt; B ? B : A</span>
</code></pre>
<p>之后，所有出现的 <code>N</code> 将被替换为 <code>1000</code>，所有出现的 <code>MAX(expr1, expr2)</code> 将被替换为 <code>expr1 &lt; expr2 ? expr2 : expr1</code>。</p>
<ul>
<li>形式 <code>#define MACRO_NAME text_to_be_replaced</code> 被称为 <strong>对象类宏</strong>。它将每个定义过的 <code>MACRO_NAME</code> 替换为 <code>text_to_be_replaced</code>。</li>
<li>另一种形式 <code>#define MACRO_NAME (parameters, ...) text_to_be_replaced</code> 被称为 <strong>函数类宏</strong>。</li>
</ul>
<p><strong>注意</strong>：重新定义先前定义的宏是不合法的，除非新定义与旧定义完全相同。这意味着 <strong>两个文件</strong>，如果都定义了某个宏，则该 <strong>定义必须一致</strong>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-9">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="26-undef">2.6. <code>#undef</code></h4>
<p><code>#undef</code> 指令具有以下语法：</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">undef</span> MACRO_NAME</span>
</code></pre>
<p>此指令通过 <code>#define</code> 取消标识符的先前定义。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="43" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-10">2. Preprocessor Directives（预处理指令）</h2>
<div class = "ldiv">
<h4 id="27-define-scope">2.7. <code>#define</code>: Scope</h4>
<ul>
<li>
<p>宏从其 <code>#define</code> 指令处开始<strong>生效</strong>。</p>
</li>
<li>
<p>当它遇到对应的 <code>#undef</code> 指令或到达当前文件末尾时，将<strong>失效</strong>。</p>
</li>
</ul>
</div>
<div class = "rdiv">
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-meta">#<span class="hljs-keyword">define</span> APPLE (10 + PEAR)</span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>{
<span class="hljs-meta">#<span class="hljs-keyword">define</span> PEAR 15</span>
    <span class="hljs-type">int</span> x = APPLE;
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;x is %d.\n&quot;</span>, x); 
    <span class="hljs-comment">// x is 25.</span>
<span class="hljs-meta">#<span class="hljs-keyword">undef</span> PEAR</span>

<span class="hljs-meta">#<span class="hljs-keyword">define</span> PEAR 100</span>
    <span class="hljs-type">int</span> y = APPLE;
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;y is %d.\n&quot;</span>, y);
    <span class="hljs-comment">// y is 110.</span>
}
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-marpit-fragments="2" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2-46" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2-46" data-marpit-pagination="44" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2-46;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-11">2. Preprocessor Directives（预处理指令）</h2>
<div class = "ldiv">
<h4 id="27-define-nested-definitions">2.7. <code>#define</code>: Nested Definitions</h4>
<br />
<ol>
<li data-marpit-fragment="1">
<p>如果一个宏的名称出现在它自身的替换文本中，则<strong>不会被替换</strong>。</p>
</li>
<li data-marpit-fragment="2">
<p>这些未被替换的宏名称随后将<strong>无法用于进一步的替换</strong>。</p>
</li>
</ol>
</div>
<div class = "rdiv">
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-meta">#<span class="hljs-keyword">define</span> APPLE (10 + APPLE)  <span class="hljs-comment">// 1)</span></span>

<span class="hljs-type">void</span> <span class="hljs-title function_">foo</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>{
  <span class="hljs-type">int</span> y = APPLE;  <span class="hljs-comment">// 2) </span>
  <span class="hljs-comment">// y is undeclared; error</span>
<span class="hljs-meta">#<span class="hljs-keyword">undef</span> APPLE</span>
<span class="hljs-meta">#<span class="hljs-keyword">define</span> APPLE 15</span>
}

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>{
    <span class="hljs-type">int</span> x = APPLE;
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;x is %d.\n&quot;</span>, x);
    <span class="hljs-comment">// x is 15 if &#x27;2)&#x27; is commented out.</span>
}
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="45" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-12">2. Preprocessor Directives（预处理指令）</h2>
<div class = "ldiv">
<br />
<h4 id="27-define-function-like-form">2.7. <code>#define</code>: Function-Like Form</h4>
<p>回顾：在第一张关于 <code>#define</code> 的幻灯片中，我们介绍了函数式的宏 <code>MAX(A, B)</code>：</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">define</span> MAX(A, B) A &lt; B ? B : A</span>
</code></pre>
</div>
<div class = "rdiv">
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-comment">// Macro definition</span>
<span class="hljs-meta">#<span class="hljs-keyword">define</span> AREA(l, b) (l * b)</span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>{
  <span class="hljs-comment">// Given lengths l1 and l2</span>
  <span class="hljs-type">int</span> l1 = <span class="hljs-number">10</span>, l2 = <span class="hljs-number">5</span>, area;

  <span class="hljs-comment">// Find the area using macros</span>
  area = AREA(l1, l2);

  <span class="hljs-comment">// Print the area</span>
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, area);

  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-13">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="exercise-8">Exercise 8</h4>
<p>根据以下用法，评估我们的宏定义是否正确。你能发现哪些潜在问题？如何解决？</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">define</span> MAX(A, B) A &lt; B ? B : A</span>

<span class="hljs-type">int</span> i = <span class="hljs-number">10</span>, j = <span class="hljs-number">15</span>;
<span class="hljs-type">int</span> k = MAX(i, j) + <span class="hljs-number">1</span>;
</code></pre>
<ul>
<li>对于这个定义呢？<code>#define MAX(A, B) (A &lt; B ? B : A)</code>
<ul>
<li>提示：评估 <code>MAX(i, i &amp; j)</code> 的结果。</li>
</ul>
</li>
<li>对于这个定义呢？<code>#define MAX(A, B) ((A) &lt; (B) ? (B) : (A))</code>
<ul>
<li>提示：同样尝试使用 <code>MAX(i, ++j)</code>。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-14">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="exercise-8-1">Exercise 8</h4>
<p>根据以下用法，评估我们的宏定义是否正确。你能发现哪些潜在问题？如何解决？</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">define</span> MAX(A, B) A &lt; B ? B : A</span>

<span class="hljs-type">int</span> i = <span class="hljs-number">10</span>, j = <span class="hljs-number">15</span>;
<span class="hljs-type">int</span> k = MAX(i, j) + <span class="hljs-number">1</span>;
</code></pre>
<blockquote>
<p>宏展开后，<code>k</code> 的计算变为 <code>i &lt; j ? j : i + 1</code>，条件运算符的优先级低于加法运算符，相当于<code>i &lt; j ? j : (i + 1)</code>，因此结果为 <code>15</code>，而不是预期的 <code>16</code>。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-15">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="exercise-8-2">Exercise 8</h4>
<p>根据以下用法，评估我们的宏定义是否正确。你能发现哪些潜在问题？如何解决？</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">define</span> MAX(A, B) (A &lt; B ? B : A)</span>

<span class="hljs-type">int</span> i = <span class="hljs-number">10</span>, j = <span class="hljs-number">15</span>;
<span class="hljs-type">int</span> k = MAX(i, i &amp; j);
</code></pre>
<blockquote>
<p>宏展开后，<code>k</code> 的计算变为 <code>(i &lt; i &amp; j ? i &amp; j : i)</code>，由于按位与运算符的优先级低于比较运算符，相当于<code>(((i &lt; i) &amp; j) ? i &amp; j : i)</code>,因此结果为 <code>10</code>。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-16">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="exercise-8-3">Exercise 8</h4>
<p>根据以下用法，评估我们的宏定义是否正确。你能发现哪些潜在问题？如何解决？</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">define</span> MAX(A, B) ((A) &lt; (B) ? (B) : (A))</span>

<span class="hljs-type">int</span> i = <span class="hljs-number">10</span>, j = <span class="hljs-number">15</span>;
<span class="hljs-type">int</span> k = MAX(i, ++j);
</code></pre>
<blockquote>
<p>宏展开后，<code>k</code> 的计算变为 <code>((i) &lt; (++j) ? (++j) : (i))</code>，这会导致 <code>j</code> 被递增两次，因此结果为 <code>17</code>。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-17">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="27-define-function-like-form-1">2.7. <code>#define</code>: Function-Like Form</h4>
<p><strong>要点：</strong></p>
<ul>
<li>始终在 <strong>宏参数</strong> 和 <strong>整个宏</strong> 的周围加上 <strong>括号</strong> ，以防止出现意外行为。</li>
<li><strong>不要</strong> 使用 <code>#define</code> 来替代函数。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="51" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-18">2. Preprocessor Directives（预处理指令）</h2>
<div class = "ldiv">
<h4 id="28-conditional-inclusion-ifdef-ifndef-endif">2.8. Conditional Inclusion: <code>#ifdef</code>, <code>#ifndef</code>, <code>#endif</code></h4>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">ifdef</span> MACRO_NAME</span>
  <span class="hljs-comment">// Text block</span>
<span class="hljs-meta">#<span class="hljs-keyword">endif</span></span>
</code></pre>
</div>
<div class = "rdiv">
<ul>
<li><code>#ifdef</code>（或 <code>#ifndef</code>）指令与 <code>#endif</code> 一起构成一个文本块。这些指令应放置在文件中，并且必须成对出现。</li>
<li>文本块是否包含在编译器的输入中取决于 <code>MACRO_NAME</code> 的定义：
<ul>
<li>如果 <code>MACRO_NAME</code> 使用 <code>#define</code> 进行了定义，则 <code>#ifdef</code> 和 <code>#endif</code> 之间的文本将被包含，否则将被排除。</li>
<li><code>#ifndef</code> 指令的作用方式相反。</li>
</ul>
</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="52" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-19">2. Preprocessor Directives（预处理指令）</h2>
<div class = "ldiv">
<h4 id="28-conditional-inclusion-if-elif-else-endif">2.8. Conditional inclusion: <code>#if</code>, <code>#elif</code>, <code>#else</code>, <code>#endif</code></h4>
<ul>
<li>
<p>由于 <code>macro_condition</code> 的值，将包含以下三个文本块中的且仅包含一个文本块：<code>Text block 1</code>、<code>Text block 2</code><em>(可选)</em> 和 <code>Text block 3</code><em>(可选)</em>。</p>
</li>
<li>
<p><code>expression</code> 是一个仅使用常量和通过 <code>#define</code> 指令定义的标识符的常量表达式。</p>
</li>
</ul>
</div>
<div class = "rdiv">
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">if</span> macro_condition</span>
   <span class="hljs-comment">// Text block 1</span>
<span class="hljs-meta">#<span class="hljs-keyword">elif</span> macro_condition</span>
   <span class="hljs-comment">// Text block 2</span>
<span class="hljs-meta">#<span class="hljs-keyword">else</span></span>
   <span class="hljs-comment">// Text block 3</span>
<span class="hljs-meta">#<span class="hljs-keyword">endif</span></span>
</code></pre>
</div>
<ul>
<li><code>#ifdef identifier</code> is essentially equivalent to <code>#if defined identifier</code>.</li>
<li><code>#ifndef identifier</code> is essentially equivalent to <code>#if !defined identifier</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-20">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="example">Example</h4>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">define</span> ABCD 2</span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
 
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>{

<span class="hljs-meta">#<span class="hljs-keyword">ifdef</span> ABCD</span>
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;1: yes\n&quot;</span>);   <span class="hljs-comment">// printed</span>

<span class="hljs-meta">#<span class="hljs-keyword">else</span></span>
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;1: no\n&quot;</span>);

<span class="hljs-meta">#<span class="hljs-keyword">endif</span></span>
</code></pre>
  </div>
  <div>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">ifndef</span> ABCD</span>
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;2: no1\n&quot;</span>);

<span class="hljs-meta">#<span class="hljs-keyword">elif</span> ABCD == 2         <span class="hljs-comment">// printed </span></span>
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;2: yes\n&quot;</span>);

<span class="hljs-meta">#<span class="hljs-keyword">else</span></span>
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;2: no2\n&quot;</span>);   
<span class="hljs-meta">#<span class="hljs-keyword">endif</span></span>
 
<span class="hljs-meta">#<span class="hljs-keyword">if</span> !defined(DCBA) &amp;&amp; (ABCD &lt; 2 * 4 - 3)</span>
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;3: yes\n&quot;</span>);   <span class="hljs-comment">// printed</span>
<span class="hljs-meta">#<span class="hljs-keyword">endif</span></span>
}
</code></pre>
  </div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="2-preprocessor-directives%E9%A2%84%E5%A4%84%E7%90%86%E6%8C%87%E4%BB%A4-21">2. Preprocessor Directives（预处理指令）</h2>
<h4 id="header-guards">Header Guards</h4>
<ul>
<li>
<p>如果你恰好在源文件中两次包含同一个头文件，例如：</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&quot;my_header.h&quot;</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&quot;my_header.h&quot;</span></span>
</code></pre>
<p>后果是灾难性的：<code>my_header.h</code> 中的所有定义（变量/函数）都会出现两次，这将导致程序崩溃。</p>
</li>
<li>
<p>你可能会认为这种情况永远不会发生。至少我们看看标准库是如何防止上述崩溃的？</p>
<ul>
<li>添加头文件保护符。建议在所有你的头文件中都这样做。<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">ifndef</span> HEADER_GUARDS</span>
<span class="hljs-meta">#<span class="hljs-keyword">define</span> HEADER_GUARDS</span>
<span class="hljs-meta">#<span class="hljs-keyword">endif</span>  <span class="hljs-comment">// HEADER_GUARDS</span></span>
</code></pre>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-class="trans" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="trans" style="--class:trans;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-size="16:9">

<li>Storage duration</li>

</li>

<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-2">3. Variables</h2>
<div class = "ldiv">
<h4 id="%E7%BF%BB%E8%AF%91%E5%8D%95%E5%85%83translation-unit">翻译单元（Translation Unit）</h4>
<ul>
<li>在 C 和 C++ 编程术语中，翻译单元是 <strong>C 或 C++ 编译器</strong> 的最终 <strong>输入</strong>，编译器会根据此生成目标文件。</li>
<li>翻译单元通常由一个源文件组成，该源文件已经过 <strong>C 预处理器</strong> 处理。</li>
<li>这意味着头文件已被包含，条件编译部分（例如由 <code>#ifndef</code> 控制的部分）已被处理，宏也已展开。</li>
</ul>
</div>
<div class = "rdiv">
<p><img src="img/multi_files.svg" alt="" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-3">3. Variables</h2>
<h4 id="%E4%BD%9C%E7%94%A8%E5%9F%9F%E4%B8%8E%E7%94%9F%E5%91%BD%E5%91%A8%E6%9C%9Fscope-and-lifetime">作用域与生命周期（Scope and Lifetime）</h4>
<ul>
<li>
<p><strong>作用域</strong>: 变量可以被访问的<strong>代码</strong>部分。</p>
<ul>
<li>在 C 程序中出现的每个 <a href="https://en.cppreference.com/w/c/language/identifier">标识符（identifier）</a> 只能在源代码中的某些可能不连续的部分内可见（即可使用）。</li>
</ul>
</li>
<li>
<p><strong>生命周期（<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0.124ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="0.968ex" role="img" focusable="false" viewBox="0 -483 778 428"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2248" d="M55 319Q55 360 72 393T114 444T163 472T205 482Q207 482 213 482T223 483Q262 483 296 468T393 413L443 381Q502 346 553 346Q609 346 649 375T694 454Q694 465 698 474T708 483Q722 483 722 452Q722 386 675 338T555 289Q514 289 468 310T388 357T308 404T224 426Q164 426 125 393T83 318Q81 289 69 289Q55 289 55 319ZM55 85Q55 126 72 159T114 210T163 238T205 248Q207 248 213 248T223 249Q262 249 296 234T393 179L443 147Q502 112 553 112Q609 112 649 141T694 220Q694 249 708 249T722 217Q722 153 675 104T555 55Q514 55 468 76T388 123T308 170T224 192Q164 192 125 159T83 84Q80 55 69 55Q55 55 55 85Z"></path></g></g></g></svg></mjx-container> 存储期）</strong>: 在程序执行期间，一个 <em><strong>对象</strong></em> 是有效的（存在、地址恒定、保留最后一次存储的值）并可被使用的<strong>时间长度</strong>。</p>
<ul>
<li>在其生命周期之外访问一个对象会导致 <strong>未定义行为</strong>。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="59" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-4">3. Variables</h2>
<div class = "ldiv">
<h4 id="example-static-local-variable-inside-a-function">Example: Static local variable inside a function</h4>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-type">void</span> <span class="hljs-title function_">count_calls</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-comment">// static local variable</span>
    <span class="hljs-type">static</span> <span class="hljs-type">int</span> count = <span class="hljs-number">0</span>;  
    count++;
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d times\n&quot;</span>, count);
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    count_calls();  <span class="hljs-comment">// First call</span>
    count_calls();  <span class="hljs-comment">// Second call</span>
    count_calls();  <span class="hljs-comment">// Third call</span>
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</div>
<div class = "rdiv">
<ul>
<li>
<p>作用域：<br />
<code>count</code> 变量是在 <code>count_calls()</code> 函数内部声明的，因此其作用域仅限于这个函数。它无法在该函数外部被直接访问或修改。</p>
</li>
<li>
<p>生命周期：<br />
静态变量 <code>count</code> 的生命周期从程序开始运行时开始，直到程序终止才会结束。它的值在函数调用之间是持续存在的。</p>
</li>
</ul>
<pre><code>called 1 times
called 2 times
called 3 times
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-5">3. Variables</h2>
<h4 id="example-accessing-an-object-outside-of-its-lifetime">Example: Accessing an object outside of its <strong>lifetime</strong></h4>
<pre><code class="language-c"><span class="hljs-type">int</span>* <span class="hljs-title function_">dangling_pointer</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">int</span> x = <span class="hljs-number">5</span>;  /
    <span class="hljs-keyword">return</span> &amp;x; 
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">int</span> *ptr = dangling_pointer();  
    <span class="hljs-comment">// ptr points to a local variable that no longer exists</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, *ptr);  
    <span class="hljs-comment">// Undefined behavior: accessing a variable after its lifetime</span>
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<p>在 <code>main</code> 函数中访问 <code>dangling_pointer()</code> 的返回值的行为是 <strong>未定义的行为</strong>，因为在变量 <code>x</code> 的生命周期结束之后，<code>dangling_pointer</code> 才返回给其调用者 <code>main</code>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="61" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-6">3. Variables</h2>
<h4 id="example-accessing-an-object-outside-of-its-scope">Example: Accessing an object outside of its <strong>scope</strong></h4>
<div class = "ldiv">
<ul>
<li>Example 1: Accessing global variable in a function while the varibale is not in the local scope of the function.</li>
</ul>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> global_x = <span class="hljs-number">42</span>;

<span class="hljs-type">void</span> <span class="hljs-title function_">foo</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-comment">// local scope of foo() begins</span>
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, global_x);  
}

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  foo(); 
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</div>
<div class = "rdiv">
<ul>
<li>Example 2: Accessing variable outside its scope through pointer.</li>
</ul>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">void</span> <span class="hljs-title function_">modify_value</span><span class="hljs-params">(<span class="hljs-type">int</span> *ptr)</span> {
  *ptr = <span class="hljs-number">20</span>;
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, *ptr);
}

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> x = <span class="hljs-number">10</span>;  
  modify_value(&amp;x);

  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, x);

  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-7">3. Variables</h2>
<h4 id="scope">Scope</h4>
<p>当作用域重叠时，内部作用域中的声明会<strong>隐藏外部作用域中的声明。</strong></p>
<ul>
<li><strong>块作用域</strong>: 适用于函数体、<code>if</code>、<code>switch</code>、<code>for</code>、<code>while</code>、<code>do-while</code> 语句以及函数定义的参数列表。
<ul>
<li>从声明点开始，到声明所在块或语句结束为止。</li>
</ul>
</li>
<li><strong>文件作用域</strong>: 适用于在任何块或参数列表之外声明的标识符。
<ul>
<li>从声明点开始，到<strong>翻译单元</strong>结尾结束。</li>
</ul>
</li>
<li><strong>*函数原型作用域</strong>: <code>int f(int n, int a[n]);</code><br />
指在函数声明（而非定义）的参数列表中引入的名称。
<ul>
<li>在函数<a href="https://en.cppreference.com/w/c/language/declarations">声明符</a>结尾处结束。</li>
</ul>
</li>
<li><em><strong>*函数作用域</strong></em>, <em><strong>*声明点</strong></em>: 超出类的作用域。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-8">3. Variables</h2>
<h4 id="variables-nested-scopes">Variables: Nested Scopes</h4>
<pre><code class="language-c"><span class="hljs-type">int</span> a;   <span class="hljs-comment">// file scope of name a begins here</span>
<span class="hljs-type">void</span> <span class="hljs-title function_">f</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>{
  <span class="hljs-type">int</span> a = <span class="hljs-number">1</span>; <span class="hljs-comment">// the block scope of the name a begins here; hides file-scope a</span>
  {
    <span class="hljs-type">int</span> a = <span class="hljs-number">2</span>; <span class="hljs-comment">// the scope of the inner a begins here, outer a is hidden</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, a);  <span class="hljs-comment">// inner a is in scope, prints 2</span>
  } <span class="hljs-comment">// the block scope of the inner a ends here</span>

  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, a);    <span class="hljs-comment">// the outer a is in scope, prints 1</span>
} <span class="hljs-comment">// the scope of the outer a ends here</span>
<span class="hljs-type">void</span> <span class="hljs-title function_">g</span><span class="hljs-params">(<span class="hljs-type">int</span> a)</span>;   
<span class="hljs-comment">// name a has function prototype scope; hides file-scope a;</span>
<span class="hljs-comment">// a is just a placeholder and is not accessible outside the prototype</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-9">3. Variables</h2>
<h4 id="storage-duration---limiting-the-object-lifetime">Storage duration - limiting the object <strong>lifetime</strong></h4>
<ul>
<li><strong>自动存储持续时间</strong>：仅在执行过程中的某些点存在
<ul>
<li>应用于函数参数、非<code>static</code>的块作用域对象等。</li>
<li>存储空间在进入声明该对象的代码块时分配，在退出该代码块时释放。</li>
</ul>
</li>
<li><strong>静态存储持续时间</strong>：拥有整个程序的生命周期
<ul>
<li>存储持续时间是程序的整个执行期间。</li>
<li>存储在对象中的值<strong>仅初始化一次</strong>，在 main 函数之前完成。</li>
<li>应用于所有声明为 <code>static</code> 的对象等。</li>
</ul>
</li>
<li><strong>动态分配存储持续时间</strong>：其生命周期由程序员决定
<ul>
<li>通过请求（动态内存分配函数）进行分配和释放。</li>
</ul>
</li>
<li><strong>*线程存储持续时间</strong>：<em>超出类的作用域</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-10">3. Variables</h2>
<h4 id="scope-and-storage-duration">Scope and Storage duration</h4>
<table>
<thead>
<tr>
<th>Type</th>
<th>Example</th>
<th>Scope</th>
<th>Duration</th>
</tr>
</thead>
<tbody>
<tr>
<td>Local variable</td>
<td><code>int x;</code></td>
<td>Block</td>
<td>Automatic</td>
</tr>
<tr>
<td>Static local variable</td>
<td><code>static int s_x;</code></td>
<td>Block</td>
<td>Static</td>
</tr>
<tr>
<td>Function parameter</td>
<td><code>void foo(int x)</code></td>
<td>Block</td>
<td>Automatic</td>
</tr>
<tr>
<td>Internal global variable</td>
<td><code>static int g_x;</code></td>
<td>File</td>
<td>Static</td>
</tr>
<tr>

<td><code>int g_x;</code></td>
