</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-11">3. Variables</h2>
<h4 id="linkage-the-ability-to-be-referenced-in-other-scope">Linkage: <strong>the ability to be referenced</strong> in other scope</h4>
<p>“链接属性（Linkage）”指的是<strong>一个标识符</strong>（变量或函数）<strong>在其他作用域中被引用的能力</strong>。以下是几种已知的链接类型：</p>
<ul>
<li>
<p><strong>无链接（No linkage）</strong>：该标识符只能在其<strong>自身的作用域内被引用</strong>。</p>
<ul>
<li>应用于所有函数参数和所有非 <code>extern</code> 的块作用域变量（包括声明为 <code>static</code> 的变量）。</li>
</ul>
</li>
<li>
<p><strong>内部链接（Internal linkage）</strong>：该标识符可以在<strong>当前翻译单元内被引用</strong>。</p>
<ul>
<li>应用于所有 <code>static</code> 的<strong>文件作用域</strong>标识符（包括函数和变量）。</li>
</ul>
</li>
<li>
<p><strong>外部链接（External linkage）</strong>：该标识符可以在<strong>其他任何翻译单元中被引用</strong>。</p>
<ul>
<li>应用于所有非 <code>static</code> 函数、所有 <code>extern</code> 变量（除非之前被声明为 <code>static</code>），以及所有非 <code>static</code> 文件作用域变量。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="67" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-12">3. Variables</h2>
  <div class = "ldiv">
<h4 id="linkage">Linkage</h4>
<ul>
<li>
<p>在一个具有多个源文件的 C 程序中，每个文件都是逐一编译并链接成一个可执行文件。</p>
</li>
<li>
<p>在编译过程之前，变量的作用域定义了它的可见性和可访问性。</p>
<ul>
<li>编译器利用作用域的特性</li>
</ul>
</li>
<li>
<p>链接过程中才涉及到链接属性的问题：</p>
<ul>
<li>变量是否应该在其他文件中被访问？</li>
<li>变量是否应该仅限于在其声明文件内使用？</li>
</ul>
</div>
<div class = "rdiv">
<p><img src="img/Compilation-Process-in-C.png" alt="#c" style="width:300px;" /></p>
</div>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-13">3. Variables</h2>
<h4 id="scope-storage-duration-and-linkage">Scope, Storage duration and Linkage</h4>
<div align="#c">
<table>
<thead>
<tr>
<th>Type</th>
<th>Example</th>
<th>Scope</th>
<th>Duration</th>
<th>Linkage</th>
</tr>
</thead>
<tbody>
<tr>
<td>Local variable</td>
<td><code>int x;</code></td>
<td>Block</td>
<td>Automatic</td>
<td>None</td>
</tr>
<tr>
<td>Static local variable</td>
<td><code>static int s_x;</code></td>
<td>Block</td>
<td>Static</td>
<td>None</td>
</tr>
<tr>
<td>Function parameter</td>
<td><code>void foo(int x)</code></td>
<td>Block</td>
<td>Automatic</td>
<td>None</td>
</tr>
<tr>
<td>Internal global variable</td>
<td><code>static int g_x;</code></td>
<td>File</td>
<td>Static</td>
<td>Internal</td>
</tr>
<tr>
<td>External global variable</td>
<td><code>int g_x;</code></td>
<td>File</td>
<td>Static</td>
<td>External</td>
</tr>
</tbody>
</table>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="bq-red" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="bq-red" data-marpit-pagination="69" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:bq-red;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-14">3. Variables</h2>

<h4 id="scope-storage-duration-and-linkage-1">Scope, Storage duration and Linkage</h4>
<ul>
<li>所有<strong>具有内部或外部连接性</strong>的对象都具有<strong>静态存储持续时间</strong>。</li>
<li><strong>块作用域</strong>变量默认情况下<strong>没有链接属性</strong>，且具有<strong>自动存储持续时间</strong>。
<ul>
<li>局部变量的存储持续时间从进入块时开始，但在看到声明之前，变量不在作用域内，无法被访问。</li>
</ul>
</li>
<li><strong>文件作用域标识符</strong>默认情况下<strong>具有链接性</strong>和<strong>静态存储持续时间</strong>。
<ul>
<li>这些标识符的作用域仅限于它们自己的翻译单元，那么如何从其他翻译单元中引用它们？</li>
</ul>
</li>
</ul>
<blockquote>
<p>CppReference：</p>
<p>如果在多个作用域中声明了具有相同<strong>标识符</strong>的变量或函数，但是不能从所有作用域中引用，则会<strong>生成该变量的多个实例</strong>。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="70" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-15">3. Variables</h2>
<h4 id="internal-linkage-static-keyword">Internal Linkage: <code>static</code> Keyword</h4>
<div class = "ldiv">
<ul>
<li>For block-scope variables,
<ul>
<li>grant them static storage duration</li>
<li>ensure them to be initialized once</li>
</ul>
</li>
</ul>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-type">void</span> <span class="hljs-title function_">counter</span><span class="hljs-params">()</span> {
  <span class="hljs-type">static</span> <span class="hljs-type">int</span> count = <span class="hljs-number">0</span>; 
  count++;
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, count);
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  counter();  <span class="hljs-comment">// Output: 1</span>
  counter();  <span class="hljs-comment">// Output: 2</span>
  counter();  <span class="hljs-comment">// Output: 3</span>
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</div>
<div class = "rdiv">
<ul>
<li>For file-scope identifiers (both functions and variables),
<ul>
<li>grant them static storage duration</li>
<li>grant them internal linkage</li>
</ul>
</li>
</ul>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-comment">// File-scope static variable</span>
<span class="hljs-type">static</span> <span class="hljs-type">int</span> file_scope_var = <span class="hljs-number">42</span>;  
<span class="hljs-comment">// File-scope static function</span>
<span class="hljs-type">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">file_scope_function</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>{  
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, file_scope_var);
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>{
  file_scope_function();
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="71" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-16">3. Variables</h2>
<h4 id="external-linkage-extern-keyword">External Linkage: <code>extern</code> keyword</h4>
<ul>
<li>使用<code>extern</code>关键字声明的变量是外部变量，表明该变量在其他文件中定义。</li>
<li><code>extern</code>说明符指定了<strong>静态存储持续时间</strong>和<strong>外部链接性</strong>。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="72" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-17">3. Variables</h2>
<div class = "ldiv">
<h4 id="example-1-of-extern">Example 1 of <code>extern</code></h4>
<p>File1: <code>file1.c</code></p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-comment">// Definition of a global variable</span>
<span class="hljs-type">int</span> shared_variable = <span class="hljs-number">42</span>;  
<span class="hljs-type">void</span> <span class="hljs-title function_">display_variable</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, shared_variable);
}
</code></pre>
<ul>
<li>在 <code>file1.c</code> 中，<code>shared_variable</code> 为一个全局变量。</li>
<li>在 <code>file2.c</code> 中，我们使用 extern 声明它，这使我们可以访问并修改来自 <code>file1.c</code> 的 <code>shared_variable</code>。</li>
</ul>
</div>
<div class = "rdiv">
<p>File2: <code>file2.c</code></p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-keyword">extern</span> <span class="hljs-type">int</span> shared_variable;  
<span class="hljs-type">void</span> <span class="hljs-title function_">display_variable</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>;
<span class="hljs-type">void</span> <span class="hljs-title function_">modify_variable</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  shared_variable = <span class="hljs-number">100</span>; 
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  modify_variable();  
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, shared_variable);
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<p>Output:<br />
<code>42</code><br />
<code>100</code></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-class="cols-2" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" class="cols-2" data-marpit-pagination="73" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--class:cols-2;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-18">3. Variables</h2>
<h4 id="example-2-of-extern">Example 2 of <code>extern</code></h4>
<div class = "ldiv">
<p>File1: <code>file1.c</code></p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-comment">// Definition of a global variable</span>

<span class="hljs-type">void</span> <span class="hljs-title function_">function_with_extern</span><span class="hljs-params">()</span> {
  <span class="hljs-comment">// Declaration within block scope</span>
  <span class="hljs-keyword">extern</span> <span class="hljs-type">int</span> shared_variable;
  <span class="hljs-comment">// Block scope access</span>
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, shared_variable);
}
</code></pre>
</div>
<div class = "rdiv">
<p>File2: <code>file2.c</code></p>
<pre><code class="language-c"><span class="hljs-comment">// Declaration of the external variable</span>

<span class="hljs-type">void</span> <span class="hljs-title function_">function_with_extern</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>;

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">()</span> {
  <span class="hljs-comment">// accesses the variable</span>
  function_with_extern();
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<p>Output: <code>42</code></p>
</div>
<br />
<ul>
<li><code>extern</code> can also be used to declrations of block scope.</li>
</ul>
</section>

<ul>
<li>静态全局变量只具有内部链接性，因此无法在其他翻译单元中访问它们。</li>
<li>即使在外部添加 <code>extern</code> 修饰的声明，其链接属性仍为内部。</li>

<header> <em>CS100</em> <em>Tutorial 3</em> <em>Fall 2025</em></header>
<h2 id="3-variables-21">3. Variables</h2>
<h4 id="variables-implicit-initialization">Variables: Implicit Initialization</h4>
<p>如果一个变量在声明时没有显式初始化：</p>
<ul>
<li>具有<strong>自动存储期</strong>（例如，局部的非<code>static</code>变量）的对象将被初始化为<strong>不确定值</strong>。换句话说，它们是<strong>未初始化的</strong>。</li>
<li>对于具有静态存储期的对象（例如，全局或局部的<code>static</code>变量），它们会进行 <a href="https://en.cppreference.com/w/c/language/initialization#Empty_initialization"><strong>空初始化</strong></a> （在 C++ 中称为 <a href="https://en.cppreference.com/w/cpp/language/zero_initialization">零初始化</a> ）：
<ul>
<li><strong>指针被初始化为其类型的<em>空指针值</em>。</strong></li>
<li>整数类型的对象被初始化为 <code>0</code>。</li>
<li>浮点类型的对象被初始化为正零 (<code>0.0</code>)。</li>
<li>数组的所有元素、结构体的所有成员以及联合体的第一个成员都会递归地进行空初始化，并且所有填充位都会被初始化为零。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-header=" *CS100* *Tutorial 3* *Fall 2025*" data-theme="dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c" lang="en-US" data-marpit-pagination="77" style="--paginate:true;--header: *CS100* *Tutorial 3* *Fall 2025*;--theme:dyg7wyx7lrdsktpwv77s1eb0pgghn9jcd97dmjdy676c;" data-marpit-pagination-total="96" data-size="16:9">
