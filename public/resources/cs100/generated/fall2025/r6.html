<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="1-c-%E7%9A%84%E5%BC%80%E5%A7%8B-1">1. C++ 的开始</h2>
<p>首先，我们采用 C++17 语言标准。如果你使用 VSCode ：</p>
<ul>
<li><code>settings.json</code>：<code>code-runner.executorMap</code> 里 <code>&quot;cpp&quot;</code> 项，确保编译指令中的语言标准是 <code>-std=c++17</code> 。</li>
<li><code>c_cpp_properties.json</code>：<code>&quot;cppStandard&quot;</code> 项设置为 <code>c++17</code></li>
</ul>
<p>调试：最简单粗暴的方法是把 <code>tasks.json</code> 和 <code>launch.json</code> 都删掉，然后调试 C++ 程序，VSCode 会自动生成。</p>
<ul>
<li>调试 C++ 时要选 <code>g++.exe</code>。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="1-c-%E7%9A%84%E5%BC%80%E5%A7%8B-2">1. C++ 的开始</h2>
<h4 id="hello-world-with-c">Hello World with C++!</h4>
<pre><code class="language-cpp"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;iostream&gt;</span></span>

<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">main</span><span class="hljs-params">()</span> </span>{
  std::cout &lt;&lt; <span class="hljs-string">&quot;Hello C++ World\n&quot;</span>;
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-class="trans" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" class="trans" style="--class:trans;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-size="16:9">
<h2 id="2-iostream">2. iostream</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="2-iostream-1">2. <code>iostream</code></h2>
<pre><code class="language-cpp"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;iostream&gt;</span></span>

<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">main</span><span class="hljs-params">()</span> </span>{
  <span class="hljs-type">int</span> a, b;
  std::cin &gt;&gt; a &gt;&gt; b;
  std::cout &lt;&lt; a + b &lt;&lt; <span class="hljs-string">&#x27;\n&#x27;</span>;
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<p><code>std::cin</code> 和 <code>std::cout</code> 是定义在 <code>&lt;iostream&gt;</code> 中的两个<strong>对象</strong>，分别表示标准输入流和标准输出流。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="2-iostream-2">2. <code>iostream</code></h2>
<p><code>std::cin &gt;&gt; x</code> 输入一个东西给 <code>x</code>。</p>
<ul>
<li><code>x</code> 可以是任何受支持的类型，例如整数、浮点数、字符、字符串。</li>
<li><strong>C++ 有能力识别 <code>x</code> 的类型并选择正确的方式输入，不需要丑陋的 &quot;%d&quot;、&quot;%c&quot; 来告诉它。</strong></li>
<li>C++ 有办法获得 <code>x</code> 的<strong>引用</strong>，因此不需要取 <code>x</code> 的地址。</li>
<li>表达式 <code>std::cin &gt;&gt; x</code> 执行完毕后会把 <code>std::cin</code> 返回出来，所以可以连着写：<code>std::cin &gt;&gt; x &gt;&gt; y &gt;&gt; z</code></li>
</ul>
<p>输出也是一样的：<code>std::cout &lt;&lt; x &lt;&lt; y &lt;&lt; z</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="2-iostream-3">2. <code>iostream</code></h2>
<p><code>std::cout &lt;&lt; std::endl;</code></p>
<ul>
<li><code>std::endl</code> 是一个“操纵符”。<code>std::cout &lt;&lt; std::endl</code> 的含义是<strong>输出换行符，并刷新输出缓冲区</strong>。</li>
</ul>
<p>如果你不手动刷新缓冲区，<code>std::cout</code> 自有规则在特定情况下刷新缓冲区。（C <code>stdout</code> 也是一样）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-class="trans" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" class="trans" style="--class:trans;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-size="16:9">
<h2 id="3-std-c-%E4%B8%8E-c">3. std, C++ 与 C</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="3-std-c-%E4%B8%8E-c-1">3. std, C++ 与 C</h2>
<h4 id="31-namespace-std">3.1. namespace <code>std</code></h4>
<p>C++ 有一套非常庞大的标准库，为了避免名字冲突，所有的名字（函数、类、类型别名、模板、全局对象等）都在一个名为 <code>std</code> 的<strong>命名空间</strong>下。</p>
<ul>
<li>你可以用 <code>using std::cin;</code> 将 <code>cin</code> 引入当前作用域，那么在当前作用域内就可以省略 <code>std::cin</code> 的 <code>std::</code>。</li>
<li>你可以用 <code>using namespace std;</code> 将 <code>std</code> 中的所有名字都引入当前作用域，<strong>但这将使得命名空间形同虚设，并且重新引入了名字冲突的风险</strong>。（我个人极不推荐，并且我自己从来不写）</li>
</ul>
<p>我们不允许在头文件的全局作用域中使用以上任何一种 <code>using</code> 。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="3-std-c-%E4%B8%8E-c-2">3. std, C++ 与 C</h2>
<h4 id="32-%E5%AF%B9-c-%E6%A0%87%E5%87%86%E5%BA%93%E7%9A%84%E5%85%BC%E5%AE%B9">3.2. 对 C 标准库的兼容</h4>
<p>C++ 标准库包含了 C 标准库的设施，<strong>但并不完全一样</strong>。</p>
<ul>
<li>因为一些历史问题（向后兼容），C 有很多不合理之处，例如 <code>strchr</code> 接受 <code>const char *</code> 却返回 <code>char *</code>，某些本应该是函数的东西被实现为宏。</li>
<li>C 缺乏 C++ 的 function overloading 等机制，因此某些设计显得繁琐。</li>
<li>C++ 的编译期计算能力远远强过 C，例如 <code>&lt;cmath&gt;</code> 里的数学函数自 C++23 起可以在编译时计算。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="3-std-c-%E4%B8%8E-c-3">3. std, C++ 与 C</h2>
<h4 id="32-%E5%AF%B9-c-%E6%A0%87%E5%87%86%E5%BA%93%E7%9A%84%E5%85%BC%E5%AE%B9-1">3.2. 对 C 标准库的兼容</h4>
<p>C 的标准库文件 <code>&lt;xxx.h&gt;</code> 在 C++ 中的版本是 <code>&lt;cxxx&gt;</code>，并且所有名字也被引入了 <code>namespace std</code>。</p>
<pre><code class="language-cpp"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;cstdio&gt;</span></span>
<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">main</span><span class="hljs-params">()</span> </span>{ std::<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Hello world\n&quot;</span>); }
</code></pre>
<blockquote>
<p>在 C++ 中使用来自 C 的标准库文件时，请使用 <code>&lt;cxxx&gt;</code> 而非 <code>&lt;xxx.h&gt;</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="3-std-c-%E4%B8%8E-c-4">3. std, C++ 与 C</h2>
<h4 id="33-c-%E4%B8%AD%E7%9A%84-c">3.3. C++ 中的 C</h4>
<p>更合理的设计</p>
<ul>
<li><code>bool</code>、<code>true</code>、<code>false</code> 是内置的，不需要额外头文件</li>
<li>逻辑运算符和关系运算符的返回值是 <code>bool</code> 而非 <code>int</code></li>
<li><code>&quot;hello&quot;</code> 的类型是 <code>const char [6]</code> 而非 <code>char [6]</code></li>
<li>字符字面值 <code>'a'</code> 的类型是 <code>char</code> 而非 <code>int</code></li>
<li>所有有潜在风险的类型转换都不允许隐式发生，不是 warning，而是 error。</li>
<li>由 <code>const int maxn = 100;</code> 声明的 <code>maxn</code> 是编译期常量，可以作为数组大小。</li>
<li><code>int fun()</code> <strong>不接受参数</strong>，而非接受任意参数。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-class="trans" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" class="trans" style="--class:trans;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-size="16:9">
<h2 id="4-stdstring">4. std::string</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="4-stdstring-1">4. <code>std::string</code></h2>
<p>定义在标准库文件 <code>&lt;string&gt;</code> 中（<strong>不是 <code>&lt;string.h&gt;</code>，不是 <code>&lt;cstring&gt;</code>！！</strong>）</p>
<p>真正意义上的“字符串”。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="4-stdstring-2">4. <code>std::string</code></h2>
<h4 id="41-%E5%AE%9A%E4%B9%89%E5%B9%B6%E5%88%9D%E5%A7%8B%E5%8C%96%E4%B8%80%E4%B8%AA%E5%AD%97%E7%AC%A6%E4%B8%B2">4.1. 定义并初始化一个字符串</h4>
<pre><code class="language-cpp">std::string str = <span class="hljs-string">&quot;Hello world&quot;</span>;
<span class="hljs-comment">// equivalent: std::string str(&quot;Hello world&quot;);</span>
<span class="hljs-comment">// equivalent: std::string str{&quot;Hello world&quot;}; (modern)</span>
std::cout &lt;&lt; str &lt;&lt; std::endl;

<span class="hljs-function">std::string <span class="hljs-title">s1</span><span class="hljs-params">(<span class="hljs-number">7</span>, <span class="hljs-string">&#x27;a&#x27;</span>)</span></span>;
std::cout &lt;&lt; s1 &lt;&lt; std::endl; <span class="hljs-comment">// aaaaaaa</span>

std::string s2 = s1; <span class="hljs-comment">// s2 is a copy of s1</span>
std::cout &lt;&lt; s2 &lt;&lt; std::endl; <span class="hljs-comment">// aaaaaaa</span>

std::string s; <span class="hljs-comment">// &quot;&quot; (empty string)</span>
</code></pre>
<blockquote>
<p>默认初始化一个 <code>std::string</code> 对象会得到空串，而非未定义的值！</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="4-stdstring-3">4. <code>std::string</code></h2>
<h4 id="42-%E4%B8%80%E4%BA%9B%E9%97%AE%E9%A2%98">4.2. 一些问题</h4>
<ul>
<li><code>std::string</code> 的内存：<strong>自动管理，自动分配，需要时自动增长，自动释放</strong></li>
<li>使用 <code>std::string</code> 时，<strong>关注字符串的内容本身，而非它的实现细节</strong>
<ul>
<li>不必再考虑它的内存是怎么管理的，不必考虑末尾是不是有 <code>'\0'</code> 。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="4-stdstring-4">4. <code>std::string</code></h2>
<h4 id="43-stdstring-%E7%9A%84%E9%95%BF%E5%BA%A6">4.3. <code>std::string</code> 的长度</h4>
<p><strong><code>s.size()</code> 成员函数</strong></p>
<pre><code class="language-cpp">std::string str{<span class="hljs-string">&quot;Hello world&quot;</span>};
std::cout &lt;&lt; str.<span class="hljs-built_in">size</span>() &lt;&lt; std::endl;
</code></pre>
<blockquote>
<p>不是 <code>strlen</code>，更不是 <code>sizeof</code>！！！</p>
</blockquote>
<p><strong><code>s.empty()</code> 成员函数</strong></p>
<pre><code class="language-cpp"><span class="hljs-keyword">if</span> (str.<span class="hljs-built_in">empty</span>()) {
  <span class="hljs-comment">// ...</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="4-stdstring-5">4. <code>std::string</code></h2>
<h4 id="44-%E5%AD%97%E7%AC%A6%E4%B8%B2%E7%9A%84%E8%BF%9E%E6%8E%A5">4.4. 字符串的连接</h4>
<p>直接用 <code>+</code> 和 <code>+=</code> 就行了！</p>
<p><strong>不需要考虑内存怎么分配，不需要 <code>strcat</code> 这样的函数</strong>。</p>
<pre><code class="language-cpp">std::string s1 = <span class="hljs-string">&quot;Hello&quot;</span>;
std::string s2 = <span class="hljs-string">&quot;world&quot;</span>;
std::string s3 = s1 + <span class="hljs-string">&#x27; &#x27;</span> + s2; <span class="hljs-comment">// &quot;Hello world&quot;</span>
s1 += s2; <span class="hljs-comment">// s1 becomes &quot;Helloworld&quot;</span>
s2 += <span class="hljs-string">&quot;C++string&quot;</span>; <span class="hljs-comment">// s2 becomes &quot;worldC++string&quot;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="4-stdstring-6">4. <code>std::string</code></h2>
<h4 id="44-%E5%AD%97%E7%AC%A6%E4%B8%B2%E7%9A%84%E8%BF%9E%E6%8E%A5-1">4.4. 字符串的连接</h4>
<p><code>+</code> 两侧至少有一个得是 <code>std::string</code> 对象。</p>
<pre><code class="language-cpp"><span class="hljs-type">const</span> <span class="hljs-type">char</span> *old_bad_ugly_c_style_string = <span class="hljs-string">&quot;hello&quot;</span>;
std::string s = old_bad_ugly_c_style_string + <span class="hljs-string">&quot;aaaaa&quot;</span>; <span class="hljs-comment">// Error</span>
</code></pre>
<p>下面这个是否合法？</p>
<pre><code class="language-cpp">std::string hello{<span class="hljs-string">&quot;hello&quot;</span>};
std::string s = hello + <span class="hljs-string">&quot;world&quot;</span> + <span class="hljs-string">&quot;C++&quot;</span>;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="4-stdstring-7">4. <code>std::string</code></h2>
<h4 id="44-%E5%AD%97%E7%AC%A6%E4%B8%B2%E7%9A%84%E8%BF%9E%E6%8E%A5-2">4.4. 字符串的连接</h4>
<p><code>+</code> 两侧至少有一个得是 <code>std::string</code> 对象。</p>
<pre><code class="language-cpp"><span class="hljs-type">const</span> <span class="hljs-type">char</span> *old_bad_ugly_c_style_string = <span class="hljs-string">&quot;hello&quot;</span>;
std::string s = old_bad_ugly_c_style_string + <span class="hljs-string">&quot;aaaaa&quot;</span>; <span class="hljs-comment">// Error</span>
</code></pre>
<p>下面这个是否合法？</p>
<pre><code class="language-cpp">std::string hello{<span class="hljs-string">&quot;hello&quot;</span>};
std::string s = hello + <span class="hljs-string">&quot;world&quot;</span> + <span class="hljs-string">&quot;C++&quot;</span>;
</code></pre>
<p><strong>合法</strong>：<code>+</code> 是<strong>左结合</strong>的，<code>(hello + &quot;world&quot;)</code> 是一个 <code>std::string</code> 对象。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="4-stdstring-8">4. <code>std::string</code></h2>
<h4 id="44-%E5%AD%97%E7%AC%A6%E4%B8%B2%E7%9A%84%E8%BF%9E%E6%8E%A5-3">4.4. 字符串的连接</h4>
<p><strong>使用 <code>+=</code></strong></p>
<p><code>s1 = s1 + s2</code> 会先为 <code>s1 + s2</code> 构造一个临时对象，必然要拷贝一遍 <code>s1</code> 的内容。</p>
<p>而 <code>s1 += s2</code> 是直接在 <code>s1</code> 后面连接 <code>s2</code>。</p>
<p>试一试：</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-cpp">std::string result;
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != n; ++i)
  result += <span class="hljs-string">&#x27;a&#x27;</span>;
</code></pre>
  </div>
  <div>
<pre><code class="language-cpp">std::string result;
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != n; ++i)
  result = result + <span class="hljs-string">&#x27;a&#x27;</span>;
</code></pre>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="4-stdstring-9">4. <code>std::string</code></h2>
<h4 id="45-%E5%AD%97%E7%AC%A6%E4%B8%B2%E6%AF%94%E8%BE%83%E5%AD%97%E5%85%B8%E5%BA%8F">4.5. 字符串比较（字典序）</h4>
<p>直接用 <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>, <code>==</code>, <code>!=</code>，不需要循环，不需要其它函数！</p>
<h4 id="46-%E5%AD%97%E7%AC%A6%E4%B8%B2%E7%9A%84%E6%8B%B7%E8%B4%9D%E8%B5%8B%E5%80%BC">4.6. 字符串的拷贝赋值</h4>
<p>直接用 <code>=</code> 就行</p>
<pre><code class="language-cpp">std::string s1{<span class="hljs-string">&quot;Hello&quot;</span>};
std::string s2{<span class="hljs-string">&quot;world&quot;</span>};
s2 = s1; <span class="hljs-comment">// s2 is a copy of s1</span>
s1 += <span class="hljs-string">&#x27;a&#x27;</span>; <span class="hljs-comment">// s2 is still &quot;Hello&quot;</span>
</code></pre>
<p><code>std::string</code> 的 <code>=</code> 会<strong>拷贝</strong>这个字符串的内容。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="4-stdstring-10">4. <code>std::string</code></h2>
<h4 id="47-%E9%81%8D%E5%8E%86%E5%AD%97%E7%AC%A6%E4%B8%B2%E5%9F%BA%E4%BA%8E%E8%8C%83%E5%9B%B4%E7%9A%84-for-%E8%AF%AD%E5%8F%A5">4.7. 遍历字符串：基于范围的 <code>for</code> 语句</h4>
<p>例：输出所有大写字母（<code>std::isupper</code> 在 <code>&lt;cctype&gt;</code> 里）</p>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">char</span> c : s)
  <span class="hljs-keyword">if</span> (std::<span class="hljs-built_in">isupper</span>(c))
    std::cout &lt;&lt; c;
std::cout &lt;&lt; std::endl;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="4-stdstring-11">4. <code>std::string</code></h2>
<h4 id="47-%E9%81%8D%E5%8E%86%E5%AD%97%E7%AC%A6%E4%B8%B2%E5%9F%BA%E4%BA%8E%E8%8C%83%E5%9B%B4%E7%9A%84-for-%E8%AF%AD%E5%8F%A5-1">4.7. 遍历字符串：基于范围的 <code>for</code> 语句</h4>
<p>等价的方法：使用下标，但不够 modern，比较啰嗦。</p>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (std::<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i != s.<span class="hljs-built_in">size</span>(); ++i)
  <span class="hljs-keyword">if</span> (std::<span class="hljs-built_in">isupper</span>(s[i]))
    std::cout &lt;&lt; s[i];
std::cout &lt;&lt; std::endl;
</code></pre>
<p>基于范围的 <code>for</code> 语句<strong>更好，更清晰，更简洁，更通用，更现代，更推荐</strong>。</p>
<ul>
<li>你的意图是“遍历该字符串”，而非“创建一个整数并使它从 <code>0</code> 变化到 <code>s.size()</code> ”。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="4-stdstring-12">4. <code>std::string</code></h2>
<h4 id="48-%E5%AD%97%E7%AC%A6%E4%B8%B2%E7%9A%84-io">4.8. 字符串的 IO</h4>
<p><code>std::cin &gt;&gt; s</code> 可以输入字符串，<code>std::cout &lt;&lt; s</code> 可以输出字符串。</p>
<ul>
<li><code>std::cin &gt;&gt; s</code> 跳不跳过空白？是读到空白结束还是读一行结束？可以自己试试</li>
</ul>
<p><code>std::getline(std::cin, s)</code>：从当前位置开始读一行，<strong>换行符会读掉，但不会存进来</strong></p>
<ul>
<li>假如前一次输入恰好停在换行符处， <code>getline</code> 就会读进一个空串。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="4-stdstring-13">4. <code>std::string</code></h2>
<h4 id="stdstring-%E6%8E%A5%E5%8F%A3%E5%AE%8C%E6%95%B4%E5%88%97%E8%A1%A8"><code>std::string</code> 接口完整列表</h4>
<p><a href="https://en.cppreference.com/w/cpp/string/basic_string">https://en.cppreference.com/w/cpp/string/basic_string</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-class="trans" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" class="trans" style="--class:trans;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-size="16:9">
<h2 id="5-stdvector">5. std::vector</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-1">5. <code>std::vector</code></h2>
<p>定义在标准库文件 <code>&lt;vector&gt;</code> 中</p>
<p>真正好用的“动态数组”</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-2">5. <code>std::vector</code></h2>
<h4 id="51-%E5%88%9B%E5%BB%BA%E4%B8%80%E4%B8%AA-stdvector-%E5%AF%B9%E8%B1%A1">5.1. 创建一个 <code>std::vector</code> 对象</h4>
<p><code>std::vector</code> 是一个<strong>类模板</strong>，只有给出了模板参数之后才成为一个真正的类型。</p>
<pre><code class="language-cpp">std::vector&lt;<span class="hljs-type">int</span>&gt; vi;         <span class="hljs-comment">// An empty vector of ints</span>
std::vector&lt;std::string&gt; vs; <span class="hljs-comment">// An empty vector of strings</span>
std::vector&lt;<span class="hljs-type">double</span>&gt; vd;      <span class="hljs-comment">// An empty vector of doubles</span>
</code></pre>
<p>对于两个不同的类型 <code>T</code> 和 <code>U</code> ， <code>std::vector&lt;T&gt;</code> 和 <code>std::vector&lt;U&gt;</code> 是不同的类型。</p>
<p><code>std::vector</code> 不是类型。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-3">5. <code>std::vector</code></h2>
<h4 id="51-%E5%88%9B%E5%BB%BA%E4%B8%80%E4%B8%AA-stdvector-%E5%AF%B9%E8%B1%A1-1">5.1. 创建一个 <code>std::vector</code> 对象</h4>
<pre><code class="language-cpp">std::vector&lt;<span class="hljs-type">int</span>&gt; v{<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span>}; <span class="hljs-comment">// A vector of ints, whose elements are {2, 3, 5, 7}.</span>
std::vector&lt;<span class="hljs-type">int</span>&gt; v2 = {<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span>}; <span class="hljs-comment">// Equivalent to ↑</span>

std::vector&lt;std::string&gt; vs{<span class="hljs-string">&quot;hello&quot;</span>, <span class="hljs-string">&quot;world&quot;</span>}; <span class="hljs-comment">// A vector of strings, whose elements are {&quot;hello&quot;, &quot;world&quot;}.</span>
std::vector&lt;std::string&gt; vs2 = {<span class="hljs-string">&quot;hello&quot;</span>, <span class="hljs-string">&quot;world&quot;</span>}; <span class="hljs-comment">// Equivalent to ↑</span>

<span class="hljs-function">std::vector&lt;<span class="hljs-type">int</span>&gt; <span class="hljs-title">v3</span><span class="hljs-params">(<span class="hljs-number">10</span>)</span></span>; <span class="hljs-comment">// A vector of ten ints, all initialized to 0.</span>
<span class="hljs-function">std::vector&lt;<span class="hljs-type">int</span>&gt; <span class="hljs-title">v4</span><span class="hljs-params">(<span class="hljs-number">10</span>, <span class="hljs-number">42</span>)</span></span>; <span class="hljs-comment">// A vector of ten ints, all initialized to 42.</span>
</code></pre>
<p><code>vector&lt;T&gt; v(n)</code> 这种构造方式会将 <code>n</code> 个元素都<strong>值初始化 (value-initialization)</strong>（类似于 C 中的“空初始化”），而不是得到一串 indeterminant value 。</p>
<ul>
<li>对于类类型来说，“值初始化”<em>几乎</em>就是调用默认构造函数进行初始化。</li>
<li>标准库和我们同样讨厌未初始化的值！</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-4">5. <code>std::vector</code></h2>
<h4 id="51-%E5%88%9B%E5%BB%BA%E4%B8%80%E4%B8%AA-stdvector-%E5%AF%B9%E8%B1%A1-2">5.1. 创建一个 <code>std::vector</code> 对象</h4>
<pre><code class="language-cpp">std::vector&lt;<span class="hljs-type">int</span>&gt; v{<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span>};
std::vector&lt;<span class="hljs-type">int</span>&gt; v2 = v; <span class="hljs-comment">// v2 is a copy of v</span>
<span class="hljs-function">std::vector&lt;<span class="hljs-type">int</span>&gt; <span class="hljs-title">v3</span><span class="hljs-params">(v)</span></span>;  <span class="hljs-comment">// Equivalent</span>
std::vector&lt;<span class="hljs-type">int</span>&gt; v4{v};  <span class="hljs-comment">// Equivalent</span>
</code></pre>
<p>和 <code>std::string</code> 一样， <code>std::vector</code> 可以直接拷贝，<strong>不需要手动写循环逐元素拷贝</strong>。</p>
<pre><code class="language-cpp">std::vector&lt;std::vector&lt;<span class="hljs-type">int</span>&gt;&gt; v;
</code></pre>
<p>“二维 <code>vector</code>”，也就是“<code>vector</code> of <code>vector</code>”，当然也是可以的。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-5">5. <code>std::vector</code></h2>
<h4 id="c17-ctad">C++17 CTAD</h4>
<p>Class Template Argument Deduction：只要你给出了足够的信息，编译器可以自动推导元素的类型。</p>
<pre><code class="language-cpp">std::vector v{<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span>};  <span class="hljs-comment">// vector&lt;int&gt;</span>
std::vector v2{<span class="hljs-number">3.14</span>, <span class="hljs-number">6.28</span>}; <span class="hljs-comment">// vector&lt;double&gt;</span>
<span class="hljs-function">std::vector <span class="hljs-title">v3</span><span class="hljs-params">(<span class="hljs-number">10</span>, <span class="hljs-number">42</span>)</span></span>;     <span class="hljs-comment">// vector&lt;int&gt;</span>
<span class="hljs-function">std::vector <span class="hljs-title">v4</span><span class="hljs-params">(<span class="hljs-number">10</span>)</span></span>;         <span class="hljs-comment">// Error: cannot deduce template argument type</span>
</code></pre>
<ul>
<li>怎样算是给出了“足够的信息”？你品。（具体规则细节略去）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-6">5. <code>std::vector</code></h2>
<h4 id="52-stdvector-%E7%9A%84%E5%A4%A7%E5%B0%8F">5.2. <code>std::vector</code> 的大小</h4>
<p><code>v.size()</code> 和 <code>v.empty()</code></p>
<pre><code class="language-cpp">std::vector v{<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span>};
std::cout &lt;&lt; v.<span class="hljs-built_in">size</span>() &lt;&lt; std::endl;
<span class="hljs-keyword">if</span> (v.<span class="hljs-built_in">empty</span>()) {
  <span class="hljs-comment">// ...</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-7">5. <code>std::vector</code></h2>
<h4 id="53-%E6%B8%85%E7%A9%BA-stdvector">5.3. 清空 <code>std::vector</code></h4>
<p><code>v.clear()</code>。</p>
<p>不要写愚蠢的 <code>while (!v.empty()) v.pop_back();</code>!!!!!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-8">5. <code>std::vector</code></h2>
<h4 id="54-%E5%90%91-stdvector-%E6%B7%BB%E5%8A%A0%E5%85%83%E7%B4%A0">5.4. 向 <code>std::vector</code> 添加元素</h4>
<p><code>v.push_back(x)</code> 将元素 <code>x</code> 添加到 <code>v</code> 的末尾</p>
<pre><code class="language-cpp"><span class="hljs-type">int</span> n;
std::cin &gt;&gt; n;
std::vector&lt;<span class="hljs-type">int</span>&gt; v;
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != n; ++i) {
  <span class="hljs-type">int</span> x;
  std::cin &gt;&gt; x;
  v.<span class="hljs-built_in">push_back</span>(x);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-9">5. <code>std::vector</code></h2>
<h4 id="55-%E5%88%A0%E9%99%A4-stdvector-%E6%9C%80%E5%90%8E%E4%B8%80%E4%B8%AA%E5%85%83%E7%B4%A0">5.5. 删除 <code>std::vector</code> 最后一个元素</h4>
<p><code>v.pop_back()</code></p>
<p>练习：将末尾的偶数删掉，直到末尾是奇数为止</p>
<pre><code class="language-cpp"><span class="hljs-keyword">while</span> (!v.<span class="hljs-built_in">empty</span>() &amp;&amp; v.<span class="hljs-built_in">back</span>() % <span class="hljs-number">2</span> == <span class="hljs-number">0</span>)
  v.<span class="hljs-built_in">pop_back</span>();
</code></pre>
<p><code>v.back()</code>：获得末尾元素<strong>的引用</strong>（这意味着什么？）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-10">5. <code>std::vector</code></h2>
<h4 id="56-vback-%E5%92%8C-vfront">5.6. <code>v.back()</code> 和 <code>v.front()</code></h4>
<p>分别获得最后一个元素、第一个元素的<strong>引用</strong>。</p>
<p>“引用”意味着你可以通过这两个成员函数修改它们：</p>
<pre><code class="language-cpp">v.<span class="hljs-built_in">front</span>() = <span class="hljs-number">42</span>;
++v.<span class="hljs-built_in">back</span>();
</code></pre>
<p><code>v.back()</code>, <code>v.front()</code>, <code>v.pop_back()</code> 在 <code>v</code> 为空的情况下是 undefined behavior 。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-11">5. <code>std::vector</code></h2>
<h4 id="57-%E5%9F%BA%E4%BA%8E%E8%8C%83%E5%9B%B4%E7%9A%84-for-%E8%AF%AD%E5%8F%A5">5.7. 基于范围的 <code>for</code> 语句</h4>
<p>遍历一个 <code>std::vector</code>，同样可以使用基于范围的 <code>for</code> 语句：</p>
<pre><code class="language-cpp">std::vector&lt;<span class="hljs-type">int</span>&gt; vi = <span class="hljs-built_in">some_values</span>();
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> x : vi)
  std::cout &lt;&lt; x &lt;&lt; std::endl;
std::vector&lt;std::string&gt; vs = <span class="hljs-built_in">some_strings</span>();
<span class="hljs-keyword">for</span> (<span class="hljs-type">const</span> std::string &amp;s : vs) <span class="hljs-comment">// use reference-to-const to avoid copying</span>
  std::cout &lt;&lt; s &lt;&lt; std::endl;
</code></pre>
<p>练习：使用基于范围的 <code>for</code> 语句，将一个 <code>vector&lt;string&gt;</code> 中的每个字符串的大写字母打印出来。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-12">5. <code>std::vector</code></h2>
<h4 id="58-%E5%9F%BA%E4%BA%8E%E8%8C%83%E5%9B%B4%E7%9A%84-for-%E8%AF%AD%E5%8F%A5">5.8. 基于范围的 <code>for</code> 语句</h4>
<p>练习：使用基于范围的 <code>for</code> 语句，将一个 <code>vector&lt;string&gt;</code> 中的每个字符串的大写字母打印出来。</p>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">const</span> std::string &amp;s : vs) {
  <span class="hljs-keyword">for</span> (<span class="hljs-type">char</span> c : s)
    <span class="hljs-keyword">if</span> (std::<span class="hljs-built_in">isupper</span>(c))
      std::cout &lt;&lt; c;
  std::cout &lt;&lt; std::endl;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-13">5. <code>std::vector</code></h2>
<h4 id="59-%E4%BD%BF%E7%94%A8%E4%B8%8B%E6%A0%87%E8%AE%BF%E9%97%AE">5.9. 使用下标访问</h4>
<p>可以使用 <code>v[i]</code> 来获得第 <code>i</code> 个元素</p>
<ul>
<li><code>i</code> 的有效范围是 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="5.655ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2499.7 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="5B" d="M118 -250V750H255V710H158V-210H255V-250H118Z"></path></g><g data-mml-node="mn" transform="translate(278,0)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g><g data-mml-node="mo" transform="translate(778,0)"><path data-c="2C" d="M78 35T78 60T94 103T137 121Q165 121 187 96T210 8Q210 -27 201 -60T180 -117T154 -158T130 -185T117 -194Q113 -194 104 -185T95 -172Q95 -168 106 -156T131 -126T157 -76T173 -3V9L172 8Q170 7 167 6T161 3T152 1T140 0Q113 0 96 17Z"></path></g><g data-mml-node="mi" transform="translate(1222.7,0)"><path data-c="1D441" d="M234 637Q231 637 226 637Q201 637 196 638T191 649Q191 676 202 682Q204 683 299 683Q376 683 387 683T401 677Q612 181 616 168L670 381Q723 592 723 606Q723 633 659 637Q635 637 635 648Q635 650 637 660Q641 676 643 679T653 683Q656 683 684 682T767 680Q817 680 843 681T873 682Q888 682 888 672Q888 650 880 642Q878 637 858 637Q787 633 769 597L620 7Q618 0 599 0Q585 0 582 2Q579 5 453 305L326 604L261 344Q196 88 196 79Q201 46 268 46H278Q284 41 284 38T282 19Q278 6 272 0H259Q228 2 151 2Q123 2 100 2T63 2T46 1Q31 1 31 10Q31 14 34 26T39 40Q41 46 62 46Q130 49 150 85Q154 91 221 362L289 634Q287 635 234 637Z"></path></g><g data-mml-node="mo" transform="translate(2110.7,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z"></path></g></g></g></svg></mjx-container>，其中 <code>N = v.size()</code></li>
<li>越界访问是<strong>未定义行为</strong>，并且通常是<strong>严重的运行时错误</strong>。</li>
<li><code>std::vector</code> 的下标运算符 <code>v[i]</code> <strong>并不检查越界</strong>，目的是为了保证效率。
<ul>
<li>事实上标准库容器的大多数操作（比如刚才的 <code>front</code>, <code>back</code>, <code>pop_back</code> ）都没有边界检查，为了效率。</li>
</ul>
</li>
<li>一种检查越界的下标是 <code>v.at(i)</code>，它会在越界时抛出 <code>std::out_of_range</code> 异常。
<ul>
<li>不妨自己试一试。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-14">5. <code>std::vector</code></h2>
<h4 id="510-%E6%8E%A5%E5%8F%A3%E7%9A%84%E7%BB%9F%E4%B8%80%E6%80%A7">5.10. 接口的统一性</h4>
<p>事实上 <code>std::string</code> 也有 <code>.at()</code>, <code>.front()</code>, <code>.back()</code>, <code>.push_back(x)</code>, <code>.pop_back()</code>, <code>.clear()</code> 等函数。C++ 标准库的各种设施是讲究统一性的。</p>
<p><a href="https://en.cppreference.com/w/cpp/container#Function_table">完整列表</a></p>
<p>练习：实现 Python 的 <code>rstrip</code> 函数，接受一个 <code>std::string</code>，返回它删去末尾的连续空白后的结果。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-15">5. <code>std::vector</code></h2>
<h4 id="510-%E6%8E%A5%E5%8F%A3%E7%9A%84%E7%BB%9F%E4%B8%80%E6%80%A7-1">5.10. 接口的统一性</h4>
<p>练习：实现 Python 的 <code>rstrip</code> 函数，接受一个 <code>std::string</code>，返回它删去末尾的连续空白后的结果。</p>
<pre><code class="language-cpp"><span class="hljs-function">std::string <span class="hljs-title">rstrip</span><span class="hljs-params">(std::string str)</span> </span>{
  <span class="hljs-keyword">while</span> (!str.<span class="hljs-built_in">empty</span>() &amp;&amp; std::<span class="hljs-built_in">isspace</span>(str.<span class="hljs-built_in">back</span>()))
    str.<span class="hljs-built_in">pop_back</span>();
  <span class="hljs-keyword">return</span> str;
}
</code></pre>
<p>在 C++17 下，这个 <code>return str;</code> 是不会产生拷贝的，不必担心。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-16">5. <code>std::vector</code></h2>
<h4 id="511-stdvector-%E7%9A%84%E5%A2%9E%E9%95%BF%E7%AD%96%E7%95%A5">5.11. <code>std::vector</code> 的增长策略</h4>
<p>考虑像这样连续 <code>push_back</code> <code>n</code> 次得到一个 <code>vector</code> 的代码：</p>
<pre><code class="language-cpp">std::vector&lt;<span class="hljs-type">int</span>&gt; v;
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != n; ++i)
  v.<span class="hljs-built_in">push_back</span>(i);
</code></pre>
<p><code>vector</code> 是如何做到快速增长的？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header=" *CS100* *Tutorial 6* *Fall 2025*" data-theme="zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--header: *CS100* *Tutorial 6* *Fall 2025*;--theme:zu9o5kbhnrokdfi2qjfgpqby3m4w5hs3cvn1hebfob1b;" data-marpit-pagination-total="50" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-17">5. <code>std::vector</code></h2>
<h4 id="511-stdvector-%E7%9A%84%E5%A2%9E%E9%95%BF%E7%AD%96%E7%95%A5-1">5.11. <code>std::vector</code> 的增长策略</h4>
<p>假设现在有一片动态分配的内存，长度为 <code>i</code>。</p>
<p>当第 <code>i+1</code> 个元素到来时，朴素做法：</p>
<ol>
<li>分配一片长度为 <code>i+1</code> 的内存</li>
<li>将原有的 <code>i</code> 个元素拷贝过来</li>
<li>将新的元素放在后面</li>
<li>释放原来的那片内存</li>
</ol>
<p>但这需要拷贝 <code>i</code> 个元素。<code>n</code> 次 <code>push_back</code> 总共就需要 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -2.819ex;" xmlns="http://www.w3.org/2000/svg" width="13.963ex" height="6.712ex" role="img" focusable="false" viewBox="0 -1720.9 6171.4 2966.8"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mstyle"><g data-mml-node="munderover"><g data-mml-node="mo"><path data-c="2211" d="M60 948Q63 950 665 950H1267L1325 815Q1384 677 1388 669H1348L1341 683Q1320 724 1285 761Q1235 809 1174 838T1033 881T882 898T699 902H574H543H251L259 891Q722 258 724 252Q725 250 724 246Q721 243 460 -56L196 -356Q196 -357 407 -357Q459 -357 548 -357T676 -358Q812 -358 896 -353T1063 -332T1204 -283T1307 -196Q1328 -170 1348 -124H1388Q1388 -125 1381 -145T1356 -210T1325 -294L1267 -449L666 -450Q64 -450 61 -448Q55 -446 55 -439Q55 -437 57 -433L590 177Q590 178 557 222T452 366T322 544L56 909L55 924Q55 945 60 948Z"></path></g><g data-mml-node="TeXAtom" transform="translate(148.2,-1087.9) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="1D456" d="M184 600Q184 624 203 642T247 661Q265 661 277 649T290 619Q290 596 270 577T226 557Q211 557 198 567T184 600ZM21 287Q21 295 30 318T54 369T98 420T158 442Q197 442 223 419T250 357Q250 340 236 301T196 196T154 83Q149 61 149 51Q149 26 166 26Q175 26 185 29T208 43T235 78T260 137Q263 149 265 151T282 153Q302 153 302 143Q302 135 293 112T268 61T223 11T161 -11Q129 -11 102 10T74 74Q74 91 79 106T122 220Q160 321 166 341T173 380Q173 404 156 404H154Q124 404 99 371T61 287Q60 286 59 284T58 281T56 279T53 278T49 278T41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mo" transform="translate(345,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mn" transform="translate(1123,0)"><path data-c=" <header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-18">5. <code>std::vector</code></h2>
<h4 id="511-stdvector-%E7%9A%84%E5%A2%9E%E9%95%BF%E7%AD%96%E7%95%A5-2">5.11. <code>std::vector</code> 的增长策略</h4>
<p>假设现在有一片动态分配的内存，长度为 <code>i</code>。</p>
<p>当第 <code>i+1</code> 个元素到来时，</p>
<ol>
<li>分配一片长度为 <code>2*i</code> 的内存</li>
<li>将原有的 <code>i</code> 个元素拷贝过来</li>
<li>将新的元素放在后面</li>
<li>释放原来的那片内存</li>
</ol>
<p>而当第 <code>i+2</code>, <code>i+3</code>, ..., <code>2*i</code> 个元素到来时，我们不需要分配新的内存，也不需要拷贝任何对象！</p>
</section>

<header> <em>CS100</em> <em>Tutorial 6</em> <em>Fall 2025</em></header>
<h2 id="5-stdvector-20">5. <code>std::vector</code></h2>
<h4 id="511-stdvector-%E5%8A%A8%E6%80%81%E5%A2%9E%E9%95%BF%E5%B8%A6%E6%9D%A5%E7%9A%84%E5%BD%B1%E5%93%8D">5.11. <code>std::vector</code> 动态增长带来的影响</h4>
<p>我们已经看到，改变 <code>vector</code> 的大小可能会导致它所保存的元素“搬家”，这会使得所有指针、引用、迭代器失效。</p>
<ul>
<li>
<p>最直接的影响：下面的代码是 undefined behavior，因为基于范围的 <code>for</code> 语句本质上依赖于迭代器。</p>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i : vec)
  <span class="hljs-keyword">if</span> (i % <span class="hljs-number">2</span> == <span class="hljs-number">0</span>)
    vec.<span class="hljs-built_in">push_back</span>(i + <span class="hljs-number">1</span>);
</code></pre>
<p><strong>不要在用基于范围的 <code>for</code> 语句遍历容器的同时改变容器的大小！</strong></p>
</li>
</ul>
</section>
