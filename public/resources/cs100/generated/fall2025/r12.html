<h2 id="stl-%E8%BF%AD%E4%BB%A3%E5%99%A8%E5%92%8C%E7%AE%97%E6%B3%95">STL 迭代器和算法</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="1-%E8%BF%AD%E4%BB%A3%E5%99%A8">1. 迭代器</h2>
<h4 id="11-%E8%BF%AD%E4%BB%A3%E5%99%A8%E7%AE%80%E4%BB%8B">1.1. 迭代器简介</h4>
<p>一种用来访问容器中的元素的广义“指针”。</p>
<ul>
<li><strong>每个容器</strong>（以及 <code>std::string</code>）都有迭代器，其类型为 <code><em>Container</em>::iterator</code></li>
<li><code>c.begin()</code> 返回“首迭代器”：指向开头</li>
<li><code>c.end()</code> 返回“尾后迭代器”：指向<strong>尾后</strong> (off-the-end) 位置</li>
<li>通常用一对迭代器表示一个<strong>左闭右开区间</strong>： <code>[begin, end)</code></li>
</ul>
<p><img src="img/range-begin-end.svg" alt="#c" style="width:700px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="1-%E8%BF%AD%E4%BB%A3%E5%99%A8-1">1. 迭代器</h2>
<h4 id="11-%E8%BF%AD%E4%BB%A3%E5%99%A8%E7%AE%80%E4%BB%8B-1">1.1. 迭代器简介</h4>
<p>并非所有容器都像 <code>std::vector</code> 或数组这样连续存储、支持用下标访问。</p>
<ul>
<li>链表，二叉树，哈希表……</li>
</ul>
<p>“广义指针”：扩展了指针的“访问元素”和“遍历序列”的功能，在不同的数据结构上 <code>++iter</code> 会采用不同的方式“前进到下一位置”。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="1-%E8%BF%AD%E4%BB%A3%E5%99%A8-2">1. 迭代器</h2>
<h4 id="12-%E8%BF%AD%E4%BB%A3%E5%99%A8%E7%9A%84%E5%9F%BA%E6%9C%AC%E6%93%8D%E4%BD%9C">1.2. 迭代器的基本操作</h4>
<p>所有迭代器类型都支持以下操作：</p>
<ul>
<li><code>*it</code> ：返回 <code>it</code> 所指向的元素的<strong>引用</strong></li>
<li><code>it-&gt;mem</code> ：等价于 <code>(*it).mem</code></li>
<li><code>++it</code>, <code>it++</code> ：将 <code>it</code> 前进一步。</li>
<li><code>it1 == it2</code>, <code>it1 != it2</code> ：检查 <code>it1</code> 和 <code>it2</code> 是否指向相同的位置。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="1-%E8%BF%AD%E4%BB%A3%E5%99%A8-3">1. 迭代器</h2>
<h4 id="13-%E8%BF%AD%E4%BB%A3%E5%99%A8%E5%9E%8B%E5%88%AB-iterator-categories">1.3. 迭代器型别 (Iterator categories)</h4>
<p>一个容器的迭代器型别归根到底取决于这个容器的性质。</p>
<ul>
<li><strong>ForwardIterator</strong> 前向迭代器：支持基本操作。</li>
<li><strong>BidirectionalIterator</strong> 双向迭代器：在前向迭代器的基础上还支持 <code>--it</code> 和 <code>it--</code> 。</li>
<li><strong>RandomAccessIterator</strong> 随机访问迭代器：在双向迭代器的基础上还支持算术运算和大小比较（类似于指针）
<ul>
<li><code>it + n</code>, <code>n + it</code>, <code>it - n</code>, <code>it += n</code>, <code>it -= n</code>, <code>it[n]</code>, <code>it1 - it2</code>, <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code></li>
<li><code>std::string::iterator</code> 和 <code>std::vector&lt;T&gt;::iterator</code> 都是随机访问迭代器</li>
</ul>
</li>
</ul>
<p>数组 <code>T[N]</code> 当然可以被视为一种容器，其迭代器是 <code>T*</code> ，也是随机访问迭代器。</p>
<p>实际上还有比 ForwardIterator 更低级的 InputIterator ，以及特殊的 OutputIterator 。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="1-%E8%BF%AD%E4%BB%A3%E5%99%A8-4">1. 迭代器</h2>
<h4 id="14-%E4%BB%8E%E8%BF%AD%E4%BB%A3%E5%99%A8%E8%8C%83%E5%9B%B4%E5%88%9D%E5%A7%8B%E5%8C%96">1.4. 从迭代器范围初始化</h4>
<p><code>std::string</code> 以及大多数容器都支持从一个迭代器范围初始化：</p>
<pre><code class="language-cpp">std::vector&lt;<span class="hljs-type">char</span>&gt; v = {<span class="hljs-string">&#x27;a&#x27;</span>, <span class="hljs-string">&#x27;b&#x27;</span>, <span class="hljs-string">&#x27;c&#x27;</span>, <span class="hljs-string">&#x27;d&#x27;</span>, <span class="hljs-string">&#x27;e&#x27;</span>, <span class="hljs-string">&#x27;f&#x27;</span>, <span class="hljs-string">&#x27;g&#x27;</span>, <span class="hljs-string">&#x27;h&#x27;</span>, <span class="hljs-string">&#x27;i&#x27;</span>};
<span class="hljs-function">std::vector <span class="hljs-title">v2</span><span class="hljs-params">(v.begin() + <span class="hljs-number">2</span>, v.end() - <span class="hljs-number">3</span>)</span></span>;  <span class="hljs-comment">// {&#x27;c&#x27;, &#x27;d&#x27;, &#x27;e&#x27;, &#x27;f&#x27;}</span>
<span class="hljs-function">std::string <span class="hljs-title">s</span><span class="hljs-params">(v.begin(), v.end())</span></span>;           <span class="hljs-comment">// &quot;abcdefghi&quot;</span>
</code></pre>
<ul>
<li>CTAD 同样能发挥作用： <code>v2</code> 的类型是 <code>std::vector&lt;char&gt;</code> ，这里的元素类型 <code>char</code> 是根据我们提供的迭代器推断出来的。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="1-%E8%BF%AD%E4%BB%A3%E5%99%A8-5">1. 迭代器</h2>
<h4 id="15-%E5%9F%BA%E4%BA%8E%E8%8C%83%E5%9B%B4%E7%9A%84-for-%E8%AF%AD%E5%8F%A5">1.5. 基于范围的 <code>for</code> 语句</h4>
<p>基于范围的 <code>for</code> 语句本质上是用<strong>迭代器</strong>遍历：</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-cpp">std::vector&lt;<span class="hljs-type">int</span>&gt; v = <span class="hljs-built_in">something</span>();
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> x : v) {
  <span class="hljs-built_in">do_something_with</span>(x);
}
</code></pre>
  </div>
  <div>
<pre><code class="language-cpp">std::vector&lt;<span class="hljs-type">int</span>&gt; v = <span class="hljs-built_in">something</span>();
{
  <span class="hljs-keyword">auto</span> begin = v.<span class="hljs-built_in">begin</span>();
  <span class="hljs-keyword">auto</span> end = v.<span class="hljs-built_in">end</span>();
  <span class="hljs-keyword">for</span> (; begin != end; ++begin) {
    <span class="hljs-built_in">do_something_with</span>(*begin);
  }
}
</code></pre>
  </div>
</div>
<p>* 如何让 <code>Dynarray</code> 也能用基于范围的 <code>for</code> 语句遍历？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="2-%E6%A0%87%E5%87%86%E5%BA%93%E7%AE%97%E6%B3%95">2. 标准库算法</h2>
<p>通常接受一对迭代器表示范围 <code>[begin, end)</code></p>
<pre><code class="language-cpp">std::<span class="hljs-built_in">sort</span>(a, a + N);              <span class="hljs-comment">// a 可能是一个数组</span>
std::<span class="hljs-built_in">copy</span>(v.<span class="hljs-built_in">begin</span>(), v.<span class="hljs-built_in">end</span>(), a); <span class="hljs-comment">// v 可能是一个 std::vector&lt;...&gt;</span>
</code></pre>
<p>带 <code>_n</code> 后缀的函数使用 <code>[begin, begin + n)</code></p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Dynarray</span>(<span class="hljs-type">const</span> Dynarray &amp;other)
      : m_length{other.<span class="hljs-built_in">size</span>()}, m_storage{<span class="hljs-keyword">new</span> <span class="hljs-type">int</span>[other.<span class="hljs-built_in">size</span>()]} {
    std::<span class="hljs-built_in">copy_n</span>(other.m_storage, other.<span class="hljs-built_in">size</span>(), m_storage);
  }
  <span class="hljs-built_in">Dynarra</span>(std::<span class="hljs-type">size_t</span> n, <span class="hljs-type">int</span> x) : m_length{n}, m_storage{<span class="hljs-keyword">new</span> <span class="hljs-type">int</span>[n]} {
    std::<span class="hljs-built_in">fill_n</span>(m_storage, m_length, x);
  }
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="2-%E6%A0%87%E5%87%86%E5%BA%93%E7%AE%97%E6%B3%95-1">2. 标准库算法</h2>
<p>通常用迭代器表示位置</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> pos = std::<span class="hljs-built_in">find</span>(v.<span class="hljs-built_in">begin</span>(), v.<span class="hljs-built_in">end</span>(), val); <span class="hljs-comment">// pos 指向 val 第一次出现的位置</span>
<span class="hljs-keyword">auto</span> maxPos = std::<span class="hljs-built_in">max_element</span>(v.<span class="hljs-built_in">begin</span>(), v.<span class="hljs-built_in">end</span>()); <span class="hljs-comment">// maxPos 指向最大值所在的位置</span>
</code></pre>
<p>部分算法对迭代器型别有要求，比如</p>
<ul>
<li><code>std::sort</code> 接受 RandomAccessIterator ，比较严格。</li>
<li><code>std::copy</code> 接受任何 InputIterator 作为前两个参数，要求第三个参数是 OutputIterator 。</li>
</ul>
<p>部分算法对元素类型有要求，比如</p>
<ul>
<li><code>std::sort</code> 要求元素类型具有 <code>&lt;</code> 运算符。</li>
<li><code>std::equal</code> 要求元素类型具有 <code>==</code> 运算符。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="2-%E6%A0%87%E5%87%86%E5%BA%93%E7%AE%97%E6%B3%95-2">2. 标准库算法</h2>
<h4 id="21-%E7%AE%97%E6%B3%95%E4%B8%8D%E4%BF%AE%E6%94%B9%E5%AE%B9%E5%99%A8">2.1. 算法不修改容器</h4>
<p>标准库算法绝不会改变容器的大小（除非传给它的迭代器是某些特殊的迭代器适配器）</p>
<p>例如， <code>std::copy(begin, end, dest)</code> 只是<strong>复制</strong>元素，但并不向容器<strong>插入</strong>元素！</p>
<pre><code class="language-cpp">std::vector&lt;<span class="hljs-type">int</span>&gt; a = <span class="hljs-built_in">someValues</span>();
<span class="hljs-function">std::vector&lt;<span class="hljs-type">int</span>&gt; <span class="hljs-title">b</span><span class="hljs-params">(a.size())</span></span>;
std::vector&lt;<span class="hljs-type">int</span>&gt; c{};
std::<span class="hljs-built_in">copy</span>(a.<span class="hljs-built_in">begin</span>(), a.<span class="hljs-built_in">end</span>(), b.<span class="hljs-built_in">begin</span>()); <span class="hljs-comment">// 正确</span>
std::<span class="hljs-built_in">copy</span>(a.<span class="hljs-built_in">begin</span>(), a.<span class="hljs-built_in">end</span>(), c.<span class="hljs-built_in">begin</span>()); <span class="hljs-comment">// 未定义行为!</span>
</code></pre>
<p>某种神秘的迭代器适配器：它的 <code>++</code> 和赋值操作十分不同寻常，会将 <code>*iter++ = x</code> 变为 <code>c.push_back(x)</code></p>
<pre><code class="language-cpp">std::<span class="hljs-built_in">copy</span>(a.<span class="hljs-built_in">begin</span>(), a.<span class="hljs-built_in">end</span>(), std::<span class="hljs-built_in">back_inserter</span>(c)); <span class="hljs-comment">// 这是可以的</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="2-%E6%A0%87%E5%87%86%E5%BA%93%E7%AE%97%E6%B3%95-3">2. 标准库算法</h2>
<h4 id="22-%E4%B8%80%E4%BA%9B%E5%B8%B8%E8%A7%81%E7%AE%97%E6%B3%95">2.2. 一些常见算法</h4>
<ul>
<li>不修改序列： <code>count</code>, <code>find</code>, <code>find_end</code>, <code>find_first_of</code>, <code>search</code> 等</li>
<li>修改序列： <code>copy</code>, <code>fill</code>, <code>reverse</code>, <code>unique</code> 等</li>
<li>划分、排序、归并： <code>partition</code>, <code>sort</code>, <code>nth_element</code>, <code>merge</code> 等</li>
<li>二分查找： <code>lower_bound</code>, <code>upper_bound</code>, <code>binary_search</code>, <code>equal_range</code></li>
<li>堆相关： <code>make_heap</code>, <code>push_heap</code>, <code>pop_heap</code>, <code>sort_heap</code> 等</li>
<li>大小比较： <code>min</code>/<code>max</code>, <code>min_element</code>/<code>max_element</code>, <code>equal</code>, <code>lexicographical_compare</code> 等</li>
<li>数值运算（<code>&lt;numeric&gt;</code>）： <code>accumulate</code>, <code>inner_product</code> 等</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="2-%E6%A0%87%E5%87%86%E5%BA%93%E7%AE%97%E6%B3%95-4">2. 标准库算法</h2>
<h4 id="23-%E8%B0%93%E8%AF%8D-predicate">2.3. 谓词 (Predicate)</h4>
<p>许多算法接受一个谓词 (predicate) ，即一个返回 <code>bool</code> 的<strong>可调用对象</strong>，来定制操作。</p>
<ul>
<li>需要比较元素的算法通常默认采用 <code>&lt;</code> 进行比较，但也提供接受一个二元谓词 <code>cmp</code> 的版本，用 <code>cmp(a, b)</code> 代替 <code>a &lt; b</code> 。
<ul>
<li><code>std::sort(begin, end, cmp)</code></li>
<li><code>std::max_element(begin, end, cmp)</code></li>
</ul>
</li>
<li>带有 <code>_if</code> 后缀的函数接受一个一元谓词 <code>cond</code> ，只关心那些 <code>cond(element)</code> 为真的元素 <code>element</code>。
<ul>
<li><code>std::find_if(b, e, [](int x) { return x % 2 == 0; })</code> 找第一个偶数</li>
<li><code>std::copy_if(b, e, d, [](int x) { return x % 2 == 0; })</code> 只拷贝偶数</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="2-%E6%A0%87%E5%87%86%E5%BA%93%E7%AE%97%E6%B3%95-5">2. 标准库算法</h2>
<h4 id="24-%E5%8F%AF%E8%B0%83%E7%94%A8%E5%AF%B9%E8%B1%A1">2.4. 可调用对象</h4>
<p>C++ 中的可调用对象有函数、函数指针、类型为重载了调用运算符 <code>operator()</code> 的类类型的对象。</p>
<p>Lambda 本质上是让编译器帮你合成一个重载了 <code>operator()</code> 的类型并创建一个该类型的对象。</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> cmp =
    [](<span class="hljs-type">const</span> std::string &amp;a,
       <span class="hljs-type">const</span> std::string &amp;b) {
         <span class="hljs-keyword">return</span> a.<span class="hljs-built_in">size</span>() &lt; b.<span class="hljs-built_in">size</span>();
       };
</code></pre>
  </div>
  <div>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">LambdaType_cmp</span> {
  <span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">operator</span><span class="hljs-params">()</span><span class="hljs-params">(<span class="hljs-type">const</span> std::string &amp;a,
                  <span class="hljs-type">const</span> std::string &amp;b)</span> </span>{
    <span class="hljs-keyword">return</span> a.<span class="hljs-built_in">size</span>() &lt; b.<span class="hljs-built_in">size</span>();
  }
};
LambdaType_cmp cmp;
</code></pre>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-class="trans" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" class="trans" style="--class:trans;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-size="16:9">
<h2 id="3-%E7%BB%A7%E6%89%BF-inheritance%E5%A4%9A%E6%80%81-polymorphism">3. 继承 (Inheritance)、多态 (Polymorphism)</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-inheritance%E5%A4%9A%E6%80%81-polymorphism-1">3. 继承 (Inheritance)、多态 (Polymorphism)</h2>
<ul>
<li>禁止“坑爹”：继承不能破坏父类的封装性</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF">3. 继承</h2>
<ul>
<li>
<p>一个子类对象里一定有一个完整的父类对象*</p>
<ul>
<li>父类的<strong>所有成员</strong>（除了构造函数和析构函数）都被继承下来，无论能否访问</li>
<li>子类的构造函数必然先调用父类的构造函数来初始化父类的部分，然后再初始化自己的成员</li>
<li>子类的析构函数在析构了自己的成员之后，必然调用父类的析构函数</li>
</ul>
</li>
<li>
<p>禁止“坑爹”：继承不能破坏父类的封装性</p>
<ul>
<li>
<p>子类不可能改变继承自父类成员的访问限制级别</p>
</li>
<li>
<p>子类不能随意初始化父类成员，必须经过父类的构造函数</p>
<ul>
<li>先默认初始化后赋值是可以的</li>
</ul>
</li>
</ul>
</li>
</ul>
<p>* 除非父类是空的，这时编译器会做“空基类优化 (Empty Base Optimization, EBO)”。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-1">3. 继承</h2>
<h4 id="31-%E5%AD%90%E7%B1%BB%E7%9A%84%E6%9E%84%E9%80%A0%E5%87%BD%E6%95%B0">3.1. 子类的构造函数</h4>
<p>必然先调用父类的构造函数来初始化父类的部分，然后再初始化自己的成员</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">DiscountedItem</span> : <span class="hljs-keyword">public</span> Item {
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">DiscountedItem</span>(<span class="hljs-type">const</span> std::string &amp;name, <span class="hljs-type">double</span> price,
                 <span class="hljs-type">int</span> minQ, <span class="hljs-type">double</span> discount)
      : <span class="hljs-built_in">Item</span>(name, price), <span class="hljs-built_in">m_minQuantity</span>(minQ), <span class="hljs-built_in">m_discount</span>(discount) {}
};
</code></pre>
<p>可以在初始值列表里调用父类的构造函数</p>
<ul>
<li>如果没有调用？</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-2">3. 继承</h2>
<h4 id="31-%E5%AD%90%E7%B1%BB%E7%9A%84%E6%9E%84%E9%80%A0%E5%87%BD%E6%95%B0-1">3.1. 子类的构造函数</h4>
<p>必然先调用父类的构造函数来初始化父类的部分，然后再初始化自己的成员</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">DiscountedItem</span> : <span class="hljs-keyword">public</span> Item {
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">DiscountedItem</span>(<span class="hljs-type">const</span> std::string &amp;name, <span class="hljs-type">double</span> price,
                 <span class="hljs-type">int</span> minQ, <span class="hljs-type">double</span> discount)
      : <span class="hljs-built_in">Item</span>(name, price), <span class="hljs-built_in">m_minQuantity</span>(minQ), <span class="hljs-built_in">m_discount</span>(discount) {}                                      
};
</code></pre>
<p>可以在初始值列表里调用父类的构造函数</p>
<ul>
<li>
<p>如果没有调用，则自动调用父类的默认构造函数</p>
<ul>
<li>如果父类不存在默认构造函数，则报错。</li>
</ul>
</li>
</ul>
<p>合成的默认构造函数的行为？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-3">3. 继承</h2>
<h4 id="31-%E5%AD%90%E7%B1%BB%E7%9A%84%E6%9E%84%E9%80%A0%E5%87%BD%E6%95%B0-2">3.1. 子类的构造函数</h4>
<p>必然先调用父类的构造函数来初始化父类的部分，然后再初始化自己的成员</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">DiscountedItem</span> : <span class="hljs-keyword">public</span> Item {
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">DiscountedItem</span>(<span class="hljs-type">const</span> std::string &amp;name, <span class="hljs-type">double</span> price,
                 <span class="hljs-type">int</span> minQ, <span class="hljs-type">double</span> discount)
      : <span class="hljs-built_in">Item</span>(name, price), <span class="hljs-built_in">m_minQuantity</span>(minQ), <span class="hljs-built_in">m_discount</span>(discount) {}                                      
};
</code></pre>
<p>可以在初始值列表里调用父类的构造函数</p>
<ul>
<li>
<p>如果没有调用，则自动调用父类的默认构造函数</p>
<ul>
<li>如果父类不存在默认构造函数，则报错。</li>
</ul>
</li>
</ul>
<p>合成的默认构造函数：先调用父类的默认构造函数，再 ......</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-4">3. 继承</h2>
<h4 id="32-%E5%AD%90%E7%B1%BB%E7%9A%84%E6%9E%90%E6%9E%84%E5%87%BD%E6%95%B0">3.2. 子类的析构函数</h4>
<p>析构函数在执行完函数体之后：</p>
<ul>
<li>先按成员的声明顺序倒序销毁所有成员。对于含有 non-trivial destructor 的成员，调用其 destructor。</li>
<li>然后调用父类的析构函数销毁父类的部分。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-5">3. 继承</h2>
<h4 id="33-%E5%AD%90%E7%B1%BB%E7%9A%84%E6%8B%B7%E8%B4%9D%E6%8E%A7%E5%88%B6">3.3. 子类的拷贝控制</h4>
<p>自定义：不要忘记拷贝/移动父类的部分</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Derived</span> : <span class="hljs-keyword">public</span> Base {
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Derived</span>(<span class="hljs-type">const</span> Derived &amp;other) : <span class="hljs-built_in">Base</span>(other), <span class="hljs-comment">/* ... */</span> { <span class="hljs-comment">/* ... */</span> }
  Derived &amp;<span class="hljs-keyword">operator</span>=(<span class="hljs-type">const</span> Derived &amp;other) {
    Base::<span class="hljs-keyword">operator</span>=(other);
    <span class="hljs-comment">// ...</span>
    <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>;
  }
};
</code></pre>
<p>合成的拷贝控制成员（不算析构）的行为？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-6">3. 继承</h2>
<h4 id="33-%E5%AD%90%E7%B1%BB%E7%9A%84%E6%8B%B7%E8%B4%9D%E6%8E%A7%E5%88%B6-1">3.3. 子类的拷贝控制</h4>
<p>合成的拷贝控制成员（不算析构）：先父类，后子类自己的成员。</p>
<ul>
<li>如果这个过程中调用了任何不存在/不可访问的函数，则合成为 implicitly deleted</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-7">3. 继承</h2>
<h4 id="34-%E5%8A%A8%E6%80%81%E7%BB%91%E5%AE%9A">3.4. 动态绑定</h4>
<p>向上转型：</p>
<ul>
<li>一个 <code>Base *</code> 可以指向一个 <code>Derived</code> 类型的对象
<ul>
<li><code>Derived *</code> 可以向 <code>Base *</code> 类型转换</li>
</ul>
</li>
<li>一个 <code>Base &amp;</code> 可以绑定到一个 <code>Derived</code> 类型的对象</li>
<li>一个 <code>std::shared/unique_ptr&lt;Base&gt;</code> 可以指向一个 <code>Derived</code> 类型的对象
<ul>
<li><code>std::shared/unique_ptr&lt;Derived&gt;</code> 可以向 <code>std::shared/unique_ptr&lt;Base&gt;</code> 类型转换</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-8">3. 继承</h2>
<h4 id="35-%E8%99%9A%E5%87%BD%E6%95%B0">3.5. 虚函数</h4>
<p>继承父类的某个函数 <code>foo</code> 时，我们可能希望在子类提供一个新版本（override）。</p>
<p>我们希望在一个 <code>Base *</code>, <code>Base &amp;</code> 或 <code>std::shared/unique_ptr&lt;Base&gt;</code> 上调用 <code>foo</code> 时，可以根据<strong>动态类型</strong>来选择正确的版本，而不是根据静态类型调用 <code>Base::foo</code>。</p>
<p>在子类里 override 一个虚函数时，函数名、参数列表、<code>const</code>ness 必须和父类的那个函数<strong>完全相同</strong>。</p>
<ul>
<li>返回值类型必须<strong>完全相同</strong>或者随类型<em>协变</em> (covariant)。</li>
</ul>
<p>加上 <code>override</code> 关键字：让编译器帮你检查它是否真的构成了 override</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-9">3. 继承</h2>
<h4 id="35-%E8%99%9A%E5%87%BD%E6%95%B0-1">3.5. 虚函数</h4>
<p><strong>除了 override，不要以其它任何方式定义和父类中某个成员同名的成员。</strong></p>
<ul>
<li>
<p>阅读以下章节，你会看到违反这条规则带来的后果。</p>
<p>《Effective C++》条款 33：避免遮掩继承而来的名称</p>
<p>《Effective C++》条款 36：绝不重新定义继承而来的 non-<code>virtual</code> 函数</p>
<p>《Effective C++》条款 37：绝不重新定义继承而来的缺省参数值</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-10">3. 继承</h2>
<h4 id="36-%E7%BA%AF%E8%99%9A%E5%87%BD%E6%95%B0%E5%92%8C%E6%8A%BD%E8%B1%A1%E7%B1%BB">3.6. 纯虚函数和抽象类</h4>
<p>通过将一个函数声明为 <code>=0</code>，它就是一个<strong>纯虚函数</strong> (pure virtual function)。</p>
<p>一个类如果有某个成员函数是纯虚函数，它就是一个<strong>抽象类</strong>。</p>
<ul>
<li>不能定义抽象类的对象，不能调用无定义的纯虚函数*。</li>
</ul>
<p>* 事实上一个纯虚函数仍然可以拥有一份定义，阅读《Effective C++》条款 34（<strong>必读</strong>）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-11">3. 继承</h2>
<h4 id="36-%E7%BA%AF%E8%99%9A%E5%87%BD%E6%95%B0%E5%92%8C%E6%8A%BD%E8%B1%A1%E7%B1%BB-1">3.6. 纯虚函数和抽象类</h4>
<p>纯虚函数通常用来定义<strong>接口</strong>：这个函数在所有子类里都应该有一份自己的实现。</p>
<p>如果一个子类继承了某个纯虚函数而没有 override 它，这个成员函数就仍然是纯虚的，这个类仍然是抽象类，无法被实例化。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-12">3. 继承</h2>
<h4 id="37-%E8%BF%90%E8%A1%8C%E6%97%B6%E7%B1%BB%E5%9E%8B%E8%AF%86%E5%88%AB-rtti">3.7. 运行时类型识别 (RTTI)</h4>
<p><code>dynamic_cast</code> 可以做到“向下转型”：</p>
<ul>
<li>它会在运行时检测这个转型是否能成功</li>
<li>如果不能成功，<code>dynamic_cast&lt;T*&gt;</code> 返回空指针，<code>dynamic_cast&lt;T&amp;&gt;</code> 抛出 <code>std::bad_cast</code> 异常。</li>
<li><strong>非常非常慢</strong>，你几乎总是应该先考虑用一组虚函数来完成你想要做的事。</li>
</ul>
<p><code>typeid(x)</code> 可以获取表达式 <code>x</code> （忽略顶层 <code>const</code> 和引用后）的动态类型信息</p>
<ul>
<li>通常用 <code>if (typeid(*ptr) == typeid(A))</code> 来判断这个动态类型是否是 <code>A</code>。</li>
</ul>
<p><a href="https://quick-bench.com/q/E0LS3gJgAHlQK0Em_6XzkRzEjnE">https://quick-bench.com/q/E0LS3gJgAHlQK0Em_6XzkRzEjnE</a></p>
<p>根据经验，如果你需要获取某个对象的动态类型，通常意味着设计上的缺陷，你应当修改设计而不是硬着头皮做 RTTI。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-13">3. 继承</h2>
<h4 id="38-%E7%BB%A7%E6%89%BF%E7%9A%84%E8%AE%BF%E9%97%AE%E6%9D%83%E9%99%90">3.8. 继承的访问权限</h4>
<p><code>public</code> 继承建模出“is-a”关系：A discounted item <strong>is an</strong> item.</p>
<p>但有些时候英语上的“is-a”具有欺骗性：</p>
<ul>
<li>Birds can fly. A penguin is a bird.</li>
<li>A square is a rectangle. 但矩形的长宽可以随意更改，而正方形不可以。</li>
</ul>
<p>阅读《Effective C++》条款 32（<strong>必读</strong>）。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-14">3. 继承</h2>
<h4 id="38-%E7%BB%A7%E6%89%BF%E7%9A%84%E8%AE%BF%E9%97%AE%E6%9D%83%E9%99%90-1">3.8. 继承的访问权限</h4>
<p>这个 <code>public</code> 是什么意思？</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">DiscountedItem</span> : <span class="hljs-keyword">public</span> Item {};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-15">3. 继承</h2>
<h4 id="38-%E7%BB%A7%E6%89%BF%E7%9A%84%E8%AE%BF%E9%97%AE%E6%9D%83%E9%99%90-2">3.8. 继承的访问权限</h4>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">DiscountedItem</span> : <span class="hljs-keyword">public</span> Item {};
</code></pre>
<p>继承的访问权限：<strong>这个继承关系（“父子关系”）是否对外公开</strong>。</p>
<p>如果采用 <code>private</code> 继承，则在外人眼里他们不是父子，任何依赖于这一父子关系的行为都将失败（有哪些？）。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header=" *CS100* *Tutorial 12* *Fall 2025*" data-theme="roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--header: *CS100* *Tutorial 12* *Fall 2025*;--theme:roxyegs3s2esvpc87aclqrltqfuew64r1ek6kwg8pwp;" data-marpit-pagination-total="36" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 12</em> <em>Fall 2025</em></header>
<h2 id="3-%E7%BB%A7%E6%89%BF-16">3. 继承</h2>
<h4 id="38-%E7%BB%A7%E6%89%BF%E7%9A%84%E8%AE%BF%E9%97%AE%E6%9D%83%E9%99%90-3">3.8. 继承的访问权限</h4>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">DiscountedItem</span> : <span class="hljs-keyword">public</span> Item {};
</code></pre>
<p>继承的访问权限：<strong>这个继承关系（“父子关系”）是否对外公开</strong>。</p>
<p>如果采用 <code>private</code> 继承，则在外人眼里他们不是父子，任何依赖于这一父子关系的行为都将失败。</p>
<ul>
<li>访问继承而来的成员（本质上也是向上转型）</li>
<li>向上转型（包括动态绑定等等）、向下转型</li>
</ul>
<p><code>private</code> 继承：建模“is-implemented-in-terms-of”。阅读《Effective C++》条款 38、39（选读）。</p>
</section>

<h2 id="3-%E7%BB%A7%E6%89%BF-17">3. 继承</h2>
<h4 id="38-%E7%BB%A7%E6%89%BF%E7%9A%84%E8%AE%BF%E9%97%AE%E6%9D%83%E9%99%90-4">3.8. 继承的访问权限</h4>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">A</span> : B {}; <span class="hljs-comment">// public inheritance</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">C</span> : B {};  <span class="hljs-comment">// private inheritance</span>
</code></pre>
<p><code>struct</code> 和 <code>class</code> 仅有两个区别：</p>
<ul>
<li>默认的成员访问权限是 <code>public</code>/<code>private</code>。</li>
<li>默认的继承访问权限是 <code>public</code>/<code>private</code>。</li>
</ul>
