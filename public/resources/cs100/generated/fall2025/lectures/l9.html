<h2 id="define-a-struct">Define a <code>struct</code></h2>
<p>A <code>struct</code> is a <strong>type</strong> consisting of a sequence of <strong>members</strong> whose storage is allocated in an ordered sequence.</p>
<p>Simply put, place several things together to form a new type.</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> {</span>
  <span class="hljs-type">const</span> <span class="hljs-type">char</span> *name;
  <span class="hljs-type">const</span> <span class="hljs-type">char</span> *id;
  <span class="hljs-type">int</span> entrance_year;
  <span class="hljs-type">int</span> dorm;
};
</code></pre>
  </div>
  <div>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Point3d</span> {</span>
  <span class="hljs-type">double</span> x, y, z;
};
<span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Line3d</span> {</span>
  <span class="hljs-comment">// P(t) = p0 + tv</span>
  <span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Point3d</span> <span class="hljs-title">p0</span>, <span class="hljs-title">v</span>;</span>
};
</code></pre>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-style="section::after {

<h2 id="struct-type"><code>struct</code> type</h2>
<p>The name of the type defined by a <code>struct</code> is <code>struct Name</code>.</p>
<ul>
<li>Unlike C++, the keyword <code>struct</code> here is necessary.</li>
</ul>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> <span class="hljs-title">stu</span>;</span> <span class="hljs-comment">// `stu` is an object of type `struct Student`</span>
<span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Point3d</span> <span class="hljs-title">polygon</span>[1000];</span> <span class="hljs-comment">// `polygon` is an array of 1000 objects,</span>
                              <span class="hljs-comment">// each being of type `struct Point3d`.</span>
<span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">TreeNode</span> *<span class="hljs-title">pNode</span>;</span> <span class="hljs-comment">// `pNode` is a pointer to `struct TreeNode`.</span>
</code></pre>
<p><strong>* The term &quot;<em>object</em>&quot; is used interchangeably with &quot;<em>variable</em>&quot;.</strong></p>
<ul>
<li><em>Objects</em> often refer to variables of <code>struct</code> (or <code>class</code> in C++) types.</li>
<li>But in fact, there's nothing wrong to say &quot;an <code>int</code> object&quot;.</li>
</ul>
</section>

<h2 id="members-of-a-struct">Members of a <code>struct</code></h2>
<p>Use <code>obj.mem</code>, the <strong>member-access operator <code>.</code></strong> to access a member.</p>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> <span class="hljs-title">stu</span>;</span>
stu.name = <span class="hljs-string">&quot;Alice&quot;</span>;
stu.id = <span class="hljs-string">&quot;2024533000&quot;</span>;
stu.entrance_year = <span class="hljs-number">2024</span>;
stu.dorm = <span class="hljs-number">8</span>;
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, student.dorm);
++student.entrance_year;
<span class="hljs-built_in">puts</span>(student.name);
</code></pre>
</section>

<h2 id="dynamic-allocation">Dynamic allocation</h2>
<p>Create an object of <code>struct</code> type dynamically: Just allocate <code>sizeof(struct Student)</code> bytes of memory.</p>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> *<span class="hljs-title">pStu</span> =</span> <span class="hljs-built_in">malloc</span>(<span class="hljs-keyword">sizeof</span>(<span class="hljs-keyword">struct</span> Student));
</code></pre>
<p>Member access through a pointer: <code>ptr-&gt;mem</code>, or <code>(*ptr).mem</code> <strong>(not <code>*ptr.mem</code>!).</strong></p>
<pre><code class="language-c">pStu-&gt;name = <span class="hljs-string">&quot;Alice&quot;</span>;
pStu-&gt;id = <span class="hljs-string">&quot;2024533000&quot;</span>;
(*pStu).entrance_year = <span class="hljs-number">2024</span>; <span class="hljs-comment">// equivalent to pStu-&gt;entrance_year = 2024;</span>
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, pStu-&gt;entrance_year);
<span class="hljs-built_in">puts</span>(pStu-&gt;name);
</code></pre>
<p>As usual, don't forget to <code>free</code> after use.</p>
<pre><code class="language-c"><span class="hljs-built_in">free</span>(pStu);
</code></pre>
</section>

<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> {</span>
  <span class="hljs-type">const</span> <span class="hljs-type">char</span> *name;

<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> *<span class="hljs-title">pStu</span> =</span> <span class="hljs-built_in">malloc</span>(<span class="hljs-keyword">sizeof</span>(<span class="hljs-keyword">struct</span> Student));

<h2 id="size-of-a-struct-1">Size of a <code>struct</code></h2>
<p>Try these:</p>

<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">A</span> {</span>

<h2 id="implicit-initialization">Implicit initialization</h2>
<p>What happens if an object of <code>struct</code> type is not explicitly initialized?</p>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> <span class="hljs-title">gStu</span>;</span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> <span class="hljs-title">stu</span>;</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-style="section::after {

" data-theme="px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy;" data-marpit-pagination-total="39">
<h2 id="implicit-initialization-1">Implicit initialization</h2>
<p>What happens if an object of <code>struct</code> type is not explicitly initialized?</p>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> <span class="hljs-title">gStu</span>;</span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> <span class="hljs-title">stu</span>;</span>
}
</code></pre>
<ul>
<li>Global or local <code>static</code>: &quot;empty-initialization&quot;, which performs <strong>member-wise</strong> empty-initialization.</li>
<li>Local non-<code>static</code>: every member is initialized to indeterminate values (in other words, uninitialized).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--style:section::after {

}
;--theme:px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy;" data-marpit-pagination-total="39">
<h2 id="explicit-initialization">Explicit initialization</h2>
<p>Use an initializer list:</p>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> <span class="hljs-title">stu</span> =</span> {<span class="hljs-string">&quot;Alice&quot;</span>, <span class="hljs-string">&quot;2024533000&quot;</span>, <span class="hljs-number">2024</span>, <span class="hljs-number">8</span>};
</code></pre>
<p><strong>Use C99 designators:</strong> (highly recommended)</p>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> <span class="hljs-title">stu</span> =</span> {.name = <span class="hljs-string">&quot;Alice&quot;</span>, .id = <span class="hljs-string">&quot;2024533000&quot;</span>,
                      .entrance_year = <span class="hljs-number">2024</span>, .dorm = <span class="hljs-number">8</span>};
</code></pre>
<p>The designators greatly improve the readability.</p>
<p><strong>[Best practice]</strong> <u>Use designators, especially for <code>struct</code> types with lots of members.</u></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy;" data-marpit-pagination-total="39">
<h2 id="compound-literals">Compound literals</h2>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> *<span class="hljs-title">student_list</span> =</span> <span class="hljs-built_in">malloc</span>(<span class="hljs-keyword">sizeof</span>(<span class="hljs-keyword">struct</span> Student) * n);
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != n; ++i) {
  student_list[i].name = A(i); <span class="hljs-comment">// A, B, C and D are some functions</span>
  student_list[i].id = B(i);
  student_list[i].entrance_year = C(i);
  student_list[i].dorm = D(i);
}
</code></pre>
<p>Use a <strong>compound literal</strong> to make it clear and simple:</p>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> *<span class="hljs-title">student_list</span> =</span> <span class="hljs-built_in">malloc</span>(<span class="hljs-keyword">sizeof</span>(<span class="hljs-keyword">struct</span> Student) * n);
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != n; ++i) {
  student_list[i] = (<span class="hljs-keyword">struct</span> Student){.name = A(i), .id = B(i),
                                     .entrance_year = C(i), .dorm = D(i)};
}

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--style:section::after {

}
;--theme:px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy;" data-marpit-pagination-total="39">
<h2 id="struct-typed-parameters"><code>struct</code>-typed parameters</h2>
<p>The semantic of argument passing is <strong>copy</strong>:</p>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">print_student</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> Student s)</span> {
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Name: %s, ID: %s, dorm: %d\n&quot;</span>, s.name, s.id, s.dorm);
}

print_student(student_list[i]);
</code></pre>
<p>In a call <code>print_student(student_list[i])</code>, the parameter <code>s</code> of <code>print_student</code> is initialized as follows:</p>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> <span class="hljs-title">s</span> =</span> student_list[i];
</code></pre>
<p>The copy of a <code>struct</code>-typed object: <strong>Member-wise copy.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--style:section::after {

}
;--theme:px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy;" data-marpit-pagination-total="39">
<h2 id="struct-typed-parameters-1"><code>struct</code>-typed parameters</h2>
<p>In a call <code>print_student(student_list[i])</code>, the parameter <code>s</code> of <code>print_student</code> is initialized as follows:</p>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> <span class="hljs-title">s</span> =</span> student_list[i];
</code></pre>
<p>The copy of a <code>struct</code>-typed object: <strong>Member-wise copy.</strong> It is performed as if</p>
<pre><code class="language-c">s.name = student_list[i].name;
s.id = student_list[i].id;
s.entrance_year = student_list[i].entrance_year;
s.dorm = student_list[i].dorm;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy;" data-marpit-pagination-total="39">
<h2 id="return-a-struct-typed-object">Return a <code>struct</code>-typed object</h2>
<p>Strictly speaking, returning is also a <strong>copy</strong>:</p>
<pre><code class="language-c"><span class="hljs-keyword">struct</span> Student <span class="hljs-title function_">fun</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Student</span> <span class="hljs-title">s</span> =</span> something();
  some_operations(s);
  <span class="hljs-keyword">return</span> s;
}
student_list[i] = fun();
</code></pre>
<p>The object <code>s</code> is returned as if</p>
<pre><code class="language-c">student_list[i] = s;
</code></pre>
<p><strong>But in fact, the compiler is more than willing to optimize this process.</strong> We will talk more about this in C++.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--style:section::after {

}
;--theme:px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy;" data-marpit-pagination-total="39">
<h2 id="array-member">Array member</h2>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">A</span> {</span>
  <span class="hljs-type">int</span> <span class="hljs-built_in">array</span>[<span class="hljs-number">10</span>];
  <span class="hljs-comment">// ...</span>
};
</code></pre>
<p>Although an array cannot be copied, <strong>an array member can be copied</strong>.</p>
<p>The copy of an array is <strong>element-wise copy</strong>.</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-c"><span class="hljs-type">int</span> a[<span class="hljs-number">10</span>];
<span class="hljs-type">int</span> b[<span class="hljs-number">10</span>] = a; <span class="hljs-comment">// Error!</span>
</code></pre>
  </div>
  <div>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">A</span> <span class="hljs-title">a</span>;</span>
<span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">A</span> <span class="hljs-title">b</span> =</span> a; <span class="hljs-comment">// OK</span>
</code></pre>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy;" data-marpit-pagination-total="39">
<h2 id="summary">Summary</h2>
<p>A <code>struct</code> is a type consisting of a sequence of members.</p>
<ul>
<li>
<p>Member access: <code>obj.mem</code>, <code>ptr-&gt;mem</code> (equivalent to <code>(*ptr).mem</code>, but better)</p>
</li>
<li>
<p><code>sizeof(struct A)</code>, no less than the sum of size of every member.</p>
<ul>
<li>But not necessarily equal, due to memory alignment requirements.</li>
</ul>
</li>
<li>
<p>Implicit initialization: recursively performed on every member.</p>
</li>
<li>
<p>Initializer-lists, designators, compound literals.</p>
</li>
<li>
<p>Copy of a <code>struct</code>: member-wise copy.</p>
</li>
<li>
<p>Argument passing and returning: copy.</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-style="section::after {

" data-theme="px9ix8jeo5dorcqn7co9a8b1u3vz8xa30312arzlodvy" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--style:section::after {

<p>A piece of cake!</p>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">factorial</span><span class="hljs-params">(<span class="hljs-type">int</span> n)</span> {
  <span class="hljs-type">int</span> result = <span class="hljs-number">1</span>;
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">1</span>; i &lt;= n; ++i)
    result *= i;
  <span class="hljs-keyword">return</span> result;
}
</code></pre>
<p><strong>You should be able to write this in 30 seconds.</strong></p>

<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">factorial</span><span class="hljs-params">(<span class="hljs-type">int</span> n)</span> {
  <span class="hljs-keyword">return</span> n == <span class="hljs-number">0</span> ? <span class="hljs-number">1</span> : n * factorial(n - <span class="hljs-number">1</span>);
}
</code></pre>
<p><strong>This is perfectly valid and reasonable C code!</strong></p>
<ul>
<li>The function <code>factorial</code> <strong>recursively</strong> calls itself.</li>
</ul>

<h2 id="problem-2-print-a-non-negative-integer">Problem 2. Print a non-negative integer</h2>
<p>If we only have <code>getchar</code>, how can we read an integer?</p>
<ul>
<li>We have solved this in recitations.</li>
</ul>
<p>If we only have <code>putchar</code>, how can we print an integer?</p>
<ul>
<li>Declared in <code>&lt;stdio.h&gt;</code>.</li>
<li><code>putchar(c)</code> prints a character <code>c</code>. That's it.</li>
</ul>
<p>For convenience, suppose the integer is non-negative (unsigned).</p>
</section>

<h2 id="design-a-recursive-algorithm">Design a recursive algorithm</h2>
<p>Suppose we are given a problem of scale <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.357ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 600 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container>.</p>
<ol>
<li>Divide the problem into one or more <strong>subproblems</strong>, which are of smaller scales.</li>
<li>Solve the subproblems <strong>recursively</strong> by calling the function itself.</li>
<li>Generate the answer to the big problem from the answers to the subproblems.</li>
</ol>
<p><strong>* Feels like mathematical induction?</strong></p>

<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">sort_impl</span><span class="hljs-params">(<span class="hljs-type">int</span> *a, <span class="hljs-type">int</span> k, <span class="hljs-type">int</span> n)</span> {

  <span class="hljs-type">int</span> m = k;
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = k + <span class="hljs-number">1</span>; i &lt; n; ++i)
    <span class="hljs-keyword">if</span> (a[i] &lt; a[m])
      m = i;
  
}

<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">sort_impl</span><span class="hljs-params">(<span class="hljs-type">int</span> *a, <span class="hljs-type">int</span> k, <span class="hljs-type">int</span> n)</span> {
  <span class="hljs-keyword">if</span> (k == n - <span class="hljs-number">1</span>) <span class="hljs-keyword">return</span>;
  
  <span class="hljs-type">int</span> m = k;
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = k + <span class="hljs-number">1</span>; i &lt; n; ++i)
    <span class="hljs-keyword">if</span> (a[i] &lt; a[m]) m = i;
  
  swap(&amp;a[m], &amp;a[k]); <span class="hljs-comment">// the &quot;swap&quot; function we defined in previous lectures</span>
  
  sort_impl(a, k + <span class="hljs-number">1</span>, n); <span class="hljs-comment">// sort the rest part recursively</span>
}
