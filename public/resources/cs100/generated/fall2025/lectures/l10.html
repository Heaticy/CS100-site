<h2 id="types">Types</h2>
<p>Types are fundamental to any program: They tell us what our data mean and what operations we can perform on those data.</p>
<p>C is a <strong>statically-typed</strong> language: The type of every expression (except those involving VLAs) is known at <strong>compile-time</strong>.</p>
</section>

<h2 id="pointer-types">Pointer types</h2>
<p><code>PointeeType *</code></p>
<ul>
<li>For <code>T</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.486ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="2.106ex" role="img" focusable="false" viewBox="0 -716 778 931"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2260" d="M166 -215T159 -215T147 -212T141 -204T139 -197Q139 -190 144 -183L306 133H70Q56 140 56 153Q56 168 72 173H327L406 327H72Q56 332 56 347Q56 360 70 367H426Q597 702 602 707Q605 716 618 716Q625 716 630 712T636 703T638 696Q638 692 471 367H707Q722 359 722 347Q722 336 708 328L451 327L371 173H708Q722 163 722 153Q722 140 707 133H351Q175 -210 170 -212Q166 -215 159 -215Z"></path></g></g></g></svg></mjx-container> <code>U</code>, <code>T *</code> and <code>U *</code> are <strong>different types</strong>.</li>
<li>The value of a pointer of type <code>T *</code> is <strong>the address of</strong> an object of type <code>T</code>.</li>
<li><strong>Null pointer</strong>: The pointer holding the <strong>null pointer value</strong>, which is a special value indicating that the pointer is &quot;pointing nowhere&quot;.
<ul>
<li>A null pointer can be obtained from <code>NULL</code>.</li>
</ul>
</li>
<li><code>&amp;var</code> returns the address of <code>var</code>. The return type is pointer to the type of <code>var</code>.</li>
<li>Only when a pointer is actually pointing to an object is it <strong>dereferenceable</strong>.</li>
<li><code>*ptr</code>, where <code>ptr</code> is not dereferenceable, is <strong>undefined behavior</strong>.</li>
</ul>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-style="section::after {

;--theme:o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5;" data-marpit-pagination-total="42">
<h2 id="variables">Variables</h2>
<p>Declare a variable: <code>Type varName</code></p>
<ul>
<li><code>ElemType varName[N]</code> for array type <code>ElemType[N]</code>.</li>
<li><code>T (*varName)[N]</code> for pointer to array type <code>T (*)[N]</code>.</li>
</ul>
<p>Initialize a variable: <code>= initializer</code></p>
<ul>
<li>Brace-enclosed list initializer for arrays and <code>struct</code>s: <code>= { ... }</code>.</li>
<li>Designators for arrays: <code>= {[3] = 5, [7] = 4}</code></li>
<li>Designators for <code>struct</code>s: <code>= {.mem1 = x, .mem2 = y}</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5;" data-marpit-pagination-total="42">
<h2 id="initialization">Initialization</h2>
<p>If a variable is declared without explicit initializer:</p>
<ul>
<li>For global or local <code>static</code> variables, they are <strong>empty-initialized</strong>:
<ul>
<li><code>0</code> for integer types,</li>
<li><code>+0.0</code> for floating-point types,</li>
<li>null pointer value for pointer types.</li>
</ul>
</li>
<li>For local non-<code>static</code> variables, they are <strong>uninitialized</strong>, holding indeterminate values.</li>
</ul>
<p>These rules apply recursively to the elements of arrays and the members of <code>struct</code>s.</p>
<p>Any use of the value of an uninitialized variable is <strong>undefined behavior</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-style="section::after {

<h2 id="scopes-and-name-lookup">Scopes and name lookup</h2>
<a align="center">
  <img src="img/scopes.png", width=600 />
</a>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-style="section::after {

" data-theme="o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--style:section::after {

;--theme:o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5;" data-marpit-pagination-total="42">
<h2 id="expressions">Expressions</h2>
<p>Expressions = operators + operands.</p>
<ul>
<li>Operator precedence, associativity, and evaluation order of operands
<ul>
<li><code>f() + g() * h()</code>, <code>f() - g() + h()</code></li>
</ul>
</li>
<li>The only four operators whose operands have deterministic evaluation order:
<ul>
<li><code>&amp;&amp;</code> and <code>||</code>: short-circuit evaluation</li>
<li><code>?:</code></li>
<li><code>,</code> (not in a function call or in an initializer list)</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--style:section::after {

}
;--theme:o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5;" data-marpit-pagination-total="42">
<h2 id="expressions-1">Expressions</h2>
<ul>
<li>
<p>If the evaluation order of <code>A</code> and <code>B</code> is unspecified, and if</p>
<ul>
<li>both <code>A</code> and <code>B</code> contain a write to an object, or</li>
<li>one of them contains a write to an object, and the other one contains a read to that object</li>
</ul>
<p>then <strong>the behavior is undefined</strong>.</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--style:section::after {

}
;--theme:o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5;" data-marpit-pagination-total="42">
<h2 id="arithmetic-operators">Arithmetic operators</h2>
<p><code>+</code>, <code>-</code>, <code>*</code>, <code>/</code>, <code>%</code></p>
<ul>
<li>Division: truncated towards zero.</li>
<li>Remainder: <code>(a / b) * b + (a % b) == a</code> always holds.</li>
<li>For <code>+</code>, <code>-</code>, <code>*</code> and <code>/</code>, the operands undergo a series of type conversions to a common type.</li>
</ul>
<p>Bitwise operators: <code>~</code>, <code>&amp;</code>, <code>|</code>, <code>^</code>, <code>&lt;&lt;</code>, <code>&gt;&gt;</code></p>
<p>Compound assignment operators: <code>a op= b</code> is equivalent to <code>a = a op b</code>.</p>
<p><strong>Be careful with signed overflows.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-style="section::after {

" data-theme="o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--style:section::after {

}
;--theme:o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5;" data-marpit-pagination-total="42">
<h2 id="pointer-arithmetic">Pointer arithmetic</h2>
<a align="center">
  <img src="img/ptradd.png", width=700 />
</a>
<ul>
<li>Pointer arithmetic: <code>p++</code>, <code>++p</code>, <code>p--</code>, <code>--p</code>, <code>p + i</code>, <code>i + p</code>, <code>p - i</code>, <code>p += i</code>, <code>p -= i</code>, <code>p1 - p2</code>.</li>
<li>Pointer arithmetic uses the units of the pointed-to type.
<ul>
<li><code>p + i == (char *)p + i * sizeof(*p)</code></li>
</ul>
</li>
<li>Pointer arithmetic must be performed within an array (including its past-the-end position), otherwise <strong>the behavior is undefined</strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5;" data-marpit-pagination-total="42">
<h2 id="operators">Operators</h2>
<p><code>++</code>, <code>--</code></p>
<ul>
<li><code>++a</code> and <code>--a</code> returns the value of <code>a</code> after incrementation/decrementation.</li>
<li><code>a++</code> and <code>a--</code> returns the original value of <code>a</code>.</li>
</ul>
<p><code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>, <code>==</code>, <code>!=</code></p>
<ul>
<li>The operands undergo a series of type conversions to a common type before comparison.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5;" data-marpit-pagination-total="42">
<h2 id="operators-1">Operators</h2>
<p>Member access: <code>obj.member</code>.</p>
<p>Member access through pointer: <code>ptr-&gt;member</code>, which is equivalent to <code>(*ptr).member</code>.</p>
<ul>
<li><code>.</code> has higher precedence than <code>*</code>, so the parentheses around <code>*ptr</code> are necessary.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-style="section::after {

" data-theme="o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--style:section::after {

}
;--theme:o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5;" data-marpit-pagination-total="42">
<h2 id="control-flow">Control flow</h2>
<ul>
<li><code>if (cond) stmt</code></li>
<li><code>if (cond) stmt1 else stmt2</code></li>
<li><code>for (init_expr; cond; inc_expr) stmt</code></li>
<li><code>while (cond) stmt</code></li>
<li><code>do stmt while (cond);</code></li>
<li><code>switch (integral_expr) { ... }</code></li>
<li><code>break</code> and <code>continue</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5;" data-marpit-pagination-total="42">
<h2 id="functions">Functions</h2>
<p>Function declaration: <code>RetType funcName(Parameters);</code></p>
<ul>
<li>Parameter names are not necessary, but types are required.</li>
<li>A function can be declared multiple times.</li>
</ul>
<p>Function definition: <code>RetType funcName(Parameters) { functionBody }</code></p>
<ul>
<li>A function can be defined only once.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-style="section::after {

}
" data-theme="o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5;" data-marpit-pagination-total="42">
<h2 id="functions-1">Functions</h2>
<ul>
<li>
<p>Argument passing:</p>
<ul>
<li>Use the argument to initialize the parameter.</li>
<li>The semantic is <strong>copy</strong>.</li>
<li><strong>Decay</strong> always happens: One can never declare an array parameter.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-style="section::after {

" data-theme="o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--style:section::after {

}
;--theme:o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5;" data-marpit-pagination-total="42">
<h2 id="the-main-function">The <code>main</code> function</h2>
<p>Entry point of the program (after initialization of all global and local <code>static</code> variables).</p>
<p>One of the following signatures:</p>
<ul>
<li><code>int main(void) { ... }</code></li>
<li><code>int main(int argc, char **argv) { ... }</code>, for passing command-line arguments.</li>
<li><code>/* another implementation-defined signature */</code></li>
</ul>
<p>Return value: <code>0</code> to indicate that the program exits successfully.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-style="section::after {

" data-theme="o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--style:section::after {

}
;--theme:o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5;" data-marpit-pagination-total="42">
<h2 id="standard-library">Standard library</h2>
<ul>
<li>IO library <code>&lt;stdio.h&gt;</code>: <code>scanf</code>, <code>printf</code>, <code>fgets</code>, <code>puts</code>, <code>putchar</code>, <code>getchar</code>, ...</li>
<li>String library <code>&lt;string.h&gt;</code>: <code>strlen</code>, <code>strcpy</code>, <code>strcmp</code>, <code>strchr</code>, ...</li>
<li>Character classification <code>&lt;ctype.h&gt;</code>: <code>isdigit</code>, <code>isalpha</code>, <code>tolower</code>, ...</li>
<li><code>&lt;stdlib.h&gt;</code>: Several general-purpose functions: <code>malloc</code>/<code>free</code>, <code>rand</code>, ...</li>
<li><code>&lt;limits.h&gt;</code>: Defines macros like <code>INT_MAX</code> that describe the limits of built-in types.</li>
<li><code>&lt;math.h&gt;</code>: Mathematical functions like <code>sqrt</code>, <code>sin</code>, <code>acos</code>, <code>exp</code>, ...</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-style="section::after {

<h2 id="example-vector-1">Example: <code>Vector</code></h2>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Vector</span> {</span>
  <span class="hljs-type">double</span> *entries;
  <span class="hljs-type">size_t</span> dimension;
};
</code></pre>
<p>Do not name them with <code>x</code> and <code>n</code>!</p>
<p><strong>[Best practice]</strong> <u>Use meaningful names in programs.</u></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-style="section::after {

<h2 id="creation-and-destruction">Creation and destruction</h2>
<pre><code class="language-c"><span class="hljs-keyword">struct</span> Vector <span class="hljs-title function_">create_vector</span><span class="hljs-params">(<span class="hljs-type">size_t</span> n)</span> {
  <span class="hljs-keyword">return</span> (<span class="hljs-keyword">struct</span> Vector){.entries = <span class="hljs-built_in">calloc</span>(n, <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>)),
                         .dimension = n};
}
<span class="hljs-type">void</span> <span class="hljs-title function_">destroy_vector</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> Vector *vec)</span> {
  <span class="hljs-built_in">free</span>(vec-&gt;entries);
  <span class="hljs-comment">// Do we need to free(vec)?</span>
}
</code></pre>
<p>Usage:</p>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Vector</span> <span class="hljs-title">v</span> =</span> create_vector(<span class="hljs-number">10</span>);
<span class="hljs-comment">// some operations ...</span>
destroy_vector(&amp;v);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-style="section::after {

<h2 id="deep-copy-of-vector">&quot;Deep copy&quot; of <code>Vector</code></h2>
<p>The default copy semantics of <code>Vector</code> is not satisfactory:</p>
<pre><code class="language-c"><span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Vector</span> <span class="hljs-title">v</span> =</span> something();
<span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Vector</span> <span class="hljs-title">u</span> =</span> v;
</code></pre>
<p>Now <code>u.entries</code> and <code>v.entries</code> point to the same memory block!</p>
<pre><code class="language-c">destroy_vector(&amp;u);
destroy_vector(&amp;v); <span class="hljs-comment">// undefined behavior: double free!</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-style="section::after {

<h2 id="deep-copy-of-vector-1">&quot;Deep copy&quot; of <code>Vector</code></h2>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">vector_assign</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> Vector *to, <span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *from)</span> {
  to-&gt;entries = <span class="hljs-built_in">malloc</span>(from-&gt;dimension * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
  <span class="hljs-built_in">memcpy</span>(to-&gt;entries, from-&gt;entries, from-&gt;dimension * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
  to-&gt;dimension = from-&gt;dimension;
}
</code></pre>
<p>Is this correct?</p>

<h2 id="deep-copy-of-vector-2">&quot;Deep copy&quot; of <code>Vector</code></h2>
<p><code>free</code> the memory block that is not used anymore!</p>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">vector_assign</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> Vector *to, <span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *from)</span> {
  <span class="hljs-built_in">free</span>(to-&gt;entries); <span class="hljs-comment">// Don&#x27;t forget this!!</span>
  to-&gt;entries = <span class="hljs-built_in">malloc</span>(from-&gt;dimension * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
  <span class="hljs-built_in">memcpy</span>(to-&gt;entries, from-&gt;entries, from-&gt;dimension * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
  to-&gt;dimension = from-&gt;dimension;
}
</code></pre>
<p>Is this correct?</p>

<h2 id="deep-copy-of-vector-3">&quot;Deep copy&quot; of <code>Vector</code></h2>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">vector_assign</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> Vector *to, <span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *from)</span> {
  <span class="hljs-built_in">free</span>(to-&gt;entries); <span class="hljs-comment">// Don&#x27;t forget this!!</span>
  to-&gt;entries = <span class="hljs-built_in">malloc</span>(from-&gt;dimension * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
  <span class="hljs-built_in">memcpy</span>(to-&gt;entries, from-&gt;entries, from-&gt;dimension * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
  to-&gt;dimension = from-&gt;dimension;
}
</code></pre>
<p>What happens if <code>to == from</code>?</p>
<ul>
<li>This is not impossible. Consider <code>vector_assign(&amp;vecs[i], &amp;vecs[j])</code> where <code>i</code> and <code>j</code> have a chance to be equal.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-style="section::after {

<h2 id="deep-copy-of-vector-4">&quot;Deep copy&quot; of <code>Vector</code></h2>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">vector_assign</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> Vector *to, <span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *from)</span> {
  <span class="hljs-built_in">free</span>(to-&gt;entries); <span class="hljs-comment">// Don&#x27;t forget this!!</span>
  to-&gt;entries = <span class="hljs-built_in">malloc</span>(from-&gt;dimension * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
  <span class="hljs-built_in">memcpy</span>(to-&gt;entries, from-&gt;entries, from-&gt;dimension * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
  to-&gt;dimension = from-&gt;dimension;
}
</code></pre>
<p>What happens if <code>to == from</code>?</p>
<ul>
<li>This is not impossible. Consider <code>vector_assign(&amp;x[i], &amp;x[j])</code> where <code>i</code> and <code>j</code> have a chance to be equal.</li>
<li>The memory block is <code>free</code>d, and the data are gone.</li>
</ul>

<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">vector_assign</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> Vector *to, <span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *from)</span> {
  <span class="hljs-keyword">if</span> (to == from)
    <span class="hljs-keyword">return</span>;
  <span class="hljs-built_in">free</span>(to-&gt;entries); <span class="hljs-comment">// Don&#x27;t forget this!!</span>
  to-&gt;entries = <span class="hljs-built_in">malloc</span>(from-&gt;dimension * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
  <span class="hljs-built_in">memcpy</span>(to-&gt;entries, from-&gt;entries, from-&gt;dimension * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
  to-&gt;dimension = from-&gt;dimension;
}
</code></pre>
<p>Why do we declare the parameters as pointers?</p>

" data-theme="o22z8aacp3t2m9hbok2zy8c96oa2gs22ph30pu83vfk5" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--style:section::after {

<h2 id="deep-copy-of-vector-6">&quot;Deep copy&quot; of <code>Vector</code></h2>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">vector_assign</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> Vector *to, <span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *from)</span> {
  <span class="hljs-keyword">if</span> (to == from)
    <span class="hljs-keyword">return</span>;
  <span class="hljs-built_in">free</span>(to-&gt;entries); <span class="hljs-comment">// Don&#x27;t forget this!!</span>
  to-&gt;entries = <span class="hljs-built_in">malloc</span>(from-&gt;dimension * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
  <span class="hljs-built_in">memcpy</span>(to-&gt;entries, from-&gt;entries, from-&gt;dimension * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
  to-&gt;dimension = from-&gt;dimension;
}
</code></pre>
<p>Why do we declare the parameters as pointers?</p>
<ul>
<li>For <code>to</code>, we need to modify it.</li>
<li>For <code>from</code>, this is a read-only operation. Pass the address to avoid copies.</li>

<h2 id="equality-comparison">Equality comparison</h2>
<pre><code class="language-c"><span class="hljs-type">bool</span> <span class="hljs-title function_">vector_equal</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *lhs, <span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *rhs)</span> {
  <span class="hljs-keyword">if</span> (lhs-&gt;dimension != rhs-&gt;dimension)
    <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
  <span class="hljs-keyword">for</span> (<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i != lhs-&gt;dimension; ++i)
    <span class="hljs-keyword">if</span> (lhs-&gt;entries[i] != rhs-&gt;entries[i])
      <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
  <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
}
</code></pre>

<h2 id="basic-operations-on-vector">Basic operations on <code>Vector</code></h2>
<pre><code class="language-c"><span class="hljs-keyword">struct</span> Vector <span class="hljs-title function_">vector_add</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *lhs, <span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *rhs)</span> {
  assert(lhs-&gt;dimension == rhs-&gt;dimension);
  <span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Vector</span> <span class="hljs-title">result</span> =</span> create_vector(lhs-&gt;dimension);
  <span class="hljs-keyword">for</span> (<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i != lhs-&gt;dimension; ++i)
    result.entries[i] = lhs-&gt;entries[i] + rhs-&gt;entries[i];
  <span class="hljs-keyword">return</span> result;
}

<span class="hljs-keyword">struct</span> Vector <span class="hljs-title function_">vector_scale</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *lhs, <span class="hljs-type">double</span> scale)</span> {
  <span class="hljs-class"><span class="hljs-keyword">struct</span> <span class="hljs-title">Vector</span> <span class="hljs-title">result</span> =</span> create_vector(lhs-&gt;dimension);
  <span class="hljs-keyword">for</span> (<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i != lhs-&gt;dimension; ++i)
    result.entries[i] = lhs-&gt;entries[i] * scale;
  <span class="hljs-keyword">return</span> result;
}
</code></pre>
<p>For <code>vector_add</code>, our design is to claim that &quot;the behavior is undefined if the vectors have different dimensions&quot;.</p>

<pre><code class="language-c"><span class="hljs-type">double</span> <span class="hljs-title function_">vector_dot_product</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *lhs, <span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *rhs)</span> {
  assert(lhs-&gt;dimension == rhs-&gt;dimension);
  <span class="hljs-type">double</span> result = <span class="hljs-number">0</span>;
  <span class="hljs-keyword">for</span> (<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i != lhs-&gt;dimension; ++i)
    result += lhs-&gt;entries[i] * rhs-&gt;entries[i];
  <span class="hljs-keyword">return</span> result;
}
<span class="hljs-type">double</span> <span class="hljs-title function_">vector_norm</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *vec)</span> {
  <span class="hljs-keyword">return</span> <span class="hljs-built_in">sqrt</span>(vector_dot_product(vec, vec));
}
<span class="hljs-type">double</span> <span class="hljs-title function_">vector_distance</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *lhs, <span class="hljs-type">const</span> <span class="hljs-keyword">struct</span> Vector *rhs)</span> {

<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">vector_push_back</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> Vector *vec, <span class="hljs-type">double</span> x)</span> {
  <span class="hljs-keyword">if</span> (<span class="hljs-comment">/* reallocation is needed */</span>)
    vector_grow(vec); <span class="hljs-comment">// Implement this function</span>
  vec-&gt;entries[vec-&gt;dimension++] = x;
}
</code></pre>

<h2 id="problems-of-the-current-implementation">Problems of the current implementation</h2>
<ol>
<li>The call to <code>create_vector</code> is not mandatory. One can easily create a <code>Vector</code> with some garbage values.</li>
<li><code>destroy_vector</code> is not called automatically. If we forget to call it manually, memory leak happens.</li>
<li>We always need to pass the address of <code>Vector</code>s to these functions. The extra <code>&amp;</code> and <code>*</code> are annoying.</li>
<li>The &quot;deep copy&quot; is implemented by a function, but the default copy semantics are still there. If we forget to call <code>vector_assign</code> when copying a <code>Vector</code>, disaster will happen.</li>
<li>No prevention from modifying a <code>Vector</code>: Disaster is caused easily by a simple <code>free(vec-&gt;entries);</code>.</li>
</ol>
</section>
