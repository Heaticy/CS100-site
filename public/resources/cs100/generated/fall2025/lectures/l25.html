<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">compare</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b)</span> </span>{

}
<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">compare</span><span class="hljs-params">(<span class="hljs-type">double</span> a, <span class="hljs-type">double</span> b)</span> </span>{

<h2 id="motivation-function-template-1">Motivation: function template</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">compare</span><span class="hljs-params">(<span class="hljs-type">const</span> T &amp;a, <span class="hljs-type">const</span> T &amp;b)</span> </span>{
  <span class="hljs-keyword">if</span> (a &lt; b) <span class="hljs-keyword">return</span> <span class="hljs-number">-1</span>;
  <span class="hljs-keyword">if</span> (b &lt; a) <span class="hljs-keyword">return</span> <span class="hljs-number">1</span>;
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<ul>
<li>Type parameter: <code>T</code></li>
<li>A template is a <strong>guideline</strong> for the compiler:
<ul>
<li>When <code>compare(42, 40)</code> is called, <code>T</code> is deduced to be <code>int</code>, and the compiler generates a version of the function for <code>int</code>.</li>
<li>When <code>compare(s1, s2)</code> is called, <code>T</code> is deduced to be <code>std::string</code>, ....</li>
<li>The generation of a function based on a function template is called the <strong>instantiation</strong> (实例化) of that function template.</li>
</ul>
</li>
</ul>
</section>

<h2 id="type-parameter">Type parameter</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">compare</span><span class="hljs-params">(<span class="hljs-type">const</span> T &amp;a, <span class="hljs-type">const</span> T &amp;b)</span> </span>{
  <span class="hljs-keyword">if</span> (a &lt; b) <span class="hljs-keyword">return</span> <span class="hljs-number">-1</span>;
  <span class="hljs-keyword">if</span> (b &lt; a) <span class="hljs-keyword">return</span> <span class="hljs-number">1</span>;
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<ul>
<li>The keyword <code>typename</code> indicates that <code>T</code> is a <strong>type</strong>.</li>
<li>Here <code>typename</code> can be replaced with <code>class</code>. <strong>They are totally equivalent here.</strong> Using <code>class</code> doesn't mean that <code>T</code> should be a class type.</li>
</ul>
</section>

<h2 id="type-parameter-1">Type parameter</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">compare</span><span class="hljs-params">(<span class="hljs-type">const</span> T &amp;a, <span class="hljs-type">const</span> T &amp;b)</span> </span>{
  <span class="hljs-keyword">if</span> (a &lt; b) <span class="hljs-keyword">return</span> <span class="hljs-number">-1</span>;
  <span class="hljs-keyword">if</span> (b &lt; a) <span class="hljs-keyword">return</span> <span class="hljs-number">1</span>;
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<ul>
<li>Why do we use <code>const T &amp;</code>? Why do we use <code>b &lt; a</code> instead of <code>a &gt; b</code>?</li>
</ul>
</section>

<h2 id="type-parameter-2">Type parameter</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">compare</span><span class="hljs-params">(<span class="hljs-type">const</span> T &amp;a, <span class="hljs-type">const</span> T &amp;b)</span> </span>{
  <span class="hljs-keyword">if</span> (a &lt; b) <span class="hljs-keyword">return</span> <span class="hljs-number">-1</span>;
  <span class="hljs-keyword">if</span> (b &lt; a) <span class="hljs-keyword">return</span> <span class="hljs-number">1</span>;
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<ul>
<li>Why do we use <code>const T &amp;</code>? Why do we use <code>b &lt; a</code> instead of <code>a &gt; b</code>?
<ul>
<li>Because we are dealing with an unknown type!</li>
<li><code>T</code> may not be copyable, or copying <code>T</code> may be costly.</li>
<li><code>T</code> may only support <code>operator&lt;</code> but does not support <code>operator&gt;</code>.</li>
</ul>
</li>
</ul>
<p><strong>* Template programs should try to minimize the number of requirements placed on the argument types.</strong></p>

<h2 id="template-argument-deduction">Template argument deduction</h2>
<p>To instantiate a function template, every template argument must be known, but not every template argument has to be specified.</p>
<p>When possible, the compiler will deduce the missing template arguments from the function arguments.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> To, <span class="hljs-keyword">typename</span> From&gt;
<span class="hljs-function">To <span class="hljs-title">my_special_cast</span><span class="hljs-params">(From f)</span></span>;

<span class="hljs-type">double</span> d = <span class="hljs-number">3.14</span>;
<span class="hljs-type">int</span> i = <span class="hljs-built_in">my_special_cast</span>&lt;<span class="hljs-type">int</span>&gt;(d);   <span class="hljs-comment">// calls my_special_cast&lt;int, double&gt;(double)</span>
<span class="hljs-type">char</span> c = <span class="hljs-built_in">my_special_cast</span>&lt;<span class="hljs-type">char</span>&gt;(d); <span class="hljs-comment">// calls my_special_cast&lt;char, double&gt;(double)</span>

<h2 id="template-argument-deduction-1">Template argument deduction</h2>
<p>Suppose we have the following function</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> P&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(P p)</span></span>;
</code></pre>
<p>and a call <code>fun(a)</code>, where the type of <code>a</code> (ignoring references) is <code>A</code>.</p>
<ul>
<li>
<p><code>A</code> is never considered to be a reference. For example,</p>
<pre><code class="language-cpp"><span class="hljs-type">const</span> <span class="hljs-type">int</span> &amp;cr = <span class="hljs-number">42</span>;
<span class="hljs-built_in">fun</span>(cr); <span class="hljs-comment">// A is considered to be const int, not const int &amp;</span>
</code></pre>
</li>
</ul>
</section>

<h2 id="template-argument-deduction-2">Template argument deduction</h2>
<p>Suppose we have the following function</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> P&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(P p)</span></span>;
</code></pre>
<p>and a call <code>fun(a)</code>, where the type of <code>a</code> (ignoring references) is <code>A</code>.</p>
<ul>
<li>
<p>Passing-by-value ignores references and top-level <code>const</code> qualifications. For example,</p>
<pre><code class="language-cpp"><span class="hljs-type">const</span> <span class="hljs-type">int</span> ci = <span class="hljs-number">42</span>; <span class="hljs-type">const</span> <span class="hljs-type">int</span> &amp;cr = ci;
<span class="hljs-built_in">fun</span>(ci); <span class="hljs-comment">// A = const int, P = int</span>
<span class="hljs-built_in">fun</span>(cr); <span class="hljs-comment">// A = const int, P = int</span>
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-style="section::after {

<h2 id="template-argument-deduction-3">Template argument deduction</h2>
<p>Suppose we have the following function</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> P&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(P p)</span></span>;
</code></pre>
<p>and a call <code>fun(a)</code>, where the type of <code>a</code> (ignoring references) is <code>A</code>.</p>
<ul>
<li>
<p>If <code>A</code> is an array or a function type, the <em><strong>decay</strong></em> to the corresponding pointer types takes place:</p>
<pre><code class="language-cpp"><span class="hljs-type">int</span> a[<span class="hljs-number">10</span>]; <span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">foo</span><span class="hljs-params">(<span class="hljs-type">double</span>, <span class="hljs-type">double</span>)</span></span>;
<span class="hljs-built_in">fun</span>(a); <span class="hljs-comment">// A = int[10], P = int *</span>
<span class="hljs-built_in">fun</span>(foo); <span class="hljs-comment">// A = int(double, double), P = int(*)(double, double)</span>
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-style="section::after {

<h2 id="template-argument-deduction-4">Template argument deduction</h2>
<p>Suppose we have the following function</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> P&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(P p)</span></span>;
</code></pre>
<p>and a call <code>fun(a)</code>, where the type of <code>a</code> (ignoring references) is <code>A</code>.</p>
<ul>
<li>If <code>A</code> is <code>const</code>-qualified, the top-level <code>const</code> is ignored;</li>
<li>otherwise <code>A</code> is an array or a function type, the <em><strong>decay</strong></em> to the corresponding pointer types takes place.</li>
</ul>
<p><strong>This is exactly the same thing as in <code>auto p = a;</code>!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-style="section::after {

<h2 id="template-argument-deduction-5">Template argument deduction</h2>
<p>Let <code>T</code> be the type parameter of the template.</p>
<ul>
<li>The deduction for the parameter <code>T x</code> with argument <code>a</code> is the same as that in <code>auto x = a;</code>.</li>
<li>The deduction for the parameter <code>T &amp;x</code> with argument <code>a</code> is the same as that in <code>auto &amp;x = a;</code>. <code>a</code> must be an lvalue expression.</li>
<li>The deduction for the parameter <code>const T x</code> with the argument <code>a</code> is the same as that in <code>const auto x = a;</code>.</li>
</ul>
<p>The deduction rule that <code>auto</code> uses is <strong>totally the same</strong> as the rule used here!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-style="section::after {

<h2 id="template-argument-deduction-6">Template argument deduction</h2>
<p>Deduction forms can be nested:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">const</span> std::vector&lt;T&gt; &amp;vec)</span></span>;

std::vector&lt;<span class="hljs-type">int</span>&gt; vi;
std::vector&lt;std::string&gt; vs;
std::vector&lt;std::vector&lt;<span class="hljs-type">int</span>&gt;&gt; vvi;

<span class="hljs-built_in">fun</span>(vi); <span class="hljs-comment">// T = int</span>
<span class="hljs-built_in">fun</span>(vs); <span class="hljs-comment">// T = std::string</span>
<span class="hljs-built_in">fun</span>(vvi); <span class="hljs-comment">// T = std::vector&lt;int&gt;</span>
</code></pre>
<p>Exercise: Write a function <code>map(func, vec)</code>, where <code>func</code> is any unary function and <code>vec</code> is any vector. Returns a vector obtained from <code>vec</code> by replacing every element <code>x</code> with <code>func(x)</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-style="section::after {

<h2 id="template-argument-deduction-7">Template argument deduction</h2>
<p>Exercise: Write a function <code>map(func, vec)</code>, where <code>func</code> is any unary function and <code>vec</code> is any vector. Returns a vector obtained from <code>vec</code> by replacing every element <code>x</code> with <code>func(x)</code>.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Func, <span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">map</span><span class="hljs-params">(Func func, <span class="hljs-type">const</span> std::vector&lt;T&gt; &amp;vec)</span> </span>{
  std::vector&lt;T&gt; result;
  <span class="hljs-keyword">for</span> (<span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;x : vec)
    result.<span class="hljs-built_in">push_back</span>(<span class="hljs-built_in">func</span>(x));
  <span class="hljs-keyword">return</span> result;
}
</code></pre>
<p>Usage:</p>
<pre><code class="language-cpp">std::vector v{<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>};
<span class="hljs-keyword">auto</span> v2 = <span class="hljs-built_in">map</span>([](<span class="hljs-type">int</span> x) { <span class="hljs-keyword">return</span> x * <span class="hljs-number">2</span>; }, v); <span class="hljs-comment">// v2 == {2, 4, 6, 8}</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-style="section::after {

;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="forwarding-reference">Forwarding reference</h2>
<p>Also known as &quot;universal reference&quot; (万能引用).</p>
<p>Suppose we have the following function</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(T &amp;&amp;x)</span></span>;
</code></pre>
<p>A call <code>fun(a)</code> happens for an expression <code>a</code>.</p>
<ul>
<li>If <code>a</code> is an rvalue expression of type <code>E</code>, <code>T</code> is deduced to be <code>E</code> so that the type of <code>x</code> is <code>E &amp;&amp;</code>, an rvalue reference.</li>
<li>If <code>a</code> is an lvalue expression of type <code>E</code>, <strong><code>T</code> will be deduced to <code>E &amp;</code></strong>.
<ul>
<li>The type of <code>x</code> is <code>T &amp; &amp;&amp;</code>??? (We know that there are no &quot;references to references&quot; in C++.)</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-style="section::after {

" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--style:section::after {

;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="reference-collapsing">Reference collapsing</h2>
<p>If a &quot;reference to reference&quot; is formed through type aliases or templates, the <strong>reference collapsing</strong> (引用折叠) rule applies:</p>
<ul>
<li><code>&amp; &amp;</code>, <code>&amp; &amp;&amp;</code> and <code>&amp;&amp; &amp;</code> collapse to <code>&amp;</code>;</li>
<li><code>&amp;&amp; &amp;&amp;</code> collapses to <code>&amp;&amp;</code>.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">using</span> lref = <span class="hljs-type">int</span> &amp;;
<span class="hljs-keyword">using</span> rref = <span class="hljs-type">int</span> &amp;&amp;;
<span class="hljs-type">int</span> n;
 
lref&amp;  r1 = n; <span class="hljs-comment">// type of r1 is int&amp;</span>
lref&amp;&amp; r2 = n; <span class="hljs-comment">// type of r2 is int&amp;</span>
rref&amp;  r3 = n; <span class="hljs-comment">// type of r3 is int&amp;</span>
rref&amp;&amp; r4 = <span class="hljs-number">1</span>; <span class="hljs-comment">// type of r4 is int&amp;&amp;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-style="section::after {

;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="forwarding-reference-1">Forwarding reference</h2>
<p>Suppose we have the following function</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(T &amp;&amp;x)</span></span>;
</code></pre>
<p>A call <code>fun(a)</code> happens for an expression <code>a</code>.</p>
<ul>
<li>If <code>a</code> is an rvalue expression of type <code>E</code>, <code>T</code> is deduced to be <code>E</code> so that the type of <code>x</code> is <code>E &amp;&amp;</code>, an rvalue reference.</li>
<li>If <code>a</code> is an lvalue expression of type <code>E</code>, <strong><code>T</code> will be deduced to <code>E &amp;</code></strong> and the reference collapsing rule applies, so that the type of <code>x</code> is <code>E &amp;</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="forwarding-reference-2">Forwarding reference</h2>
<p>Suppose we have the following function</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(T &amp;&amp;x)</span></span>;
</code></pre>
<p>A call <code>fun(a)</code> happens for an expression <code>a</code>.</p>
<ul>
<li>If <code>a</code> is an rvalue expression of type <code>E</code>, <code>T</code> is <code>E</code> and <code>x</code> is of type <code>E &amp;&amp;</code>.</li>
<li>If <code>a</code> is an lvalue expression of type <code>E</code>, <code>T</code> is <code>E &amp;</code> and <code>x</code> is of type <code>E &amp;</code>.</li>
</ul>
<p>As a result, <code>x</code> is always a reference depending on the value category of <code>a</code>! Such reference is called a <strong>universal reference</strong> or <strong>forwarding reference</strong>.</p>
<p>The same thing happens for <code>auto &amp;&amp;x = a;</code>!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-style="section::after {

" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--style:section::after {

;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="perfect-forwarding">Perfect forwarding</h2>
<p>A forwarding reference can be used for <strong>perfect forwarding</strong>:</p>
<ul>
<li>The value category is not changed.</li>
<li>If there is a <code>const</code> qualification, it is not lost.</li>
</ul>
<p>Example: Suppose we design a <code>std::make_unique</code> for one argument:</p>
<ul>
<li><code>make_unique&lt;Type&gt;(arg)</code> forwards the argument <code>arg</code> to the constructor of <code>Type</code>.</li>
<li>The value category must not be changed: <code>make_unique&lt;std::string&gt;(s1 + s2)</code> must move <code>s1 + s2</code> instead of copying it.</li>
<li>The <code>const</code>-qualification must not be changed: No <code>const</code> is added if <code>arg</code> is non-<code>const</code>, and <code>const</code> should be preserved if <code>arg</code> is <code>const</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="perfect-forwarding-1">Perfect forwarding</h2>
<ul>
<li>The value category must not be changed: <code>make_unique&lt;std::string&gt;(s1 + s2)</code> must move <code>s1 + s2</code> instead of copying it.</li>
<li>The <code>const</code>-qualification must not be changed: No <code>const</code> is added if <code>arg</code> is non-<code>const</code>, and <code>const</code> should be preserved if <code>arg</code> is <code>const</code>.</li>
</ul>
<p>The following does not meet our requirements: An rvalue will become an lvalue, and <code>const</code> is added.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T, <span class="hljs-keyword">typename</span> U&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">make_unique</span><span class="hljs-params">(<span class="hljs-type">const</span> U &amp;arg)</span> </span>{
  <span class="hljs-keyword">return</span> std::<span class="hljs-built_in">unique_ptr</span>&lt;T&gt;(<span class="hljs-keyword">new</span> <span class="hljs-built_in">T</span>(arg));
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="perfect-forwarding-2">Perfect forwarding</h2>
<ul>
<li>The value category must not be changed: <code>make_unique&lt;std::string&gt;(s1 + s2)</code> must move <code>s1 + s2</code> instead of copying it.</li>
<li>The <code>const</code>-qualification must not be changed: No <code>const</code> is added if <code>arg</code> is non-<code>const</code>, and <code>const</code> should be preserved if <code>arg</code> is <code>const</code>.</li>
</ul>
<p>We need to do this:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T, <span class="hljs-keyword">typename</span> U&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">make_unique</span><span class="hljs-params">(U &amp;&amp;arg)</span> </span>{
  <span class="hljs-comment">// For an lvalue argument, U=E&amp; and arg is E&amp;.</span>
  <span class="hljs-comment">// For an rvalue argument, U=E  and arg is E&amp;&amp;.</span>
  <span class="hljs-keyword">if</span> (<span class="hljs-comment">/* U is an lvalue reference type */</span>)
    <span class="hljs-keyword">return</span> std::<span class="hljs-built_in">unique_ptr</span>&lt;T&gt;(<span class="hljs-keyword">new</span> <span class="hljs-built_in">T</span>(arg));
  <span class="hljs-keyword">else</span>
    <span class="hljs-keyword">return</span> std::<span class="hljs-built_in">unique_ptr</span>&lt;T&gt;(<span class="hljs-keyword">new</span> <span class="hljs-built_in">T</span>(std::<span class="hljs-built_in">move</span>(arg)));
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="perfect-forwarding-3">Perfect forwarding</h2>
<p><code>std::forward&lt;T&gt;(arg)</code>: defined in <code>&lt;utility&gt;</code>.</p>
<ul>
<li>If <code>T</code> is an lvalue reference type, returns an lvalue reference to <code>arg</code>.</li>
<li>Otherwise, returns an rvalue reference to <code>std::move(arg)</code>.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T, <span class="hljs-keyword">typename</span> U&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">make_unique</span><span class="hljs-params">(U &amp;&amp;arg)</span> </span>{
  <span class="hljs-keyword">return</span> std::<span class="hljs-built_in">unique_ptr</span>&lt;T&gt;(<span class="hljs-keyword">new</span> <span class="hljs-built_in">T</span>(std::forward&lt;U&gt;(arg))).
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="variadic-templates">Variadic templates</h2>
<p>To support an unknown number of arguments of unknown types:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span>... Types&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">foo</span><span class="hljs-params">(Types... params)</span></span>;
</code></pre>
<p>It can be called with any number of arguments, of any types:</p>
<pre><code class="language-cpp"><span class="hljs-built_in">foo</span>();         <span class="hljs-comment">// OK: `params` contains no arguments</span>
<span class="hljs-built_in">foo</span>(<span class="hljs-number">42</span>);       <span class="hljs-comment">// OK: `params` contains one argument: int</span>
<span class="hljs-built_in">foo</span>(<span class="hljs-number">42</span>, <span class="hljs-number">3.14</span>); <span class="hljs-comment">// OK: `params` contains two arguments: int and double</span>
</code></pre>
<p><code>Types</code> is a <strong>template parameter pack</strong>, and <code>params</code> is a <strong>function parameter pack</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="parameter-pack">Parameter pack</h2>
<p>The types of the function parameters can also contain <code>const</code> or references:</p>
<pre><code class="language-cpp"><span class="hljs-comment">// All arguments are passed by reference-to-const</span>
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span>... Types&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">foo</span><span class="hljs-params">(<span class="hljs-type">const</span> Types &amp;...params)</span></span>;
<span class="hljs-comment">// All arguments are passed by forwarding reference</span>
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span>... Types&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">foo</span><span class="hljs-params">(Types &amp;&amp;...params)</span></span>;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="pack-expansion">Pack expansion</h2>
<p>A <strong>pattern</strong> followed by <code>...</code>, in which the name of at least one parameter pack appears at least once, is <strong>expanded</strong> into zero or more comma-separated instantiations of the pattern.</p>
<ul>
<li>The name of the parameter pack is replaced by each of the elements from the pack, in order.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span>... Types&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">foo</span><span class="hljs-params">(Types &amp;&amp;...params)</span> </span>{
  <span class="hljs-comment">// Suppose Types is T1, T2, T3 and params is p1, p2, p3.</span>
  <span class="hljs-comment">// &amp;params... is expanded to &amp;p1, &amp;p2, &amp;p3.</span>
  <span class="hljs-comment">// func(params)... is expanded to func(p1), func(p2), func(p3).</span>
  <span class="hljs-comment">// func(params...) is expanded to func(p1, p2, p3)</span>
  <span class="hljs-comment">// std::forward&lt;Types&gt;(params)... is expanded to</span>
  <span class="hljs-comment">//   std::forward&lt;T1&gt;(p1), std::forward&lt;T2&gt;(p2), std::forward&lt;T3&gt;(p3)</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="perfect-forwarding-final-version">Perfect forwarding: final version</h2>
<p>Perfect forwarding for any number of arguments of any types:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T, <span class="hljs-keyword">typename</span>... Ts&gt; <span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">make_unique</span><span class="hljs-params">(Ts &amp;&amp;...params)</span> </span>{
  <span class="hljs-keyword">return</span> std::<span class="hljs-built_in">unique_ptr</span>&lt;T&gt;(<span class="hljs-keyword">new</span> <span class="hljs-built_in">T</span>(std::forward&lt;Ts&gt;(params)...));
}
</code></pre>
<p>This is also how <code>std::vector&lt;T&gt;::emplace_back</code> forward arguments.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt; <span class="hljs-keyword">class</span> <span class="hljs-title class_">vector</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span>... Types&gt; <span class="hljs-function">reference <span class="hljs-title">emplace_back</span><span class="hljs-params">(Types &amp;&amp;...args)</span> </span>{
    <span class="hljs-keyword">if</span> (<span class="hljs-built_in">size</span>() == <span class="hljs-built_in">capacity</span>())
      <span class="hljs-built_in">reallocate</span>(<span class="hljs-built_in">capacity</span>() == <span class="hljs-number">0</span> ? <span class="hljs-number">1</span> : <span class="hljs-built_in">capacity</span>() * <span class="hljs-number">2</span>);
    <span class="hljs-built_in">construct_at</span>(m_end_of_elems, std::forward&lt;Types&gt;(args)...);
    ++m_end_of_elems;
    <span class="hljs-keyword">return</span> *(m_end_of_elems - <span class="hljs-number">1</span>);
  }
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="auto-and-template-argument-deduction"><code>auto</code> and template argument deduction</h2>
<p>We have seen that the deduction rule that <code>auto</code> uses is exactly the template argument deduction rule.</p>
<p>If we declare the parameter types in an <strong>lambda expression</strong> with <code>auto</code>, it becomes a <strong>generic lambda</strong>:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> less = [](<span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;lhs, <span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;rhs) { <span class="hljs-keyword">return</span> lhs &lt; rhs; };
std::string s1, s2;
<span class="hljs-type">bool</span> b1 = <span class="hljs-built_in">less</span>(<span class="hljs-number">10</span>, <span class="hljs-number">15</span>); <span class="hljs-comment">// 10 &lt; 15</span>
<span class="hljs-type">bool</span> b2 = <span class="hljs-built_in">less</span>(s1, s2); <span class="hljs-comment">// s1 &lt; s2</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="auto-and-template-argument-deduction-1"><code>auto</code> and template argument deduction</h2>
<p>We have seen that the deduction rule that <code>auto</code> uses is exactly the template argument deduction rule.</p>
<p><strong>Since C++20</strong>: Function parameter types can be declared with <code>auto</code>.</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">add</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;a, <span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;b)</span> </span>{
  <span class="hljs-keyword">return</span> a + b;
}
<span class="hljs-comment">// Equialent way: template</span>
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T, <span class="hljs-keyword">typename</span> U&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">add</span><span class="hljs-params">(<span class="hljs-type">const</span> T &amp;a, <span class="hljs-type">const</span> U &amp;b)</span> </span>{
  <span class="hljs-keyword">return</span> a + b;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h1 id="class-templates">Class templates</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="define-a-class-template">Define a class template</h2>
<p>Let's make our <code>Dynarray</code> a template <code>Dynarray&lt;T&gt;</code> to support any element type <code>T</code>.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
  std::<span class="hljs-type">size_t</span> m_length;
  T *m_storage;

<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Dynarray</span>();
  <span class="hljs-built_in">Dynarray</span>(<span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;);
  <span class="hljs-built_in">Dynarray</span>(Dynarray&lt;T&gt; &amp;&amp;) <span class="hljs-keyword">noexcept</span>;
  <span class="hljs-comment">// other members ...</span>
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="define-a-class-template-1">Define a class template</h2>
<p>A class template is a <strong>guideline</strong> for the compiler: When a type <code>Dynarray&lt;T&gt;</code> is used for a certain type <code>T</code>, the compiler will <strong>instantiate</strong> that class type according to the class template.</p>
<p>For different types <code>T</code> and <code>U</code>, <code>Dynarray&lt;T&gt;</code> and <code>Dynarray&lt;U&gt;</code> <strong>are different types</strong>.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-keyword">class</span> <span class="hljs-title class_">X</span> {
  <span class="hljs-type">int</span> x = <span class="hljs-number">42</span>; <span class="hljs-comment">// private</span>

<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">foo</span><span class="hljs-params">(X&lt;<span class="hljs-type">double</span>&gt; xd)</span> </span>{
    x = xd.x; <span class="hljs-comment">// access a private member of X&lt;double&gt;</span>
    <span class="hljs-comment">// This is valid only when T is double.</span>
  }
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="define-a-class-template-2">Define a class template</h2>
<p>Inside the class template, the template parameters can be omitted when we are referring to the self type:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
  std::<span class="hljs-type">size_t</span> m_length;
  T *m_storage;

<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Dynarray</span>();
  <span class="hljs-built_in">Dynarray</span>(<span class="hljs-type">const</span> Dynarray &amp;); <span class="hljs-comment">// Parameter type is const Dynarray&lt;T&gt; &amp;</span>
  <span class="hljs-built_in">Dynarray</span>(Dynarray &amp;&amp;) <span class="hljs-keyword">noexcept</span>; <span class="hljs-comment">// Parameter type is Dynarray&lt;T&gt; &amp;&amp;</span>
  <span class="hljs-comment">// other members ...</span>
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="member-functions-of-a-class-template">Member functions of a class template</h2>
<p>If we want to define a member function outside the template class, a template declaration is also needed.</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-type">int</span> &amp;<span class="hljs-title">at</span><span class="hljs-params">(std::<span class="hljs-type">size_t</span> n)</span></span>;
};

" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--style:section::after {

;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="member-functions-of-a-class-template-1">Member functions of a class template</h2>
<p><strong>A member function will not be instantiated if it is not used!</strong></p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">X</span> {
  T x;
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">foo</span><span class="hljs-params">()</span> </span>{ x = <span class="hljs-number">42</span>; }
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">bar</span><span class="hljs-params">()</span> </span>{ x = <span class="hljs-string">&quot;hello&quot;</span>; }
};
</code></pre>
  </div>
  <div>
<pre><code class="language-cpp">X&lt;<span class="hljs-type">int</span>&gt; xi; <span class="hljs-comment">// OK</span>
xi.<span class="hljs-built_in">foo</span>();  <span class="hljs-comment">// OK</span>
X&lt;std::string&gt; xs; <span class="hljs-comment">// OK</span>
xs.<span class="hljs-built_in">bar</span>();          <span class="hljs-comment">// OK</span>
</code></pre>
  </div>
</div>
<p>No compile-error occurs: <code>X&lt;int&gt;::bar()</code> and <code>X&lt;std::string&gt;::foo()</code> are not instantiated because they are not called.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-style="section::after {

<h2 id="member-functions-of-a-class-template-2">Member functions of a class template</h2>
<p>A member function itself can also be a template:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt;

      : <span class="hljs-built_in">m_length</span>(std::<span class="hljs-built_in">distance</span>(begin, end)), <span class="hljs-built_in">m_storage</span>(<span class="hljs-keyword">new</span> T[m_length]) {
    std::<span class="hljs-built_in">copy</span>(begin, end, m_storage);

std::vector&lt;std::string&gt; vs = <span class="hljs-built_in">someValues</span>();
<span class="hljs-function">Dynarray&lt;std::string&gt; <span class="hljs-title">ds</span><span class="hljs-params">(vs.begin(), vs.end())</span></span>; <span class="hljs-comment">// Values are copied from vs.</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-style="section::after {

<h2 id="member-functions-of-a-class-template-3">Member functions of a class template</h2>
<p>A member function itself can also be a template. To define it outside the class, <strong>two</strong> template declarations are needed:</p>
<pre><code class="language-cpp"><span class="hljs-comment">// This cannot be written as `template &lt;typename T, typename Iterator&gt;`</span>
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt;
Dynarray&lt;T&gt;::<span class="hljs-built_in">Dynarray</span>(Iterator begin, Iterator end)
    : <span class="hljs-built_in">m_length</span>(std::<span class="hljs-built_in">distance</span>(begin, end)), <span class="hljs-built_in">m_storage</span>(<span class="hljs-keyword">new</span> T[m_length]) {
  std::<span class="hljs-built_in">copy</span>(begin, end, m_storage);
}
</code></pre>
</section>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-style="section::after {

<h2 id="alias-templates">Alias templates</h2>
<p>The <code>using</code> declaration can also declare <strong>alias templates</strong>:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-keyword">using</span> pii = std::pair&lt;T, T&gt;;
<span class="hljs-function">pii&lt;<span class="hljs-type">int</span>&gt; <span class="hljs-title">p1</span><span class="hljs-params">(<span class="hljs-number">2</span>, <span class="hljs-number">3</span>)</span></span>; <span class="hljs-comment">// std::pair&lt;int, int&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-style="section::after {

" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="variable-templates-since-c14">Variable templates (since C++14)</h2>
<p>Variables can also be templates. Typical example: the C++20 <code>&lt;numbers&gt;</code> library:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">namespace</span> std::numbers {
  <span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
  <span class="hljs-keyword">inline</span> <span class="hljs-keyword">constexpr</span> T pi_v = <span class="hljs-comment">/* unspecified */</span>;
}
<span class="hljs-keyword">auto</span> pi_d = std::numbers::pi_v&lt;<span class="hljs-type">double</span>&gt;; <span class="hljs-comment">// The `double` version of π</span>
<span class="hljs-keyword">auto</span> pi_f = std::numbers::pi_v&lt;<span class="hljs-type">float</span>&gt;;  <span class="hljs-comment">// The `float` version of π</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-style="section::after {

}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="non-type-template-parameters">Non-type template parameters</h2>
<p>Apart from types, a template parameter can also be an integer, an lvalue reference, a pointer, ...</p>
<p>Since C++20, floating-point types and <em>literal class types</em> with certain properties are also allowed.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T, std::<span class="hljs-type">size_t</span> N&gt;
<span class="hljs-keyword">class</span> <span class="hljs-title class_">array</span> {
  T data[N];
  <span class="hljs-comment">// ...</span>
};
array&lt;<span class="hljs-type">int</span>, 10&gt; a;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-style="section::after {

}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="non-type-template-parameters-1">Non-type template parameters</h2>
<p>Define a function that accepts an array of <strong>any length</strong>, <strong>any type</strong>:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T, std::<span class="hljs-type">size_t</span> N&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">print_array</span><span class="hljs-params">(T (&amp;a)[N])</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;x : a)
    std::cout &lt;&lt; x &lt;&lt; <span class="hljs-string">&#x27; &#x27;</span>;
  std::cout &lt;&lt; std::endl;
}
<span class="hljs-type">int</span> a[<span class="hljs-number">10</span>]; <span class="hljs-type">double</span> b[<span class="hljs-number">20</span>];
<span class="hljs-built_in">print_array</span>(a); <span class="hljs-comment">// T=int, N=10</span>
<span class="hljs-built_in">print_array</span>(b); <span class="hljs-comment">// T=double, N=20</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="summary">Summary</h2>
<p>Idea of templates: <strong>Generic programming</strong>.</p>
<ul>
<li>Write code that can deal with different types. e.g. Containers parameterized on element types.</li>
<li>The compiler generates (<em><strong>instantiates</strong></em>) the actual code in terms of the template code.</li>
</ul>
<p>Function template:</p>
<ul>
<li>Template argument deduction:
<ul>
<li>Pass-by-value: Reference and top-level <code>const</code>-qualification are ignored. Decay happens.</li>
<li>Pass-by-reference: Reference collapsing happens.</li>
<li>Same as the deduction rule of <code>auto</code>.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="summary-1">Summary</h2>
<p>Perfect forwarding:</p>
<ul>
<li>Forwarding reference: <code>auto &amp;&amp;</code>, or <code>T &amp;&amp;</code> where <code>T</code> is a template type parameter.
<ul>
<li>Deduced to lvalue-reference if the argument is an lvalue, and rvalue-reference if the argument is an rvalue.</li>
<li><code>const</code> qualifications are preserved.</li>
</ul>
</li>
<li><code>std::forward&lt;T&gt;(x)</code>: Casts <code>x</code> to <code>T &amp;&amp;</code>.</li>
</ul>
<p>Variadic template and pack expansion: Used to accept an unknown number of arguments of unknown types, and perform some operations on them.</p>
<ul>
<li>&quot;unknown&quot; is for the author of the templates. The compiler generates the required versions of them.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ztu0wohgv58o3dci4n1v7knyd5jkrbvccyi4dgq5aow;" data-marpit-pagination-total="46">
<h2 id="summary-2">Summary</h2>
<p>Class templates:</p>
<ul>
<li>The class is parameterized on some template parameter. Different template arguments yield different classes.</li>
<li>The member functions are instantiated only when they are called.</li>
</ul>
<p>Other things:</p>
<ul>
<li>Alias templates</li>
<li>Variable templates</li>
<li>Non-type template parameters</li>
</ul>
</section>
