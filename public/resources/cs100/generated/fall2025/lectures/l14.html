<h2 id="a-simple-class">A simple <code>class</code></h2>
<p>The initial idea: A <code>class</code> is a new kind of <code>struct</code> that can have member functions:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
  std::string name; 
  std::string id;
  <span class="hljs-type">int</span> entranceYear;
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">setName</span><span class="hljs-params">(<span class="hljs-type">const</span> std::string &amp;newName)</span> </span>{
    name = newName;
  }
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">printInfo</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{
    std::cout &lt;&lt; <span class="hljs-string">&quot;I am &quot;</span> &lt;&lt; name &lt;&lt; <span class="hljs-string">&quot;, id &quot;</span> &lt;&lt; id  
              &lt;&lt; <span class="hljs-string">&quot;, entrance year: &quot;</span> &lt;&lt; entranceYear &lt;&lt; std::endl;
  }
  <span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">graduated</span><span class="hljs-params">(<span class="hljs-type">int</span> year)</span> <span class="hljs-type">const</span> </span>{
    <span class="hljs-keyword">return</span> year - entranceYear &gt;= <span class="hljs-number">4</span>; 
  }
};
</code></pre>

<h2 id="member-access">Member access</h2>
<p>Member access: <code>a.mem</code>, where <code>a</code> is an <strong>object</strong> of the class type.</p>
<ul>
<li>Every member <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></g></g></svg></mjx-container> belongs to an object: each student has a name, id, entrance year, etc.
<ul>
<li>You need to specify <em>whose</em> name / id / ... you want to obtain.</li>
</ul>
</li>
</ul>
<p>To call a member function on an object: <code>a.memfun(args)</code>.</p>
<pre><code class="language-cpp">Student s = <span class="hljs-built_in">someValue</span>();
s.<span class="hljs-built_in">printInfo</span>(); <span class="hljs-comment">// call its printInfo() to print related info  </span>
<span class="hljs-keyword">if</span> (s.<span class="hljs-built_in">graduated</span>(<span class="hljs-number">2023</span>)) {
  <span class="hljs-comment">// ...</span>
}
</code></pre>
</section>

<h2 id="access-control">Access control</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
<span class="hljs-keyword">private</span>:
  std::string name; 
  std::string id;
  <span class="hljs-type">int</span> entranceYear;
<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">setName</span><span class="hljs-params">(<span class="hljs-type">const</span> std::string &amp;newName)</span> </span>{ name = newName; }
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">printInfo</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{
    std::cout &lt;&lt; <span class="hljs-string">&quot;I am &quot;</span> &lt;&lt; name &lt;&lt; <span class="hljs-string">&quot;, id &quot;</span> &lt;&lt; id  
              &lt;&lt; <span class="hljs-string">&quot;, entrance year: &quot;</span> &lt;&lt; entranceYear &lt;&lt; std::endl;
  }
  <span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">graduated</span><span class="hljs-params">(<span class="hljs-type">int</span> year)</span> <span class="hljs-type">const</span> </span>{ <span class="hljs-keyword">return</span> year - entranceYear &gt;= <span class="hljs-number">4</span>; }
};
</code></pre>
<ul>
<li><code>private</code> members: Only accessible to code inside the class and <code>friend</code>s.
<ul>
<li><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.054ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.242ex" role="img" focusable="false" viewBox="0 -525 1000 549"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D2" d="M580 514Q580 525 596 525Q601 525 604 525T609 525T613 524T615 523T617 520T619 517T622 512Q659 438 720 381T831 300T927 263Q944 258 944 250T935 239T898 228T840 204Q696 134 622 -12Q618 -21 615 -22T600 -24Q580 -24 580 -17Q580 -13 585 0Q620 69 671 123L681 133H70Q56 140 56 153Q56 168 72 173H725L735 181Q774 211 852 250Q851 251 834 259T789 283T735 319L725 327H72Q56 332 56 347Q56 360 70 367H681L671 377Q638 412 609 458T580 514Z"></path></g></g></g></svg></mjx-container> We will introduce <code>friend</code>s in later lectures.</li>
</ul>
</li>
<li><code>public</code> members: Accessible to all parts of the program.</li>
</ul>

<h2 id="access-control-1">Access control</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
<span class="hljs-keyword">private</span>:
  std::string name;
  std::string id; 
  <span class="hljs-type">int</span> entranceYear;

<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">setName</span><span class="hljs-params">(<span class="hljs-type">const</span> std::string &amp;newName)</span></span>;
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">printInfo</span><span class="hljs-params">()</span> <span class="hljs-type">const</span></span>;

<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
<span class="hljs-comment">// private:</span>
  std::string name;
  std::string id; 
  <span class="hljs-type">int</span> entranceYear;
<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">setName</span><span class="hljs-params">(<span class="hljs-type">const</span> std::string &amp;newName)</span></span>;
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">printInfo</span><span class="hljs-params">()</span> <span class="hljs-type">const</span></span>;
  <span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">graduated</span><span class="hljs-params">(<span class="hljs-type">int</span> year)</span> <span class="hljs-type">const</span></span>;  
};
</code></pre>
<p>What if there is a group of members with no access specifier at the beginning?</p>
<ul>
<li>If it's <code>class</code>, they are <code>private</code>.</li>
<li>If it's <code>struct</code>, they are <code>public</code>.</li>
</ul>
<p>This is one of the <strong>only two differences</strong> between <code>struct</code> and <code>class</code> in C++.</p>
</section>

    <span class="hljs-params">(Student *<span class="hljs-keyword">this</span>, <span class="hljs-type">const</span> std::string &amp;n)</span> </span>{

}

Student s = <span class="hljs-built_in">someValue</span>();
<span class="hljs-keyword">if</span> (<span class="hljs-built_in">graduated</span>(&amp;s, <span class="hljs-number">2023</span>))

<h2 id="the-this-pointer-3">The <code>this</code> pointer</h2>
<p>There is a pointer called <code>this</code> in each member function of class <code>X</code> which has type <code>X *</code> or <code>const X *</code>, pointing to the object on which the member function is called.</p>
<p>Inside a member function, access of any member <code>mem</code> is actually <code>this-&gt;mem</code>.</p>
<p>We can also write <code>this-&gt;mem</code> explicitly.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">graduated</span><span class="hljs-params">(<span class="hljs-type">int</span> year)</span> <span class="hljs-type">const</span> </span>{
    <span class="hljs-keyword">return</span> year - <span class="hljs-keyword">this</span>-&gt;entranceYear &gt;= <span class="hljs-number">4</span>;
  }
};
</code></pre>
<p>Many languages have similar constructs, e.g. <code>self</code> in Python. <a href="https://en.cppreference.com/w/cpp/language/member_functions#Explicit_object_parameter">(C++23 has <code>self</code> too!)</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--style:section::after {

<h2 id="const-member-functions"><code>const</code> member functions</h2>
<p>The <code>const</code> keyword after the parameter list and before the function body <code>{</code> is used to declare a <strong><code>const</code> member function</strong>.</p>
<ul>
<li>A <code>const</code> member function cannot modify its data members <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></g></g></svg></mjx-container>.</li>
<li>A <code>const</code> member function <strong>guarantees</strong> that no data member will be modified.
<ul>
<li>A non-<code>const</code> member function does not provide such guarantee.</li>
<li>In a <code>const</code> member function, calling a non-<code>const</code> member function on <code>*this</code> is not allowed.</li>
</ul>
</li>
<li>For a <code>const</code> object, <strong>only <code>const</code> member functions can be called on it</strong>.</li>
</ul>
<p><strong>[Best practice]</strong> <u>If, logically, a member function should not modify the object's state, it should be made a <code>const</code> member function.</u> Otherwise, it cannot be called on <code>const</code> objects.</p>
</section>

<h2 id="const-member-functions-and-the-this-pointer"><code>const</code> member functions and the <code>this</code> pointer</h2>
<p>This <code>const</code> is essentially applied to the <code>this</code> pointer:</p>
<ul>
<li>In <code>const</code> member functions of class <code>X</code>, <code>this</code> has type <code>const X *</code>.</li>
<li>In non-<code>const</code> member functions of class <code>X</code>, <code>this</code> has type <code>X *</code>.</li>
</ul>
<p>If <code>ptr</code> is of type <code>const T *</code>, the expression <code>ptr-&gt;mem</code> is also <code>const</code>-qualified.</p>
<ul>
<li>Recall that in a member function, access of a member <code>mem</code> is actually <code>this-&gt;mem</code>.</li>
<li>Therefore, <code>mem</code> is also <code>const</code>-qualified in a <code>const</code> member function.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">foo</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{
    name += <span class="hljs-string">&#x27;a&#x27;</span>; <span class="hljs-comment">// Error: `name` is `const std::string` in a const member</span>
                 <span class="hljs-comment">// function. It cannot be modified.</span>
  }
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-style="section::after {

                   <span class="hljs-comment">// is equal to `entranceYear`.</span>
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">adjustID</span><span class="hljs-params">()</span></span>; <span class="hljs-comment">// adjust `id` according to `entranceYear`.</span>

<p><em>Effective C++</em> Item 3: <strong>Use <code>const</code> whenever possible.</strong></p>
<p>Decide whether the following member functions need a <code>const</code> qualification:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
  std::string name, id;

  <span class="hljs-function"><span class="hljs-type">const</span> std::string &amp;<span class="hljs-title">getID</span><span class="hljs-params">()</span> <span class="hljs-type">const</span></span>;   <span class="hljs-comment">// returns the id of the student.</span>
  <span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">valid</span><span class="hljs-params">()</span> <span class="hljs-type">const</span></span>;    <span class="hljs-comment">// verifies whether the leading four digits in `id`</span>
                         <span class="hljs-comment">// is equal to `entranceYear`.</span>

<p>The <code>const</code>ness of member functions should be determined <strong>logically</strong>.</p>

<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
  std::string name, id;
  <span class="hljs-type">int</span> entranceYear;
<span class="hljs-keyword">public</span>:

  <span class="hljs-function"><span class="hljs-type">const</span> std::string &amp;<span class="hljs-title">getID</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{ <span class="hljs-keyword">return</span> id; }
  <span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">valid</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{ <span class="hljs-keyword">return</span> id.<span class="hljs-built_in">substr</span>(<span class="hljs-number">0</span>, <span class="hljs-number">4</span>) == std::<span class="hljs-built_in">to_string</span>(entranceYear); }
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">adjustID</span><span class="hljs-params">()</span> </span>{ id = std::<span class="hljs-built_in">to_string</span>(entranceYear) + id.<span class="hljs-built_in">substr</span>(<span class="hljs-number">4</span>); }

<p><code>str.substr(pos, len)</code> returns the substring of <code>str</code> starting from the position indexed <code>pos</code> with length <code>len</code>.</p>

<li>If <code>len</code> is not provided, it returns the <strong>suffix</strong> starting from the position indexed <code>pos</code>.</li>

<h2 id="constructors-1">Constructors</h2>
<p><strong>Constructors</strong> define how an object can be initialized.</p>
<ul>
<li>Constructors are often <strong>overloaded</strong>, because an object may have multiple reasonable ways of initialization.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
  std::string name;
  std::string id;
  <span class="hljs-type">int</span> entranceYear;
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Student</span>(<span class="hljs-type">const</span> std::string &amp;name_, <span class="hljs-type">const</span> std::string &amp;id_, <span class="hljs-type">int</span> ey)

  <span class="hljs-built_in">Student</span>(<span class="hljs-type">const</span> std::string &amp;name_, <span class="hljs-type">const</span> std::string &amp;id_)
    : <span class="hljs-built_in">name</span>(name_), <span class="hljs-built_in">id</span>(id_), <span class="hljs-built_in">entranceYear</span>(std::<span class="hljs-built_in">stoi</span>(id_.<span class="hljs-built_in">substr</span>(<span class="hljs-number">0</span>, <span class="hljs-number">4</span>))) {}   
};

<span class="hljs-function">Student <span class="hljs-title">a</span><span class="hljs-params">(<span class="hljs-string">&quot;Alice&quot;</span>, <span class="hljs-string">&quot;2020123123&quot;</span>, <span class="hljs-number">2020</span>)</span></span>;

<h2 id="constructors-2">Constructors</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
  std::string name;
  std::string id;
  <span class="hljs-type">int</span> entranceYear;

<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Student</span>(<span class="hljs-type">const</span> std::string &amp;name_, <span class="hljs-type">const</span> std::string &amp;id_) 
    : <span class="hljs-built_in">name</span>(name_), <span class="hljs-built_in">id</span>(id_), <span class="hljs-built_in">entranceYear</span>(std::<span class="hljs-built_in">stoi</span>(id_.<span class="hljs-built_in">substr</span>(<span class="hljs-number">0</span>, <span class="hljs-number">4</span>))) {}
};
</code></pre>
<ul>
<li>The constructor name is the class name: <code>Student</code>.</li>
<li>Constructors do not have a return type (not even <code>void</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.885ex" role="img" focusable="false" viewBox="0 -833.2 436.6 833.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></g></g></g></svg></mjx-container>). The constructor body can contain a <code>return;</code> statement, which should not return a value.</li>
<li>The function body of this constructor is empty: <code>{}</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--style:section::after {

;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="constructor-initializer-list">Constructor initializer list</h2>
<p>Constructors initialize <strong>all data members</strong> of the object.</p>
<p>The initialization of <strong>all data members</strong> is done <strong>before entering the function body</strong>.</p>
<p>How they are initialized is (partly) determined by the <strong>constructor initializer list</strong>:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
  <span class="hljs-comment">// ...</span>
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Student</span>(<span class="hljs-type">const</span> std::string &amp;name_, <span class="hljs-type">const</span> std::string &amp;id_) 
    : <span class="hljs-built_in">name</span>(name_), <span class="hljs-built_in">id</span>(id_), <span class="hljs-built_in">entranceYear</span>(std::<span class="hljs-built_in">stoi</span>(id_.<span class="hljs-built_in">substr</span>(<span class="hljs-number">0</span>, <span class="hljs-number">4</span>))) {} 
};
</code></pre>
<p>The initializer list starts with <code>:</code>, and contains initializers for each data member, separated by <code>,</code>. The initializers must be of the form <code>(...)</code> or <code>{...}</code>, not <code>= ...</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--style:section::after {

}
;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="order-of-initialization">Order of initialization</h2>
<p>Data members are initialized in order <strong>in which they are declared</strong>, not the order in the initializer list.</p>
<ul>
<li>If the initializers appear in an order different from the declaration order, the compiler will generate a warning.</li>
</ul>
<p>Typical mistake: <code>entranceYear</code> is initialized in terms of <code>id</code>, but <code>id</code> is not initialized yet!</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
  std::string name;
  <span class="hljs-type">int</span> entranceYear; <span class="hljs-comment">// !!!</span>
  std::string id;

<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Student</span>(<span class="hljs-type">const</span> std::string &amp;name_, <span class="hljs-type">const</span> std::string &amp;id_)
    : <span class="hljs-built_in">name</span>(name_), <span class="hljs-built_in">id</span>(id_), <span class="hljs-built_in">entranceYear</span>(std::<span class="hljs-built_in">stoi</span>(id.<span class="hljs-built_in">substr</span>(<span class="hljs-number">0</span>, <span class="hljs-number">4</span>))) {}
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--style:section::after {

<h2 id="constructor-initializer-list-1">Constructor initializer list</h2>
<p>Data members are initialized in order <strong>in which they are declared</strong>, not the order in the initializer list.</p>
<ul>
<li>If the initializers appear in an order different from the declaration order, the compiler will generate a warning.</li>
<li>For a data member that do not appear in the initializer list:
<ul>
<li>If there is an <strong>in-class initializer</strong> (see next page), it is initialized using the in-class initializer.</li>
<li>Otherwise, it is <strong>default-initialized</strong>.</li>
</ul>
</li>
</ul>
<p>What does <strong>default-initialization</strong> mean for class types? <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.054ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.242ex" role="img" focusable="false" viewBox="0 -525 1000 549"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D2" d="M580 514Q580 525 596 525Q601 525 604 525T609 525T613 524T615 523T617 520T619 517T622 512Q659 438 720 381T831 300T927 263Q944 258 944 250T935 239T898 228T840 204Q696 134 622 -12Q618 -21 615 -22T600 -24Q580 -24 580 -17Q580 -13 585 0Q620 69 671 123L681 133H70Q56 140 56 153Q56 168 72 173H725L735 181Q774 211 852 250Q851 251 834 259T789 283T735 319L725 327H72Q56 332 56 347Q56 360 70 367H681L671 377Q638 412 609 458T580 514Z"></path></g></g></g></svg></mjx-container> To be discussed later.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--style:section::after {

}
;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="in-class-initializers">In-class initializers</h2>
<p>A member can have an in-class initializer. It must be in the form <code>{...}</code> or <code>= ...</code>.<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.904ex" role="img" focusable="false" viewBox="0 -841.7 436.6 841.7"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path></g></g></g></g></g></g></svg></mjx-container></p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
  std::string name = <span class="hljs-string">&quot;Alice&quot;</span>;
  std::string id;
  <span class="hljs-type">int</span> entranceYear{<span class="hljs-number">2024</span>}; <span class="hljs-comment">// equivalent to `int entranceYear = 2024;`.</span>
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Student</span>() {} <span class="hljs-comment">// `name` is initialized to `&quot;Alice&quot;`,</span>
               <span class="hljs-comment">// `id` is initialized to an empty string,</span>
               <span class="hljs-comment">// and `entranceYear` is initialized to 2024.</span>
  <span class="hljs-built_in">Student</span>(<span class="hljs-type">int</span> ey) : <span class="hljs-built_in">entranceYear</span>(ey) {} <span class="hljs-comment">// `name` is initialized to `&quot;Alice&quot;`,</span>
                                    <span class="hljs-comment">// `id` is initialized to an empty string,</span>
                                    <span class="hljs-comment">// and `entranceYear` is initialized to `ey`.</span>
};
</code></pre>
<p>The in-class initializer provides the &quot;default&quot; way of initializing a member in this class, as a substitute for default-initialization.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--style:section::after {

<h2 id="constructor-initializer-list-2">Constructor initializer list</h2>
<p>Below is a typical way of writing this constructor without an initializer list:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
  <span class="hljs-comment">// ...</span>
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Student</span>(<span class="hljs-type">const</span> std::string &amp;name_, <span class="hljs-type">const</span> std::string &amp;id_) {
    name = name_;
    id = id_;
    entranceYear = std::<span class="hljs-built_in">stoi</span>(id_.<span class="hljs-built_in">substr</span>(<span class="hljs-number">0</span>, <span class="hljs-number">4</span>));
  }
}; 
</code></pre>
<p>How are these members actually initialized in this constructor?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--style:section::after {

;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="constructor-initializer-list-3">Constructor initializer list</h2>
<p>Below is a typical way of writing this constructor without an initializer list:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
  <span class="hljs-comment">// ...</span>
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Student</span>(<span class="hljs-type">const</span> std::string &amp;name_, <span class="hljs-type">const</span> std::string &amp;id_) {
    name = name_;
    id = id_;
    entranceYear = std::<span class="hljs-built_in">stoi</span>(id_.<span class="hljs-built_in">substr</span>(<span class="hljs-number">0</span>, <span class="hljs-number">4</span>));
  }
}; 
</code></pre>
<p>How are these members actually initialized in this constructor?</p>
<ul>
<li>First, before entering the function body, <code>name</code>, <code>id</code> and <code>entranceYear</code> are default-initialized. <code>name</code> and <code>id</code> are initialized to empty strings.</li>
<li>Then, the assignments in the function body take place.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--style:section::after {

;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="constructor-initializer-list-4">Constructor initializer list</h2>
<p><strong>[Best practice]</strong> <u>Always use an initializer list in a constructor.</u></p>
<ul>
<li>Not all types can be default-initialized. Not all types can be assigned to. (Any counterexamples?)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-style="section::after {

}
" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--style:section::after {

}
;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="constructor-initializer-list-5">Constructor initializer list</h2>
<p><strong>[Best practice]</strong> <u>Always use an initializer list in a constructor.</u></p>
<p>Not all types can be default-initialized. Not all types can be assigned to.</p>
<ul>
<li>References <code>T &amp;</code> cannot be default-initialized, and cannot be assigned to.</li>
<li><code>const</code> objects of built-in types cannot be default-initialized.</li>
<li><code>const</code> objects cannot be assigned to.</li>
<li>A class can choose to allow or disallow default initialization or assignment. It depends on the design. <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.054ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.242ex" role="img" focusable="false" viewBox="0 -525 1000 549"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D2" d="M580 514Q580 525 596 525Q601 525 604 525T609 525T613 524T615 523T617 520T619 517T622 512Q659 438 720 381T831 300T927 263Q944 258 944 250T935 239T898 228T840 204Q696 134 622 -12Q618 -21 615 -22T600 -24Q580 -24 580 -17Q580 -13 585 0Q620 69 671 123L681 133H70Q56 140 56 153Q56 168 72 173H725L735 181Q774 211 852 250Q851 251 834 259T789 283T735 319L725 327H72Q56 332 56 347Q56 360 70 367H681L671 377Q638 412 609 458T580 514Z"></path></g></g></g></svg></mjx-container> See next page.</li>
</ul>
<p>Moreover, if a data member is default-initialized and then assigned when could have been initialized directly, it may lead to low efficiency.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-style="section::after {

<h2 id="default-constructors">Default constructors</h2>
<p>A special constructor that takes no parameters.</p>
<ul>
<li>Guess what it's for?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--style:section::after {

<h2 id="default-constructors-1">Default Constructors</h2>
<p>A special constructor that takes no parameters.</p>
<ul>
<li>It defines the behavior of <strong>default-initialization</strong> of objects of that class type, since no arguments need to be passed when calling it.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Point2d</span> {
  <span class="hljs-type">double</span> x, y;
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Point2d</span>() : <span class="hljs-built_in">x</span>(<span class="hljs-number">0</span>), <span class="hljs-built_in">y</span>(<span class="hljs-number">0</span>) {} <span class="hljs-comment">// default constructor</span>
  <span class="hljs-built_in">Point2d</span>(<span class="hljs-type">double</span> x_, <span class="hljs-type">double</span> y_) : <span class="hljs-built_in">x</span>(x_), <span class="hljs-built_in">y</span>(y_) {}  
};

Point2d p1;       <span class="hljs-comment">// calls default ctor, (0, 0) </span>
<span class="hljs-function">Point2d <span class="hljs-title">p2</span><span class="hljs-params">(<span class="hljs-number">3</span>, <span class="hljs-number">4</span>)</span></span>; <span class="hljs-comment">// calls Point2d(double, double), (3, 4)</span>
<span class="hljs-function">Point2d <span class="hljs-title">p3</span><span class="hljs-params">()</span></span>;     <span class="hljs-comment">// Is this calling the default ctor?</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--style:section::after {

;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="default-constructors-2">Default constructors</h2>
<p>A special constructor that takes no parameters.</p>
<ul>
<li>It defines the behavior of <strong>default-initialization</strong> of objects of that class type, since no arguments need to be passed when calling it.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Point2d</span> {
  <span class="hljs-type">double</span> x, y;
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Point2d</span>() : <span class="hljs-built_in">x</span>(<span class="hljs-number">0</span>), <span class="hljs-built_in">y</span>(<span class="hljs-number">0</span>) {} <span class="hljs-comment">// default constructor</span>
  <span class="hljs-built_in">Point2d</span>(<span class="hljs-type">double</span> x_, <span class="hljs-type">double</span> y_) : <span class="hljs-built_in">x</span>(x_), <span class="hljs-built_in">y</span>(y_) {}  
};

Point2d p1;       <span class="hljs-comment">// calls default ctor, (0, 0) </span>
<span class="hljs-function">Point2d <span class="hljs-title">p2</span><span class="hljs-params">(<span class="hljs-number">3</span>, <span class="hljs-number">4</span>)</span></span>; <span class="hljs-comment">// calls Point2d(double, double), (3, 4)</span>
<span class="hljs-function">Point2d <span class="hljs-title">p3</span><span class="hljs-params">()</span></span>;     <span class="hljs-comment">// Is this calling the default ctor?</span>
</code></pre>
<p>Be careful! <code>p3</code> is a <strong>function</strong> that takes no parameters and returns <code>Point2d</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--style:section::after {

}
;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="is-a-default-constructor-needed">Is a default constructor needed?</h2>
<p>First, if you need to use arrays, you almost certainly need a default constructor:</p>
<pre><code class="language-cpp">Student s[<span class="hljs-number">1000</span>]; <span class="hljs-comment">// All elements are default-initialized</span>
                 <span class="hljs-comment">// by the default constructor.</span>
Student s2[<span class="hljs-number">1000</span>] = {a, b}; <span class="hljs-comment">// The first two elements are initialized to</span>
                           <span class="hljs-comment">// `a` and `b`. The rest are initialized by the</span>
                           <span class="hljs-comment">// default constructor.</span>
</code></pre>
<p>A <code>std::vector</code> does not require that:</p>
<pre><code class="language-cpp"><span class="hljs-comment">// In this code, the default constructor of `Student` is not called.</span>
std::vector&lt;Student&gt; students;
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> i = <span class="hljs-number">0</span>; i != n; ++i)
  students.<span class="hljs-built_in">push_back</span>(<span class="hljs-built_in">some_student</span>());
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--style:section::after {

}
;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="is-a-default-constructor-needed-1">Is a default constructor needed?</h2>
<p>If a class has no user-declared constructors, the compiler will try to synthesize a default constructor.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">X</span> {}; <span class="hljs-comment">// No user-declared constructors.</span>
X x; <span class="hljs-comment">// OK: calls the compiler-synthesized default constructor</span>
</code></pre>
<p>The synthesized default constructor initializes the data members as follows:</p>
<ul>
<li>If a data member has an in-class initializer, it is initialized according to the in-class initializer.</li>
<li>Otherwise, default-initialize that member. If it cannot be default-initialized, the compiler will give up -- no default constructor is generated.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="is-a-default-constructor-needed-2">Is a default constructor needed?</h2>
<p>If a class has any user-declared constructors but no default constructor, the compiler <strong>will not</strong> synthesize a default constructor.</p>
<p>You may ask for a default constructor with <code>= default;</code>:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Student</span>(<span class="hljs-type">const</span> std::string &amp;name_, <span class="hljs-type">const</span> std::string &amp;id_, <span class="hljs-type">int</span> ey)  
    : <span class="hljs-built_in">name</span>(name_), <span class="hljs-built_in">id</span>(id_), <span class="hljs-built_in">entranceYear</span>(ey) {}
  
  <span class="hljs-built_in">Student</span>(<span class="hljs-type">const</span> std::string &amp;name_, <span class="hljs-type">const</span> std::string &amp;id_)
    : <span class="hljs-built_in">name</span>(name_), <span class="hljs-built_in">id</span>(id_), <span class="hljs-built_in">entranceYear</span>(std::<span class="hljs-built_in">stoi</span>(id_.<span class="hljs-built_in">substr</span>(<span class="hljs-number">0</span>, <span class="hljs-number">4</span>))) {}
    
  <span class="hljs-built_in">Student</span>() = <span class="hljs-keyword">default</span>;
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--style:section::after {

;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="is-a-default-constructor-needed-3">Is a default constructor needed?</h2>
<p>It depends on the <strong>design</strong>:</p>
<ul>
<li>If the class has a default constructor, what should be the behavior of it? Is there a reasonable &quot;default state&quot; for your class type?</li>
</ul>
<p>For <code>Student</code>: What is a &quot;default student&quot;?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--style:section::after {

}
;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="is-a-default-constructor-needed-4">Is a default constructor needed?</h2>
<p>It depends on the <strong>design</strong>:</p>
<ul>
<li>If the class has a default constructor, what should be the behavior of it? Is there a reasonable &quot;default state&quot; for your class type?</li>
</ul>
<p>For <code>Student</code>: What is a &quot;default student&quot;?</p>
<ul>
<li>There seems to be no such thing as a &quot;default student&quot; (in a normal design). Therefore, <code>Student</code> should not have a default constructor.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="is-a-default-constructor-needed-5">Is a default constructor needed?</h2>
<p><strong>[Best practice]</strong> <u><strong>When in doubt, leave it out.</strong> If the class does not have a &quot;default state&quot;, it should not have a default constructor!</u></p>
<ul>
<li>Do not define one arbitrarily or letting it <code>= default</code>. This leads to pitfalls.</li>
<li>Calling the default constructor of something that has no &quot;default state&quot; should result in a <strong>compile error</strong>, instead of being allowed arbitrarily.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-style="section::after {

" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--style:section::after {

;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="summary">Summary</h2>
<p>Members of a class</p>
<ul>
<li>A class can have data members and member functions.</li>
<li>Access control: <code>private</code>, <code>public</code>.
<ul>
<li>One difference between <code>class</code> and <code>struct</code>: Default access.</li>
</ul>
</li>
<li>The <code>this</code> pointer: has type <code>X *</code> (<code>const X *</code> in <code>const</code> member functions). It points to the object on which the member function is called.</li>
<li><code>const</code> member function: guarantees that no modification will happen.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="summary-1">Summary</h2>
<p>The followings hold for <strong>all constructors</strong>, no matter how they are defined:</p>
<ul>
<li>A constructor initializes <strong>all</strong> data members in order in which they are declared.</li>
<li>The initialization of <strong>all</strong> data members is done before the function body of a constructor is executed.</li>
</ul>
<p>In a constructor, a member is initialized as follows:</p>
<ul>
<li>If there is an initializer for it in the initializer list, use it.</li>
<li>Otherwise, if it has an in-class initializer, use it.</li>
<li>Otherwise, it is default-initialized. If it cannot be default-initialized, it leads to a compile-error.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:mz2i14slr1fntzn9tg92rewym41jx8nye6lyhdbhm;" data-marpit-pagination-total="41">
<h2 id="summary-2">Summary</h2>
<p>Default constructors</p>
<ul>
<li>The default constructor defines the behavior of default-initialization.</li>
<li>The default constructor is the constructor with an empty parameter list.</li>
<li>If we have not defined <strong>any constructor</strong>, the compiler will try to synthesize a <strong>default constructor</strong> as if it were defined as <code>ClassName() {}</code>.
<ul>
<li>The compiler may fail to do that if some member has no in-class initializer and is not default-initializable. In that case, the compiler gives up (without giving an error).</li>
</ul>
</li>
<li>We can use <code>= default</code> to ask for a synthesized default constructor explicitly.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-style="section::after {

<h2 id="notes">Notes</h2>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></g></g></svg></mjx-container> Every <em>non-<code>static</code></em> member belongs to an object. All data members mentioned in the slides of this lecture are non-<code>static</code>.</p>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></g></g></svg></mjx-container> A <code>const</code> member function cannot modify its data members, unless that member is marked <code>mutable</code>.</p>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.885ex" role="img" focusable="false" viewBox="0 -833.2 436.6 833.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></g></g></g></svg></mjx-container> A constructor does not have a return type according to the standard. But it behaves as if its return type is <code>void</code>. Some compilers (such as Clang) may also treat it as if it returns <code>void</code>.</p>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.904ex" role="img" focusable="false" viewBox="0 -841.7 436.6 841.7"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path></g></g></g></g></g></g></svg></mjx-container> In-class initializers cannot be provided in the form <code>(...)</code>. The parentheses here will be treated as part of a function declaration.</p>
