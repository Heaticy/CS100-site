<h2 id="an-only-once-function-1">An &quot;only-once&quot; function</h2>
<p>Suppose we want to design a function that should be called only once.</p>
<ul>
<li>When it is called for the second time, report an error.</li>
</ul>
<pre><code class="language-c"><span class="hljs-type">bool</span> start_game_called = <span class="hljs-literal">false</span>;

<span class="hljs-type">void</span> <span class="hljs-title function_">start_game</span><span class="hljs-params">(Player *p1, Player *p2, <span class="hljs-type">int</span> difficulty, GameWorld *world)</span> {
  <span class="hljs-keyword">if</span> (start_game_called)
    report_an_error(<span class="hljs-string">&quot;You cannot start the game twice!&quot;</span>);
  start_game_called = <span class="hljs-literal">true</span>;
  <span class="hljs-comment">// ...</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="an-only-once-function-2">An &quot;only-once&quot; function</h2>
<p>What if there are many such functions?</p>
<pre><code class="language-c"><span class="hljs-type">bool</span> start_game_called = <span class="hljs-literal">false</span>;
<span class="hljs-type">bool</span> end_game_called = <span class="hljs-literal">false</span>;
<span class="hljs-type">bool</span> magic_power_used = <span class="hljs-literal">false</span>;
<span class="hljs-type">bool</span> special_skill_used = <span class="hljs-literal">false</span>;
<span class="hljs-comment">// ...</span>
</code></pre>
<p>The global name space is <strong>polluted</strong> with these variables.</p>
<ul>
<li>Is there a way to declare these variables inside the corresponding functions?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--style:section::after {

}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="an-only-once-function-3">An &quot;only-once&quot; function</h2>
<p>This does not work. Why?</p>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">start_game</span><span class="hljs-params">(Player *p1, Player *p2, <span class="hljs-type">int</span> difficulty, GameWorld *world)</span> {
  <span class="hljs-type">bool</span> called = <span class="hljs-literal">false</span>; <span class="hljs-comment">// Note that we can use a shorter name,</span>
                       <span class="hljs-comment">// because it is local to this function.</span>
  <span class="hljs-keyword">if</span> (called)
    report_an_error(<span class="hljs-string">&quot;You cannot start the game twice!&quot;</span>);
  called = <span class="hljs-literal">true</span>;
  <span class="hljs-comment">// ...</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-style="section::after {

" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--style:section::after {

}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="an-only-once-function-4">An &quot;only-once&quot; function</h2>
<p>This does not work. Why?</p>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">start_game</span><span class="hljs-params">(Player *p1, Player *p2, <span class="hljs-type">int</span> difficulty, GameWorld *world)</span> {
  <span class="hljs-type">bool</span> called = <span class="hljs-literal">false</span>; <span class="hljs-comment">// Note that we can use a shorter name,</span>
                  <span class="hljs-comment">// because it is local to this function.</span>
  <span class="hljs-keyword">if</span> (called)
    report_an_error(<span class="hljs-string">&quot;You cannot start the game twice!&quot;</span>);
  called = <span class="hljs-literal">true</span>;
  <span class="hljs-comment">// ...</span>
}
</code></pre>
<ul>
<li>Every time <code>start_game</code> is called, <code>called</code> is created and initialized to zero.</li>
<li>Every time <code>start_game</code> returns, <code>called</code> is destroyed.</li>
<li>We need a &quot;local&quot; variable whose lifetime is longer!</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--style:section::after {

}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="local-static-variables">Local <code>static</code> variables</h2>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">start_game</span><span class="hljs-params">(Player *p1, Player *p2, <span class="hljs-type">int</span> difficulty, GameWorld *world)</span> {
  <span class="hljs-type">static</span> <span class="hljs-type">bool</span> called = <span class="hljs-literal">false</span>;
  <span class="hljs-keyword">if</span> (called)
    report_an_error(<span class="hljs-string">&quot;You cannot start the game twice!&quot;</span>);
  called = <span class="hljs-literal">true</span>;
  <span class="hljs-comment">// ...</span>
}
</code></pre>
<p>The lifetime of a local <code>static</code> variable is <strong>as long as</strong> that of a global variable. <em>(They both have <a href="https://en.cppreference.com/w/c/language/storage_duration#Storage_duration">static storage duration</a>.)</em></p>
<ul>
<li>A local <code>static</code> variable is initialized <strong>during program startup</strong>, and is destroyed <strong>on program termination</strong>.</li>
</ul>
<p>It behaves just like a global variable, but its name is inside a function, which does not pollute the global name space.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-style="section::after {

<h2 id="initialization">Initialization</h2>
<p>If we declare a variable without explicit initialization, what is the value of it?</p>
<p>Experiment:</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> global;

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> local;
  <span class="hljs-type">static</span> <span class="hljs-type">int</span> local_static;
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d, %d, %d\n&quot;</span>, global, local,
         local_static);
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
  </div>
  <div>
<ul>
<li>
<p>Compiled without <code>-O2</code> (a kind of optimization):</p>
<pre><code>0, 22031, 0
</code></pre>
</li>
<li>
<p>Compiled with <code>-O2</code>:</p>
<pre><code>0, 0, 0
</code></pre>
</div>
</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-style="section::after {

" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--style:section::after {

}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="implicit-initialization-very-important">Implicit initialization [Very important]</h2>
<p>If a variable is declared without explicit initialization:</p>
<ul>
<li>
<p>For local non-<code>static</code> variables, they are initialized to <strong>indeterminate values</strong>. In other words, they are <strong>uninitialized</strong>.</p>
</li>
<li>
<p>For global or local <code>static</code> variables, they are <a href="https://en.cppreference.com/w/c/language/initialization#Empty_initialization"><strong>empty-initialized</strong></a> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></g></g></svg></mjx-container>:</p>
<ul>
<li>Pointers are initialized to <em>null pointer values</em> of their types. (later in this lecture)</li>
<li>Objects of integral types are initialized to <code>0</code>.</li>
<li>Objects of floating types are initialized to positive zero (<code>0.0</code>).</li>
<li>Other cases will be discussed in later lectures.</li>
</ul>
<p>* Intuitively, such variables are initialized to some kind of &quot;zero&quot; <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></g></g></svg></mjx-container>. This is called <a href="https://en.cppreference.com/w/cpp/language/zero_initialization">zero-initialization</a> in C++.</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-style="section::after {

" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--style:section::after {

<h2 id="uninitialized-garbage-can-be-deadly">Uninitialized garbage can be deadly!</h2>
<p><strong>The behavior is undefined</strong> if the value of an object is used while it is indeterminate.</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<p><a href="https://en.cppreference.com/w/c/language/behavior#Uninitialized_scalar">Example: Schrödinger's <code>bool</code></a></p>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">bool</span> p;
  <span class="hljs-keyword">if</span> (p)
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;p is true.\n&quot;</span>);
  <span class="hljs-keyword">if</span> (!p)
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;p is false.\n&quot;</span>);
}
</code></pre>
  </div>
  <div>
<ul>
<li>
<p>Possible output (observed with an older version of gcc):</p>
<pre><code>p is true.
p is false.
</code></pre>
</li>
<li>
<p><code>p</code> is in a &quot;superposition state&quot; of true and false?</p>
</div>
</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="uninitialized-garbage-can-be-deadly-1">Uninitialized garbage can be deadly!</h2>
<p>Example: For a local variable declared with <code>int n;</code> (uninitialized), <code>n</code> may not compare equal to itself and it may appear to change its value on subsequent reads.</p>
<pre><code class="language-c"><span class="hljs-comment">// in some function</span>
<span class="hljs-type">int</span> n; <span class="hljs-comment">// uninitialized</span>
<span class="hljs-comment">// n == n is not necessarily true and involves undefined behavior.</span>
<span class="hljs-type">int</span> m = n;
<span class="hljs-comment">// m == n is not necessarily true and involves undefined behavior.</span>
</code></pre>
<p>Uninitialized variables may also have <em>trap representations</em>, which <a href="https://devblogs.microsoft.com/oldnewthing/20040119-00/?p=41003">on some architectures can cause serious problems</a>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="uninitialized-garbage-can-be-deadly-2">Uninitialized garbage can be deadly!</h2>
<p><strong>[Best practice]</strong> <u>Always initialize the variable.</u></p>
<p>Except in certain cases, e.g.</p>
<pre><code class="language-c"><span class="hljs-comment">// in some function</span>
<span class="hljs-type">int</span> n;           <span class="hljs-comment">// uninitialized</span>
<span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d&quot;</span>, &amp;n); <span class="hljs-comment">// A value is assigned to `n` immediately. This is OK.</span>
<span class="hljs-comment">// Now the value of `n` is not indeterminate. It can be used normally.</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="const-type-qualifier"><code>const</code> type qualifier</h2>
<p>Each type <code>T</code> (not <code>const</code>-qualified) has a <code>const</code>-qualified version of that type, written as <code>T const</code> or <code>const T</code>.</p>
<p>Any direct modification of variables with <code>const</code>-qualified types is not allowed:</p>
<pre><code class="language-c"><span class="hljs-type">const</span> <span class="hljs-type">int</span> n = <span class="hljs-number">100</span>; <span class="hljs-comment">// Type of `n` is `const int`.</span>
++n; <span class="hljs-comment">// Error.</span>
</code></pre>
<p>(Any indirect modification of <code>const</code> variables is undefined behavior; see in later lectures.)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="const-type-qualifier-1"><code>const</code> type qualifier</h2>
<p>A <code>const</code> variable cannot be modified after initialization.</p>
<p>Therefore, an uninitialized <code>const</code> local non-<code>static</code> variable is almost a non-stop ticket to undefined behavior.</p>
<pre><code class="language-c"><span class="hljs-comment">// in some function</span>
<span class="hljs-type">const</span> <span class="hljs-type">int</span> n; <span class="hljs-comment">// `n` has indeterminate values</span>
n = <span class="hljs-number">42</span>; <span class="hljs-comment">// Error: cannot modify a const variable.</span>
<span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d&quot;</span>, &amp;n); <span class="hljs-comment">// Error: cannot modify a const variable.</span>
</code></pre>
<p>In C++, <code>const</code> variables of built-in types must be initialized.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--style:section::after {

}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h1 id="pointers">Pointers</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="pointers-1">Pointers</h2>
<p>A pointer <em>points to</em> a variable. The <strong>value</strong> of a pointer is the address of the variable that it points to.</p>
<div style="display: grid; grid-template-columns: 1fr 0.8fr;">
  <div>
<pre><code class="language-c"><span class="hljs-type">int</span> i = <span class="hljs-number">42</span>;
<span class="hljs-type">int</span>* pi = &amp;i;
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, *pi);
</code></pre>
  </div>
  <div style="margin-left: 90px;">
<a align="center">
<img src="img/ptr_addr.jpg" width=400 />
</a>
  </div>
</div>
<ul>
<li><code>int* pi;</code> declares a pointer named <code>pi</code>.
<ul>
<li>The type of <code>pi</code> is <code>int*</code>.</li>
<li>The type of the variable that <code>pi</code> points to (&quot;pointee&quot;) is <code>int</code>.</li>
</ul>
</li>
<li><code>&amp;</code> is the <strong>address-of operator</strong>, used for taking the address of a variable.</li>
<li><code>*</code> in the expression <code>*pi</code> is the <strong>indirection (dereference) operator</strong>, used for obtaining the variable that a pointer points to.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="pointers-2">Pointers</h2>
<p>A pointer <em>points to</em> a variable.</p>
<p>We can access and modify a variable through its address (or a pointer pointing to it).</p>
<pre><code class="language-c"><span class="hljs-type">int</span> num = <span class="hljs-number">3</span>;
<span class="hljs-type">int</span>* ptr = &amp;num;
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, *ptr);  <span class="hljs-comment">// 3</span>
*ptr = <span class="hljs-number">10</span>;
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, num);   <span class="hljs-comment">// 10</span>
++num;
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, *ptr);  <span class="hljs-comment">// 11</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="declare-a-pointer">Declare a pointer</h2>
<p>To declare a pointer: <code>PointeeType* ptr;</code></p>
<ul>
<li>The type of <code>ptr</code> is <code>PointeeType*</code>.
<ul>
<li>Pointer types with different pointee types are <strong>different types</strong>: <code>int*</code> and <code>double*</code> are different.</li>
</ul>
</li>
<li>The asterisk <code>*</code> can be placed near either <code>PointeeType</code> or <code>ptr</code>:
<ul>
<li><code>PointeeType* ptr;</code> and <code>PointeeType *ptr;</code> are the same declaration.</li>
<li><code>PointeeType * ptr;</code>, <code>PointeeType       *   ptr;</code> and <code>PointeeType*ptr;</code> are also correct.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="declare-a-pointer-1">Declare a pointer</h2>
<p>The asterisk <code>*</code> can be placed near either <code>PointeeType</code> or <code>ptr</code>:</p>
<ul>
<li><code>PointeeType* ptr;</code> may be more intuitive?</li>
</ul>
<p>However, when declaring more than one pointers in one declaration statement, an asterisk is needed <strong>for every identifier</strong>:</p>
<pre><code class="language-c"><span class="hljs-type">int</span>* p1, p2, p3;   <span class="hljs-comment">// `p1` is of type `int*`, but `p2` and `p3` are ints.</span>
<span class="hljs-type">int</span> *q1, *q2, *q3; <span class="hljs-comment">// `q1`, `q2` and `q3` all have the type `int*`.</span>
<span class="hljs-type">int</span>* r1, r2, *r3;  <span class="hljs-comment">// `r1` and `r3` are of the type `int*`,</span>
                   <span class="hljs-comment">// while `r2` is an int.</span>
</code></pre>
<p><strong>[Best practice]</strong> <u>Either <code>PointeeType *ptr</code> or <code>PointeeType* ptr</code> is ok. Choose one style and stick to it. But if you choose the second one, never declare more than one pointers in one declaration statement.</u></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:jqrloxq3gihno9ii1w34zkqwwkzwpwdsjqmqgxz1509;" data-marpit-pagination-total="51">
<h2 id="and-"><code>&amp;</code> and <code>*</code></h2>
<p><code>&amp;var</code> returns the address of the variable <code>var</code>.</p>
<ul>
<li>The result type is <code>Type *</code>, where <code>Type</code> is the type of <code>var</code>.</li>
<li><code>var</code> must be an object that has an identity (an <em>lvalue</em>) <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.885ex" role="img" focusable="false" viewBox="0 -833.2 436.6 833.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></g></g></g></svg></mjx-container>: <code>&amp;42</code> or <code>&amp;(a + b)</code> are not allowed.</li>
</ul>
<p><code>*expr</code> returns <strong>the variable</strong> whose address is the value of <code>expr</code>.</p>
<ul>
<li><code>expr</code> must have a pointer type <code>PointeeType *</code>. The result type is <code>PointeeType</code>.</li>
<li><strong>The variable</strong> is returned, not only its value. This means that we can modify the returned variable: <code>++*ptr</code> is allowed.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

<h2 id=""><code>*</code></h2>
<p>In a <strong>declaration</strong> <code>PointeeType *ptr</code>, <code>*</code> is a part of the pointer type <code>PointeeType *</code>.</p>
<p>In an <strong>expression</strong> like <code>*ptr</code>, <code>*</code> is the <strong>indirection (dereference) operator</strong> used to obtain the variable whose address is the value of <code>ptr</code>.</p>
<p>Do not mix them up!</p>
</section>

<h2 id="the-null-pointer">The null pointer</h2>
<p>The <strong>null pointer value</strong> is the &quot;zero&quot; value for pointer types <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.904ex" role="img" focusable="false" viewBox="0 -841.7 436.6 841.7"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path></g></g></g></g></g></g></svg></mjx-container>.</p>
<ul>
<li>
<p>It can be obtained from the macro <a href="https://en.cppreference.com/w/c/types/NULL"><code>NULL</code></a>, which is available from many standard library header files (e.g. <code>&lt;stddef.h&gt;</code>, <code>&lt;stdio.h&gt;</code>, <code>&lt;stdlib.h&gt;</code>):</p>
<pre><code class="language-c"><span class="hljs-type">int</span> *ptr = <span class="hljs-literal">NULL</span>; <span class="hljs-comment">// `ptr` is a null pointer.</span>
</code></pre>
</li>
<li>
<p>It can also be obtained from the integer literal <code>0</code>.</p>
<pre><code class="language-c"><span class="hljs-type">double</span> *ptr = <span class="hljs-number">0</span>; <span class="hljs-comment">// same as `double *ptr = NULL;`</span>
</code></pre>
</li>
<li>
<p>Conversion from a null pointer to an integer type results in <code>0</code>.</p>
</li>
</ul>
<p>Note: Better null pointer values (<code>nullptr</code>) are available <a href="https://en.cppreference.com/w/c/language/nullptr">in C23</a> and <a href="https://en.cppreference.com/w/cpp/language/nullptr">in C++11</a>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-style="section::after {

<h2 id="the-null-pointer-1">The null pointer</h2>
<p>The <strong>null pointer value</strong> is the &quot;zero&quot; value for pointer types <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.904ex" role="img" focusable="false" viewBox="0 -841.7 436.6 841.7"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path></g></g></g></g></g></g></svg></mjx-container>.</p>
<p>A null pointer compares unequal to any pointer pointing to an object.</p>
<p>It is used for representing a pointer that &quot;points nowhere&quot;.</p>
<p><strong>Dereferencing a null pointer is undefined behavior, and often causes severe runtime errors!</strong></p>
<ul>
<li>Because it is not pointing to an object.</li>
</ul>
<pre><code class="language-c"><span class="hljs-type">int</span> *ptr = <span class="hljs-literal">NULL</span>;
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, *ptr); <span class="hljs-comment">// undefined behavior</span>
*ptr = <span class="hljs-number">42</span>; <span class="hljs-comment">// undefined behavior</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-style="section::after {

<h2 id="implicit-initialization-of-pointers">Implicit initialization of pointers</h2>
<p>If a pointer is not explicitly initialized:</p>
<ul>
<li>Global or local <code>static</code>: Initialized to the null pointer value.</li>
<li>Local non-<code>static</code>: Initialized to indeterminate values, or in other words, <strong>uninitialized</strong>.
<ul>
<li>Uninitialized pointers are often called <strong>wild pointers</strong>.</li>
</ul>
</li>
</ul>
<p>A wild pointer do not point to a specific object, and is not a null pointer either.</p>
<p><strong>Dereferencing a wild pointer is undefined behavior, and often causes severe runtime errors.</strong></p>
<p><strong>[Best practice]</strong> <u>Avoid wild pointers.</u></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-style="section::after {

<h2 id="pointers-that-are-not-dereferenceable">Pointers that are not dereferenceable</h2>
<p>A pointer <code>ptr</code> is dereferenceable. <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.057ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.247ex" role="img" focusable="false" viewBox="0 -526 1000 551"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D4" d="M308 524Q318 526 323 526Q340 526 340 514Q340 507 336 499Q326 476 314 454T292 417T274 391T260 374L255 368Q255 367 500 367Q744 367 744 368L739 374Q734 379 726 390T707 416T685 453T663 499Q658 511 658 515Q658 525 680 525Q687 524 690 523T695 519T701 507Q766 359 902 287Q921 276 939 269T961 259T966 250Q966 246 965 244T960 240T949 236T930 228T902 213Q763 137 701 -7Q697 -16 695 -19T690 -23T680 -25Q658 -25 658 -15Q658 -11 663 1Q673 24 685 46T707 83T725 109T739 126L744 132Q744 133 500 133Q255 133 255 132L260 126Q265 121 273 110T292 84T314 47T336 1Q341 -11 341 -15Q341 -25 319 -25Q312 -24 309 -23T304 -19T298 -7Q233 141 97 213Q83 221 70 227T51 235T41 239T35 243T34 250T35 256T40 261T51 265T70 273T97 287Q235 363 299 509Q305 522 308 524ZM792 319L783 327H216Q183 294 120 256L110 250L120 244Q173 212 207 181L216 173H783L792 181Q826 212 879 244L889 250L879 256Q826 288 792 319Z"></path></g></g></g></svg></mjx-container> <code>*ptr</code> has no undefined behavior. <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.057ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.247ex" role="img" focusable="false" viewBox="0 -526 1000 551"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D4" d="M308 524Q318 526 323 526Q340 526 340 514Q340 507 336 499Q326 476 314 454T292 417T274 391T260 374L255 368Q255 367 500 367Q744 367 744 368L739 374Q734 379 726 390T707 416T685 453T663 499Q658 511 658 515Q658 525 680 525Q687 524 690 523T695 519T701 507Q766 359 902 287Q921 276 939 269T961 259T966 250Q966 246 965 244T960 240T949 236T930 228T902 213Q763 137 701 -7Q697 -16 695 -19T690 -23T680 -25Q658 -25 658 -15Q658 -11 663 1Q673 24 685 46T707 83T725 109T739 126L744 132Q744 133 500 133Q255 133 255 132L260 126Q265 121 273 110T292 84T314 47T336 1Q341 -11 341 -15Q341 -25 319 -25Q312 -24 309 -23T304 -19T298 -7Q233 141 97 213Q83 221 70 227T51 235T41 239T35 243T34 250T35 256T40 261T51 265T70 273T97 287Q235 363 299 509Q305 522 308 524ZM792 319L783 327H216Q183 294 120 256L110 250L120 244Q173 212 207 181L216 173H783L792 181Q826 212 879 244L889 250L879 256Q826 288 792 319Z"></path></g></g></g></svg></mjx-container> <code>ptr</code> points to an existing object.</p>
<p>A pointer that does not point to an existing object may be</p>
<ul>
<li>uninitialized (wild), or</li>
<li>a null pointer, or</li>
<li>dangling (We will discuss this in later lectures.), or</li>
<li>holding some other meaningless address: <code>int *p = 123;</code></li>
</ul>

<h2 id="pointers-that-are-not-dereferenceable-1">Pointers that are not dereferenceable</h2>
<p>Dereferencing such a pointer is undefined behavior, and usually causes severe runtime errors.</p>
<ul>
<li>
<p>Recall the &quot;short-circuit&quot; evaluation of binary logical operators:</p>
<pre><code class="language-c"><span class="hljs-keyword">if</span> (ptr != <span class="hljs-literal">NULL</span> &amp;&amp; *ptr == <span class="hljs-number">42</span>) { <span class="hljs-comment">/* ... */</span> }
</code></pre>
<p>When <code>ptr</code> is a null pointer, the right-hand side operand <code>*ptr == 42</code> won't be evaluated, so <code>ptr</code> is not dereferenced.</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-style="section::after {

<h2 id="argument-passing">Argument passing</h2>
<p>What is the output? Is the value of <code>i</code> changed to <code>42</code>?</p>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> x)</span> {
  x = <span class="hljs-number">42</span>;
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> i = <span class="hljs-number">30</span>;
  fun(i);
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, i);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-style="section::after {

<h2 id="argument-passing-1">Argument passing</h2>
<div style="display: grid; grid-template-columns: 1fr 0.8fr;">
  <div>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> x)</span> {
   x = <span class="hljs-number">42</span>;
 }
 <span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
   <span class="hljs-type">int</span> i = <span class="hljs-number">30</span>;
   fun(i);
   <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, i); <span class="hljs-comment">// 30</span>
 }  
</code></pre>
  </div>
  <div style="margin-left: 30px;">
<a align="center">
<img src="img/call_by_value.jpg" width=500 />
</a>
  </div>
</div>
<p>The output is still <code>30</code>. <code>i</code> is not changed.</p>
<ul>
<li>The parameter <code>x</code> is initialized as if <code>int x = i;</code>, thus obtaining the <strong>value</strong> of <code>i</code>.
<ul>
<li><code>x</code> and <code>i</code> are two independent variables.</li>
</ul>
</li>
<li>Modification on <code>x</code> does not influence <code>i</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-style="section::after {

<p>To make the modification happen on a variable outside, pass its address into the function.</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> x)</span> {
  x = <span class="hljs-number">42</span>;
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> i = <span class="hljs-number">30</span>;
  fun(i); <span class="hljs-comment">// int x = i;</span>
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, i); <span class="hljs-comment">// 30</span>
}
</code></pre>
  </div>
  <div>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> *px)</span> {
  *px = <span class="hljs-number">42</span>;
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {

<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">swap</span><span class="hljs-params">(<span class="hljs-type">int</span> *pa, <span class="hljs-type">int</span> *pb)</span> {
  <span class="hljs-type">int</span> tmp = *pa;
  *pa = *pb;
  *pb = tmp;
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> i = <span class="hljs-number">42</span>, j = <span class="hljs-number">35</span>;
  swap(&amp;i, &amp;j);
  <span class="hljs-comment">// Now i = 35, j = 42.</span>
}
</code></pre>
<p>* Why do we need to write <code>&amp;</code> when calling <code>scanf</code>, but not in <code>printf</code>?</p>
<ul>
<li><code>scanf</code> needs to modify the variable, but <code>printf</code> doesn't.</li>
</ul>

<h2 id="arrays-1">Arrays</h2>
<p>An array is a sequence of <code>N</code> objects of an <em>element type</em> <code>ElemType</code> stored <strong>contiguously</strong> in memory, where <code>N</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.471ex;" xmlns="http://www.w3.org/2000/svg" width="5.079ex" height="2.016ex" role="img" focusable="false" viewBox="0 -683 2244.9 891"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2208" d="M84 250Q84 372 166 450T360 539Q361 539 377 539T419 540T469 540H568Q583 532 583 520Q583 511 570 501L466 500Q355 499 329 494Q280 482 242 458T183 409T147 354T129 306T124 272V270H568Q583 262 583 250T568 230H124V228Q124 207 134 177T167 112T231 48T328 7Q355 1 466 0H570Q583 -10 583 -20Q583 -32 568 -40H471Q464 -40 446 -40T417 -41Q262 -41 172 45Q84 127 84 250Z"></path></g><g data-mml-node="msub" transform="translate(944.8,0)"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="2124" d="M39 -1Q29 9 29 12Q29 23 60 77T219 337L410 648H364Q261 648 210 628Q168 612 142 588T109 545T97 509T88 490Q85 489 80 489Q72 489 61 503L70 588Q72 607 75 628T79 662T81 675Q84 677 88 681Q90 683 341 683H592Q604 673 604 666Q604 662 412 348L221 37Q221 35 301 35Q406 35 446 48Q504 68 543 111T597 212Q602 239 617 239Q624 239 629 234T635 223Q635 215 621 113T604 8L597 1Q595 -1 317 -1H39ZM148 637L166 648H112V632Q111 629 110 622T108 612Q108 608 110 608T116 612T129 623T148 637ZM552 646Q552 648 504 648Q452 648 450 643Q448 639 266 343T77 37Q77 35 128 35H179L366 339L552 646ZM572 35Q581 89 581 97L561 77Q542 59 526 48L508 37L539 35H572Z"></path></g></g><g data-mml-node="mo" transform="translate(700,-150) scale(0.707)"><path data-c="2B" d="M56 237T56 250T70 270H369V420L370 570Q380 583 389 583Q402 583 409 568V270H707Q722 262 722 250T707 230H409V-68Q401 -82 391 -82H389H387Q375 -82 369 -68V230H70Q56 237 56 250Z"></path></g></g></g></g></svg></mjx-container> is the <em>length</em> of it.</p>
<pre><code class="language-c">ElemType arr[N];
</code></pre>
<p><code>N</code> must be a <strong>constant expression</strong> whose value is known at compile-time.</p>
<pre><code class="language-c"><span class="hljs-type">int</span> a1[<span class="hljs-number">10</span>];      <span class="hljs-comment">// OK. A literal is a constant expression.</span>
<span class="hljs-meta">#<span class="hljs-keyword">define</span> MAXN 10</span>
<span class="hljs-type">int</span> a2[MAXN];    <span class="hljs-comment">// OK. `MAXN` is replaced with `10` by the preprocessor.</span>
<span class="hljs-type">int</span> n; <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d&quot;</span>, &amp;n);
<span class="hljs-type">int</span> a[n];        <span class="hljs-comment">// A C99 VLA (Variable-Length Array), whose length is</span>
                 <span class="hljs-comment">// determined at runtime.</span>
</code></pre>
<p>For now, we do not recommend the use of VLAs. We will talk more about it in recitations.</p>

<h2 id="array-type">Array type</h2>
<p>An array is a sequence of <code>N</code> objects of an <em>element type</em> <code>ElemType</code> stored <strong>contiguously</strong> in memory, where <code>N</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.471ex;" xmlns="http://www.w3.org/2000/svg" width="5.079ex" height="2.016ex" role="img" focusable="false" viewBox="0 -683 2244.9 891"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2208" d="M84 250Q84 372 166 450T360 539Q361 539 377 539T419 540T469 540H568Q583 532 583 520Q583 511 570 501L466 500Q355 499 329 494Q280 482 242 458T183 409T147 354T129 306T124 272V270H568Q583 262 583 250T568 230H124V228Q124 207 134 177T167 112T231 48T328 7Q355 1 466 0H570Q583 -10 583 -20Q583 -32 568 -40H471Q464 -40 446 -40T417 -41Q262 -41 172 45Q84 127 84 250Z"></path></g><g data-mml-node="msub" transform="translate(944.8,0)"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="2124" d="M39 -1Q29 9 29 12Q29 23 60 77T219 337L410 648H364Q261 648 210 628Q168 612 142 588T109 545T97 509T88 490Q85 489 80 489Q72 489 61 503L70 588Q72 607 75 628T79 662T81 675Q84 677 88 681Q90 683 341 683H592Q604 673 604 666Q604 662 412 348L221 37Q221 35 301 35Q406 35 446 48Q504 68 543 111T597 212Q602 239 617 239Q624 239 629 234T635 223Q635 215 621 113T604 8L597 1Q595 -1 317 -1H39ZM148 637L166 648H112V632Q111 629 110 622T108 612Q108 608 110 608T116 612T129 623T148 637ZM552 646Q552 648 504 648Q452 648 450 643Q448 639 266 343T77 37Q77 35 128 35H179L366 339L552 646ZM572 35Q581 89 581 97L561 77Q542 59 526 48L508 37L539 35H572Z"></path></g></g><g data-mml-node="mo" transform="translate(700,-150) scale(0.707)"><path data-c="2B" d="M56 237T56 250T70 270H369V420L370 570Q380 583 389 583Q402 583 409 568V270H707Q722 262 722 250T707 230H409V-68Q401 -82 391 -82H389H387Q375 -82 369 -68V230H70Q56 237 56 250Z"></path></g></g></g></g></svg></mjx-container> is the <em>length</em> of it.</p>
<pre><code class="language-c">ElemType arr[N]; <span class="hljs-comment">// The type of `arr` is `ElemType [N]`.</span>
</code></pre>
<p>The type of an array consists of two parts:</p>
<ol>
<li>the element type <code>ElemType</code>, and</li>
<li>the length of the array <code>[N]</code>.</li>
</ol>

<pre><code class="language-c">ElemType arr[N];
</code></pre>

<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-c"><span class="hljs-type">int</span> a[<span class="hljs-number">10</span>];

<span class="hljs-type">bool</span> <span class="hljs-title function_">find</span><span class="hljs-params">(<span class="hljs-type">int</span> value)</span> {

<h2 id="array-initialization">Array initialization</h2>
<p>If an array is declared without explicit initialization:</p>
<ul>
<li>Global or local <code>static</code>: Empty-initialization <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.054ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.242ex" role="img" focusable="false" viewBox="0 -525 1000 549"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D2" d="M580 514Q580 525 596 525Q601 525 604 525T609 525T613 524T615 523T617 520T619 517T622 512Q659 438 720 381T831 300T927 263Q944 258 944 250T935 239T898 228T840 204Q696 134 622 -12Q618 -21 615 -22T600 -24Q580 -24 580 -17Q580 -13 585 0Q620 69 671 123L681 133H70Q56 140 56 153Q56 168 72 173H725L735 181Q774 211 852 250Q851 251 834 259T789 283T735 319L725 327H72Q56 332 56 347Q56 360 70 367H681L671 377Q638 412 609 458T580 514Z"></path></g></g></g></svg></mjx-container> Every element is empty-initialized.</li>
<li>Local non-<code>static</code>: Every element is initialized to indeterminate values (uninitialized).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-style="section::after {

<h2 id="array-initialization-1">Array initialization</h2>
<p>Arrays can be initialized from <a href="https://en.cppreference.com/w/c/language/array_initialization#Initialization_from_brace-enclosed_lists">brace-enclosed lists</a>:</p>
<ul>
<li>
<p>Initialize the beginning few elements:</p>
<pre><code class="language-c"><span class="hljs-type">int</span> a[<span class="hljs-number">10</span>] = {<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span>}; <span class="hljs-comment">// Correct: Initializes a[0], a[1], a[2], a[3]</span>
<span class="hljs-type">int</span> b[<span class="hljs-number">2</span>] = {<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>};     <span class="hljs-comment">// Error: Too many initializers</span>
<span class="hljs-type">int</span> c[] = {<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>};      <span class="hljs-comment">// Correct: &#x27;c&#x27; has type int[3].</span>
<span class="hljs-type">int</span> d[<span class="hljs-number">100</span>] = {};          <span class="hljs-comment">// Correct in C++ and since C23.</span>
</code></pre>
</li>
<li>
<p>Initialize designated elements (since C99):</p>
<pre><code class="language-c"><span class="hljs-type">int</span> e[<span class="hljs-number">10</span>] = {[<span class="hljs-number">0</span>] = <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, [<span class="hljs-number">7</span>] = <span class="hljs-number">7</span>, <span class="hljs-number">11</span>, [<span class="hljs-number">4</span>] = <span class="hljs-number">13</span>};
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-style="section::after {

<h2 id="array-initialization-2">Array initialization</h2>
<p>If an array is explicitly initialized, all the elements that are not explicitly initialized are <strong>empty-initialized</strong>.</p>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> a[<span class="hljs-number">10</span>] = {<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>}; <span class="hljs-comment">// a[3], a[4], ... are all initialized to zero.</span>
  <span class="hljs-type">int</span> b[<span class="hljs-number">100</span>] = {<span class="hljs-number">0</span>};      <span class="hljs-comment">// All elements of b are initialized to zero.</span>
  <span class="hljs-type">int</span> c[<span class="hljs-number">100</span>] = {<span class="hljs-number">1</span>};      <span class="hljs-comment">// c[0] is initialized to 1,</span>
                         <span class="hljs-comment">// and the rest are initialized to zero.</span>
}
</code></pre>
<p><strong><code>= {x}</code> is not initializing all elements to <code>x</code>!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-style="section::after {

<h2 id="nested-arrays">Nested arrays</h2>
<p>The C answer to &quot;multidimensional arrays&quot; is <strong>nested arrays</strong>, which is in fact <strong>arrays of arrays</strong>:</p>
<a align="center">
  <img src="img/mdarray.png", width=800 />
</a>
<pre><code class="language-c"><span class="hljs-type">int</span> a[<span class="hljs-number">10</span>][<span class="hljs-number">20</span>];

<span class="hljs-type">bool</span> <span class="hljs-title function_">find</span><span class="hljs-params">(<span class="hljs-type">int</span> value)</span> {
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">10</span>; ++i)
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> j = <span class="hljs-number">0</span>; j &lt; <span class="hljs-number">20</span>; ++j)
      <span class="hljs-keyword">if</span> (a[i][j] == value)
        <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
  <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-style="section::after {

<h2 id="initialization-of-nested-arrays">Initialization of nested arrays</h2>
<p>Things have been stated quite clearly <a href="https://en.cppreference.com/w/c/language/array_initialization#Nested_arrays">on cppreference</a>.</p>
<pre><code class="language-c"><span class="hljs-type">int</span> a[<span class="hljs-number">4</span>][<span class="hljs-number">3</span>] = { <span class="hljs-comment">// array of 4 arrays of 3 ints each (4x3 matrix)</span>
    { <span class="hljs-number">1</span> },      <span class="hljs-comment">// row 0 initialized to {1, 0, 0}</span>
    { <span class="hljs-number">0</span>, <span class="hljs-number">1</span> },   <span class="hljs-comment">// row 1 initialized to {0, 1, 0}</span>
    { [<span class="hljs-number">2</span>]=<span class="hljs-number">1</span> },  <span class="hljs-comment">// row 2 initialized to {0, 0, 1}</span>
};              <span class="hljs-comment">// row 3 initialized to {0, 0, 0}</span>
<span class="hljs-type">int</span> b[<span class="hljs-number">4</span>][<span class="hljs-number">3</span>] = {    <span class="hljs-comment">// array of 4 arrays of 3 ints each (4x3 matrix)</span>
  <span class="hljs-number">1</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">2</span>, <span class="hljs-number">4</span>, <span class="hljs-number">6</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span> <span class="hljs-comment">// row 0 initialized to {1, 3, 5}</span>

                            <span class="hljs-comment">// row 2 initialized to {3, 5, 7}</span>
                            <span class="hljs-comment">// row 3 initialized to {0, 0, 0}</span>
<span class="hljs-type">int</span> y[<span class="hljs-number">4</span>][<span class="hljs-number">3</span>] = {[<span class="hljs-number">0</span>][<span class="hljs-number">0</span>]=<span class="hljs-number">1</span>, [<span class="hljs-number">1</span>][<span class="hljs-number">1</span>]=<span class="hljs-number">1</span>, [<span class="hljs-number">2</span>][<span class="hljs-number">0</span>]=<span class="hljs-number">1</span>};  <span class="hljs-comment">// row 0 initialized to {1, 0, 0}</span>
                                               <span class="hljs-comment">// row 1 initialized to {0, 1, 0}</span>
                                               <span class="hljs-comment">// row 2 initialized to {1, 0, 0}</span>
                                               <span class="hljs-comment">// row 3 initialized to {0, 0, 0}</span>
</code></pre>

<h2 id="summary">Summary</h2>
<p>Variables</p>
<ul>
<li>Local <code>static</code> variables: A variable whose name is local to a function but whose lifetime is as long as that of a global variable.</li>
<li>Implicit initialization:
<ul>
<li>Global or local <code>static</code>: empty-initialization (some kind of &quot;zero&quot; value)</li>
<li>Local non-<code>static</code>: initialized to indeterminate values (uninitialized)</li>
<li>Use of indeterminate values is undefined behavior.</li>
</ul>
</li>
<li><code>const</code>: not modifiable.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-style="section::after {

<h2 id="summary-1">Summary</h2>
<p>Pointers</p>
<ul>
<li>Type of a pointer: <code>PointeeType *</code></li>
<li><code>&amp;var</code> returns the address of <code>var</code>.</li>
<li><code>*expr</code> returns the variable whose address is the value of <code>expr</code>.</li>
<li>Null pointer value: The &quot;zero&quot; value for pointer types.
<ul>
<li>Obtained from <code>NULL</code> or the integer literal <code>0</code>.</li>
<li>Representing a pointer that &quot;points nowhere&quot;.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-style="section::after {

<h2 id="summary-2">Summary</h2>
<p>Pointers</p>
<ul>
<li>Implicit initialization:
<ul>
<li>Global or local <code>static</code>: null pointer</li>
<li>Local non-<code>static</code>: &quot;wild pointer&quot;</li>
<li>Dereferencing such pointers is undefined behavior.</li>
</ul>
</li>
<li>Used for argument passing
<ul>
<li>To modify a variable outside the function, pass its address into the function.</li>
</ul>
</li>
</ul>
</section>

<h2 id="notes">Notes</h2>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></g></g></svg></mjx-container> The <a href="https://en.cppreference.com/w/c/language/initialization#Empty_initialization">cppreference page for empty-initialization</a> does not mark the term &quot;empty-initialization&quot; as C23, but in fact it does not appear in any standards prior to C23. Looking through the edit history of this page, we can see that this term was not introduced until the C23 things were added. For convenience, we use this term to represent this kind of initialization.</p>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></g></g></svg></mjx-container> The &quot;zero&quot; value is not necessarily all-bits zero. For example, the floating-point positive zero <code>+0.0</code> may not be all-bits zero in <a href="https://www.ccsinfo.com/faq.php?page=mchp_float_format">a special representation used by the CCS C compiler</a>. The null pointer value is not all-bits zero on some platforms either, details of which are available on <a href="https://c-faq.com/null/machexamp.html">comp.lang.c FAQ</a>.</p>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.885ex" role="img" focusable="false" viewBox="0 -833.2 436.6 833.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></g></g></g></svg></mjx-container> We will not talk about the concepts related to value categories until we meet them in C++, although <a href="https://en.cppreference.com/w/c/language/value_category">C also has value categories</a>.</p>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.904ex" role="img" focusable="false" viewBox="0 -841.7 436.6 841.7"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path></g></g></g></g></g></g></svg></mjx-container> See <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="1.507ex" role="img" focusable="false" viewBox="0 -666 500 666"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container>.</p>
