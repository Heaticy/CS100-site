<h2 id="lifetime-of-an-object">Lifetime of an object</h2>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<p><strong>Lifetime</strong> of a local non-<code>static</code> object:</p>
<ul>
<li>Starts on initialization</li>
<li>Ends when control flow goes out of its <strong>scope</strong>.</div>
<div>
</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != n; ++i) {
  <span class="hljs-built_in">do_something</span>(i);
  <span class="hljs-comment">// Lifetime of `s` begins.</span>
  std::string s = <span class="hljs-built_in">some_string</span>();
  <span class="hljs-built_in">do_something_else</span>(s, i);
<span class="hljs-comment">/* end of lifetime of `s` */</span> }
</code></pre>
  </div>
</div>
<p>Every time the loop body is executed, <code>s</code> undergoes initialization and destruction.</p>
<ul>
<li><code>std::string</code> <strong>owns</strong> some resources (memory where the characters are stored).</li>
<li><code>std::string</code> must <em>somehow</em> release that resources (deallocate that memory) at the end of its lifetime.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-style="section::after {

<h2 id="lifetime-of-an-object-1">Lifetime of an object</h2>
<p>Lifetime of a global object:</p>
<ul>
<li>Starts on initialization (before the first statement of <code>main</code>)</li>
<li>Ends when the program terminates.</li>
</ul>
<p>Lifetime of a heap-based object:</p>
<ul>
<li>Starts on initialization: <strong>A <code>new</code> expression will do this, but <code>malloc</code> does not!</strong></li>
<li>Ends when it is destroyed: <strong>A <code>delete</code> expression will do this, but <code>free</code> does not!</strong></li>
</ul>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.054ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.242ex" role="img" focusable="false" viewBox="0 -525 1000 549"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D2" d="M580 514Q580 525 596 525Q601 525 604 525T609 525T613 524T615 523T617 520T619 517T622 512Q659 438 720 381T831 300T927 263Q944 258 944 250T935 239T898 228T840 204Q696 134 622 -12Q618 -21 615 -22T600 -24Q580 -24 580 -17Q580 -13 585 0Q620 69 671 123L681 133H70Q56 140 56 153Q56 168 72 173H725L735 181Q774 211 852 250Q851 251 834 259T789 283T735 319L725 327H72Q56 332 56 347Q56 360 70 367H681L671 377Q638 412 609 458T580 514Z"></path></g></g></g></svg></mjx-container> <code>new</code> / <code>delete</code> expressions are in this week's recitation.</p>

<h2 id="constructors-and-destructors-1">Constructors and Destructors</h2>
<p>Take <code>std::string</code> as an example:</p>
<ul>
<li>Its initialization (done by its constructors) must allocate some memory for its content.</li>
<li>When it is destroyed, it must <em>somehow</em> deallocate that memory.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-style="section::after {

<h2 id="constructors-and-destructors-2">Constructors and Destructors</h2>
<p>Take <code>std::string</code> as an example:</p>
<ul>
<li>Its initialization (done by its constructors) must allocate some memory for its content.</li>
<li>When it is destroyed, it must <em>somehow</em> deallocate that memory.</li>
</ul>
<p><strong>A destructor of a class is the function that is automatically called when an object of that class type is destroyed.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-style="section::after {

<h2 id="constructors-and-destructors-3">Constructors and Destructors</h2>
<p>Syntax: <code>~ClassName() { /* ... */ }</code></p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">A</span> {
  <span class="hljs-built_in">A</span>() {
    std::cout &lt;&lt; <span class="hljs-string">&#x27;c&#x27;</span>;
  }
  ~<span class="hljs-built_in">A</span>() {
    std::cout &lt;&lt; <span class="hljs-string">&#x27;d&#x27;</span>;
  }
};
</code></pre>
  </div>
  <div>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != <span class="hljs-number">3</span>; ++i) {
  A a;
  <span class="hljs-comment">// do something ...</span>
}
</code></pre>
<p>Output:</p>
<pre><code>cdcdcd
</code></pre>

<h2 id="destructor">Destructor</h2>
<p>Called <strong>automatically</strong> when the object is destroyed!</p>
<ul>
<li>How can we make use of this property?</li>
</ul>
</section>

" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--style:section::after {

<h2 id="destructor-1">Destructor</h2>
<p>Called <strong>automatically</strong> when the object is destroyed!</p>
<ul>
<li>How can we make use of this property?</li>
</ul>
<p>We often do some <strong>cleanup</strong> in a destructor:</p>
<ul>
<li>If the object <strong>owns some resources</strong> (e.g. dynamic memory), destructors can be made use of to avoid leaking!</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">A</span> {
  SomeResourceHandle resource;

<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">A</span>(<span class="hljs-comment">/* ... */</span>) : <span class="hljs-built_in">resource</span>(<span class="hljs-built_in">obtain_resource</span>(<span class="hljs-comment">/* ... */</span>)) {}
  ~<span class="hljs-built_in">A</span>() {
    <span class="hljs-built_in">release_resource</span>(resource);
  }
};
</code></pre>
</section>

<h2 id="example-a-dynamic-array">Example: A dynamic array</h2>
<p>Suppose we want to implement a &quot;dynamic array&quot;:</p>
<ul>
<li>It looks like a VLA (variable-length array), but it is heap-based, which is safer.</li>
<li>It should take good care of the memory it uses.</li>
</ul>
<p>Expected usage:</p>
<pre><code class="language-cpp"><span class="hljs-type">int</span> n; std::cin &gt;&gt; n;
<span class="hljs-function">Dynarray <span class="hljs-title">arr</span><span class="hljs-params">(n)</span></span>; <span class="hljs-comment">// `n` is runtime determined</span>
                 <span class="hljs-comment">// `arr` should have allocated memory for `n` `int`s now.</span>
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != n; ++i) {
  <span class="hljs-type">int</span> x; std::cin &gt;&gt; x;
  arr.<span class="hljs-built_in">at</span>(i) = x * x; <span class="hljs-comment">// subscript, looks as if `arr[i] = x * x`</span>
}
<span class="hljs-comment">// ...</span>
<span class="hljs-comment">// `arr` should deallocate its memory itself.</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-style="section::after {

<h2 id="dynarray-members">Dynarray: members</h2>
<ul>
<li>It should have a pointer that points to the memory, where elements are stored.</li>
<li>It should remember its length.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
  <span class="hljs-type">int</span> *m_storage;
  std::<span class="hljs-type">size_t</span> m_length;
};
</code></pre>
<ul>
<li><code>m</code> stands for <strong>member</strong>.</li>
</ul>
<p><strong>[Best practice]</strong> <u>Make data members <code>private</code>, to achieve good encapsulation.</u></p>
</section>

<li>We want <code>Dynarray a(n);</code> to construct a <code>Dynarray</code> that contains <code>n</code> elements.

</ul>
</li>
<li><code>new int[n]{}</code>: Allocate a block of heap memory that stores <code>n</code> <code>int</code>s, and value-initialize them.</li>
</ul>
</li>
<li>Do we need a default constructor?
<ul>
<li>Review: What is a default constructor?
<ul>
<li>The constructor with no parameters.</li>
</ul>
</li>
<li>What should be the correct behavior of it?</li>
</ul>
</li>

<ul>
<li>We want <code>Dynarray a(n);</code> to construct a <code>Dynarray</code> that contains <code>n</code> elements.
<ul>
<li>To avoid troubles, we want the elements to be <strong>value-initialized</strong>!</li>
</ul>
</li>
<li>Suppose we don't want a default constructor.</li>

<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
  <span class="hljs-type">int</span> *m_storage;

<h2 id="dynarray-destructor">Dynarray: destructor</h2>
<ul>
<li>Remember: The destructor is (automatically) called when the object is &quot;dead&quot;.</li>
<li>The memory is obtained in the constructor, and released in the destructor.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
  <span class="hljs-type">int</span> *m_storage;
  std::<span class="hljs-type">size_t</span> m_length;
 <span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Dynarray</span>(std::<span class="hljs-type">size_t</span> n)
    : <span class="hljs-built_in">m_storage</span>(<span class="hljs-keyword">new</span> <span class="hljs-type">int</span>[n]{}), <span class="hljs-built_in">m_length</span>(n) {}
  ~<span class="hljs-built_in">Dynarray</span>() {
    <span class="hljs-keyword">delete</span>[] m_storage; <span class="hljs-comment">// Pay attention to `[]`!</span>
  }
};
</code></pre>
</section>

  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="copy-initialization">Copy-initialization</h2>
<p>We can easily construct a <code>std::string</code> to be a copy of another:</p>
<pre><code class="language-cpp">std::string s1 = <span class="hljs-built_in">some_value</span>();
std::string s2 = s1; <span class="hljs-comment">// s2 is initialized to be a copy of s1</span>
<span class="hljs-function">std::string <span class="hljs-title">s3</span><span class="hljs-params">(s1)</span></span>; <span class="hljs-comment">// equivalent</span>
std::string s4{s1}; <span class="hljs-comment">// equivalent, but modern</span>
</code></pre>
<p>Can we do this for our <code>Dynarray</code>?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="copy-initialization-1">Copy-initialization</h2>
<p>Before we add anything, let's try what will happen:</p>
<pre><code class="language-cpp"><span class="hljs-function">Dynarray <span class="hljs-title">a</span><span class="hljs-params">(<span class="hljs-number">3</span>)</span></span>;
a.<span class="hljs-built_in">at</span>(<span class="hljs-number">0</span>) = <span class="hljs-number">2</span>; a.<span class="hljs-built_in">at</span>(<span class="hljs-number">1</span>) = <span class="hljs-number">3</span>; a.<span class="hljs-built_in">at</span>(<span class="hljs-number">2</span>) = <span class="hljs-number">5</span>;
Dynarray b = a; <span class="hljs-comment">// It compiles.</span>
<span class="hljs-built_in">print</span>(b); <span class="hljs-comment">// 2 3 5</span>
a.<span class="hljs-built_in">at</span>(<span class="hljs-number">0</span>) = <span class="hljs-number">70</span>;
<span class="hljs-built_in">print</span>(b); <span class="hljs-comment">// 70 3 5</span>
</code></pre>
<p>Ooops! Although it compiles, the pointers <code>a.m_storage</code> and <code>b.m_storage</code> are pointing to the same address!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-style="section::after {

" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="copy-initialization-2">Copy-initialization</h2>
<p>Before we add anything, let's try what will happen:</p>
<pre><code class="language-cpp"><span class="hljs-function">Dynarray <span class="hljs-title">a</span><span class="hljs-params">(<span class="hljs-number">3</span>)</span></span>;
Dynarray b = a;
</code></pre>
<p>Although it compiles, the pointers <code>a.m_storage</code> and <code>b.m_storage</code> are pointing to the same address!</p>
<p>This will cause disaster: consider the case if <code>b</code> &quot;dies&quot; before <code>a</code>:</p>
<pre><code class="language-cpp"><span class="hljs-function">Dynarray <span class="hljs-title">a</span><span class="hljs-params">(<span class="hljs-number">3</span>)</span></span>;
<span class="hljs-keyword">if</span> (some_condition) {
  Dynarray b = a; <span class="hljs-comment">// `a.m_storage` and `b.m_storage` point to the same memory!</span>
  <span class="hljs-comment">// ...</span>
} <span class="hljs-comment">// At this point, dtor of `b` is invoked, which deallocates the memory.</span>
std::cout &lt;&lt; a.<span class="hljs-built_in">at</span>(<span class="hljs-number">0</span>); <span class="hljs-comment">// Invalid memory access!</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="copy-constructor">Copy constructor</h2>
<p>Let <code>a</code> be an object of type <code>Type</code>. The behaviors of <strong>copy-initialization</strong> (in one of the following forms)</p>
<pre><code class="language-cpp">Type b = a;
<span class="hljs-function">Type <span class="hljs-title">b</span><span class="hljs-params">(a)</span></span>;
Type b{a};
</code></pre>
<p>are determined by a constructor: <strong>the copy constructor</strong>.</p>
<ul>
<li>Note! The <code>=</code> in <code>Type b = a;</code> <strong>is not an assignment operator</strong>!</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="copy-constructor-1">Copy constructor</h2>
<p>The copy constructor of a class <code>X</code> has a parameter of type <code>const X &amp;</code>:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
 <span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Dynarray</span>(<span class="hljs-type">const</span> Dynarray &amp;other);
};
</code></pre>
<p>Why <code>const</code>?</p>
<ul>
<li>Logically, it should not modify the object being copied.</li>
</ul>
<p>Why <code>&amp;</code>?</p>
<ul>
<li><strong>Avoid copying.</strong> Pass-by-value is actually <strong>copy-initialization</strong> of the parameter, which will cause infinite recursion here!</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="dynarray-copy-constructor">Dynarray: copy constructor</h2>
<p>What should be the correct behavior of it?</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
 <span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Dynarray</span>(<span class="hljs-type">const</span> Dynarray &amp;other);
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="dynarray-copy-constructor-1">Dynarray: copy constructor</h2>
<ul>
<li>We want a copy of the content of <code>other</code>.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
 <span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Dynarray</span>(<span class="hljs-type">const</span> Dynarray &amp;other)
    : <span class="hljs-built_in">m_storage</span>(<span class="hljs-keyword">new</span> <span class="hljs-type">int</span>[other.<span class="hljs-built_in">size</span>()]{}), <span class="hljs-built_in">m_length</span>(other.<span class="hljs-built_in">size</span>()) {
    <span class="hljs-keyword">for</span> (std::<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i != other.<span class="hljs-built_in">size</span>(); ++i)
      m_storage[i] = other.<span class="hljs-built_in">at</span>(i);
  }
};
</code></pre>
<p>Now the copy-initialization of <code>Dynarray</code> does the correct thing:</p>
<ul>
<li>The new object allocates a new block of memory.</li>
<li>The <strong>contents</strong> are copied, not just the address.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="synthesized-copy-constructor">Synthesized copy constructor</h2>
<p>If the class does not have a user-declared copy constructor, the compiler will try to synthesize one:</p>
<ul>
<li>
<p>The synthesized copy constructor will <strong>copy-initialize</strong> all the members, as if</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
 <span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Dynarray</span>(<span class="hljs-type">const</span> Dynarray &amp;other)
    : <span class="hljs-built_in">m_storage</span>(other.m_storage), <span class="hljs-built_in">m_length</span>(other.m_length) {}
};
</code></pre>
</li>
<li>
<p>If the synthesized copy constructor does not behave as you expect, <strong>define it on your own!</strong></p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="defaulted-copy-constructor">Defaulted copy constructor</h2>
<p>If the synthesized copy constructor behaves as we expect, we can explicitly require it:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
 <span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Dynarray</span>(<span class="hljs-type">const</span> Dynarray &amp;) = <span class="hljs-keyword">default</span>;
  <span class="hljs-comment">// Explicitly defaulted: Explicitly requires the compiler to synthesize</span>
  <span class="hljs-comment">// a copy constructor, with default behavior.</span>
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="deleted-copy-constructor">Deleted copy constructor</h2>
<p>What if we don't want a copy constructor?</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">ComplicatedDevice</span> {
  <span class="hljs-comment">// some members</span>
  <span class="hljs-comment">// Suppose this class represents some complicated device, </span>
  <span class="hljs-comment">// for which there is no correct and suitable behavior for &quot;copying&quot;.</span>
};
</code></pre>
<p>Simply not defining the copy constructor does not work:</p>
<ul>
<li>The compiler will synthesize one for you.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="deleted-copy-constructor-1">Deleted copy constructor</h2>
<p>What if we don't want a copy constructor?</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">ComplicatedDevice</span> {
  <span class="hljs-comment">// some members</span>
  <span class="hljs-comment">// Suppose this class represents some complicated device, </span>
  <span class="hljs-comment">// for which there is no correct and suitable behavior for &quot;copying&quot;.</span>
 <span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">ComplicatedDevice</span>(<span class="hljs-type">const</span> ComplicatedDevice &amp;) = <span class="hljs-keyword">delete</span>;
};
</code></pre>
<p>By saying <code>= delete</code>, we define a <strong>deleted</strong> copy constructor:</p>
<pre><code class="language-cpp">ComplicatedDevice a = <span class="hljs-built_in">something</span>();
ComplicatedDevice b = a; <span class="hljs-comment">// Error: calling deleted function</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="copy-assignment-operator">Copy-assignment operator</h2>
<p>Apart from copy-initialization, there is another form of copying:</p>
<pre><code class="language-cpp">std::string s1 = <span class="hljs-string">&quot;hello&quot;</span>, s2 = <span class="hljs-string">&quot;world&quot;</span>;
s1 = s2; <span class="hljs-comment">// s1 becomes a copy of s2, representing &quot;world&quot;</span>
</code></pre>
<p>In <code>s1 = s2</code>, <code>=</code> is the <strong>assignment operator</strong>.</p>
<p><code>=</code> is the assignment operator <strong>only when it is in an expression.</strong></p>
<ul>
<li><code>s1 = s2</code> is an expression.</li>
<li><code>std::string s1 = s2</code> is in a <strong>declaration statement</strong>, not an expression. <code>=</code> here is a part of the initialization syntax.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="dynarray-copy-assignment-operator">Dynarray: copy-assignment operator</h2>
<p>The copy-assignent operator is defined in the form of <strong>operator overloading</strong>:</p>
<ul>
<li><code>a = b</code> is equivalent to <code>a.operator=(b)</code>.</li>
<li>We will talk about more on operator overloading in a few weeks.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
 <span class="hljs-keyword">public</span>:
  Dynarray &amp;<span class="hljs-keyword">operator</span>=(<span class="hljs-type">const</span> Dynarray &amp;other);
};
</code></pre>
<ul>
<li>The function name is <code>operator=</code>.</li>
<li>In consistent with built-in assignment operators, <code>operator=</code> returns <strong>reference to the left-hand side object</strong> (the object being assigned).
<ul>
<li>It is <code>*this</code>.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="dynarray-copy-assignment-operator-1">Dynarray: copy-assignment operator</h2>
<p>We also want the copy-assignment operator to copy the contents, not only an address.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
 <span class="hljs-keyword">public</span>:
  Dynarray &amp;<span class="hljs-keyword">operator</span>=(<span class="hljs-type">const</span> Dynarray &amp;other) {
    m_storage = <span class="hljs-keyword">new</span> <span class="hljs-type">int</span>[other.<span class="hljs-built_in">size</span>()];
    <span class="hljs-keyword">for</span> (std::<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i != other.<span class="hljs-built_in">size</span>(); ++i)
      m_storage[i] = other.<span class="hljs-built_in">at</span>(i);
    m_length = other.<span class="hljs-built_in">size</span>();
    <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>;
  }
};
</code></pre>
<p>Is this correct?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65;" data-marpit-pagination-total="49">
<h2 id="dynarray-copy-assignment-operator-2">Dynarray: copy-assignment operator</h2>
<p><strong>Avoid memory leaks! Deallocate the memory you don't use!</strong></p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
 <span class="hljs-keyword">public</span>:
  Dynarray &amp;<span class="hljs-keyword">operator</span>=(<span class="hljs-type">const</span> Dynarray &amp;other) {
    <span class="hljs-keyword">delete</span>[] m_storage; <span class="hljs-comment">// !!!</span>
    m_storage = <span class="hljs-keyword">new</span> <span class="hljs-type">int</span>[other.<span class="hljs-built_in">size</span>()];
    <span class="hljs-keyword">for</span> (std::<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i != other.<span class="hljs-built_in">size</span>(); ++i)
      m_storage[i] = other.<span class="hljs-built_in">at</span>(i);
    m_length = other.<span class="hljs-built_in">size</span>();
    <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>;
  }
};
</code></pre>
<p>Is this correct?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ti6j9iksq4j499rqow2q5sm7u9trje7ryyk7xs65" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--style:section::after {

<h2 id="dynarray-copy-assignment-operator-3">Dynarray: copy-assignment operator</h2>
<p>What if <strong>self-assignment</strong> happens?</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
 <span class="hljs-keyword">public</span>:
  Dynarray &amp;<span class="hljs-keyword">operator</span>=(<span class="hljs-type">const</span> Dynarray &amp;other) {
    <span class="hljs-comment">// If `other` and `*this` are actually the same object,</span>
    <span class="hljs-comment">// the memory is deallocated and the data are lost! (DISASTER)</span>
    <span class="hljs-keyword">delete</span>[] m_storage;
    m_storage = <span class="hljs-keyword">new</span> <span class="hljs-type">int</span>[other.<span class="hljs-built_in">size</span>()];
    <span class="hljs-keyword">for</span> (std::<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i != other.<span class="hljs-built_in">size</span>(); ++i)
      m_storage[i] = other.<span class="hljs-built_in">at</span>(i);
    m_length = other.<span class="hljs-built_in">size</span>();
    <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>;
  }
};
</code></pre>
</section>

<h2 id="dynarray-copy-assignment-operator-4">Dynarray: copy-assignment operator</h2>
<p>Assignment operators should be <strong>self-assignment-safe</strong>.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
 <span class="hljs-keyword">public</span>:
  Dynarray &amp;<span class="hljs-keyword">operator</span>=(<span class="hljs-type">const</span> Dynarray &amp;other) {
    <span class="hljs-type">int</span> *new_data = <span class="hljs-keyword">new</span> <span class="hljs-type">int</span>[other.<span class="hljs-built_in">size</span>()];
    <span class="hljs-keyword">for</span> (std::<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i != other.<span class="hljs-built_in">size</span>(); ++i)
      new_data[i] = other.<span class="hljs-built_in">at</span>(i);
    <span class="hljs-keyword">delete</span>[] m_storage;
    m_storage = new_data;
    m_length = other.<span class="hljs-built_in">size</span>();
    <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>;
  }
};
</code></pre>
<p>This is self-assignment-safe. (Think about it.)</p>
</section>

<h2 id="synthesized-defaulted-and-deleted-copy-assignment-operator">Synthesized, defaulted and deleted copy-assignment operator</h2>
<p>Like the copy constructor:</p>
<ul>
<li>
<p>The copy-assignment operator can also be <strong>deleted</strong>, by declaring it as <code>= delete;</code>.</p>
</li>
<li>
<p>If you don't define it, the compiler will generate one that copy-assigns all the members, as if it is defined as:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
 <span class="hljs-keyword">public</span>:
  Dynarray &amp;<span class="hljs-keyword">operator</span>=(<span class="hljs-type">const</span> Dynarray &amp;other) {
    m_storage = other.m_storage;
    m_length = other.m_length;
    <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>;
  }
};
</code></pre>
</li>
<li>
<p>You can also require a synthesized one explicitly by saying <code>= default;</code>.</p>
</li>
</ul>
</section>

<h2 id="important-the-rule-of-three-reasoning">[IMPORTANT] The rule of three: Reasoning</h2>
<p>Among the <strong>copy constructor</strong>, the <strong>copy-assignment operator</strong> and the <strong>destructor</strong>:</p>
<ul>
<li>If a class needs a user-provided version of one of them, <strong>usually</strong>, it needs a user-provided version of <strong>each</strong> of them.</li>
<li>Why?</li>
</ul>

<h2 id="important-the-rule-of-three-reasoning-1">[IMPORTANT] The rule of three: Reasoning</h2>
<p>Among the <strong>copy constructor</strong>, the <strong>copy-assignment operator</strong> and the <strong>destructor</strong>:</p>
<ul>
<li>If a class needs a user-provided version of one of them,</li>
<li><strong>usually</strong>, it is a class that <strong>manages some resources</strong>,</li>
<li>for which <strong>the default behavior of the copy-control members does not suffice</strong>.</li>
<li>Therefore, all of the three special functions need a user-provided version.
<ul>
<li>Define them in a correct, well-defined manner.</li>
<li>If a class should not be copy-constructible or copy-assignable, <strong>delete that function</strong>.</li>
</ul>
</li>
</ul>
</section>

</ul>
<p>then the compiler <strong>still generates <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.464ex;" xmlns="http://www.w3.org/2000/svg" width="1.109ex" height="1.464ex" role="img" focusable="false" viewBox="0 -442 490 647"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D466" d="M21 287Q21 301 36 335T84 406T158 442Q199 442 224 419T250 355Q248 336 247 334Q247 331 231 288T198 191T182 105Q182 62 196 45T238 27Q261 27 281 38T312 61T339 94Q339 95 344 114T358 173T377 247Q415 397 419 404Q432 431 462 431Q475 431 483 424T494 412T496 403Q496 390 447 193T391 -23Q363 -106 294 -155T156 -205Q111 -205 77 -183T43 -117Q43 -95 50 -80T69 -58T89 -48T106 -45Q150 -45 150 -87Q150 -107 138 -122T115 -142T102 -147L99 -148Q101 -153 118 -160T152 -167H160Q177 -167 186 -165Q219 -156 247 -127T290 -65T313 -9T321 21L315 17Q309 13 296 6T270 -6Q250 -11 231 -11Q185 -11 150 11T104 82Q103 89 103 113Q103 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container></strong>, but <strong>this behavior has been deprecated since C++11</strong>.</p>

</ul>

<h2 id="important-the-rule-of-three">[IMPORTANT] The rule of three</h2>
<p>Into modern C++: <strong>The Rule of Five</strong>.</p>
<ul>
<li><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.054ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.242ex" role="img" focusable="false" viewBox="0 -525 1000 549"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D2" d="M580 514Q580 525 596 525Q601 525 604 525T609 525T613 524T615 523T617 520T619 517T622 512Q659 438 720 381T831 300T927 263Q944 258 944 250T935 239T898 228T840 204Q696 134 622 -12Q618 -21 615 -22T600 -24Q580 -24 580 -17Q580 -13 585 0Q620 69 671 123L681 133H70Q56 140 56 153Q56 168 72 173H725L735 181Q774 211 852 250Q851 251 834 259T789 283T735 319L725 327H72Q56 332 56 347Q56 360 70 367H681L671 377Q638 412 609 458T580 514Z"></path></g></g></g></svg></mjx-container> We will talk about it in later lectures.</li>
</ul>
<p>Read <em>Effective Modern C++</em> Item 17 for a thorough understanding of this.</p>
</section>

<h2 id="summary">Summary</h2>
<p>Lifetime of an object:</p>
<ul>
<li>depends on its <strong>storage</strong>: local non-<code>static</code>, global, allocated, ...</li>
<li><strong>Initialization</strong> marks the beginning of the lifetime of an object.
<ul>
<li>Classes can control the way of initialization using <strong>constructors</strong>.</li>
</ul>
</li>
<li>When the lifetime of an object ends, it is <strong>destroyed</strong>.
<ul>
<li>If it is an object of class type, its <strong>destructor</strong> is called right before it is destroyed.</li>
</ul>
</li>
</ul>
</section>

<h2 id="summary-1">Summary</h2>
<p>Copy control</p>
<ul>
<li>Usually, the <strong>copy control members</strong> refer to the copy constructor, the copy assignment operator and the destructor.</li>
<li>Copy constructor: <code>ClassName(const ClassName &amp;)</code></li>
<li>Copy assignment operator: <code>ClassName &amp;operator=(const ClassName &amp;)</code>
<ul>
<li>It needs to be <strong>self-assignment safe</strong>.</li>
</ul>
</li>
<li>Destructor: <code>~ClassName()</code></li>
<li><code>=default</code>, <code>=delete</code></li>
<li>The rule of three.</li>
</ul>
</section>
