</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="type-of-a-variable">Type of a variable</h2>
<p>Every variable in C has a type.</p>
<ul>
<li>The type is <strong>fully deterministic</strong> and <strong>cannot be changed</strong>.</li>
<li>The type is <strong>known even when the program is not run</strong>.
<ul>
<li><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.057ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.247ex" role="img" focusable="false" viewBox="0 -526 1000 551"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D4" d="M308 524Q318 526 323 526Q340 526 340 514Q340 507 336 499Q326 476 314 454T292 417T274 391T260 374L255 368Q255 367 500 367Q744 367 744 368L739 374Q734 379 726 390T707 416T685 453T663 499Q658 511 658 515Q658 525 680 525Q687 524 690 523T695 519T701 507Q766 359 902 287Q921 276 939 269T961 259T966 250Q966 246 965 244T960 240T949 236T930 228T902 213Q763 137 701 -7Q697 -16 695 -19T690 -23T680 -25Q658 -25 658 -15Q658 -11 663 1Q673 24 685 46T707 83T725 109T739 126L744 132Q744 133 500 133Q255 133 255 132L260 126Q265 121 273 110T292 84T314 47T336 1Q341 -11 341 -15Q341 -25 319 -25Q312 -24 309 -23T304 -19T298 -7Q233 141 97 213Q83 221 70 227T51 235T41 239T35 243T34 250T35 256T40 261T51 265T70 273T97 287Q235 363 299 509Q305 522 308 524ZM792 319L783 327H216Q183 294 120 256L110 250L120 244Q173 212 207 181L216 173H783L792 181Q826 212 879 244L889 250L879 256Q826 288 792 319Z"></path></g></g></g></svg></mjx-container> The type is known at <strong>compile-time</strong>.</li>
<li><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.057ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.247ex" role="img" focusable="false" viewBox="0 -526 1000 551"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D4" d="M308 524Q318 526 323 526Q340 526 340 514Q340 507 336 499Q326 476 314 454T292 417T274 391T260 374L255 368Q255 367 500 367Q744 367 744 368L739 374Q734 379 726 390T707 416T685 453T663 499Q658 511 658 515Q658 525 680 525Q687 524 690 523T695 519T701 507Q766 359 902 287Q921 276 939 269T961 259T966 250Q966 246 965 244T960 240T949 236T930 228T902 213Q763 137 701 -7Q697 -16 695 -19T690 -23T680 -25Q658 -25 658 -15Q658 -11 663 1Q673 24 685 46T707 83T725 109T739 126L744 132Q744 133 500 133Q255 133 255 132L260 126Q265 121 273 110T292 84T314 47T336 1Q341 -11 341 -15Q341 -25 319 -25Q312 -24 309 -23T304 -19T298 -7Q233 141 97 213Q83 221 70 227T51 235T41 239T35 243T34 250T35 256T40 261T51 265T70 273T97 287Q235 363 299 509Q305 522 308 524ZM792 319L783 327H216Q183 294 120 256L110 250L120 244Q173 212 207 181L216 173H783L792 181Q826 212 879 244L889 250L879 256Q826 288 792 319Z"></path></g></g></g></svg></mjx-container> C is <strong>statically-typed</strong> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></g></g></svg></mjx-container>. <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.057ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.247ex" role="img" focusable="false" viewBox="0 -526 1000 551"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D4" d="M308 524Q318 526 323 526Q340 526 340 514Q340 507 336 499Q326 476 314 454T292 417T274 391T260 374L255 368Q255 367 500 367Q744 367 744 368L739 374Q734 379 726 390T707 416T685 453T663 499Q658 511 658 515Q658 525 680 525Q687 524 690 523T695 519T701 507Q766 359 902 287Q921 276 939 269T961 259T966 250Q966 246 965 244T960 240T949 236T930 228T902 213Q763 137 701 -7Q697 -16 695 -19T690 -23T680 -25Q658 -25 658 -15Q658 -11 663 1Q673 24 685 46T707 83T725 109T739 126L744 132Q744 133 500 133Q255 133 255 132L260 126Q265 121 273 110T292 84T314 47T336 1Q341 -11 341 -15Q341 -25 319 -25Q312 -24 309 -23T304 -19T298 -7Q233 141 97 213Q83 221 70 227T51 235T41 239T35 243T34 250T35 256T40 261T51 265T70 273T97 287Q235 363 299 509Q305 522 308 524ZM792 319L783 327H216Q183 294 120 256L110 250L120 244Q173 212 207 181L216 173H783L792 181Q826 212 879 244L889 250L879 256Q826 288 792 319Z"></path></g></g></g></svg></mjx-container> C has a <strong>static type system</strong>.</li>
<li>In contrast, Python is <strong>dynamically-typed</strong>.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="statically-typed-vs-dynamically-typed">Statically-typed vs dynamically-typed</h2>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<p>Python: dynamically typed</p>
<pre><code class="language-python">a = <span class="hljs-number">42</span>       <span class="hljs-comment"># Type of a is int.</span>
a = <span class="hljs-string">&quot;hello&quot;</span>  <span class="hljs-comment"># Type of a becomes str.</span>
</code></pre>
<p>The type of a variable</p>
<ul>
<li>
<p>can be changed, and</p>
</li>
<li>
<p>is not necessarily known until we run the program.</p>
</div>
<div>
</li>
</ul>
<p>C: statically-typed</p>
<pre><code class="language-c"><span class="hljs-type">int</span> a = <span class="hljs-number">42</span>;  <span class="hljs-comment">// Type of a is int.</span>
a = <span class="hljs-string">&quot;hello&quot;</span>; <span class="hljs-comment">// Error! Types mismatch!</span>
</code></pre>
<p>The type of a variable</p>
<ul>
<li>is explicitly written on declaration, and</li>
<li>is known at compile-time, and</li>
<li>cannot be changed.</div>
</li>
</ul>
</div>
<p>A type-related error in C is <em>(usually)</em> a <strong>compile error</strong>:</p>
<ul>
<li>It stops the compiler. The executable will not be generated.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="declare-a-variable">Declare a variable</h2>
<p>To declare a variable, we need to specify its <strong>type</strong> and <strong>name</strong>.</p>
<pre><code class="language-c">Type name;
</code></pre>
<p>Example:</p>
<pre><code class="language-c"><span class="hljs-type">int</span> x;    <span class="hljs-comment">// Declares a variable named `x`, whose type is `int`.</span>
<span class="hljs-type">double</span> y; <span class="hljs-comment">// Declares a variable named `y`, whose type is `double`.</span>
</code></pre>
<p>We may declare multiple variables of a same type in one declaration statement, separated by <code>,</code>:</p>
<pre><code class="language-c"><span class="hljs-type">int</span> x, y; <span class="hljs-comment">// Declares two variables `x` and `y`, both having type `int`.</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="declare-a-variable-1">Declare a variable</h2>
<p>A <strong>variable declaration</strong> can be placed</p>
<ul>
<li>inside a function, which declares a <strong>local variable</strong>, or</li>
<li>outside of any functions, which declares a <strong>global variable</strong>.</li>
</ul>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> x, y; <span class="hljs-comment">// global variables</span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d%d&quot;</span>, &amp;x, &amp;y);
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, x + y);
}
</code></pre>
  </div>
  <div>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-comment">// local variables in `main`</span>
  <span class="hljs-type">int</span> x, y;
  <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d%d&quot;</span>, &amp;x, &amp;y);
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, x + y);
}
</code></pre>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="local-variables-vs-global-variables">Local variables vs global variables</h2>
<p>Which one do you prefer?</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> x, y; <span class="hljs-comment">// global variables</span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d%d&quot;</span>, &amp;x, &amp;y);
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, x + y);
}
</code></pre>
  </div>
  <div>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-comment">// local variables in `main`</span>
  <span class="hljs-type">int</span> x, y;
  <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d%d&quot;</span>, &amp;x, &amp;y);
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, x + y);
}
</code></pre>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="what-are-these-variables-used-for">What are these variables used for?</h2>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-comment">// Other #includes</span>

<span class="hljs-type">int</span> x, y; <span class="hljs-comment">// What are these two variables used for?</span>

<span class="hljs-type">int</span> <span class="hljs-title function_">moveSpaceShuttle</span><span class="hljs-params">(SpaceShuttle *shuttle, Coord to, Vehicle *by)</span> {
  <span class="hljs-comment">// 109 lines</span>
}
<span class="hljs-type">int</span> <span class="hljs-title function_">makePreparations</span><span class="hljs-params">(Environment *env, Task tasks[], Time time)</span> {
  <span class="hljs-comment">// 73 lines</span>
}
LaunchResult <span class="hljs-title function_">launchSpaceShuttle</span><span class="hljs-params">(SpaceShuttle *shuttle, Task tasks[])</span> {
  <span class="hljs-comment">// 35 lines</span>
}
<span class="hljs-comment">// Other 136 functions, 3325 lines in total</span>
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-comment">// 120 lines</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="readability-matters">Readability matters</h2>
<p><strong>[Best practice]</strong> <u>Declare the variable when you first use it!</u></p>
<ul>
<li>If the declaration and use of the variable are too separated, it will become much more difficult to figure out what they are used for as the program goes longer.</li>
</ul>
<p><strong>[Best practice]</strong> <u>Use meaningful names!</u></p>
<ul>
<li>The program would be a mess if polluted with names like <code>a</code>, <code>b</code>, <code>c</code>, <code>d</code>, <code>x</code>, <code>y</code>, <code>cnt</code>, <code>cnt_2</code>, <code>flag1</code>, <code>flag2</code>, <code>flag3</code> everywhere.</li>
<li>Use meaningful names: <code>sumOfScore</code>, <code>student_cnt</code>, <code>open_success</code>, ...</li>
</ul>
<p><strong>Readability is very important.</strong> Many students debug day and night simply because their programs are not human-readable.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="use-of-global-variables">Use of global variables</h2>
<p>One reason for using global variables is to have them shared between functions:</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-c"><span class="hljs-type">int</span> input;
<span class="hljs-type">void</span> <span class="hljs-title function_">work</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, input);
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d&quot;</span>, &amp;input);
  work();
}
</code></pre>
  </div>
  <div>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">work</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-comment">// Error: `input` was not decared</span>
  <span class="hljs-comment">// in this scope.</span>
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, input);
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> input;
  <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d&quot;</span>, &amp;input);
  work();
}
</code></pre>
  </div>
</div>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.054ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.242ex" role="img" focusable="false" viewBox="0 -525 1000 549"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D2" d="M580 514Q580 525 596 525Q601 525 604 525T609 525T613 524T615 523T617 520T619 517T622 512Q659 438 720 381T831 300T927 263Q944 258 944 250T935 239T898 228T840 204Q696 134 622 -12Q618 -21 615 -22T600 -24Q580 -24 580 -17Q580 -13 585 0Q620 69 671 123L681 133H70Q56 140 56 153Q56 168 72 173H725L735 181Q774 211 852 250Q851 251 834 259T789 283T735 319L725 327H72Q56 332 56 347Q56 360 70 367H681L671 377Q638 412 609 458T580 514Z"></path></g></g></g></svg></mjx-container> More about scopes and name lookup in later lectures / recitations.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="initialize-a-variable">Initialize a variable</h2>
<p>A variable can be <strong>initialized</strong> on declaration.</p>
<pre><code class="language-c"><span class="hljs-type">int</span> x = <span class="hljs-number">42</span>; <span class="hljs-comment">// Declares the variable `x` of type `int`,</span>
            <span class="hljs-comment">// and initializes its value to 42.</span>
<span class="hljs-type">int</span> a = <span class="hljs-number">0</span>, b, c = <span class="hljs-number">42</span>; <span class="hljs-comment">// Declares three `int` variables, with `a` initialized</span>
                      <span class="hljs-comment">// to 0, `c` initialized to 42, and `b` uninitialized.</span>
</code></pre>
<p>This is syntactically <strong>different</strong> (though seems equivalent) to</p>
<pre><code class="language-c"><span class="hljs-type">int</span> x;  <span class="hljs-comment">// Declares `x`, uninitialized.</span>
x = <span class="hljs-number">42</span>; <span class="hljs-comment">// Assigns 42 to `x`.</span>
</code></pre>
<p><strong>[Best practice]</strong> <u>Initialize the variable if possible. Prefer initialization to later assignment.</u></p>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.054ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.242ex" role="img" focusable="false" viewBox="0 -525 1000 549"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D2" d="M580 514Q580 525 596 525Q601 525 604 525T609 525T613 524T615 523T617 520T619 517T622 512Q659 438 720 381T831 300T927 263Q944 258 944 250T935 239T898 228T840 204Q696 134 622 -12Q618 -21 615 -22T600 -24Q580 -24 580 -17Q580 -13 585 0Q620 69 671 123L681 133H70Q56 140 56 153Q56 168 72 173H725L735 181Q774 211 852 250Q851 251 834 259T789 283T735 319L725 327H72Q56 332 56 347Q56 360 70 367H681L671 377Q638 412 609 458T580 514Z"></path></g></g></g></svg></mjx-container> More on initialization in later lectures.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h1 id="arithmetic-types">Arithmetic types</h1>
<p>Refer to <a href="https://en.cppreference.com/w/c/language/arithmetic_types">this page</a> for a complete, detailed and standard documentation.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="integer-types">Integer types</h2>
<p>Is <code>int</code> equivalent to <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.509ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 667 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="2124" d="M39 -1Q29 9 29 12Q29 23 60 77T219 337L410 648H364Q261 648 210 628Q168 612 142 588T109 545T97 509T88 490Q85 489 80 489Q72 489 61 503L70 588Q72 607 75 628T79 662T81 675Q84 677 88 681Q90 683 341 683H592Q604 673 604 666Q604 662 412 348L221 37Q221 35 301 35Q406 35 446 48Q504 68 543 111T597 212Q602 239 617 239Q624 239 629 234T635 223Q635 215 621 113T604 8L597 1Q595 -1 317 -1H39ZM148 637L166 648H112V632Q111 629 110 622T108 612Q108 608 110 608T116 612T129 623T148 637ZM552 646Q552 648 504 648Q452 648 450 643Q448 639 266 343T77 37Q77 35 128 35H179L366 339L552 646ZM572 35Q581 89 581 97L561 77Q542 59 526 48L508 37L539 35H572Z"></path></g></g></g></g></svg></mjx-container>?</p>
<ul>
<li>Is there a limitation on the numbers that <code>int</code> can represent?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="integer-types-1">Integer types</h2>
<p>Is <code>int</code> equivalent to <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.509ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 667 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="2124" d="M39 -1Q29 9 29 12Q29 23 60 77T219 337L410 648H364Q261 648 210 628Q168 612 142 588T109 545T97 509T88 490Q85 489 80 489Q72 489 61 503L70 588Q72 607 75 628T79 662T81 675Q84 677 88 681Q90 683 341 683H592Q604 673 604 666Q604 662 412 348L221 37Q221 35 301 35Q406 35 446 48Q504 68 543 111T597 212Q602 239 617 239Q624 239 629 234T635 223Q635 215 621 113T604 8L597 1Q595 -1 317 -1H39ZM148 637L166 648H112V632Q111 629 110 622T108 612Q108 608 110 608T116 612T129 623T148 637ZM552 646Q552 648 504 648Q452 648 450 643Q448 639 266 343T77 37Q77 35 128 35H179L366 339L552 646ZM572 35Q581 89 581 97L561 77Q542 59 526 48L508 37L539 35H572Z"></path></g></g></g></g></svg></mjx-container>?</p>
<ul>
<li>Is there a limitation on the numbers that <code>int</code> can represent?</li>
</ul>
<p>Experiment:</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> x = <span class="hljs-number">1</span>;
  <span class="hljs-keyword">while</span> (<span class="hljs-number">1</span>) {
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, x);
    x *= <span class="hljs-number">2</span>; <span class="hljs-comment">// x = x * 2</span>
    getchar();
  }
}
</code></pre>
  </div>
  <div>
<ul>
<li>
<p>On 64-bit Ubuntu 22.04 and compiled with GCC 13, after printing <code>1073741824</code> (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.919ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 1290.1 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g><g data-mml-node="TeXAtom" transform="translate(533,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mn"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(500,0)"></path></g></g></g></g></g></svg></mjx-container>), the output becomes negative, and then <code>0</code>.</p>
<pre><code>1073741824
-2147483648
0
0
</code></pre>
</div>
</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="bits-and-bytes">Bits and bytes</h2>
<p>Information is stored in computers <strong>in binary</strong>.</p>

<h2 id="integer-types-2">Integer types</h2>
<p>An integer type in C is either <strong>signed</strong> or <strong>unsigned</strong>, and has a <strong>width</strong> denoting the number of bits that can be used to represent values.</p>
<p>Suppose we have an integer type of <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.357ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 600 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container> bits in width.</p>
<ul>

<h2 id="integer-types-3">Integer types</h2>
<a align="center">
  <img src="img/int_types.png" />
</a>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="integer-types-4">Integer types</h2>
<ul>
<li>
<p>The keyword <code>int</code> is optional in types other than <code>int</code>:</p>
<ul>
<li>e.g. <code>short int</code> and <code>short</code> name the same type.</li>
<li>e.g. <code>unsigned int</code> and <code>unsigned</code> name the same type.</li>
</ul>
</li>
<li>
<p>&quot;Unsigned-ness&quot; needs to be written explicitly: <code>unsigned int</code>, <code>unsigned long</code>, ...</p>
</li>
<li>
<p>Types without the keyword <code>unsigned</code> are signed by default:</p>
<ul>
<li>e.g. <code>signed int</code> and <code>int</code> name the same type.</li>
<li>e.g. <code>signed long int</code>, <code>signed long</code>, <code>long int</code> and <code>long</code> name the same type.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="width-of-integer-types">Width of integer types</h2>
<div align="center">
<table>
<thead>
<tr>
<th>type</th>
<th>width (at least)</th>
<th>width (usually)</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>short</code></td>
<td>16 bits</td>
<td>16 bits</td>
</tr>
<tr>
<td><code>int</code></td>
<td>16 bits</td>
<td>32 bits</td>
</tr>
<tr>
<td><code>long</code></td>
<td>32 bits</td>
<td>32 or 64 bits</td>
</tr>
<tr>
<td><code>long long</code></td>
<td>64 bits</td>
<td>64 bits</td>
</tr>
</tbody>
</table>
</div>
<ul>
<li>A signed type has the same width as its <code>unsigned</code> counterpart.</li>
<li><strong>It is also guaranteed that <code>sizeof(short)</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.312ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="1.751ex" role="img" focusable="false" viewBox="0 -636 778 774"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2A7D" d="M674 636Q682 636 688 630T694 615T687 601Q686 600 417 472L151 346L399 228Q687 92 691 87Q694 81 694 76Q694 58 676 56H670L382 192Q92 329 90 331Q83 336 83 348Q84 359 96 365Q104 369 382 500T665 634Q669 636 674 636ZM94 170Q102 172 104 172Q110 171 254 103T535 -30T678 -98Q694 -106 694 -118Q694 -136 676 -138H670L382 -2Q92 135 90 137Q83 142 83 154Q84 164 94 170Z"></path></g></g></g></svg></mjx-container> <code>sizeof(int)</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.312ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="1.751ex" role="img" focusable="false" viewBox="0 -636 778 774"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2A7D" d="M674 636Q682 636 688 630T694 615T687 601Q686 600 417 472L151 346L399 228Q687 92 691 87Q694 81 694 76Q694 58 676 56H670L382 192Q92 329 90 331Q83 336 83 348Q84 359 96 365Q104 369 382 500T665 634Q669 636 674 636ZM94 170Q102 172 104 172Q110 171 254 103T535 -30T678 -98Q694 -106 694 -118Q694 -136 676 -138H670L382 -2Q92 135 90 137Q83 142 83 154Q84 164 94 170Z"></path></g></g></g></svg></mjx-container> <code>sizeof(long)</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.312ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="1.751ex" role="img" focusable="false" viewBox="0 -636 778 774"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2A7D" d="M674 636Q682 636 688 630T694 615T687 601Q686 600 417 472L151 346L399 228Q687 92 691 87Q694 81 694 76Q694 58 676 56H670L382 192Q92 329 90 331Q83 336 83 348Q84 359 96 365Q104 369 382 500T665 634Q669 636 674 636ZM94 170Q102 172 104 172Q110 171 254 103T535 -30T678 -98Q694 -106 694 -118Q694 -136 676 -138H670L382 -2Q92 135 90 137Q83 142 83 154Q84 164 94 170Z"></path></g></g></g></svg></mjx-container> <code>sizeof(long long)</code>.</strong>
<ul>
<li><code>sizeof(T)</code> is the number of <strong>bytes</strong> that <code>T</code> holds.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="implementation-defined-behaviors">Implementation-defined behaviors</h2>
<p>The standard states that the exact width of the integer types is <strong>implementation-defined</strong>.</p>
<ul>
<li><strong>Implementation</strong>: The compiler and the standard library.</li>
<li>An implementation-defined behavior depends on the compiler and the standard library, and is often also related to the hosted environment (e.g. the operating system).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="which-one-should-i-use">Which one should I use?</h2>
<p><strong><code>int</code> is the most optimal integer type for the platform.</strong></p>
<ul>
<li>Use <code>int</code> for integer arithmetic by default.</li>
<li>Use <code>long long</code> if the range of <code>int</code> is not large enough.</li>
<li>Use smaller types (<code>short</code>, or even <code>unsigned char</code>) for memory-saving or other special purposes.</li>
<li>Use <code>unsigned</code> types for special purposes. We will see some in later lectures.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="real-floating-types">Real floating types</h2>
<p>&quot;Floating-point&quot;: The number's radix point can &quot;float&quot; anywhere to the left, right, or between the significant digits of the number.</p>
<p>Real floating-point types can be used to represent <em>some</em> real values.</p>
<ul>
<li>Real floating-point types <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.486ex;" xmlns="http://www.w3.org/2000/svg" width="4.022ex" height="2.106ex" role="img" focusable="false" viewBox="0 -716 1777.8 931"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2260" d="M166 -215T159 -215T147 -212T141 -204T139 -197Q139 -190 144 -183L306 133H70Q56 140 56 153Q56 168 72 173H327L406 327H72Q56 332 56 347Q56 360 70 367H426Q597 702 602 707Q605 716 618 716Q625 716 630 712T636 703T638 696Q638 692 471 367H707Q722 359 722 347Q722 336 708 328L451 327L371 173H708Q722 163 722 153Q722 140 707 133H351Q175 -210 170 -212Q166 -215 159 -215Z"></path></g><g data-mml-node="TeXAtom" data-mjx-texclass="ORD" transform="translate(1055.8,0)"><g data-mml-node="mi"><path data-c="211D" d="M17 665Q17 672 28 683H221Q415 681 439 677Q461 673 481 667T516 654T544 639T566 623T584 607T597 592T607 578T614 565T618 554L621 548Q626 530 626 497Q626 447 613 419Q578 348 473 326L455 321Q462 310 473 292T517 226T578 141T637 72T686 35Q705 30 705 16Q705 7 693 -1H510Q503 6 404 159L306 310H268V183Q270 67 271 59Q274 42 291 38Q295 37 319 35Q344 35 353 28Q362 17 353 3L346 -1H28Q16 5 16 16Q16 35 55 35Q96 38 101 52Q106 60 106 341T101 632Q95 645 55 648Q17 648 17 665ZM241 35Q238 42 237 45T235 78T233 163T233 337V621L237 635L244 648H133Q136 641 137 638T139 603T141 517T141 341Q141 131 140 89T134 37Q133 36 133 35H241ZM457 496Q457 540 449 570T425 615T400 634T377 643Q374 643 339 648Q300 648 281 635Q271 628 270 610T268 481V346H284Q327 346 375 352Q421 364 439 392T457 496ZM492 537T492 496T488 427T478 389T469 371T464 361Q464 360 465 360Q469 360 497 370Q593 400 593 495Q593 592 477 630L457 637L461 626Q474 611 488 561Q492 537 492 496ZM464 243Q411 317 410 317Q404 317 401 315Q384 315 370 312H346L526 35H619L606 50Q553 109 464 243Z"></path></g></g></g></g></svg></mjx-container>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="real-floating-types-1">Real floating types</h2>
<p>C has three types for representing real floating-point values:</p>
<ul>
<li><code>float</code>: single precision. Matches <a href="https://en.wikipedia.org/wiki/Single-precision_floating-point_format">IEEE754 binary32 format</a> if supported.</li>
<li><code>double</code>: double precision. Matches <a href="https://en.wikipedia.org/wiki/Double-precision_floating-point_format">IEEE754 binary64 format</a> if supported.</li>
<li><code>long double</code>: extended precision. A floating-point type whose precision and range are at least as good as those of <code>double</code>.</li>
</ul>
<p>Details of IEEE754 formats are not required in CS100.</p>
<p>Range of values can be found in <a href="https://en.cppreference.com/w/c/language/arithmetic_types#Range_of_values">this table</a>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="which-one-should-i-use-1">Which one should I use?</h2>
<p>Use <code>double</code> for real floating-point arithmetic by default.</p>
<ul>
<li>In some cases the precision of <code>float</code> is not enough.</li>
<li>Don't worry about efficiency! <code>double</code> arithmetic is not necessarily slower than <code>float</code>.</li>
</ul>
<p><strong>Do not use floating-point types for integer arithmetic!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="scanfprintf"><code>scanf</code>/<code>printf</code></h2>
<p>Refer to the table in <a href="https://en.cppreference.com/w/c/io/fscanf">this page</a>.</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div align="center">
<table>
<thead>
<tr>
<th>type</th>
<th>format specifier</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>short</code></td>
<td><code>%hd</code></td>
</tr>
<tr>
<td><code>int</code></td>
<td><code>%d</code></td>
</tr>
<tr>
<td><code>long</code></td>
<td><code>%ld</code></td>
</tr>
<tr>
<td><code>long long</code></td>
<td><code>%lld</code></td>
</tr>
</tbody>
</table>
  </div>
  <div align="center">
<table>
<thead>
<tr>
<th>type</th>
<th>format specifier</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>unsigned short</code></td>
<td><code>%hu</code></td>
</tr>
<tr>
<td><code>unsigned</code></td>
<td><code>%u</code></td>
</tr>
<tr>
<td><code>unsigned long</code></td>
<td><code>%lu</code></td>
</tr>
<tr>
<td><code>unsigned long long</code></td>
<td><code>%llu</code></td>
</tr>
</tbody>
</table>
  </div>
</div>
<ul>
<li><code>%f</code> for <code>float</code>, <code>%lf</code> for <code>double</code>, and <code>%Lf</code> for <code>long double</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="exercise">Exercise</h2>
<p>Write the &quot;A+B&quot; program for real numbers. Which type do you decide to use? How do you read and print the values?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="exercise-1">Exercise</h2>
<p>Write the &quot;A+B&quot; program for real numbers. Which type do you decide to use? How do you read and print the values?</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">double</span> a, b;
  <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%lf%lf&quot;</span>, &amp;a, &amp;b);
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%lf\n&quot;</span>, a + b);
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>

<h2 id="character-types">Character types</h2>
<p>The C standard provides three <strong>different</strong> character types: <code>signed char</code>, <code>unsigned char</code> and <code>char</code>.</p>
<p>Let <code>T</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="3.269ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 1444.8 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2208" d="M84 250Q84 372 166 450T360 539Q361 539 377 539T419 540T469 540H568Q583 532 583 520Q583 511 570 501L466 500Q355 499 329 494Q280 482 242 458T183 409T147 354T129 306T124 272V270H568Q583 262 583 250T568 230H124V228Q124 207 134 177T167 112T231 48T328 7Q355 1 466 0H570Q583 -10 583 -20Q583 -32 568 -40H471Q464 -40 446 -40T417 -41Q262 -41 172 45Q84 127 84 250Z"></path></g><g data-mml-node="mo" transform="translate(944.8,0)"><path data-c="7B" d="M434 -231Q434 -244 428 -250H410Q281 -250 230 -184Q225 -177 222 -172T217 -161T213 -148T211 -133T210 -111T209 -84T209 -47T209 0Q209 21 209 53Q208 142 204 153Q203 154 203 155Q189 191 153 211T82 231Q71 231 68 234T65 250T68 266T82 269Q116 269 152 289T203 345Q208 356 208 377T209 529V579Q209 634 215 656T244 698Q270 724 324 740Q361 748 377 749Q379 749 390 749T408 750H428Q434 744 434 732Q434 719 431 716Q429 713 415 713Q362 710 332 689T296 647Q291 634 291 499V417Q291 370 288 353T271 314Q240 271 184 255L170 250L184 245Q202 239 220 230T262 196T290 137Q291 131 291 1Q291 -134 296 -147Q306 -174 339 -192T415 -213Q429 -213 431 -216Q434 -219 434 -231Z"></path></g></g></g></svg></mjx-container><code>signed char</code>, <code>unsigned char</code>, <code>char</code><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 500 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="7D" d="M65 731Q65 745 68 747T88 750Q171 750 216 725T279 670Q288 649 289 6 <p><code>1 == sizeof(T) &lt;= sizeof(short) &lt;= sizeof(int) &lt;= sizeof(long) &lt;= sizeof(long long)</code>.</p>
<ul>
<li><strong><code>T</code> takes exactly 1 byte</strong>.</li>
</ul>
<p>Question: What is the valid range of <code>signed char</code>? <code>unsigned char</code>?</p>

<h2 id="ascii-american-standard-code-for-information-interchange-1">ASCII (American Standard Code for Information Interchange)</h2>
<p>A character is represented in computers as its <a href="https://en.cppreference.com/w/c/language/ascii">ASCII code</a>, which is a small integer.</p>
<ul>
<li>We only consider the so-called <em>ASCII characters</em> here.</li>
</ul>
<a align="center">
  <img src="img/ascii_char.png" />
</a>
<p>A character is <strong>nothing but</strong> an integer! In C, there is no &quot;conversion&quot; between characters and ASCII code!</p>
</section>

<p>Example: Given a lowercase letter, return its uppercase form.</p>
<pre><code class="language-c"><span class="hljs-type">char</span> <span class="hljs-title function_">to_uppercase</span><span class="hljs-params">(<span class="hljs-type">char</span> x)</span> {

<h2 id="best-practice-uavoid-magic-numbersu">[Best practice] <u>Avoid magic numbers</u></h2>
<p>What is the meaning of <code>32</code> here? <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.054ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.242ex" role="img" focusable="false" viewBox="0 -525 1000 549"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D2" d="M580 514Q580 525 596 525Q601 525 604 525T609 525T613 524T615 523T617 520T619 517T622 512Q659 438 720 381T831 300T927 263Q944 258 944 250T935 239T898 228T840 204Q696 134 622 -12Q618 -21 615 -22T600 -24Q580 -24 580 -17Q580 -13 585 0Q620 69 671 123L681 133H70Q56 140 56 153Q56 168 72 173H725L735 181Q774 211 852 250Q851 251 834 259T789 283T735 319L725 327H72Q56 332 56 347Q56 360 70 367H681L671 377Q638 412 609 458T580 514Z"></path></g></g></g></svg></mjx-container> a magic number.</p>
<pre><code class="language-c"><span class="hljs-type">char</span> <span class="hljs-title function_">to_uppercase</span><span class="hljs-params">(<span class="hljs-type">char</span> x)</span> {
  <span class="hljs-keyword">return</span> x - <span class="hljs-number">32</span>;
}
</code></pre>
<p>Write it in a more human-readable way:</p>
<pre><code class="language-c"><span class="hljs-type">char</span> <span class="hljs-title function_">to_uppercase</span><span class="hljs-params">(<span class="hljs-type">char</span> x)</span> {
  <span class="hljs-keyword">return</span> x - (<span class="hljs-string">&#x27;a&#x27;</span> - <span class="hljs-string">&#x27;A&#x27;</span>);
}
</code></pre>
</section>

<h2 id="escape-sequence">Escape sequence</h2>
<p>Some special characters are not directly representable: newline, tab, quote, ...</p>
<p>We use <a href="https://en.cppreference.com/w/c/language/escape">escape sequences</a>, e.g.</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div align="center">
<table>
<thead>
<tr>
<th>escape sequence</th>
<th>description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>\'</code></td>
<td>single quote</td>
</tr>
<tr>
<td><code>\&quot;</code></td>
<td>double quote</td>
</tr>
<tr>
<td><code>\\</code></td>
<td>backslash</td>
</tr>
</tbody>
</table>
  </div>
  <div align="center">
<table>
<thead>
<tr>
<th>escape sequence</th>
<th>description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>\n</code></td>
<td>newline</td>
</tr>
<tr>
<td><code>\r</code></td>
<td>carriage return</td>
</tr>
<tr>
<td><code>\t</code></td>
<td>horizontal tab</td>
</tr>
</tbody>
</table>
  </div>
</div>
</section>

<h2 id="character-types-2">Character types</h2>
<p><code>char</code>, <code>signed char</code> and <code>unsigned char</code> are <strong>three different types</strong>.</p>
<ul>
<li>Whether <code>char</code> is signed or unsigned is <strong>implementation-defined</strong>.</li>
<li>If <code>char</code> is signed (unsigned), it represents the same set of values as the type <code>signed char</code> (<code>unsigned char</code>), but <strong>they are not the same type</strong>.
<ul>

</ul>
</li>

<h2 id="character-types-3">Character types</h2>
<p>For almost all cases, use <code>char</code> (or, sometimes <code>int</code>) to represent characters.</p>
<p><code>signed char</code> and <code>unsigned char</code> are used for other purposes.</p>
<p>To read/print a <code>char</code> using <code>scanf</code>/<code>printf</code>, use <code>%c</code>.</p>
</section>

<h2 id="boolean-type-bool-since-c99">Boolean type: <code>bool</code> (since C99)</h2>
<p>A type that represents true/false, 0/1, yes/no, ...</p>
<p>To access the name <code>bool</code>, <code>true</code> and <code>false</code>, <code>&lt;stdbool.h&gt;</code> is needed. (until C23)</p>
<p>Example: Define a function that accepts a character and returns whether that character is a lowercase letter.</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<p>Before C99, using <code>int</code>, <code>0</code> and <code>1</code>:</p>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">is_lowercase</span><span class="hljs-params">(<span class="hljs-type">char</span> c)</span> {
  <span class="hljs-keyword">if</span> (c &gt;= <span class="hljs-string">&#x27;a&#x27;</span> &amp;&amp; c &lt;= <span class="hljs-string">&#x27;z&#x27;</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-number">1</span>;
  <span class="hljs-keyword">else</span>
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
  </div>
  <div>
<p>Since C99, using <code>bool</code>, <code>false</code> and <code>true</code>:</p>
<pre><code class="language-c"><span class="hljs-type">bool</span> <span class="hljs-title function_">is_lowercase</span><span class="hljs-params">(<span class="hljs-type">char</span> c)</span> {
  <span class="hljs-keyword">if</span> (c &gt;= <span class="hljs-string">&#x27;a&#x27;</span> &amp;&amp; c &lt;= <span class="hljs-string">&#x27;z&#x27;</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
  <span class="hljs-keyword">else</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
}
</code></pre>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="boolean-type-bool-since-c99-1">Boolean type: <code>bool</code> (since C99)</h2>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<p>Before C99, using <code>int</code>, <code>0</code> and <code>1</code>:</p>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">is_lowercase</span><span class="hljs-params">(<span class="hljs-type">char</span> c)</span> {
  <span class="hljs-keyword">if</span> (c &gt;= <span class="hljs-string">&#x27;a&#x27;</span> &amp;&amp; c &lt;= <span class="hljs-string">&#x27;z&#x27;</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-number">1</span>;
  <span class="hljs-keyword">else</span>
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
  </div>
  <div>
<p>Since C99, using <code>bool</code>, <code>false</code> and <code>true</code>:</p>
<pre><code class="language-c"><span class="hljs-type">bool</span> <span class="hljs-title function_">is_lowercase</span><span class="hljs-params">(<span class="hljs-type">char</span> c)</span> {
  <span class="hljs-keyword">if</span> (c &gt;= <span class="hljs-string">&#x27;a&#x27;</span> &amp;&amp; c &lt;= <span class="hljs-string">&#x27;z&#x27;</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
  <span class="hljs-keyword">else</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
}
</code></pre>
  </div>
</div>
<p>Both return values can be used as follows:</p>
<pre><code class="language-c"><span class="hljs-type">char</span> c; <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%c&quot;</span>, &amp;c);
<span class="hljs-keyword">if</span> (is_lowercase(c)) {
  <span class="hljs-comment">// do something when c is lowercase ...</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:4702zk1i3u5cqu97jznzrecc9lere7mc6w0unxxwj1eo;" data-marpit-pagination-total="52">
<h2 id="best-practice-usimplify-your-codeu">[Best practice] <u>Simplify your code</u></h2>
<p>Just return the result of the condition expression.</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">is_lowercase</span><span class="hljs-params">(<span class="hljs-type">char</span> c)</span> {
  <span class="hljs-keyword">return</span> c &gt;= <span class="hljs-string">&#x27;a&#x27;</span> &amp;&amp; c &lt;= <span class="hljs-string">&#x27;z&#x27;</span>;
}
</code></pre>
  </div>
  <div>
<pre><code class="language-c"><span class="hljs-type">bool</span> <span class="hljs-title function_">is_lowercase</span><span class="hljs-params">(<span class="hljs-type">char</span> c)</span> {
  <span class="hljs-keyword">return</span> c &gt;= <span class="hljs-string">&#x27;a&#x27;</span> &amp;&amp; c &lt;= <span class="hljs-string">&#x27;z&#x27;</span>;
}
</code></pre>
  </div>
</div>
<p>We will introduce the operators (<code>&amp;&amp;</code>, <code>&lt;=</code>, <code>&gt;=</code>) involved here in later lectures.</p>
</section>

<h2 id="exercise-2">Exercise</h2>
<p>Write a simple calculator that handles input of the form <code>x op y</code>, where <code>x</code> and <code>y</code> are floating-point numbers and <code>op</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="3.269ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 1444.8 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2208" d="M84 250Q84 372 166 450T360 539Q361 539 377 539T419 540T469 540H568Q583 532 583 520Q583 511 570 501L466 500Q355 499 329 494Q280 482 242 458T183 409T147 354T129 306T124 272V270H568Q583 262 583 250T568 230H124V228Q124 207 134 177T167 112T231 48T328 7Q355 1 466 0H570Q583 -10 583 -20Q583 -32 568 -40H471Q464 -40 446 -40T417 -41Q262 -41 172 45Q84 127 84 250Z"></path></g><g data-mml-node="mo" transform="translate(944.8,0)"><path data-c="7B" d="M434 -231Q434 -244 428 -250H410Q281 -250 230 -184Q225 -177 222 -172T217 -161T213 -148T211 -133T210 -111T209 -84T209 -47T209 0Q209 21 209 53Q208 142 204 153Q203 154 203 155Q189 191 153 211T82 231Q71 231 68 234T65 250T68 266T82 269Q116 269 152 289T203 345Q208 356 208 377T209 529V579Q209 634 215 656T244 698Q270 724 324 740Q361 748 377 749Q379 749 390 749T408 750H428Q434 744 434 732Q434 719 431 716Q429 713 415 713Q362 710 332 689T296 647Q291 634 291 499V417Q291 370 288 353T271 314Q240 271 184 255L170 250L184 245Q202 239 220 230T262 196T290 137Q291 131 291 1Q291 -134 296 -147Q306 -174 339 -192T415 -213Q429 -213 431 -216Q434 -219 434 -231Z"></path></g></g></g></svg></mjx-container> <code>'+'</code>, <code>'-'</code>, <code>'*'</code>, <code>'/'</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 500 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="7D" d="M65 731Q65 745 68 747T88 750Q171 750 216 725T279 670Q288 649 289 635T291 501Q292 362 293 357Q306 312 345 291T417 269Q428 269 431 266T434 250T431 234T417 231Q380 231 345 210T298 157Q293 143 292 121T291 -28V-79Q291 -134 285 -156T256 -198Q202 -250 89 -250Q71 -250 68 -247T65 -230Q65 -224 65 -223T66 -218T69 -214T77 -213Q91 -213 108 -210T146 -200T183 -177T207 -139Q208 -134 209 3L210 139Q223 196 280 230Q315 247 330 250Q305 257 280 270Q225 304 212 352L210 362L209 498Q208 635 207 640Q195 680 154 696T77 713Q68 713 67 716T65 731Z"></path></g></g></g></svg></mjx-container>. You may use a group of <code>if</code>-<code>else</code> statements like this:</p>
<pre><code class="language-c"><span class="hljs-keyword">if</span> (op == <span class="hljs-string">&#x27;+&#x27;</span>) {
  <span class="hljs-comment">// ...</span>
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (op == <span class="hljs-string">&#x27;-&#x27;</span>) {

} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (op == <span class="hljs-string">&#x27;/&#x27;</span>) {

<h2 id="notes">Notes</h2>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></g></g></svg></mjx-container> The type of every expression in C is determined at compile-time except for <em>variable-length arrays</em> (since C99).</p>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></g></g></svg></mjx-container> A byte is 8 bits on most platforms, but we do have exceptions: <a href="https://en.wikipedia.org/wiki/36-bit_computing">36-bit computing</a>.</p>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.885ex" role="img" focusable="false" viewBox="0 -833.2 436.6 833.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"></g><g data-mml-node="TeXAtom" transform="translate(33,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mstyle" fill="red" stroke="red"><g data-mml-node="mn"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></g></g></g></svg></mjx-container> There are several different signed number representations, but all popular machines and almost all compilers use <strong>two's complement</strong>. Before C23 and C++20, the C/C++ standards allow for all possible representations, so the minimal valid range for a <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.357ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 600 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L24
