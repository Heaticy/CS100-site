<h2 id="basics">Basics</h2>
<p>Operator overloading: Provide the behaviors of <strong>operators</strong> for class types.</p>
<p>We have already seen some:</p>
<ul>
<li>The <strong>copy assignment operator</strong> and the <strong>move assignment operator</strong> are two special overloads for <code>operator=</code>.</li>
<li>The IOStream library provides overloaded <code>operator&lt;&lt;</code> and <code>operator&gt;&gt;</code> to perform input and output.</li>
<li>The string library provides <code>operator+</code> for concatenation of strings, and <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>, <code>==</code>, <code>!=</code> for comparison in lexicographical order.</li>
<li>Standard library containers and <code>std::string</code> have <code>operator[]</code>.</li>
<li>Smart pointers have <code>operator*</code> and <code>operator-&gt;</code>.</li>
</ul>
</section>

<h2 id="basics-1">Basics</h2>
<p>Overloaded operators can be defined in two forms:</p>
<ul>
<li>
<p>as a member function, in which the leftmost operand is bound to <code>this</code>:</p>
<ul>
<li><code>a[i]</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.057ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.247ex" role="img" focusable="false" viewBox="0 -526 1000 551"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D4" d="M308 524Q318 526 323 526Q340 526 340 514Q340 507 336 499Q326 476 314 454T292 417T274 391T260 374L255 368Q255 367 500 367Q744 367 744 368L739 374Q734 379 726 390T707 416T685 453T663 499Q658 511 658 515Q658 525 680 525Q687 524 690 523T695 519T701 507Q766 359 902 287Q921 276 939 269T961 259T966 250Q966 246 965 244T960 240T949 236T930 228T902 213Q763 137 701 -7Q697 -16 695 -19T690 -23T680 -25Q658 -25 658 -15Q658 -11 663 1Q673 24 685 46T707 83T725 109T739 126L744 132Q744 133 500 133Q255 133 255 132L260 126Q265 121 273 110T292 84T314 47T336 1Q341 -11 341 -15Q341 -25 319 -25Q312 -24 309 -23T304 -19T298 -7Q233 141 97 213Q83 221 70 227T51 235T41 239T35 243T34 250T35 256T40 261T51 265T70 273T97 287Q235 363 299 509Q305 522 308 524ZM792 319L783 327H216Q183 294 120 256L110 250L120 244Q173 212 207 181L216 173H783L792 181Q826 212 879 244L889 250L879 256Q826 288 792 319Z"></path></g></g></g></svg></mjx-container> <code>a.operator[](i)</code></li>
<li><code>a = b</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.057ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.247ex" role="img" focusable="false" viewBox="0 -526 1000 551"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D4" d="M308 524Q318 526 323 526Q340 526 340 514Q340 507 336 499Q326 476 314 454T292 417T274 391T260 374L255 368Q255 367 500 367Q744 367 744 368L739 374Q734 379 726 390T707 416T685 453T663 499Q658 511 658 515Q658 525 680 525Q687 524 690 523T695 519T701 507Q766 359 902 287Q921 276 939 269T961 259T966 250Q966 246 965 244T960 240T949 236T930 228T902 213Q763 137 701 -7Q697 -16 695 -19T690 -23T680 -25Q658 -25 658 -15Q658 -11 663 1Q673 24 685 46T707 83T725 109T739 126L744 132Q744 133 500 133Q255 133 255 132L260 126Q265 121 273 110T292 84T314 47T336 1Q341 -11 341 -15Q341 -25 319 -25Q312 -24 309 -23T304 -19T298 -7Q233 141 97 213Q83 221 70 227T51 235T41 239T35 243T34 250T35 256T40 261T51 265T70 273T97 287Q235 363 299 509Q305 522 308 524ZM792 319L783 327H216Q183 294 120 256L110 250L120 244Q173 212 207 181L216 173H783L792 181Q826 212 879 244L889 250L879 256Q826 288 792 319Z"></path></g></g></g></svg></mjx-container> <code>a.operator=(b)</code></li>
<li><code>*a</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.057ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.247ex" role="img" focusable="false" viewBox="0 -526 1000 551"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D4" d="M308 524Q318 526 323 526Q340 526 340 514Q340 507 336 499Q326 476 314 454T292 417T274 391T260 374L255 368Q255 367 500 367Q744 367 744 368L739 374Q734 379 726 390T707 416T685 453T663 499Q658 511 658 515Q658 525 680 525Q687 524 690 523T695 519T701 507Q766 359 902 287Q921 276 939 269T961 259T966 250Q966 246 965 244T960 240T949 236T930 228T902 213Q763 137 701 -7Q697 -16 695 -19T690 -23T680 -25Q658 -25 658 -15Q658 -11 663 1Q673 24 685 46T707 83T725 109T739 126L744 132Q744 133 500 133Q255 133 255 132L260 126Q265 121 273 110T292 84T314 47T336 1Q341 -11 341 -15Q341 -25 319 -25Q312 -24 309 -23T304 -19T298 -7Q233 141 97 213Q83 221 70 227T51 235T41 239T35 243T34 250T35 256T40 261T51 265T70 273T97 287Q235 363 299 509Q305 522 308 524ZM792 319L783 327H216Q183 294 120 256L110 250L120 244Q173 212 207 181L216 173H783L792 181Q826 212 879 244L889 250L879 256Q826 288 792 319Z"></path></g></g></g></svg></mjx-container> <code>a.operator*()</code></li>
<li><code>f(arg1, arg2, arg3, ...)</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.057ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.247ex" role="img" focusable="false" viewBox="0 -526 1000 551"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D4" d="M308 524Q318 526 323 526Q340 526 340 514Q340 507 336 499Q326 476 314 454T292 417T274 391T260 374L255 368Q255 367 500 367Q744 367 744 368L739 374Q734 379 726 390T707 416T685 453T663 499Q658 511 658 515Q658 525 680 525Q687 524 690 523T695 519T701 507Q766 359 902 287Q921 276 939 269T961 259T966 250Q966 246 965 244T960 240T949 236T930 228T902 213Q763 137 701 -7Q697 -16 695 -19T690 -23T680 -25Q658 -25 658 -15Q658 -11 663 1Q673 24 685 46T707 83T725 109T739 126L744 132Q744 133 500 133Q255 133 255 132L260 126Q265 121 273 110T292 84T314 47T336 1Q341 -11 341 -15Q341 -25 319 -25Q312 -24 309 -23T304 -19T298 -7Q233 141 97 213Q83 221 70 227T51 235T41 239T35 243T34 250T35 256T40 261T51 265T70 273T97 287Q235 363 299 509Q305 522 308 524ZM792 319L783 327H216Q183 294 120 256L110 250L120 244Q173 212 207 181L216 173H783L792 181Q826 212 879 244L889 250L879 256Q826 288 792 319Z"></path></g></g></g></svg></mjx-container> <code>f.operator()(arg1, arg2, arg3, ...)</code></li>
</ul>
</li>
<li>
<p>as a non-member function:</p>

;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="basics-2">Basics</h2>
<p>Some operators cannot be overloaded:</p>
<p><code>obj.mem</code>, <code>::</code>, <code>?:</code>, <code>obj.*memptr</code> (not covered in CS100)</p>
<p>Some operators can be overloaded, but are strongly not recommended:</p>
<p><code>cond1 &amp;&amp; cond2</code>, <code>cond1 || cond2</code></p>
<ul>
<li>Reason: Since <code>x &amp;&amp; y</code> would become <code>operator&amp;&amp;(x, y)</code>, there is no way to overload <code>&amp;&amp;</code> (or <code>||</code>) that preserves the <strong>short-circuit evaluation</strong> property.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="basics-3">Basics</h2>
<ul>
<li>
<p>At least one operand should be a class type. Modifying the behavior of operators on built-in types is not allowed.</p>
<pre><code class="language-cpp"><span class="hljs-type">int</span> <span class="hljs-keyword">operator</span>+(<span class="hljs-type">int</span>, <span class="hljs-type">int</span>);   <span class="hljs-comment">// Error.</span>
MyInt <span class="hljs-keyword">operator</span>-(<span class="hljs-type">int</span>, <span class="hljs-type">int</span>); <span class="hljs-comment">// Still error.</span>
</code></pre>
</li>
<li>
<p>Inventing new operators is not allowed.</p>
<pre><code class="language-cpp"><span class="hljs-type">double</span> <span class="hljs-keyword">operator</span>**(<span class="hljs-type">double</span> x, <span class="hljs-type">double</span> exp); <span class="hljs-comment">// Error.</span>
</code></pre>
</li>
<li>
<p>Overloading does not modify the <strong>associativity</strong>, <strong>precedence</strong> and the <strong>operands' evaluation order</strong>.</p>
<pre><code class="language-cpp">std::cout &lt;&lt; a + b; <span class="hljs-comment">// Equivalent to `std::cout &lt;&lt; (a + b)`.</span>
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-style="section::after {

<h1 id="example-rational">Example: <code>Rational</code></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-style="section::after {

" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--style:section::after {

;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="a-class-for-rational-numbers">A class for rational numbers</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
  <span class="hljs-type">int</span> m_num;        <span class="hljs-comment">// numerator</span>
  <span class="hljs-type">unsigned</span> m_denom; <span class="hljs-comment">// denominator</span>
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">simplify</span><span class="hljs-params">()</span> </span>{ <span class="hljs-comment">// Private, because this is our implementation detail.</span>
    <span class="hljs-type">int</span> gcd = std::<span class="hljs-built_in">gcd</span>(m_num, m_denom); <span class="hljs-comment">// std::gcd in &lt;numeric&gt; (since C++17)</span>
    m_num /= gcd; m_denom /= gcd;
  }
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Rational</span>(<span class="hljs-type">int</span> x = <span class="hljs-number">0</span>) : m_num{x}, m_denom{<span class="hljs-number">1</span>} {} <span class="hljs-comment">// Also a default constructor.</span>
  <span class="hljs-built_in">Rational</span>(<span class="hljs-type">int</span> num, <span class="hljs-type">unsigned</span> denom) : m_num{num}, m_denom{denom} { <span class="hljs-built_in">simplify</span>(); }
  <span class="hljs-function"><span class="hljs-type">double</span> <span class="hljs-title">to_double</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">double</span>&gt;(m_num) / m_denom;
  }
};
</code></pre>
<p>We want to have arithmetic operators supported for <code>Rational</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="rational-arithmetic-operators"><code>Rational</code>: arithmetic operators</h2>
<p>A good way: define <code>operator+=</code> and the <strong>unary</strong> <code>operator-</code>, and then define other operators in terms of them.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
  <span class="hljs-keyword">friend</span> Rational <span class="hljs-keyword">operator</span>-(<span class="hljs-type">const</span> Rational &amp;); <span class="hljs-comment">// Unary `operator-` as in `-x`.</span>
<span class="hljs-keyword">public</span>:
  Rational &amp;<span class="hljs-keyword">operator</span>+=(<span class="hljs-type">const</span> Rational &amp;rhs) {
    m_num = m_num * <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(rhs.m_denom) <span class="hljs-comment">// Be careful with `unsigned`!</span>
            + <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(m_denom) * rhs.m_num;
    m_denom *= rhs.m_denom;
    <span class="hljs-built_in">simplify</span>();
    <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>; <span class="hljs-comment">// `x += y` should return a reference to `x`.</span>
  }
};
Rational <span class="hljs-keyword">operator</span>-(<span class="hljs-type">const</span> Rational &amp;x) {
  <span class="hljs-keyword">return</span> {-x.m_num, x.m_denom};
  <span class="hljs-comment">// The above is equivalent to `return Rational(-x.m_num, x.m_denom);`.</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-style="section::after {

" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--style:section::after {

<h2 id="rational-arithmetic-operators-1"><code>Rational</code>: arithmetic operators</h2>
<p>Define the arithmetic operators in terms of the compound assignment operators.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  Rational &amp;<span class="hljs-keyword">operator</span>-=(<span class="hljs-type">const</span> Rational &amp;rhs) {
    <span class="hljs-comment">// Makes use of `operator+=` and the unary `operator-`.</span>
    <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span> += -rhs;
  }
};
Rational <span class="hljs-keyword">operator</span>+(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> <span class="hljs-built_in">Rational</span>(lhs) += rhs; <span class="hljs-comment">// Makes use of `operator+=`.</span>
}
Rational <span class="hljs-keyword">operator</span>-(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> <span class="hljs-built_in">Rational</span>(lhs) -= rhs; <span class="hljs-comment">// Makes use of `operator-=`.</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-style="section::after {

" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--style:section::after {

<h2 id="best-practice-uavoid-repetitionu"><strong>[Best practice]</strong> <u>Avoid repetition.</u></h2>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  Rational &amp;<span class="hljs-keyword">operator</span>+=(<span class="hljs-type">const</span> Rational &amp;rhs) {
    m_num = m_num * <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(rhs.m_denom)
           + <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(m_denom) * rhs.m_num;
    m_denom *= rhs.m_denom;
    <span class="hljs-built_in">simplify</span>();
    <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>;
  }
};
</code></pre>
<p>The arithmetic operators for <code>Rational</code> are simple yet requires carefulness.</p>
<ul>
<li>Integers with different signed-ness need careful treatment.</li>
<li>Remember to <code>simplify()</code>.</li>
</ul>
<p>Fortunately, we only need to pay attention to these things in <code>operator+=</code>. Everything will be right if <code>operator+=</code> is right.</p>
</section>

<h2 id="best-practice-uavoid-repetitionu-1"><strong>[Best practice]</strong> <u>Avoid repetition.</u></h2>
<p>The code would be very error-prone if you implement every function from scratch!</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  Rational &amp;<span class="hljs-keyword">operator</span>+=(<span class="hljs-type">const</span> Rational &amp;rhs) {
    m_num = m_num * <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(rhs.m_denom)
           + <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(m_denom) * rhs.m_num;
    m_denom *= rhs.m_denom;
    <span class="hljs-built_in">simplify</span>();
    <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>;
  }
  Rational &amp;<span class="hljs-keyword">operator</span>-=(<span class="hljs-type">const</span> Rational &amp;rhs) {
    m_num = m_num * <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(rhs.m_denom)
           - <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(m_denom) * rhs.m_num;
    m_denom *= rhs.m_denom;
    <span class="hljs-built_in">simplify</span>();
    <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>;
  }
  <span class="hljs-keyword">friend</span> Rational <span class="hljs-keyword">operator</span>+(<span class="hljs-type">const</span> Rational &amp;,
                            <span class="hljs-type">const</span> Rational &amp;);
  <span class="hljs-keyword">friend</span> Rational <span class="hljs-keyword">operator</span>-(<span class="hljs-type">const</span> Rational &amp;,
                            <span class="hljs-type">const</span> Rational &amp;);
};
</code></pre>
  </div>
  <div>
<pre><code class="language-cpp">Rational <span class="hljs-keyword">operator</span>+(<span class="hljs-type">const</span> Rational &amp;lhs,
                   <span class="hljs-type">const</span> Rational &amp;rhs) {

Rational <span class="hljs-keyword">operator</span>-(<span class="hljs-type">const</span> Rational &amp;lhs,
                   <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> {
    lhs.m_num * <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(rhs.m_denom)
        - <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(lhs.m_denom) * rhs.lhs,

  };

<h2 id="rational-arithmetic-and-relational-operators"><code>Rational</code>: arithmetic and relational operators</h2>
<p>What if we define them (say, <code>operator+</code>) as member functions?</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Rational</span>(<span class="hljs-type">int</span> x = <span class="hljs-number">0</span>) : m_num{x}, m_denom{<span class="hljs-number">1</span>} {}
  Rational <span class="hljs-keyword">operator</span>+(<span class="hljs-type">const</span> Rational &amp;rhs) <span class="hljs-type">const</span> {
    <span class="hljs-keyword">return</span> {
      m_num * <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(rhs.m_denom)
          + <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(m_denom) * rhs.m_num,
      m_denom * rhs.m_denom
    };
  }
};
</code></pre>

<h2 id="rational-arithmetic-and-relational-operators-1"><code>Rational</code>: arithmetic and relational operators</h2>
<p>What if we define them (say, <code>operator+</code>) as member functions?</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Rational</span>(<span class="hljs-type">int</span> x = <span class="hljs-number">0</span>) : m_num{x}, m_denom{<span class="hljs-number">1</span>} {}
  Rational <span class="hljs-keyword">operator</span>+(<span class="hljs-type">const</span> Rational &amp;rhs) <span class="hljs-type">const</span> {
    <span class="hljs-comment">// ...</span>
  }
};
</code></pre>
<pre><code class="language-cpp">Rational r = <span class="hljs-built_in">some_value</span>();
<span class="hljs-keyword">auto</span> s = r + <span class="hljs-number">0</span>; <span class="hljs-comment">// OK, `r.operator+(0)`, effectively `r.operator+(Rational(0))`</span>
<span class="hljs-keyword">auto</span> t = <span class="hljs-number">0</span> + r; <span class="hljs-comment">// Error! `0.operator+(r)` ???</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="rational-arithmetic-and-relational-operators-2"><code>Rational</code>: arithmetic and relational operators</h2>
<p>To allow implicit conversions on both sides, the operator should be defined as <strong>non-member functions</strong>.</p>
<pre><code class="language-cpp">Rational r = <span class="hljs-built_in">some_value</span>();
<span class="hljs-keyword">auto</span> s = r + <span class="hljs-number">0</span>; <span class="hljs-comment">// OK, `operator+(r, 0)`, effectively `operator+(r, Rational(0))`</span>
<span class="hljs-keyword">auto</span> t = <span class="hljs-number">0</span> + r; <span class="hljs-comment">// OK, `operator+(0, r)`, effectively `operator+(Rational(0), r)`</span>
</code></pre>
<p><strong>[Best practice]</strong> <u>The &quot;symmetric&quot; operators, whose operands are often exchangeable, often should be defined as non-member functions.</u></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--style:section::after {

}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="rational-relational-operators"><code>Rational</code>: relational operators</h2>
<p>Define <code>&lt;</code> and <code>==</code>, and define others in terms of them. (Before C++20)</p>
<ul>
<li>Since C++20: Define <code>==</code> and <code>&lt;=&gt;</code>, and the compiler will generate others.</li>
</ul>
<p>A possible way: Use <code>to_double</code> and compare the floating-point values.</p>
<pre><code class="language-cpp"><span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> lhs.<span class="hljs-built_in">to_double</span>() &lt; rhs.<span class="hljs-built_in">to_double</span>();
}
</code></pre>
<ul>
<li>This does not require <code>operator&lt;</code> to be a <code>friend</code>.</li>
<li>However, this is subject to floating-point errors.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="rational-ralational-operators"><code>Rational</code>: ralational operators</h2>
<p>Another way (possibly better):</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
  <span class="hljs-keyword">friend</span> <span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Rational &amp;, <span class="hljs-type">const</span> Rational &amp;);
  <span class="hljs-keyword">friend</span> <span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>==(<span class="hljs-type">const</span> Rational &amp;, <span class="hljs-type">const</span> Rational &amp;);
};
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(rhs.m_denom) * lhs.m_num
        &lt; <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(lhs.m_denom) * rhs.m_num;
}
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>==(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> lhs.m_num == rhs.m_num &amp;&amp; lhs.m_denom == rhs.m_denom;
}
</code></pre>
<p>If there are member functions to obtain the numerator and the denominator, these functions don't need to be <code>friend</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--style:section::after {

;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="rational-relational-operators-1"><code>Rational</code>: relational operators</h2>
<p><strong>[Best practice]</strong> <u>Avoid repetition.</u></p>
<p>Define others in terms of <code>&lt;</code> and <code>==</code>:</p>
<pre><code class="language-cpp"><span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&gt;(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> rhs &lt; lhs;
}
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;=(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> !(lhs &gt; rhs);
}
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&gt;=(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> !(lhs &lt; rhs);
}
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>!=(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> !(lhs == rhs);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-style="section::after {

" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--style:section::after {

}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="relational-operators">Relational operators</h2>
<p>Define relational operators in a consistent way:</p>
<ul>
<li><code>a != b</code> should mean <code>!(a == b)</code></li>
<li><code>!(a &lt; b)</code> and <code>!(a &gt; b)</code> should imply <code>a == b</code></li>
</ul>
<p>C++20 has devoted some efforts to the design of <strong>consistent comparison</strong>: <a href="https://open-std.org/jtc1/sc22/wg21/docs/papers/2017/p0515r3.pdf">P0515r3</a>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="relational-operators-1">Relational operators</h2>
<p>Avoid abuse of relational operators:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">Point2d</span> { <span class="hljs-type">double</span> x, y; };
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Point2d &amp;lhs, <span class="hljs-type">const</span> Point2d &amp;rhs) {
  <span class="hljs-keyword">return</span> lhs.x &lt; rhs.x; <span class="hljs-comment">// Is this the unique, best behavior?</span>
}
<span class="hljs-comment">// Much better design: Use a named function.</span>
<span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">less_in_x</span><span class="hljs-params">(<span class="hljs-type">const</span> Point2d &amp;lhs, <span class="hljs-type">const</span> Point2d &amp;rhs)</span> </span>{
  <span class="hljs-keyword">return</span> lhs.x &lt; rhs.x;
}
</code></pre>
<p><strong>[Best practice]</strong> <u>Operators should be used for operations that are likely to be unambiguous to users.</u></p>
<ul>
<li>If an operator has plausibly more than one interpretation, use named functions instead. Function names can convey more information.</li>
</ul>
<p><strong><code>std::string</code> has <code>operator+</code> for concatenation. Why doesn't <code>std::vector</code> have one?</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--style:section::after {

;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="and---"><code>++</code> and <code>--</code></h2>
<p><code>++</code> and <code>--</code> are often defined as <strong>members</strong>, because they modify the object.</p>
<p>To differentiate the postfix version <code>x++</code> and the prefix version <code>++x</code>: <strong>The postfix version has a parameter of type <code>int</code>.</strong></p>
<ul>
<li>The compiler will translate <code>++x</code> to <code>x.operator++()</code>, <code>x++</code> to <code>x.operator++(0)</code>.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  Rational &amp;<span class="hljs-keyword">operator</span>++() { ++m_num; <span class="hljs-built_in">simplify</span>(); <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>; }
  Rational <span class="hljs-keyword">operator</span>++(<span class="hljs-type">int</span>) { <span class="hljs-comment">// This `int` parameter is not used.</span>
    <span class="hljs-comment">// The postfix version is almost always defined like this.</span>
    <span class="hljs-keyword">auto</span> tmp = *<span class="hljs-keyword">this</span>;
    ++*<span class="hljs-keyword">this</span>; <span class="hljs-comment">// Makes use of the prefix version.</span>
    <span class="hljs-keyword">return</span> tmp;
  }
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="and----1"><code>++</code> and <code>--</code></h2>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  Rational &amp;<span class="hljs-keyword">operator</span>++() { ++m_num; <span class="hljs-built_in">simplify</span>(); <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>; }
  Rational <span class="hljs-keyword">operator</span>++(<span class="hljs-type">int</span>) { <span class="hljs-comment">// This `int` parameter is not used.</span>
    <span class="hljs-comment">// The postfix version is almost always defined like this.</span>
    <span class="hljs-keyword">auto</span> tmp = *<span class="hljs-keyword">this</span>;
    ++*<span class="hljs-keyword">this</span>; <span class="hljs-comment">// Make use of the prefix version.</span>
    <span class="hljs-keyword">return</span> tmp;
  }
};
</code></pre>
<p>The prefix version returns reference to <code>*this</code>, while the postfix version returns a copy of <code>*this</code> before incrementation.</p>
<ul>
<li>Same as the built-in behaviors.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-style="section::after {

;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="io-operators">IO operators</h2>
<p>Implement <code>std::cin &gt;&gt; r</code> and <code>std::cout &lt;&lt; r</code>.</p>
<p>Input operator:</p>
<pre><code class="language-cpp">std::istream &amp;<span class="hljs-keyword">operator</span>&gt;&gt;(std::istream &amp;, Rational &amp;);
</code></pre>
<p>Output operator:</p>
<pre><code class="language-cpp">std::ostream &amp;<span class="hljs-keyword">operator</span>&lt;&lt;(std::ostream &amp;, <span class="hljs-type">const</span> Rational &amp;);
</code></pre>
<ul>
<li>
<p><code>std::cin</code> is of type <code>std::istream</code>, and <code>std::cout</code> is of type <code>std::ostream</code>.</p>
</li>
<li>
<p>The left-hand side operand should be returned, so that we can write</p>
<pre><code class="language-cpp">std::cin &gt;&gt; a &gt;&gt; b &gt;&gt; c; std::cout &lt;&lt; a &lt;&lt; b &lt;&lt; c;
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="rational-output-operator"><code>Rational</code>: output operator</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
  <span class="hljs-keyword">friend</span> std::ostream &amp;<span class="hljs-keyword">operator</span>&lt;&lt;(std::ostream &amp;, <span class="hljs-type">const</span> Rational &amp;);
};
std::ostream &amp;<span class="hljs-keyword">operator</span>&lt;&lt;(std::ostream &amp;os, <span class="hljs-type">const</span> Rational &amp;r) {
  <span class="hljs-keyword">return</span> os &lt;&lt; r.m_num &lt;&lt; <span class="hljs-string">&#x27;/&#x27;</span> &lt;&lt; r.m_denom;
}
</code></pre>
<p>If there are member functions to obtain the numerator and the denominator, it don't have to be a <code>friend</code>.</p>
<pre><code class="language-cpp">std::ostream &amp;<span class="hljs-keyword">operator</span>&lt;&lt;(std::ostream &amp;os, <span class="hljs-type">const</span> Rational &amp;r) {
  <span class="hljs-keyword">return</span> os &lt;&lt; r.<span class="hljs-built_in">get_numerator</span>() &lt;&lt; <span class="hljs-string">&#x27;/&#x27;</span> &lt;&lt; r.<span class="hljs-built_in">get_denominator</span>();
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-style="section::after {

<h2 id="rational-input-operator"><code>Rational</code>: input operator</h2>
<p>Suppose the input format is <code>a b</code> for the rational number <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -1.577ex;" xmlns="http://www.w3.org/2000/svg" width="2.192ex" height="4.104ex" role="img" focusable="false" viewBox="0 -1117 969 1814"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mstyle"><g data-mml-node="mfrac"><g data-mml-node="mi" transform="translate(220,676)"><path data-c="1D44E" d="M33 157Q33 258 109 349T280 441Q331 441 370 392Q386 422 416 422Q429 422 439 414T449 394Q449 381 412 234T374 68Q374 43 381 35T402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487Q506 153 506 144Q506 138 501 117T481 63T449 13Q436 0 417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157ZM351 328Q351 334 346 350T323 385T277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q217 26 254 59T298 110Q300 114 325 217T351 328Z"></path></g><g data-mml-node="mi" transform="translate(270,-686)"><path data-c="1D44F" d="M73 647Q73 657 77 670T89 683Q90 683 161 688T234 694Q246 694 246 685T212 542Q204 508 195 472T180 418L176 399Q176 396 182 402Q231 442 283 442Q345 442 383 396T422 280Q422 169 343 79T173 -11Q123 -11 82 27T40 150V159Q40 180 48 217T97 414Q147 611 147 623T109 637Q104 637 101 637H96Q86 637 83 637T76 640T73 647ZM336 325V331Q336 405 275 405Q258 405 240 397T207 376T181 352T163 330L157 322L136 236Q114 150 114 114Q114 66 138 42Q154 26 178 26Q211 26 245 58Q270 81 285 114T318 219Q336 291 336 325Z"></path></g><rect width="729" height="60" x="120" y="220"></rect></g></g></g></g></svg></mjx-container>, where <code>a</code> and <code>b</code> are integers.</p>
<pre><code class="language-cpp">std::istream &amp;<span class="hljs-keyword">operator</span>&gt;&gt;(std::istream &amp;is, Rational &amp;r) {
  <span class="hljs-type">int</span> x, y; is &gt;&gt; x &gt;&gt; y;
  <span class="hljs-keyword">if</span> (!is) { <span class="hljs-comment">// Pay attention to input failures!</span>
    x = <span class="hljs-number">0</span>;
    y = <span class="hljs-number">1</span>;
  }
  <span class="hljs-keyword">if</span> (y &lt; <span class="hljs-number">0</span>) { y = -y; x = -x; }
  r = <span class="hljs-built_in">Rational</span>(x, y);
  <span class="hljs-keyword">return</span> is;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-style="section::after {

" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--style:section::after {

<h2 id="operator"><code>operator[]</code></h2>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-type">int</span> &amp;<span class="hljs-keyword">operator</span>[](std::<span class="hljs-type">size_t</span> n) {
    <span class="hljs-keyword">return</span> m_storage[n];
  }
  <span class="hljs-type">const</span> <span class="hljs-type">int</span> &amp;<span class="hljs-keyword">operator</span>[](std::<span class="hljs-type">size_t</span> n) <span class="hljs-type">const</span> {
    <span class="hljs-keyword">return</span> m_storage[n];
  }
};
</code></pre>
<p>The use of <code>a[i]</code> is interpreted as <code>a.operator[](i)</code>.</p>
<p><a href="https://en.cppreference.com/w/cpp/language/operator_member_access#Built-in_subscript_operator">(C++23 allows <code>a[i, j, k]</code>!)</a></p>
<p>Homework: Define <code>operator[]</code> and relational operators for <code>Dynarray</code>.</p>

<h2 id="windowptr-indirection-dereference-operator"><code>WindowPtr</code>: indirection (dereference) operator</h2>
<p>Recall the <code>WindowPtr</code> class we defined in the previous lecture.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">WindowWithCounter</span> {
  Window theWindow;
  <span class="hljs-type">int</span> refCount = <span class="hljs-number">1</span>;
};
<span class="hljs-keyword">class</span> <span class="hljs-title class_">WindowPtr</span> {
  WindowWithCounter *m_ptr;
<span class="hljs-keyword">public</span>:
  Window &amp;<span class="hljs-keyword">operator</span>*() <span class="hljs-type">const</span> { <span class="hljs-comment">// Why should it be const?</span>
    <span class="hljs-keyword">return</span> m_ptr-&gt;theWindow;
  }
};
</code></pre>
<p>We want <code>*sp</code> to return reference to the managed object.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-style="section::after {

<h2 id="windowptr-indirection-derefernce-operator"><code>WindowPtr</code>: indirection (derefernce) operator</h2>
<p>Why should <code>operator*</code> be <code>const</code>?</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">WindowPtr</span> {
  WindowWithCounter *m_ptr;
<span class="hljs-keyword">public</span>:
  Window &amp;<span class="hljs-keyword">operator</span>*() <span class="hljs-type">const</span> {
    <span class="hljs-keyword">return</span> m_ptr-&gt;theWindow;
  }
};
</code></pre>
<p>On a <code>const WindowPtr</code> (&quot;top-level&quot; <code>const</code>), obtaining a non-<code>const</code> reference to the managed object may still be allowed.</p>
<ul>
<li>The (smart) pointer is <code>const</code>, but the managed object is not.</li>
<li><code>this</code> is <code>const WindowPtr *</code>, so <code>m_ptr</code> is <code>WindowWithCounter *const</code>.</li>
</ul>
</section>

<h2 id="windowptr-member-access-through-pointer"><code>WindowPtr</code>: member access through pointer</h2>
<p>To make <code>operator-&gt;</code> consistent with <code>operator*</code> (make <code>ptr-&gt;mem</code> equivalent to <code>(*ptr).mem</code>), <code>operator-&gt;</code> is almost always defined like this:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">WindowPtr</span> {
<span class="hljs-keyword">public</span>:
  Window *<span class="hljs-keyword">operator</span>-&gt;() <span class="hljs-type">const</span> {
    <span class="hljs-keyword">return</span> std::<span class="hljs-built_in">addressof</span>(<span class="hljs-keyword">operator</span>*());
  }
};
</code></pre>
<p><code>std::addressof(x)</code> is almost always equivalent to <code>&amp;x</code>, but the latter may not return the address of <code>x</code> if <code>operator&amp;</code> for <code>x</code> has been overloaded!</p>
</section>

<p>Type conversions can happen either <strong>implicitly</strong> or <strong>explicitly</strong>. A conversion is <strong>explicit</strong> if and only if the target type <code>U</code> is written explicitly in the conversion expression.</p>
<p>Explicit conversions can happen in one of the following forms:</p>
<div align="center">
<table>
<thead>
<tr>
<th>expression</th>
<th>explanation</th>
<th>example</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>what_cast&lt;U&gt;(expr)</code></td>
<td>through named casts</td>
<td><code>static_cast&lt;int&gt;(3.14)</code></td>
</tr>
<tr>
<td><code>U(expr)</code></td>
<td>looks like a constructor call</td>
<td><code>std::string(&quot;xx&quot;)</code>, <code>int(3.14)</code></td>
</tr>
<tr>
<td><code>(U)expr</code></td>
<td>old C-style conversion</td>
<td>Not recommended. Don't use it.</td>
</tr>
</tbody>
</table>
</div>
</section>

<ul>
<li>
<p>Arithmetic conversions are often allowed to happen implicitly:</p>
<pre><code class="language-cpp"><span class="hljs-type">int</span> sum = <span class="hljs-comment">/* ... */</span>, n = <span class="hljs-comment">/* ... */</span>;
<span class="hljs-keyword">auto</span> average = <span class="hljs-number">1.0</span> * sum / n; <span class="hljs-comment">// `sum` and `n` are converted to `double`,</span>
                              <span class="hljs-comment">// so `average` has type `double`.</span>
</code></pre>
</li>
<li>
<p>The dangerous conversions for built-in types must be explicit:</p>
<pre><code class="language-cpp"><span class="hljs-type">const</span> <span class="hljs-type">int</span> *cip = <span class="hljs-built_in">something</span>();
<span class="hljs-keyword">auto</span> ip = <span class="hljs-built_in">const_cast</span>&lt;<span class="hljs-type">int</span> *&gt;(cip);       <span class="hljs-comment">// int *</span>
<span class="hljs-keyword">auto</span> cp = <span class="hljs-built_in">reinterpret_cast</span>&lt;<span class="hljs-type">char</span> *&gt;(ip); <span class="hljs-comment">// char *</span>
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-style="section::after {

<h2 id="type-conversions-2">Type conversions</h2>
<p>A <strong>type conversion</strong> is a function <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.464ex;" xmlns="http://www.w3.org/2000/svg" width="9.978ex" height="2.059ex" role="img" focusable="false" viewBox="0 -705 4410.1 910"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D453" d="M118 -162Q120 -162 124 -164T135 -167T147 -168Q160 -168 171 -155T187 -126Q197 -99 221 27T267 267T289 382V385H242Q195 385 192 387Q188 390 188 397L195 425Q197 430 203 430T250 431Q298 431 298 432Q298 434 307 482T319 540Q356 705 465 705Q502 703 526 683T550 630Q550 594 529 578T487 561Q443 561 443 603Q443 622 454 636T478 657L487 662Q471 668 457 668Q445 668 434 658T419 630Q412 601 403 552T387 469T380 433Q380 431 435 431Q480 431 487 430T498 424Q499 420 496 407T491 391Q489 386 482 386T428 385H372L349 263Q301 15 282 -47Q255 -132 212 -173Q175 -205 139 -205Q107 -205 81 -186T55 -132Q55 -95 76 -78T118 -61Q162 -61 162 -103Q162 -122 151 -136T127 -157L118 -162Z"></path></g><g data-mml-node="mo" transform="translate(827.8,0)"><path data-c="3A" d="M78 370Q78 394 95 412T138 430Q162 430 180 414T199 371Q199 346 182 328T139 310T96 327T78 370ZM78 60Q78 84 95 102T138 120Q162 120 180 104T199 61Q199 36 182 18T139 0T96 17T78 60Z"></path></g><g data-mml-node="mi" transform="translate(1383.6,0)"><path data-c="1D447" d="M40 437Q21 437 21 445Q21 450 37 501T71 602L88 651Q93 669 101 677H569H659Q691 677 697 676T704 667Q704 661 687 553T668 444Q668 437 649 437Q640 437 637 437T631 442L629 445Q629 451 635 490T641 551Q641 586 628 604T573 629Q568 630 515 631Q469 631 457 630T439 622Q438 621 368 343T298 60Q298 48 386 46Q418 46 427 45T436 36Q436 31 433 22Q429 4 424 1L422 0Q419 0 415 0Q410 0 363 1T228 2Q99 2 64 0H49Q43 6 43 9T45 27Q49 40 55 46H83H94Q174 46 189 55Q190 56 191 56Q196 59 201 76T241 233Q258 301 269 344Q339 619 339 625Q339 630 310 630H279Q212 630 191 624Q146 614 121 583T67 467Q60 445 57 441T43 4 31 433 22Q429 4 424 1L422 0Q419 0 415 0Q410 0 363 1T228 2Q99 2 64 0H49Q43 6 43 9T45 27Q49 40 55 46H83H94Q174 46 189 55Q190 56 191 56Q196 59 201 76T241 233Q258 301 269 344Q339 619 339 625Q339 630 310 630H279Q212 630 191 624Q146 614 121 583T67 467Q60 445 57 441T43 437H40Z"></path></g></g></g></svg></mjx-container> and <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.735ex" height="1.595ex" role="img" focusable="false" viewBox="0 -683 767 705"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D448" d="M107 637Q73 637 71 641Q70 643 70 649Q70 673 81 682Q83 683 98 683Q139 681 234 681Q268 681 297 681T342 682T362 682Q378 682 378 672Q378 670 376 658Q371 641 366 638H364Q362 638 359 638T352 638T343 637T334 637Q295 636 284 634T266 623Q265 621 238 518T184 302T154 169Q152 155 152 140Q152 86 183 55T269 24Q336 24 403 69T501 205L552 406Q599 598 599 606Q599 633 535 637Q511 637 511 648Q511 650 513 660Q517 676 519 679T529 683Q532 683 561 682T645 680Q696 680 723 681T752 682Q767 682 767 672Q767 650 759 642Q756 637 737 637Q666 633 648 597Q646 592 598 404Q557 235 548 205Q515 105 433 42T263 -22Q171 -22 116 34T60 167V183Q60 201 115 421Q164 622 164 628Q164 635 107 637Z"></path></g></g></g></svg></mjx-container>.</p>
<p>Type conversions can happen either <strong>implicitly</strong> or <strong>explicitly</strong>. A conversion is <strong>explicit</strong> if and only if the target type <code>U</code> is written explicitly in the conversion expression.</p>
<ul>
<li>
<p>This is also a type conversion, isn't it?</p>
<pre><code class="language-cpp">std::string s = <span class="hljs-string">&quot;hello&quot;</span>; <span class="hljs-comment">// from `const char [6]` to `std::string`</span>
</code></pre>
</li>
<li>
<p>This is also a type conversion, isn't it?</p>
<pre><code class="language-cpp">std::<span class="hljs-type">size_t</span> n = <span class="hljs-number">1000</span>;
<span class="hljs-function">std::vector&lt;<span class="hljs-type">int</span>&gt; <span class="hljs-title">v</span><span class="hljs-params">(n)</span></span>; <span class="hljs-comment">// from `std::size_t` to `std::vector&lt;int&gt;`</span>
</code></pre>
</li>
</ul>
<p>How do these type conversions happen? Are they implicit or explicit?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-style="section::after {

;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="type-conversions-3">Type conversions</h2>
<p>We can define a type conversion for our class <code>X</code> in one of the following ways:</p>
<ol>
<li>
<p>A constructor with exactly one parameter of type <code>T</code> is a conversion from <code>T</code> to <code>X</code>.</p>
<ul>
<li>Example: <code>std::string</code> has a constructor accepting a <code>const char *</code>. <code>std::vector</code> has a constructor accepting a <code>std::size_t</code>.</li>
</ul>
</li>
<li>
<p>A <strong>type conversion operator</strong>: a conversion from <code>X</code> to some other type.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-comment">// conversion from `Rational` to `double`.</span>
  <span class="hljs-function"><span class="hljs-keyword">operator</span> <span class="hljs-title">double</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{ <span class="hljs-keyword">return</span> <span class="hljs-number">1.0</span> * m_num / m_denom; }
};
<span class="hljs-function">Rational <span class="hljs-title">r</span><span class="hljs-params">(<span class="hljs-number">3</span>, <span class="hljs-number">4</span>)</span></span>;
<span class="hljs-type">double</span> dval = r;  <span class="hljs-comment">// 0.75</span>
</code></pre>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="type-conversion-operator">Type conversion operator</h2>
<p>A type conversion operator is a member function of class <code>X</code>, which defines the type conversion from <code>X</code> to some other type <code>T</code>.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-comment">// conversion from `Rational` to `double`.</span>
  <span class="hljs-function"><span class="hljs-keyword">operator</span> <span class="hljs-title">double</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{ <span class="hljs-keyword">return</span> <span class="hljs-number">1.0</span> * m_num / m_denom; }
};
<span class="hljs-function">Rational <span class="hljs-title">r</span><span class="hljs-params">(<span class="hljs-number">3</span>, <span class="hljs-number">4</span>)</span></span>;
<span class="hljs-type">double</span> dval = r;  <span class="hljs-comment">// 0.75</span>
</code></pre>
<ul>
<li>The name of the function is <code>operator T</code>.</li>
<li>The return type is <code>T</code>, which is not written before the name.</li>
<li>A type conversion is usually a <strong>read-only</strong> operation, so it is usually <code>const</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-style="section::after {

" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="explicit-type-conversion">Explicit type conversion</h2>
<p>Some conversions should be allowed to happen implicitly:</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">foo</span><span class="hljs-params">(<span class="hljs-type">const</span> std::string &amp;str)</span> </span>{ <span class="hljs-comment">/* ... */</span> }
<span class="hljs-built_in">foo</span>(<span class="hljs-string">&quot;hello&quot;</span>); <span class="hljs-comment">// implicit conversion from `const char [6]` to `const char *`,</span>
              <span class="hljs-comment">// and then to `std::string`.</span>
</code></pre>
<p>Some should never happen implicitly!</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">bar</span><span class="hljs-params">(<span class="hljs-type">const</span> std::vector&lt;<span class="hljs-type">int</span>&gt; &amp;vec)</span> </span>{ <span class="hljs-comment">/* ...*/</span> }
<span class="hljs-built_in">bar</span>(<span class="hljs-number">1000</span>);                  <span class="hljs-comment">// ??? Too weird!</span>
<span class="hljs-built_in">bar</span>(std::<span class="hljs-built_in">vector</span>&lt;<span class="hljs-type">int</span>&gt;(<span class="hljs-number">1000</span>)) <span class="hljs-comment">// OK.</span>
<span class="hljs-function">std::vector&lt;<span class="hljs-type">int</span>&gt; <span class="hljs-title">v1</span><span class="hljs-params">(<span class="hljs-number">1000</span>)</span></span>;  <span class="hljs-comment">// OK.</span>
std::vector&lt;<span class="hljs-type">int</span>&gt; v2 = <span class="hljs-number">1000</span>; <span class="hljs-comment">// No! This should never happen. Too weird!</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="explicit-type-conversion-1">Explicit type conversion</h2>
<p>To disallow the implicit use of a constructor as a type conversion, write <code>explicit</code> before the return type:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">string</span> { <span class="hljs-comment">// Suppose this is the `std::string` class.</span>
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">string</span>(<span class="hljs-type">const</span> <span class="hljs-type">char</span> *cstr); <span class="hljs-comment">// Not marked `explicit`. Implicit use is allowed.</span>
};

<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt; <span class="hljs-keyword">class</span> <span class="hljs-title class_">vector</span> { <span class="hljs-comment">// Suppose this is the `std::vector` class.</span>
<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-keyword">explicit</span> <span class="hljs-title">vector</span><span class="hljs-params">(std::<span class="hljs-type">size_t</span> n)</span></span>; <span class="hljs-comment">// Implicit use is not allowed.</span>
};

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-keyword">explicit</span> <span class="hljs-title">Dynarray</span><span class="hljs-params">(std::<span class="hljs-type">size_t</span> n)</span> : m_length{</span>n}, m_storage{<span class="hljs-keyword">new</span> <span class="hljs-type">int</span>[n]{}} {}
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="explicit-type-conversion-2">Explicit type conversion</h2>
<p>To disallow the implicit use of a type conversion operator, also write <code>explicit</code>:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-keyword">explicit</span> <span class="hljs-keyword">operator</span> <span class="hljs-title">double</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{ <span class="hljs-keyword">return</span> <span class="hljs-number">1.0</span> * m_num / m_denom; }
};
<span class="hljs-function">Rational <span class="hljs-title">r</span><span class="hljs-params">(<span class="hljs-number">3</span>, <span class="hljs-number">4</span>)</span></span>;
<span class="hljs-type">double</span> d = r;                     <span class="hljs-comment">// Error.</span>
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">foo</span><span class="hljs-params">(<span class="hljs-type">double</span> x)</span> </span>{ <span class="hljs-comment">/* ... */</span> }
<span class="hljs-built_in">foo</span>(r);                           <span class="hljs-comment">// Error.</span>
<span class="hljs-built_in">foo</span>(<span class="hljs-built_in">double</span>(r));                   <span class="hljs-comment">// OK.</span>
<span class="hljs-built_in">foo</span>(<span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">double</span>&gt;(r));      <span class="hljs-comment">// OK.</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="best-practice-uavoid-the-abuse-of-type-conversion-operatorsu"><strong>[Best practice]</strong> <u>Avoid the abuse of type conversion operators.</u></h2>
<p>Type conversion operators can lead to unexpected results!</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-keyword">operator</span> <span class="hljs-title">double</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{ <span class="hljs-keyword">return</span> <span class="hljs-number">1.0</span> * m_num / m_denom; }
  <span class="hljs-function"><span class="hljs-keyword">operator</span> <span class="hljs-title">std::string</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{
    <span class="hljs-keyword">return</span> std::<span class="hljs-built_in">to_string</span>(m_num) + <span class="hljs-string">&quot; / &quot;</span> + std::<span class="hljs-built_in">to_string</span>(m_denom);
  }
};
<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">main</span><span class="hljs-params">()</span> </span>{
  <span class="hljs-function">Rational <span class="hljs-title">r</span><span class="hljs-params">(<span class="hljs-number">3</span>, <span class="hljs-number">4</span>)</span></span>;
  std::cout &lt;&lt; r &lt;&lt; <span class="hljs-string">&#x27;\n&#x27;</span>; <span class="hljs-comment">// Ooops! Is it `0.75` or `3 / 4`?</span>
}
</code></pre>
<p>In the code above, either <strong>mark the type conversions as <code>explicit</code></strong>, or remove them and <strong>define named functions</strong> like <code>to_double()</code> and <code>to_string()</code> instead.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:l9uqqmegj69msgsltpqks33tuhopdxee4vqym4y617t;" data-marpit-pagination-total="46">
<h2 id="contextual-conversion-to-bool">Contextual conversion to <code>bool</code></h2>
<p>A special rule for conversion to <code>bool</code>.</p>
<p>Suppose <code>expr</code> is an expression of a class type <code>X</code>, and suppose <code>X</code> has an <code>explicit</code> type conversion operator to <code>bool</code>. In the following contexts, that conversion is applicable even if it is not written as <code>bool(expr)</code> or <code>static_cast&lt;bool&gt;(expr)</code>:</p>
<ul>
<li><code>if (expr)</code>, <code>while (expr)</code>, <code>for (...; expr; ...)</code>, <code>do ... while (expr)</code></li>
<li>as the operand of <code>!</code>, <code>&amp;&amp;</code>, <code>||</code></li>
<li>as the first operand of <code>?:</code>: <code>expr ? something : something_else</code></li>
</ul>
</section>

<h2 id="contextual-conversion-to-bool-1">Contextual conversion to <code>bool</code></h2>
<p>Exercise: We often test whether a pointer is non-null like this:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">if</span> (ptr) {
  <span class="hljs-comment">// ...</span>
}
<span class="hljs-keyword">auto</span> val = ptr ? ptr-&gt;some_value : <span class="hljs-number">0</span>;
</code></pre>
<p>Define a conversion from <code>WindowPtr</code> to <code>bool</code>, so that we can test whether a <code>WindowPtr</code> is non-null in the same way.</p>
<ul>
<li>Should this conversion be allowed to happen implicitly? If not, mark it <code>explicit</code>.</li>
</ul>
</section>

<h2 id="summary-1">Summary</h2>
<p>Type conversions</p>
<ul>
<li>Implicit vs explicit</li>
<li>User-defined type conversions: either through a constructor or through a type conversion operator.</li>
<li>To disable the implicit use of the user-defined type conversion: <code>explicit</code></li>
<li>Avoid abuse of type conversion operators.</li>
<li>Conversion to <code>bool</code> has some special rules (<em>contextual conversion</em>).</li>
</ul>
</section>
