<h2 id="defining-a-subclass-1">Defining a subclass</h2>
<p>Use <strong>inheritance</strong> to model the &quot;is-a&quot; relationship:</p>
<ul>
<li>A discounted item <strong>is an</strong> item.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">DiscountedItem</span> : <span class="hljs-keyword">public</span> Item {
  <span class="hljs-type">int</span> m_minQuantity = <span class="hljs-number">0</span>;
  <span class="hljs-type">double</span> m_discount = <span class="hljs-number">1.0</span>;
<span class="hljs-keyword">public</span>:
  <span class="hljs-comment">// constructors</span>
  <span class="hljs-comment">// netPrice</span>
};
</code></pre>

<h2 id="protected-members"><code>protected</code> members</h2>
<p>A <code>protected</code> member is private, except that it is accessible in subclasses.</p>
<ul>
<li><code>m_price</code> needs to be <code>protected</code>, of course.</li>
<li>Should <code>m_name</code> be <code>protected</code> or <code>private</code>?
<ul>
<li><code>private</code> is ok if the subclass does not modify it. It is accessible through the public <code>getName</code> interface.</li>
<li><code>protected</code> is also reasonable.</li>
</ul>
</li>
</ul>
</section>

<h2 id="protected-members-1"><code>protected</code> members</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Item</span> {
  std::string m_name;
<span class="hljs-keyword">protected</span>:
  <span class="hljs-type">double</span> m_price = <span class="hljs-number">0.0</span>;
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Item</span>() = <span class="hljs-keyword">default</span>;
  <span class="hljs-built_in">Item</span>(<span class="hljs-type">const</span> std::string &amp;name, <span class="hljs-type">double</span> price)
      : <span class="hljs-built_in">m_name</span>(name), <span class="hljs-built_in">m_price</span>(price) {}
  <span class="hljs-function"><span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;<span class="hljs-title">getName</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{ <span class="hljs-keyword">return</span> m_name; }
  <span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">netPrice</span><span class="hljs-params">(<span class="hljs-type">int</span> cnt)</span> <span class="hljs-type">const</span> </span>{

<h2 id="inheritance-1">Inheritance</h2>

<p>By defining <code>DiscountedItem</code> to be a subclass of <code>Item</code>, <strong>every <code>DiscountedItem</code> object contains a subobject of type <code>Item</code>.</strong></p>
<ul>
<li>Every data member and member function, except the ctors and dtors, is inherited, <strong>no matter what access level they have</strong>.</li>
</ul>
<p>What can be inferred from this?</p>

<h2 id="inheritance-2">Inheritance</h2>
<p>By defining <code>DiscountedItem</code> to be a subclass of <code>Item</code>, <strong>every <code>DiscountedItem</code> object contains a subobject of type <code>Item</code>.</strong></p>
<ul>
<li>Every data member and member function, except the ctors and dtors, is inherited, <strong>no matter what access level they have</strong>.</li>
</ul>
<p>What can be inferred from this?</p>
<ul>
<li>A constructor of <code>DiscountedItem</code> must first initialize the base class subobject by calling a constructor of <code>Item</code>'s.</li>
<li>The destructor of <code>DiscountedItem</code> must call the destructor of <code>Item</code> after having destroyed its own members (<code>m_minQuantity</code> and <code>m_discount</code>).</li>
<li><code>sizeof(Derived) &gt;= sizeof(Base)</code></li>
</ul>
</section>

<h2 id="inheritance-3">Inheritance</h2>
<p>Key points of inheritance:</p>
<ul>
<li>Every object of the derived class (subclass) contains a base class subobject.</li>
<li>Inheritance should not break the encapsulation of the base class.
<ul>
<li>e.g. To initialize the base class subobject, <strong>we must call a constructor of the base class</strong>. It is not allowed to initialize data members of the base class subobject directly.</li>
</ul>
</li>
</ul>
</section>

<h2 id="upcasting">Upcasting</h2>
<p>If <code>D</code> is a subclass of <code>B</code>:</p>
<ul>
<li>A <code>B*</code> can point to a <code>D</code>, and</li>
<li>A <code>B&amp;</code> can be bound to a <code>D</code>.</li>
</ul>
<pre><code class="language-cpp">DiscountedItem di = <span class="hljs-built_in">someValue</span>();
Item &amp;ir = di; <span class="hljs-comment">// correct</span>
Item *ip = &amp;di; <span class="hljs-comment">// correct</span>
</code></pre>
<p>Reason: The <strong>is-a</strong> relationship! A <code>D</code> <strong>is a</strong> <code>B</code>.</p>
<p>But on such references or pointers, only the members of <code>B</code> can be accessed.</p>
</section>

<h2 id="static-type-and-dynamic-type">Static type and dynamic type</h2>
<ul>
<li><strong>static type</strong> of an expression: The type known at compile-time.</li>
<li><strong>dynamic type</strong> of an expression: The real type of the object that the expression is representing. This is known at run-time.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">printItemName</span><span class="hljs-params">(<span class="hljs-type">const</span> Item &amp;item)</span> </span>{
  std::cout &lt;&lt; <span class="hljs-string">&quot;Name: &quot;</span> &lt;&lt; item.<span class="hljs-built_in">getName</span>() &lt;&lt; std::endl;
}
</code></pre>
<p>The static type of the expression <code>item</code> is <code>const Item</code>, but its dynamic type is not known until run-time. (It may be <code>const Item</code> or <code>const DiscountedItem</code>.)</p>
</section>

<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Item</span> {

    <span class="hljs-keyword">return</span> cnt &lt; m_minQuantity ? cnt * m_price : cnt * m_price * m_discount;

<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">printItemInfo</span><span class="hljs-params">(<span class="hljs-type">const</span> Item &amp;item)</span> </span>{

<p>The dynamic type of <code>item</code> is determined at run-time.</p>
<p>Since <code>netPrice</code> is a <code>virtual</code> function, which version is called is also determined at run-time:</p>
<ul>
<li>If the dynamic type of <code>item</code> is <code>Item</code>, it calls <code>Item::netPrice</code>.</li>
<li>If the dynamic type of <code>item</code> is <code>DiscountedItem</code>, it calls <code>DiscountedItem::netPrice</code>.</li>

<p><strong>late binding</strong>, or <strong>dynamic binding</strong></p>

<h2 id="virtual-override"><code>virtual</code>-<code>override</code></h2>
<p>To <strong>override</strong> (覆盖/覆写) a <code>virtual</code> function,</p>
<ul>
<li>The function parameter list must be the same as that of the base class's version.</li>
<li>The return type should be <strong>identical to</strong> (or <em><strong>covariant with</strong></em>) that of the corresponding function in the base class.
<ul>
<li>We will talk about &quot;covariant with&quot; in later lectures or recitations.</li>
</ul>
</li>
<li><strong>The <code>const</code>ness should be the same!</strong></li>
</ul>
<p>To make sure you are truly overriding the <code>virtual</code> function (instead of making a overloaded version), use the <code>override</code> keyword.</p>
<p><strong>* Not to be confused with &quot;overloading&quot;（重载）.</strong></p>
</section>

<h2 id="virtual-override-1"><code>virtual</code>-<code>override</code></h2>
<p>An overriding function is also <code>virtual</code>, even if not explicitly declared.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">DiscountedItem</span> : <span class="hljs-keyword">public</span> Item {
  <span class="hljs-function"><span class="hljs-keyword">virtual</span> <span class="hljs-type">double</span> <span class="hljs-title">netPrice</span><span class="hljs-params">(<span class="hljs-type">int</span> cnt)</span> <span class="hljs-type">const</span> <span class="hljs-keyword">override</span></span>; <span class="hljs-comment">// correct, explicitly virtual</span>
};
<span class="hljs-keyword">class</span> <span class="hljs-title class_">DiscountedItem</span> : <span class="hljs-keyword">public</span> Item {

<h2 id="usage-with-smart-pointers">Usage with smart pointers</h2>
<p>Smart pointers are implemented by wrapping the raw pointers, so they can also be used for dynamic binding.</p>
<pre><code class="language-cpp">std::vector&lt;std::shared_ptr&lt;Item&gt;&gt; myItems;
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> i = <span class="hljs-number">0</span>; i != n; ++i) {
  <span class="hljs-keyword">if</span> (someCondition) {
    myItems.<span class="hljs-built_in">push_back</span>(std::<span class="hljs-built_in">make_shared</span>&lt;Item&gt;(someParams));
  } <span class="hljs-keyword">else</span> {
    myItems.<span class="hljs-built_in">push_back</span>(std::<span class="hljs-built_in">make_shared</span>&lt;DiscountedItem&gt;(someParams));
  }
}
</code></pre>
<p>A <code>std::unique_ptr&lt;Derived&gt;</code> can be implicitly converted to a <code>std::unique_ptr&lt;Base&gt;</code>.</p>
<p>A <code>std::shared_ptr&lt;Derived&gt;</code> can be implicitly converted to a <code>std::shared_ptr&lt;Base&gt;</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-style="section::after {

<h2 id="copy-control">Copy-control</h2>
<p>Remember to copy/move the base subobject! One possible way:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Derived</span> : <span class="hljs-keyword">public</span> Base {
<span class="hljs-keyword">public</span>:
  <span class="hljs-built_in">Derived</span>(<span class="hljs-type">const</span> Derived &amp;other)
      : <span class="hljs-built_in">Base</span>(other), <span class="hljs-comment">/* Derived&#x27;s own members */</span> { <span class="hljs-comment">/* ... */</span> }
  Derived &amp;<span class="hljs-keyword">operator</span>=(<span class="hljs-type">const</span> Derived &amp;other) {
    Base::<span class="hljs-keyword">operator</span>=(other); <span class="hljs-comment">// call Base&#x27;s operator= explicitly</span>
    <span class="hljs-comment">// copy Derived&#x27;s own members</span>
    <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>;
  }
  <span class="hljs-comment">// ...</span>
};
</code></pre>
<p>Why <code>Base(other)</code> and <code>Base::operator=(other)</code> work?</p>
<ul>
<li>The parameter type is <code>const Base &amp;</code>, which can be bound to a <code>Derived</code> object.</li>
</ul>
</section>

<h2 id="synthesized-copy-control-members-1">Synthesized copy-control members</h2>
<p>Remeber that the base class's subobject is always handled first.</p>
<p>These rules are quite natural:</p>
<ul>
<li>What are the behaviors of the compiler-generated copy-control members?
<ul>
<li>First, it calls the base class's corresponding copy-control member.</li>
<li>Then, it performs the corresponding operation on the derived class's own data members.</li>
</ul>
</li>
<li>In what cases will they be <code>delete</code>d?
<ul>
<li>If the base class's corresponding copy-control member is not accessible (e.g. non-existent, or <code>private</code>),</li>
<li>or if any of the data members' corresponding copy-control member is not accessible.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-style="section::after {

<h2 id="slicing">Slicing</h2>
<p>Dynamic binding only happens on references or pointers to base class.</p>
<pre><code class="language-cpp"><span class="hljs-function">DiscountedItem <span class="hljs-title">di</span><span class="hljs-params">(<span class="hljs-string">&quot;A&quot;</span>, <span class="hljs-number">10</span>, <span class="hljs-number">2</span>, <span class="hljs-number">0.8</span>)</span></span>;
Item i = di; <span class="hljs-comment">// What happens?</span>
<span class="hljs-keyword">auto</span> x = i.<span class="hljs-built_in">netPrice</span>(<span class="hljs-number">3</span>); <span class="hljs-comment">// Which netPrice?</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-style="section::after {

;--theme:7w0kvll4h78pakx71fa2nmj9ckjtpx3sf4ojkhpf13;" data-marpit-pagination-total="45">
<h2 id="slicing-1">Slicing</h2>
<p>Dynamic binding only happens on references or pointers to base class.</p>
<pre><code class="language-cpp"><span class="hljs-function">DiscountedItem <span class="hljs-title">di</span><span class="hljs-params">(<span class="hljs-string">&quot;A&quot;</span>, <span class="hljs-number">10</span>, <span class="hljs-number">2</span>, <span class="hljs-number">0.8</span>)</span></span>;
Item i = di; <span class="hljs-comment">// What happens?</span>
<span class="hljs-keyword">auto</span> x = i.<span class="hljs-built_in">netPrice</span>(<span class="hljs-number">3</span>); <span class="hljs-comment">// Which netPrice?</span>
</code></pre>
<p><code>Item i = di;</code> calls the <strong>copy constructor of <code>Item</code></strong></p>
<ul>
<li>but <code>Item</code>'s copy constructor handles only the base part.</li>
<li>So <code>DiscountedItem</code>'s own members are <strong>ignored</strong>, or <strong>&quot;sliced down&quot;</strong>.</li>
<li><code>i.netPrice(3)</code> calls <code>Item::netPrice</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-style="section::after {

;--theme:7w0kvll4h78pakx71fa2nmj9ckjtpx3sf4ojkhpf13;" data-marpit-pagination-total="45">
<h2 id="polymorphic-class">Polymorphic class</h2>
<p>A class is said to be <strong>polymorphic</strong> if it has (declares or inherits) at least one virtual function.</p>
<ul>
<li>Either a <code>virtual</code> normal member function or a <code>virtual</code> dtor is ok.</li>
</ul>
<p>If a class is polymorphic, all classes derived from it are polymorphic.</p>
<ul>
<li>There is no way to &quot;refuse&quot; to inherit any member functions, so <code>virtual</code> member functions must be inherited.</li>
<li>The dtor must be <code>virtual</code> if the dtor of the base class is <code>virtual</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-style="section::after {

" data-theme="7w0kvll4h78pakx71fa2nmj9ckjtpx3sf4ojkhpf13" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:7w0kvll4h78pakx71fa2nmj9ckjtpx3sf4ojkhpf13;" data-marpit-pagination-total="45">
<h2 id="downcasting-for-polymorphic-class-only">Downcasting: For polymorphic class only</h2>
<p><code>dynamic_cast&lt;Target&gt;(expr)</code>.</p>
<pre><code class="language-cpp">Base *bp = <span class="hljs-keyword">new</span> Derived{};
Derived *dp = <span class="hljs-built_in">dynamic_cast</span>&lt;Derived *&gt;(bp);
Derived &amp;dr = <span class="hljs-built_in">dynamic_cast</span>&lt;Derived &amp;&gt;(*bp);
</code></pre>
<ul>
<li><code>Target</code> must be a <strong>reference</strong> or a <strong>pointer</strong> type.</li>
<li><code>dynamic_cast</code> will perform <strong>runtime type identification (RTTI)</strong> to check the dynamic type of the expression.
<ul>
<li>If the dynamic type is <code>Derived</code>, or a derived class (direct or indirect) of <code>Derived</code>, the downcasting succeeds.</li>

</ul>
</li>

<h2 id="dynamic_cast-can-be-very-slow"><code>dynamic_cast</code> can be very slow</h2>
<p><code>dynamic_cast</code> performs a runtime <strong>check</strong> to see whether the downcasting should succeed, which uses runtime type information.</p>
<p>This is <strong>much slower</strong> than other types of casting, e.g. <code>const_cast</code>, or arithmetic conversions.</p>
<p><strong>[Best practice]</strong> <u>Avoid <code>dynamic_cast</code> whenever possible.</u></p>
<h3 id="guaranteed-successful-downcasting-use-static_cast">Guaranteed successful downcasting: Use <code>static_cast</code>.</h3>
<p>If the downcasting is guaranteed to be successful, you may use <code>static_cast</code></p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> dp = <span class="hljs-built_in">static_cast</span>&lt;Derived *&gt;(bp); <span class="hljs-comment">// quicker than dynamic_cast,</span>
<span class="hljs-comment">// but performs no checks. If the dynamic type is not Derived, UB.</span>
</code></pre>

<h2 id="summary">Summary</h2>
<p>Inheritance</p>
<ul>
<li>Every object of type <code>Derived</code> contains a subobject of type <code>Base</code>.
<ul>
<li>Every member of <code>Base</code> is inherited, no matter whether it is accessible or not.</li>
</ul>
</li>
<li>Inheritance should not break the base class's encapsulation.
<ul>
<li>The access control of inherited members is not changed.</li>
<li>Every constructor of <code>Derived</code> calls a constructor of <code>Base</code> to initialize the base class subobject <strong>before</strong> initializing its own data members.</li>
<li>The destructor of <code>Derived</code> calls the destructor of <code>Base</code> to destroy the base class subobject <strong>after</strong> destroying its own data members.</li>
</ul>
</li>
</ul>
</section>

<h2 id="summary-1">Summary</h2>
<p>Dynamic binding</p>
<ul>
<li>Upcasting: A pointer, reference or smart pointer to <code>Base</code> can be bound to an object of type <code>Derived</code>.
<ul>
<li>static type and dynamic type</li>
</ul>
</li>
<li><code>virtual</code> functions: A function that can be overridden by derived classes.
<ul>
<li>The base class and the derived class can provide different versions of this function.</li>
</ul>
</li>
<li>Dynamic (late) binding
<ul>
<li>A call to a virtual function on a pointer or reference to <code>Base</code> will actually call the corresponding version of that function according to the dynamic type.</li>
</ul>
</li>
<li>Avoid downcasting if possible.</li>
</ul>
