<h2 id="better-c">&quot;Better C&quot;</h2>
<p>C++ was developed based on C.</p>
<p>From <em>The Design and Evolution of C++</em>:</p>
<blockquote>
<p>C++ is a general-purpose programming language that</p>
<ul>
<li><strong>is a better C</strong>,</li>
<li>supports data abstraction,</li>
<li>supports object-oriented programming.</li>
</ul>
</blockquote>
<p>C++ brought up new ideas and improvements of C, some of which also in turn influenced the development of C.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="better-c-1">&quot;Better C&quot;</h2>
<ul>
<li><code>bool</code>, <code>true</code> and <code>false</code> are built-in. No need to <code>#include &lt;stdbool.h&gt;</code>. <code>true</code> and <code>false</code> are of type <code>bool</code>, not <code>int</code>.
<ul>
<li>This is also true since C23.</li>
</ul>
</li>
<li>The return type of logical operators <code>&amp;&amp;</code>, <code>||</code>, <code>!</code> and comparison operators <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>, <code>==</code>, <code>!=</code> is <code>bool</code>, not <code>int</code>.</li>
<li>The type of string literals <code>&quot;hello&quot;</code> is <code>const char [N+1]</code>, not <code>char [N+1]</code>.
<ul>
<li>Recall that string literals are stored in <strong>read-only memory</strong>. Any attempt to modify them results in undefined behavior.</li>
</ul>
</li>
<li>The type of character literals <code>'a'</code> is <code>char</code>, not <code>int</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="better-c-2">&quot;Better C&quot;</h2>
<ul>
<li>
<p><code>const</code> variables initialized with literals are compile-time constants. They can be used as the length of arrays.</p>
<pre><code class="language-cpp"><span class="hljs-type">const</span> <span class="hljs-type">int</span> maxn = <span class="hljs-number">1000</span>;
<span class="hljs-type">int</span> a[maxn]; <span class="hljs-comment">// a normal array in C++, but VLA in C</span>
</code></pre>
</li>
<li>
<p><code>int fun()</code> declares a function accpeting no arguments. It is not accepting unknown arguments.</p>
<ul>
<li>This is also true since C23.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-style="section::after {

<h1 id="type-system">Type System</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-style="section::after {

}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--style:section::after {

}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="stronger-type-checking">Stronger type checking</h2>
<p>Some arithmetic conversions are problematic: They are not value-preserving.</p>
<pre><code class="language-c"><span class="hljs-type">int</span> x = some_int_value();
<span class="hljs-type">long</span> <span class="hljs-type">long</span> y = x; <span class="hljs-comment">// OK. Value-preserving</span>
<span class="hljs-type">long</span> <span class="hljs-type">long</span> z = some_long_long_value();
<span class="hljs-type">int</span> w = z;       <span class="hljs-comment">// Is this OK?</span>
</code></pre>
<ul>
<li>Conversion from <code>int</code> to <code>long long</code> is value-preserving, without doubt.</li>
<li>Conversion from <code>long long</code> to <code>int</code> may lose precision. (&quot;narrowing&quot;)</li>
</ul>
<p>However, no warning or error is generated for such conversions in C.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="stronger-type-checking-1">Stronger type checking</h2>
<p>Some arithmetic conversions are problematic: They are not value-preserving.</p>
<pre><code class="language-cpp"><span class="hljs-type">long</span> <span class="hljs-type">long</span> z = <span class="hljs-built_in">some_long_long_value</span>();
<span class="hljs-type">int</span> w = z; <span class="hljs-comment">// &quot;narrowing&quot; conversion</span>
</code></pre>
<p>Stroustrup had decided to ban all implicit narrowing conversions in C++. However,</p>
<blockquote>
<p>The experiment failed miserably. Every C program I looked at contained large numbers of assignments of <code>int</code>s to <code>char</code> variables. Naturally, since these were <strong>working programs</strong>, most of these assignments were perfectly safe. That is, either the value was small enough not to become truncated, or the truncation was expected or at least harmless in that particular context.</p>
</blockquote>
<p>In the end, narrowing conversions are not banned completely in C++. They are not allowed only in a special context in modern C++. We will see it soon.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="stronger-type-checking-2">Stronger type checking</h2>
<p>Some type conversions (casts) can be very dangerous:</p>
<pre><code class="language-c"><span class="hljs-type">const</span> <span class="hljs-type">int</span> x = <span class="hljs-number">42</span>, *pci = &amp;x;
<span class="hljs-type">int</span> *pi = pci; <span class="hljs-comment">// Warning in C, Error in C++</span>
++*pi;         <span class="hljs-comment">// undefined behavior</span>
<span class="hljs-type">char</span> *pc = pi; <span class="hljs-comment">// Warning in C, Error in C++</span>
<span class="hljs-type">void</span> *pv = pi; <span class="hljs-type">char</span> *pc2 = pv; <span class="hljs-comment">// Even no warning in C! Error in C++.</span>
<span class="hljs-type">int</span> y = pc;    <span class="hljs-comment">// Warning in C, Error in C++</span>
</code></pre>
<ul>
<li>For <code>T</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.486ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="2.106ex" role="img" focusable="false" viewBox="0 -716 778 931"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2260" d="M166 -215T159 -215T147 -212T141 -204T139 -197Q139 -190 144 -183L306 133H70Q56 140 56 153Q56 168 72 173H327L406 327H72Q56 332 56 347Q56 360 70 367H426Q597 702 602 707Q605 716 618 716Q625 716 630 712T636 703T638 696Q638 692 471 367H707Q722 359 722 347Q722 336 708 328L451 327L371 173H708Q722 163 722 153Q722 140 707 133H351Q175 -210 170 -212Q166 -215 159 -215Z"></path></g></g></g></svg></mjx-container> <code>U</code>, <code>T *</code> and <code>U *</code> are different types. Treating a <code>T *</code> as <code>U *</code> leads to undefined behavior in most cases, but the C compiler gives only a warning!</li>
<li><code>void *</code> is a hole in the type system. You can cast anything to and from it <strong>without even a warning</strong>.</li>
</ul>
<p>C++ does not allow the dangerous type conversions to happen <em><strong>implicitly</strong></em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="explicit-casts">Explicit Casts</h2>
<p>C++ provides four <strong>named cast operators</strong>:</p>
<ul>
<li><code>static_cast&lt;Type&gt;(expr)</code></li>
<li><code>const_cast&lt;Type&gt;(expr)</code></li>
<li><code>reinterpret_cast&lt;Type&gt;(expr)</code></li>
<li><code>dynamic_cast&lt;Type&gt;(expr)</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.054ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.242ex" role="img" focusable="false" viewBox="0 -525 1000 549"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D2" d="M580 514Q580 525 596 525Q601 525 604 525T609 525T613 524T615 523T617 520T619 517T622 512Q659 438 720 381T831 300T927 263Q944 258 944 250T935 239T898 228T840 204Q696 134 622 -12Q618 -21 615 -22T600 -24Q580 -24 580 -17Q580 -13 585 0Q620 69 671 123L681 133H70Q56 140 56 153Q56 168 72 173H725L735 181Q774 211 852 250Q851 251 834 259T789 283T735 319L725 327H72Q56 332 56 347Q56 360 70 367H681L671 377Q638 412 609 458T580 514Z"></path></g></g></g></svg></mjx-container> will be covered in later lectures.</li>
</ul>
<p>In contrast, the C style explicit cast <code>(Type)expr</code> looks way too innocent.</p>
<p>&quot;An ugly behavior should have an ugly looking.&quot;</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="const_cast"><code>const_cast</code></h2>
<p>Cast away low-level constness <strong>(DANGEROUS)</strong>:</p>
<pre><code class="language-cpp"><span class="hljs-type">int</span> ival = <span class="hljs-number">42</span>;
<span class="hljs-type">const</span> <span class="hljs-type">int</span> &amp;cref = ival;
<span class="hljs-type">int</span> &amp;ref = cref; <span class="hljs-comment">// Error: casting away low-level constness</span>
<span class="hljs-type">int</span> &amp;ref2 = <span class="hljs-built_in">const_cast</span>&lt;<span class="hljs-type">int</span> &amp;&gt;(cref); <span class="hljs-comment">// OK</span>
<span class="hljs-type">int</span> *ptr = <span class="hljs-built_in">const_cast</span>&lt;<span class="hljs-type">int</span> *&gt;(&amp;cref); <span class="hljs-comment">// OK</span>
</code></pre>
<p>However, modifying a <code>const</code> object through a non-<code>const</code> access path (possibly formed by <code>const_cast</code>) results in <strong>undefined behavior</strong>!</p>
<pre><code class="language-cpp"><span class="hljs-type">const</span> <span class="hljs-type">int</span> cival = <span class="hljs-number">42</span>;
<span class="hljs-type">int</span> &amp;ref = <span class="hljs-built_in">const_cast</span>&lt;<span class="hljs-type">int</span> &amp;&gt;(cival); <span class="hljs-comment">// compiles, but dangerous</span>
++ref; <span class="hljs-comment">// undefined behavior (may crash)</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="reinterpret_cast"><code>reinterpret_cast</code></h2>
<p>Often used to perform conversion between different pointer types <strong>(DANGEROUS)</strong>:</p>
<pre><code class="language-cpp"><span class="hljs-type">int</span> ival = <span class="hljs-number">42</span>;
<span class="hljs-type">char</span> *pc = <span class="hljs-built_in">reinterpret_cast</span>&lt;<span class="hljs-type">char</span> *&gt;(&amp;ival);
</code></pre>
<p>We must never forget that the actual object addressed by <code>pc</code> is an <code>int</code>, not a character! Any use of <code>pc</code> that assumes it's an ordinary character pointer <strong>is likely to fail</strong> at run time, e.g.:</p>
<pre><code class="language-cpp"><span class="hljs-function">std::string <span class="hljs-title">str</span><span class="hljs-params">(pc)</span></span>; <span class="hljs-comment">// undefined behavior</span>
</code></pre>
<p><strong>Wherever possible, do not use it!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="static_cast"><code>static_cast</code></h2>
<p>Other types of conversions (which often look &quot;harmless&quot;):</p>
<pre><code class="language-cpp"><span class="hljs-type">double</span> average = <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">double</span>&gt;(sum) / n;
<span class="hljs-type">int</span> pos = <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">int</span>&gt;(std::<span class="hljs-built_in">sqrt</span>(n));
</code></pre>
<p>Some typical usage: <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.054ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.242ex" role="img" focusable="false" viewBox="0 -525 1000 549"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D2" d="M580 514Q580 525 596 525Q601 525 604 525T609 525T613 524T615 523T617 520T619 517T622 512Q659 438 720 381T831 300T927 263Q944 258 944 250T935 239T898 228T840 204Q696 134 622 -12Q618 -21 615 -22T600 -24Q580 -24 580 -17Q580 -13 585 0Q620 69 671 123L681 133H70Q56 140 56 153Q56 168 72 173H725L735 181Q774 211 852 250Q851 251 834 259T789 283T735 319L725 327H72Q56 332 56 347Q56 360 70 367H681L671 377Q638 412 609 458T580 514Z"></path></g></g></g></svg></mjx-container> We will talk about them in later lectures.</p>
<pre><code class="language-cpp"><span class="hljs-built_in">static_cast</span>&lt;std::string &amp;&amp;&gt;(str) <span class="hljs-comment">// converts to a xvalue</span>
<span class="hljs-built_in">static_cast</span>&lt;Derived *&gt;(base_ptr) <span class="hljs-comment">// downcast without runtime checking</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="minimize-casting">Minimize casting</h2>
<p><strong>[Best practice]</strong> <u>Minimize casting. (<em>Effective C++</em> Item 27)</u></p>
<p>Type systems work as a <strong>guard</strong> against possible errors: Type mismatch often indicates a logical error.</p>
<p><strong>[Best practice]</strong> <u>When casting is necessary, <strong>prefer C++-style casts to old C-style casts</strong>.</u></p>
<ul>
<li>With old C-style casts, you can't even tell whether it is dangerous or not!</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="type-deduction">Type deduction</h2>
<p>C++ is very good at <strong>type computations</strong>:</p>
<pre><code class="language-cpp"><span class="hljs-function">std::vector <span class="hljs-title">v</span><span class="hljs-params">(<span class="hljs-number">10</span>, <span class="hljs-number">42</span>)</span></span>;
</code></pre>
<ul>
<li>It should be <code>std::vector&lt;int&gt; v(10, 42);</code>, but the compiler can deduce that <code>int</code> from <code>42</code>.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-type">int</span> x = <span class="hljs-number">42</span>; <span class="hljs-type">double</span> d = <span class="hljs-number">3.14</span>; std::string s = <span class="hljs-string">&quot;hello&quot;</span>;
std::cout &lt;&lt; x &lt;&lt; d &lt;&lt; s;
</code></pre>
<ul>
<li>The compiler can detect the types of <code>x</code>, <code>d</code> and <code>s</code> and select the correct printing functions.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="auto"><code>auto</code></h2>
<p>When declaring a variable with an initializer, we can use the keyword <code>auto</code> to let the compiler deduce the type.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> x = <span class="hljs-number">42</span>;    <span class="hljs-comment">// `int`, because 42 is an `int`.</span>
<span class="hljs-keyword">auto</span> y = <span class="hljs-number">3.14</span>;  <span class="hljs-comment">// `double`, because 3.14 is a `double`.</span>
<span class="hljs-keyword">auto</span> z = x + y; <span class="hljs-comment">// `double`, because the type of `x + y` is `double`.</span>
<span class="hljs-keyword">auto</span> m;         <span class="hljs-comment">// Error: cannot deduce the type. An initializer is needed.</span>
</code></pre>
<p><code>auto</code> can also be used to produce compound types:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> &amp;r = x;        <span class="hljs-comment">// `int &amp;`, because `x` is an `int`.</span>
<span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;rc = r; <span class="hljs-comment">// `const int &amp;`.</span>
<span class="hljs-keyword">auto</span> *p = &amp;rc;      <span class="hljs-comment">// `const int *`, because `&amp;rc` is `const int *`.</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="auto-1"><code>auto</code></h2>
<p>What about this?</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> str = <span class="hljs-string">&quot;hello&quot;</span>;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="auto-2"><code>auto</code></h2>
<p>What about this?</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> str = <span class="hljs-string">&quot;hello&quot;</span>; <span class="hljs-comment">// `const char *`</span>
</code></pre>
<ul>
<li>Recall that the type of <code>&quot;hello&quot;</code> is <strong><code>const char [6]</code></strong>, not <code>std::string</code>. This is for compatibility with C.</li>
<li>When using <code>auto</code>, the array-to-pointer conversion (&quot;decay&quot;) is performed automatically.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="auto-3"><code>auto</code></h2>
<p>Deduction of return type is also allowed (since C++14):</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">sum</span><span class="hljs-params">(<span class="hljs-type">int</span> x, <span class="hljs-type">int</span> y)</span> </span>{
  <span class="hljs-keyword">return</span> x + y;
}
</code></pre>
<ul>
<li>The return type is deduced to <code>int</code>.</li>
</ul>
<p>Since C++20, <code>auto</code> can also be used for function parameters! Such a function is actually a function template.</p>
<ul>
<li>This is beyond the scope of CS100.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">sum</span><span class="hljs-params">(<span class="hljs-keyword">auto</span> x, <span class="hljs-keyword">auto</span> y)</span> </span>{
  <span class="hljs-keyword">return</span> x + y;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="auto-4"><code>auto</code></h2>
<p><code>auto</code> lets us enjoy the benefits of the static type system.</p>
<p>Some types in C++ are very long:</p>
<pre><code class="language-cpp">std::vector&lt;std::string&gt;::const_iterator it = vs.<span class="hljs-built_in">begin</span>();
</code></pre>
<p>Use <code>auto</code> to simplify it:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> it = vs.<span class="hljs-built_in">begin</span>();
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="auto-5"><code>auto</code></h2>
<p><code>auto</code> lets us enjoy the benefits of the static type system.</p>
<p>Some types in C++ are not known to anyone but the compiler:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> lam = [](<span class="hljs-type">int</span> x, <span class="hljs-type">int</span> y) { <span class="hljs-keyword">return</span> x + y; } <span class="hljs-comment">// A lambda expression.</span>
</code></pre>
<p>Every lambda expression has its own type, whose name is only known by the compiler.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="decltype"><code>decltype</code></h2>
<p><code>decltype(expr)</code> will deduce the type of the expression <code>expr</code> <strong>without evaluating it</strong>.</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b)</span> </span>{ <span class="hljs-comment">// The return type is deduced to be `int`.</span>
  std::cout &lt;&lt; <span class="hljs-string">&quot;fun() is called.\n&quot;</span>
  <span class="hljs-keyword">return</span> a + b;
}
<span class="hljs-type">int</span> x = <span class="hljs-number">10</span>, y = <span class="hljs-number">15</span>;
<span class="hljs-keyword">decltype</span>(<span class="hljs-built_in">fun</span>(x, y)) z; <span class="hljs-comment">// Same as `int z;`.</span>
                       <span class="hljs-comment">// Unlike `auto`, no initializer is required here.</span>
                       <span class="hljs-comment">// The type is deduced from the return type of `fun`.</span>
</code></pre>
<ul>
<li><code>decltype(fun(x, y))</code> only deduces the return type of <code>fun</code> without actually calling it. Therefore, <strong>no output is produced</strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-style="section::after {

<h2 id="note-on-auto-and-decltype">Note on <code>auto</code> and <code>decltype</code></h2>
<p>The detailed rules of <code>auto</code> and <code>decltype</code> (as well as their differences) are complicated, and require some deeper understanding of C++ types and templates. You don't have to remember them.</p>
<p>Learn about them mainly through experiments.</p>
<ul>
<li>A good IDE should be of great help: Place your mouse on it, and your IDE should tell you the deduction result.</li>
</ul>
<a align="center">
  <img src="img/vscode_show_auto.png" width=300 />
</a>
<p>C23 also has <code>auto</code> type deduction.</p>
</section>

<h2 id="default-arguments">Default arguments</h2>
<p>Some functions have parameters that are given a particular value in most, but not all, calls. In such cases, we can declare that common value as a <strong>default argument</strong>.</p>
<pre><code class="language-cpp"><span class="hljs-function">std::string <span class="hljs-title">get_screen</span><span class="hljs-params">(std::<span class="hljs-type">size_t</span> height = <span class="hljs-number">24</span>, std::<span class="hljs-type">size_t</span> width = <span class="hljs-number">80</span>,
                       <span class="hljs-type">char</span> background = <span class="hljs-string">&#x27; &#x27;</span>)</span></span>;
</code></pre>
<ul>
<li>
<p>By default, the screen is <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="7.291ex" height="1.581ex" role="img" focusable="false" viewBox="0 -677 3222.4 699"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z" transform="translate(500,0)"></path></g><g data-mml-node="mo" transform="translate(1222.2,0)"><path data-c="D7" d="M630 29Q630 9 609 9Q604 9 587 25T493 118L389 222L284 117Q178 13 175 11Q171 9 168 9Q160 9 154 15T147 29Q147 36 161 51T255 146L359 250L255 354Q174 435 161 449T147 471Q147 480 153 485T168 490Q173 490 175 489Q178 487 284 383L389 278L493 382Q570 459 587 475T609 491Q630 491 630 471Q630 464 620 453T522 355L418 250L522 145Q606 61 618 48T630 29Z"></path></g><g data-mml-node="mn" transform="translate(2222.4,0)"><path data-c="38" d="M70 417T70 494T124 618T248 666Q319 666 374 624T429 515Q429 485 418 459T392 417T361 389T335 371T324 363L338 354Q352 344 366 334T382 323Q457 264 457 174Q457 95 399 37T249 -22Q159 -22 101 29T43 155Q43 263 172 335L154 348Q133 361 127 368Q70 417 70 494ZM286 386L292 390Q298 394 301 396T311 403T323 413T334 425T345 438T355 454T364 471T369 491T371 513Q371 556 342 586T275 624Q268 625 242 625Q201 625 165 599T128 534Q128 511 141 492T167 463T217 431Q224 426 228 424L286 386ZM250 21Q308 21 350 55T392 137Q392 154 387 169T375 194T353 216T330 234T301 253T274 270Q260 279 244 289T218 306L210 311Q204 311 181 294T133 239T107 157Q107 98 150 60T250 21Z"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(500,0)"></path></g></g></g></svg></mjx-container> filled with <code>' '</code>.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> default_screen = <span class="hljs-built_in">get_screen</span>();
</code></pre>
</li>
<li>
<p>To override the default arguments:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> large_screen   = <span class="hljs-built_in">get_screen</span>(<span class="hljs-number">66</span>);           <span class="hljs-comment">// 66x80, filled with &#x27; &#x27;</span>
<span class="hljs-keyword">auto</span> larger_screen  = <span class="hljs-built_in">get_screen</span>(<span class="hljs-number">66</span>, <span class="hljs-number">256</span>);      <span class="hljs-comment">// 66x256, filled with &#x27; &#x27;</span>
<span class="hljs-keyword">auto</span> special_screen = <span class="hljs-built_in">get_screen</span>(<span class="hljs-number">66</span>, <span class="hljs-number">256</span>, <span class="hljs-string">&#x27;#&#x27;</span>); <span class="hljs-comment">// 66x256, filled with &#x27;#&#x27;</span>
</code></pre>
</li>
</ul>
</section>

<h2 id="default-arguments-1">Default arguments</h2>
<p>Arguments in the call are resolved by position.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> scr = <span class="hljs-built_in">get_screen</span>(<span class="hljs-string">&#x27;#&#x27;</span>); <span class="hljs-comment">// Passing the ASCII value of &#x27;#&#x27; to `height`.</span>
                            <span class="hljs-comment">// `width` and `background` are set to</span>
                            <span class="hljs-comment">// default values (`80` and `&#x27; &#x27;`).</span>
</code></pre>
<ul>
<li>
<p>Some other languages have named parameters:</p>
<pre><code class="language-python"><span class="hljs-built_in">print</span>(a, b, sep=<span class="hljs-string">&quot;, &quot;</span>, end=<span class="hljs-string">&quot;&quot;</span>) <span class="hljs-comment"># Python</span>
</code></pre>
<p>There is no such syntax in C++.</p>
</li>
</ul>
<p>Default arguments are only allowed for the last (right-most) several parameters:</p>
<pre><code class="language-cpp"><span class="hljs-function">std::string <span class="hljs-title">get_screen</span><span class="hljs-params">(std::<span class="hljs-type">size_t</span> height = <span class="hljs-number">24</span>, std::<span class="hljs-type">size_t</span> width,
                       <span class="hljs-type">char</span> background)</span></span>; <span class="hljs-comment">// Error.</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-style="section::after {

;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="function-overloading">Function overloading</h2>
<p>In C++, a group of functions can have the same name, as long as they can be differentiated when called.</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">max</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b)</span> </span>{
  <span class="hljs-keyword">return</span> a &lt; b ? b : a;
}
<span class="hljs-function"><span class="hljs-type">double</span> <span class="hljs-title">max</span><span class="hljs-params">(<span class="hljs-type">double</span> a, <span class="hljs-type">double</span> b)</span> </span>{
  <span class="hljs-keyword">return</span> a &lt; b ? b : a;
}
<span class="hljs-function"><span class="hljs-type">const</span> <span class="hljs-type">char</span> *<span class="hljs-title">max</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">char</span> *a, <span class="hljs-type">const</span> <span class="hljs-type">char</span> *b)</span> </span>{
  <span class="hljs-keyword">return</span> std::<span class="hljs-built_in">strcmp</span>(a, b) &lt; <span class="hljs-number">0</span> ? b : a;
}
</code></pre>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> x = <span class="hljs-built_in">max</span>(<span class="hljs-number">10</span>, <span class="hljs-number">20</span>);           <span class="hljs-comment">// Calls max(int, int)</span>
<span class="hljs-keyword">auto</span> y = <span class="hljs-built_in">max</span>(<span class="hljs-number">3.14</span>, <span class="hljs-number">2.5</span>);        <span class="hljs-comment">// Calls max(double, double)</span>
<span class="hljs-keyword">auto</span> z = <span class="hljs-built_in">max</span>(<span class="hljs-string">&quot;hello&quot;</span>, <span class="hljs-string">&quot;world&quot;</span>); <span class="hljs-comment">// Calls max(const char *, const char *)</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-style="section::after {

<h2 id="overloaded-functions">Overloaded functions</h2>
<p>Overloaded functions should be distinguished in the way they are called.</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span>)</span></span>;
<span class="hljs-function"><span class="hljs-type">double</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span>)</span></span>;  <span class="hljs-comment">// Error: functions that differ only in</span>
                  <span class="hljs-comment">// their return type cannot be overloaded.</span>
</code></pre>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">move_cursor</span><span class="hljs-params">(Coord to)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">move_cursor</span><span class="hljs-params">(<span class="hljs-type">int</span> r, <span class="hljs-type">int</span> c)</span></span>; <span class="hljs-comment">// OK, differ in the number of arguments</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-style="section::after {

" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--style:section::after {

;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="overloaded-functions-1">Overloaded functions</h2>
<p>Overloaded functions should be distinguished in the way they are called.</p>
<ul>
<li>
<p>The following are declaring <strong>the same function</strong>. They are not overloading.</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> *)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> [<span class="hljs-number">10</span>])</span></span>;
</code></pre>
</li>
<li>
<p>The following are the same for an array argument:</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> *a)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> (&amp;a)[<span class="hljs-number">10</span>])</span></span>;
<span class="hljs-type">int</span> ival = <span class="hljs-number">42</span>; <span class="hljs-built_in">fun</span>(&amp;ival); <span class="hljs-comment">// OK, calls fun(int *)</span>
<span class="hljs-type">int</span> arr[<span class="hljs-number">10</span>];   <span class="hljs-built_in">fun</span>(arr);   <span class="hljs-comment">// Error: ambiguous call</span>
</code></pre>
<p>Why?</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-style="section::after {

" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--style:section::after {

;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="overloaded-functions-2">Overloaded functions</h2>
<p>Overloaded functions should be distinguished in the way they are called.</p>
<ul>
<li>
<p>The following are the same for an array argument:</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> *a)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> (&amp;a)[<span class="hljs-number">10</span>])</span></span>;
<span class="hljs-type">int</span> arr[<span class="hljs-number">10</span>];   <span class="hljs-built_in">fun</span>(arr);   <span class="hljs-comment">// Error: ambiguous call</span>
</code></pre>
<ul>
<li>For <code>fun(int (&amp;)[10])</code>, this is <strong>an exact match</strong>.</li>
<li>For <code>fun(int *)</code>, this involves an array-to-pointer implicit conversion. We will see that this is <strong>also considered an exact match</strong>.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-style="section::after {

<h2 id="basic-overload-resolution">Basic overload resolution</h2>
<p>Suppose we have the following overloaded functions.</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span>)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">double</span>)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> *)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">int</span> *)</span></span>;
</code></pre>
<p>Which will be the best match for a call <code>fun(a)</code>?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-style="section::after {

" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="basic-overload-resolution-1">Basic overload resolution</h2>
<p>Suppose we have the following overloaded functions.</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span>)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">double</span>)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> *)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">int</span> *)</span></span>;
</code></pre>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<p>Obvious: The arguments and the parameters match perfectly.</p>
<pre><code class="language-cpp"><span class="hljs-built_in">fun</span>(<span class="hljs-number">42</span>);   <span class="hljs-comment">// fun(int)</span>
<span class="hljs-built_in">fun</span>(<span class="hljs-number">3.14</span>); <span class="hljs-comment">// fun(double)</span>
<span class="hljs-type">const</span> <span class="hljs-type">int</span> arr[<span class="hljs-number">10</span>];
<span class="hljs-built_in">fun</span>(arr);  <span class="hljs-comment">// fun(const int *)</span>
</code></pre>
  </div>
  <div>
<p>Not so obvious:</p>
<pre><code class="language-cpp"><span class="hljs-type">int</span> ival = <span class="hljs-number">42</span>;
<span class="hljs-comment">// fun(int *) or fun(const int *)?</span>
<span class="hljs-built_in">fun</span>(&amp;ival);
<span class="hljs-built_in">fun</span>(<span class="hljs-string">&#x27;a&#x27;</span>);   <span class="hljs-comment">// fun(int) or fun(double)?</span>
<span class="hljs-built_in">fun</span>(<span class="hljs-number">3.14f</span>); <span class="hljs-comment">// fun(int) or fun(double)?</span>
<span class="hljs-built_in">fun</span>(<span class="hljs-literal">NULL</span>);  <span class="hljs-comment">// fun(int) or fun(int *)?</span>
</code></pre>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-style="section::after {

" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--style:section::after {

;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="basic-overload-resolution-2">Basic overload resolution</h2>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span>)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">double</span>)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> *)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">int</span> *)</span></span>;
</code></pre>
<ul>
<li><code>fun(&amp;ival)</code> matches <code>fun(int *)</code></li>
<li><code>fun('a')</code> matches <code>fun(int)</code></li>
<li><code>fun(3.14f)</code> matches <code>fun(double)</code></li>
<li><code>fun(NULL)</code> ? We will see this later.</li>
</ul>
<p>There are detailed rules that define these behaviors. <strong>But our program should avoid such confusing overload sets.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-style="section::after {

}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="basic-overload-resolution-3">Basic overload resolution</h2>
<ol>
<li>An exact match, including the following cases:
<ul>
<li>identical types</li>
<li><strong>match through decay of array</strong> <em>(or function)</em> <strong>type</strong></li>
<li>match through top-level <code>const</code> conversion</li>
</ul>
</li>
<li><strong>Match through adding low-level <code>const</code></strong></li>
<li>Match through <a href="https://en.cppreference.com/w/cpp/language/implicit_conversion#Numeric_promotions">integral or floating-point promotion</a></li>
<li>Match through <a href="https://en.cppreference.com/w/cpp/language/implicit_conversion#Numeric_conversions">numeric conversion</a></li>
<li>Match through a class-type conversion (in later lectures).</li>
</ol>
<p>No need to remember all the details. But pay attention to some cases that are very common.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-style="section::after {

" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--style:section::after {

;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="the-null-pointer">The null pointer</h2>
<p><code>NULL</code> is a <strong>macro</strong> defined in standard library header files.</p>
<ul>
<li>In C, it may be defined as <code>(void *)0</code>, <code>0</code>, <code>(long)0</code> or other forms.</li>
</ul>
<p>In C++, <code>NULL</code> cannot be <code>(void *)0</code> since the implicit conversion from <code>void *</code> to other pointer types is <strong>not allowed</strong>.</p>
<ul>
<li>
<p>It is most likely to be an integer literal with value zero.</p>
</li>
<li>
<p>With the following overload declarations, <code>fun(NULL)</code> may call <code>fun(int)</code> on some platforms, and may be <strong>ambiguous</strong> on other platforms!</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span>)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> *)</span></span>;
</code></pre>
  </div>
  <div>
<pre><code class="language-cpp"><span class="hljs-built_in">fun</span>(<span class="hljs-literal">NULL</span>); <span class="hljs-comment">// May call fun(int),</span>
           <span class="hljs-comment">// or may be ambiguous.</span>
</code></pre>
  </div>
</div>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="better-null-pointer-nullptr">Better null pointer: <code>nullptr</code></h2>
<p>In short, <code>NULL</code> is a &quot;fake&quot; pointer.</p>
<p>Since C++11, a better null pointer is introduced: <code>nullptr</code> (also available in C23)</p>
<ul>
<li>
<p><code>nullptr</code> has a unique type <code>std::nullptr_t</code> (defined in <code>&lt;cstddef&gt;</code>), which is neither <code>void *</code> nor an integer.</p>
</li>
<li>
<p><code>fun(nullptr)</code> will definitely match <code>fun(int *)</code>.</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span>)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">fun</span><span class="hljs-params">(<span class="hljs-type">int</span> *)</span></span>;
</code></pre>
  </div>
  <div>
<pre><code class="language-cpp"><span class="hljs-built_in">fun</span>(<span class="hljs-literal">NULL</span>); <span class="hljs-comment">// May call fun(int),</span>
           <span class="hljs-comment">// or may be ambiguous.</span>
<span class="hljs-built_in">fun</span>(<span class="hljs-literal">nullptr</span>); <span class="hljs-comment">// Calls fun(int *).</span>
</code></pre>
  </div>
</div>
</li>
</ul>
<p><strong>[Best practice]</strong> <u>Use <code>nullptr</code> as the null pointer constant in C++.</u></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-style="section::after {

<h2 id="avoid-abuse-of-function-overloading">Avoid abuse of function overloading</h2>
<p>Only overload operations that actually do similar things. A bad example:</p>
<pre><code class="language-cpp"><span class="hljs-function">Screen &amp;<span class="hljs-title">moveHome</span><span class="hljs-params">(Screen &amp;)</span></span>;
<span class="hljs-function">Screen &amp;<span class="hljs-title">moveAbs</span><span class="hljs-params">(Screen &amp;, <span class="hljs-type">int</span>, <span class="hljs-type">int</span>)</span></span>;
<span class="hljs-function">Screen &amp;<span class="hljs-title">moveRel</span><span class="hljs-params">(Screen &amp;, <span class="hljs-type">int</span>, <span class="hljs-type">int</span>, std::string direction)</span></span>;
</code></pre>
<p>If we overload this set of functions under the name <code>move</code>, some information is lost.</p>
<pre><code class="language-cpp"><span class="hljs-function">Screen &amp;<span class="hljs-title">move</span><span class="hljs-params">(Screen &amp;)</span></span>;
<span class="hljs-function">Screen &amp;<span class="hljs-title">move</span><span class="hljs-params">(Screen &amp;, <span class="hljs-type">int</span>, <span class="hljs-type">int</span>)</span></span>;
<span class="hljs-function">Screen &amp;<span class="hljs-title">move</span><span class="hljs-params">(Screen &amp;, <span class="hljs-type">int</span>, <span class="hljs-type">int</span>, std::string direction)</span></span>;
</code></pre>
<p>Which one is easier to understand?</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-cpp"><span class="hljs-built_in">moveHome</span>(scrn); <span class="hljs-comment">// OK, moves to home.</span>
</code></pre>
  </div>
  <div>
<pre><code class="language-cpp"><span class="hljs-built_in">move</span>(scrn); <span class="hljs-comment">// Unclear: How to move?</span>
</code></pre>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-style="section::after {

<h2 id="range-based-for-loops">Range-based <code>for</code> loops</h2>
<p>Traverse a <code>std::string</code></p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">str_to_int</span><span class="hljs-params">(<span class="hljs-type">const</span> std::string &amp;str)</span> </span>{
  <span class="hljs-type">int</span> value = <span class="hljs-number">0</span>;
  <span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> c : str) <span class="hljs-comment">// char</span>
    value = value * <span class="hljs-number">10</span> + c - <span class="hljs-string">&#x27;0&#x27;</span>;
  <span class="hljs-keyword">return</span> value;
}
</code></pre>
<p>Note: This function can be replaced by <code>std::stol</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-style="section::after {

;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="range-based-for-loops-1">Range-based <code>for</code> loops</h2>
<p>Traverse a <code>std::vector</code></p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">is_all_digits</span><span class="hljs-params">(<span class="hljs-type">const</span> std::string &amp;str)</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> c : str)
    <span class="hljs-keyword">if</span> (!std::<span class="hljs-built_in">isdigit</span>(c))
      <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
  <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
}
<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">count_numbers</span><span class="hljs-params">(<span class="hljs-type">const</span> std::vector&lt;std::string&gt; &amp;strs)</span> </span>{
  <span class="hljs-type">int</span> cnt = <span class="hljs-number">0</span>;
  <span class="hljs-keyword">for</span> (<span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;s : strs) <span class="hljs-comment">// const std::string &amp;s</span>
    <span class="hljs-keyword">if</span> (<span class="hljs-built_in">is_all_digits</span>(s))
      ++cnt;
  <span class="hljs-keyword">return</span> cnt;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-style="section::after {

;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="traverse-an-array">Traverse an array</h2>
<p>An array can also be traversed by range-<code>for</code>:</p>
<pre><code class="language-cpp"><span class="hljs-type">int</span> arr[<span class="hljs-number">100</span>] = {}; <span class="hljs-comment">// OK in C++ and C23.</span>
<span class="hljs-comment">// The following loop will read 100 integers.</span>
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> &amp;x : arr) <span class="hljs-comment">// int &amp;</span>
  std::cin &gt;&gt; x;
</code></pre>
<ul>
<li>Note: The range-based <code>for</code> loop will traverse <strong>the entire array</strong>.</li>
</ul>
<p>What else can be traversed using a range-<code>for</code>? <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.054ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.242ex" role="img" focusable="false" viewBox="0 -525 1000 549"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D2" d="M580 514Q580 525 596 525Q601 525 604 525T609 525T613 524T615 523T617 520T619 517T622 512Q659 438 720 381T831 300T927 263Q944 258 944 250T935 239T898 228T840 204Q696 134 622 -12Q618 -21 615 -22T600 -24Q580 -24 580 -17Q580 -13 585 0Q620 69 671 123L681 133H70Q56 140 56 153Q56 168 72 173H725L735 181Q774 211 852 250Q851 251 834 259T789 283T735 319L725 327H72Q56 332 56 347Q56 360 70 367H681L671 377Q638 412 609 458T580 514Z"></path></g></g></g></svg></mjx-container> We will learn about this when introducing <strong>iterators</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-style="section::after {

" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--style:section::after {

<h2 id="pass-an-array-by-reference">Pass an array by reference</h2>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">print</span><span class="hljs-params">(<span class="hljs-type">int</span> *arr)</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> x : arr) <span class="hljs-comment">// Error: `arr` is a pointer, not an array.</span>
    std::cout &lt;&lt; x &lt;&lt; <span class="hljs-string">&#x27; &#x27;</span>;
  std::cout &lt;&lt; <span class="hljs-string">&#x27;\n&#x27;</span>;
}
</code></pre>
<p>We can declare <code>arr</code> to be a <strong>reference to array</strong>:</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">print</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">int</span> (&amp;arr)[<span class="hljs-number">100</span>])</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> x : arr) <span class="hljs-comment">// OK. `arr` is an array.</span>
    std::cout &lt;&lt; x &lt;&lt; <span class="hljs-string">&#x27; &#x27;</span>;
  std::cout &lt;&lt; <span class="hljs-string">&#x27;\n&#x27;</span>;
}
</code></pre>
<ul>
<li><code>arr</code> is of type <code>const int (&amp;)[100]</code>: a reference to an array of <code>100</code> elements, where each element is of type <code>const int</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-style="section::after {

" data-theme="2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--style:section::after {

;--theme:2lk6w0w3iugbl96j4mf6hcmntmor8j2sn6m53vclqg0l;" data-marpit-pagination-total="46">
<h2 id="pass-an-array-by-reference-1">Pass an array by reference</h2>
<p>We can declare <code>arr</code> to be a <strong>reference to array</strong>:</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">print</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">int</span> (&amp;arr)[<span class="hljs-number">100</span>])</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> x : arr) <span class="hljs-comment">// OK. `arr` is an array.</span>
    std::cout &lt;&lt; x &lt;&lt; <span class="hljs-string">&#x27; &#x27;</span>;
  std::cout &lt;&lt; <span class="hljs-string">&#x27;\n&#x27;</span>;
}
</code></pre>
<ul>
<li><code>arr</code> is of type <code>const int (&amp;)[100]</code>: a reference to an array of <code>100</code> elements, where each element is of type <code>const int</code>.</li>
</ul>
<p>Note that only arrays of <code>100</code> <code>int</code>s can fit here.</p>
<pre><code class="language-cpp"><span class="hljs-type">int</span> a[<span class="hljs-number">100</span>] = {}; <span class="hljs-built_in">print</span>(a); <span class="hljs-comment">// OK.</span>
<span class="hljs-type">int</span> b[<span class="hljs-number">101</span>] = {}; <span class="hljs-built_in">print</span>(b); <span class="hljs-comment">// Error.</span>
<span class="hljs-type">double</span> c[<span class="hljs-number">100</span>] = {}; <span class="hljs-built_in">print</span>(c); <span class="hljs-comment">// Error.</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-style="section::after {

<h2 id="pass-an-array-by-reference-2">Pass an array by reference</h2>
<p>To allow arrays of any type, any length: Use a template function.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Type, std::<span class="hljs-type">size_t</span> N&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">print</span><span class="hljs-params">(<span class="hljs-type">const</span> Type (&amp;arr)[N])</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;x : arr)
    std::cout &lt;&lt; x &lt;&lt; <span class="hljs-string">&#x27; &#x27;</span>;
  std::cout &lt;&lt; <span class="hljs-string">&#x27;\n&#x27;</span>;
}
</code></pre>
<p>We will learn about this in the end of this semester.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-style="section::after {

<h2 id="summary">Summary</h2>
<p>Type system</p>
<ul>
<li>Dangerous casts must happen explicitly: pointers of different types, pointers to integers, casting away low-level <code>const</code>ness, ...</li>
<li><code>const_cast</code>: used for casting away low-level <code>const</code>ness.</li>
<li><code>reinterpret_cast</code>: used for conversion between different pointer types.</li>
<li><code>static_cast</code>: used for some normal &quot;innocent-looking&quot; conversions: <code>int</code> to <code>double</code>, <code>unsigned</code> to <code>int</code>, ...</li>
<li><strong>Prefer the C++-style named casts to old C-style casts.</strong></li>
<li><code>auto</code> and <code>decltype</code>: type deduction</li>
</ul>
</section>
