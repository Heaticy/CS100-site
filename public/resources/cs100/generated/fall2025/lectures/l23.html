<h2 id="containers"><a href="https://en.cppreference.com/w/cpp/container">Containers</a></h2>
<ul>
<li>Sequence containers
<ul>
<li><code>vector</code>, <code>list</code>, <code>deque</code>, <code>array</code> (since C++11), <code>forward_list</code> (since C++11)</li>
</ul>
</li>
<li>Associative containers
<ul>
<li><code>set</code>, <code>map</code>, <code>multiset</code>, <code>multimap</code> (often implemented with <em>binary search trees</em>)</li>
</ul>
</li>
<li>Unordered associative containers (since C++11)
<ul>
<li><code>unordered_set</code>, <code>unordered_map</code>, <code>unordered_multiset</code>, <code>unordered_multimap</code> (implemented with <em>hash tables</em>)</li>
</ul>
</li>
<li>Container adaptors: provide a different interface for sequential containers, but they are not containers themselves.
<ul>
<li><code>stack</code>, <code>queue</code>, <code>priority_queue</code></li>
<li>(since C++23) <code>flat_set</code>, <code>flat_map</code>, <code>flat_multiset</code>, <code>flat_multimap</code></li>
</ul>
</li>
</ul>

<h3 id="without-iterators">Without iterators:</h3>
<ul>
<li>Traverse an array<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != <span class="hljs-built_in">sizeof</span>(a) / <span class="hljs-built_in">sizeof</span>(a[<span class="hljs-number">0</span>]); ++i)
  <span class="hljs-built_in">do_something</span>(a[i]);
</code></pre>
</li>
<li>Traverse a <code>vector</code><pre><code class="language-cpp"><span class="hljs-keyword">for</span> (std::<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i != v.<span class="hljs-built_in">size</span>(); ++i)
  <span class="hljs-built_in">do_something</span>(v[i]);
</code></pre>
</li>
<li>Traverse a linked-list?<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (ListNode *p = l.<span class="hljs-built_in">head</span>(); p; p = p-&gt;next)
  <span class="hljs-built_in">do_something</span>(p-&gt;data);
</code></pre>
</li>
</ul>

<h2 id="iterators-1"><a href="https://en.cppreference.com/w/cpp/iterator">Iterators</a></h2>
<p>A generalization of pointers, used to access elements in different containers <strong>in a uniform manner</strong>.</p>
<h3 id="with-iterators">With iterators:</h3>
<p>The following works no matter whether <code>c</code> is an array, a <code>std::string</code>, or any container.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> it = std::<span class="hljs-built_in">begin</span>(c); it != std::<span class="hljs-built_in">end</span>(c); ++it)
  <span class="hljs-built_in">do_something</span>(*it);
</code></pre>
<p><strong>Equivalent way: range-based for loops</strong></p>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> &amp;x : c) <span class="hljs-built_in">do_something</span>(x);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-style="section::after {

<h2 id="algorithms"><a href="https://en.cppreference.com/w/cpp/algorithm">Algorithms</a></h2>
<p>The algorithms library defines functions for a variety of purposes:</p>
<ul>
<li>searching, sorting, counting, manipulating, ...</li>
</ul>
<p>Examples:</p>
<pre><code class="language-cpp"><span class="hljs-comment">// assign every element in `a` with the value `x`.</span>
std::<span class="hljs-built_in">fill</span>(a.<span class="hljs-built_in">begin</span>(), a.<span class="hljs-built_in">end</span>(), x);
<span class="hljs-comment">// sort the elements in `b` in ascending order.</span>
std::<span class="hljs-built_in">sort</span>(b.<span class="hljs-built_in">begin</span>(), b.<span class="hljs-built_in">end</span>());
<span class="hljs-comment">// find the first element in `b` that is equal to `x`.</span>
<span class="hljs-keyword">auto</span> pos = std::<span class="hljs-built_in">find</span>(b.<span class="hljs-built_in">begin</span>(), b.<span class="hljs-built_in">end</span>(), x);
<span class="hljs-comment">// reverse the elements in `c`.</span>
std::<span class="hljs-built_in">reverse</span>(c.<span class="hljs-built_in">begin</span>(), c.<span class="hljs-built_in">end</span>());
</code></pre>
</section>

<h2 id="algorithms-1"><a href="https://en.cppreference.com/w/cpp/algorithm">Algorithms</a></h2>
<p>Example: Obtain the rank of each number in a sequence.</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">getRank</span><span class="hljs-params">(<span class="hljs-type">const</span> std::vector&lt;<span class="hljs-type">int</span>&gt; &amp;data)</span> </span>{
  <span class="hljs-keyword">auto</span> tmp = data;
  std::<span class="hljs-built_in">sort</span>(tmp.<span class="hljs-built_in">begin</span>(), tmp.<span class="hljs-built_in">end</span>()); <span class="hljs-comment">// sort</span>
  <span class="hljs-keyword">auto</span> pos = std::<span class="hljs-built_in">unique</span>(tmp.<span class="hljs-built_in">begin</span>(), tmp.<span class="hljs-built_in">end</span>()); <span class="hljs-comment">// drop duplicates</span>
  <span class="hljs-keyword">auto</span> ret = data;
  <span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> &amp;x : ret)
    x = std::<span class="hljs-built_in">lower_bound</span>(tmp.<span class="hljs-built_in">begin</span>(), pos, x) - tmp.<span class="hljs-built_in">begin</span>(); <span class="hljs-comment">// binary search</span>
  <span class="hljs-keyword">return</span> ret;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-style="section::after {

<h2 id="function-objects">Function objects</h2>
<p>Things that look like &quot;functions&quot;: <em>Callable</em></p>
<ul>
<li>functions, and also function pointers</li>
<li>objects of a class type that has an overloaded <code>operator()</code> (the function-call operator)</li>
<li>lambda expressions</li>
</ul>
<p>The standard library has defined some common function objects: <code>std::less</code>, <code>std::greater</code>, ...</p>
<pre><code class="language-cpp">std::<span class="hljs-built_in">sort</span>(a.<span class="hljs-built_in">begin</span>(), a.<span class="hljs-built_in">end</span>(), std::greater&lt;&gt;{}); <span class="hljs-comment">// Sort in descending order.</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="adaptors">Adaptors</h2>
<p>Container adaptors: <code>std::stack</code>, <code>std::queue</code>, <code>std::priority_queue</code></p>
<ul>
<li>Represent the stack, queue and the priority-queue data structures respectively.</li>
<li>They are <strong>not</strong> containers themselves. They are based on some underlying container, and provide the interfaces of the corresponding data structures.</li>
</ul>
<pre><code class="language-cpp">std::stack&lt;<span class="hljs-type">int</span>&gt; stk; <span class="hljs-comment">// By default, uses `std::deque&lt;int&gt;` as</span>
                     <span class="hljs-comment">// the underlying container.</span>
std::stack&lt;<span class="hljs-type">int</span>, std::vector&lt;<span class="hljs-type">int</span>&gt;&gt; stk2; <span class="hljs-comment">// Uses `std::vector&lt;int&gt;`.</span>
</code></pre>
<p>Iterator adaptors: To be discussed in recitations.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-style="section::after {

<h1 id="sequence-containers">Sequence containers</h1>
<p>Note: <code>std::string</code> is not treated as a container but behaves much like one.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-style="section::after {

<h2 id="sequence-containers-1">Sequence containers</h2>
<ul>
<li><code>std::vector&lt;T&gt;</code>: dynamic contiguous array (we are quite familiar with)</li>
</ul>
<a align="center">
  <img src="img/vector.png", width=400 />
</a>
<ul>
<li><code>std::deque&lt;T&gt;</code>: <strong>d</strong>ouble-<strong>e</strong>nded <strong>que</strong>ue (often pronounced as &quot;deck&quot;)
<ul>
<li><code>std::deque&lt;T&gt;</code> supports fast insertion and deletion <strong>at both its beginning and its end</strong>. (<code>push_front</code>, <code>pop_front</code>, <code>push_back</code>, <code>pop_back</code>)</li>
</ul>
</li>
</ul>
<a align="center">
  <img src="img/deque.png", width=400 />
</a>
<ul>
<li><code>std::array&lt;T, N&gt;</code>: same as <code>T[N]</code>,but it is a <strong>container</strong>
<ul>
<li>It will never decay to <code>T *</code>.</li>
<li>Container interfaces are provided: <code>.at(i)</code>, <code>.front()</code>, <code>.back()</code>, <code>.size()</code>, ..., as well as iterators.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--style:section::after {

}
;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="sequence-containers-2">Sequence containers</h2>
<ul>
<li><code>std::list&lt;T&gt;</code>: doubly-linked list
<ul>
<li><code>std::list&lt;T&gt;</code> supports fast insertion and deletion <strong>anywhere in the container</strong>,</li>
<li>but fast random access is not supported (i.e. no <code>operator[]</code>).</li>
<li>Bidirectional traversal is supported.</li>
</ul>
</li>
</ul>
<a align="center">
  <img src="img/list.png", width=400 />
</a>
<ul>
<li><code>std::forward_list&lt;T&gt;</code>: singly-linked list
<ul>
<li>Intended to save time and space (compared to <code>std::list</code>).</li>
<li>Only forward traversal is supported.</li>
</ul>
</li>
</ul>
<a align="center">
  <img src="img/forward_list.png", width=400 />
</a>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-style="section::after {

<h2 id="interfaces">Interfaces</h2>
<p>STL containers have consistent interfaces. See <a href="https://en.cppreference.com/w/cpp/container#Member_function_table">here</a> for a full list.</p>
<p>Element access:</p>
<ul>
<li><code>c.at(i)</code>, <code>c[i]</code>: access the element indexed <code>i</code>. <code>at</code> performs bounds checking, and throws <code>std::out_of_range</code> if <code>i</code> exceeds the valid range.</li>
<li><code>c.front()</code>, <code>c.back()</code>: access the front/back element.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-style="section::after {

" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--style:section::after {

}
;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="interfaces-1">Interfaces</h2>
<p>Size and capacity: <code>c.size()</code> and <code>c.empty()</code> are what we already know.</p>
<ul>
<li><code>c.resize(n)</code>, <code>c.resize(n, x)</code>: adjust the container to be with exactly <code>n</code> elements. If <code>n &gt; c.size()</code>, <code>n - c.size()</code> elements will be appended.
<ul>
<li><code>c.resize(n)</code>: Appended elements are <strong>value-initialized</strong>.</li>
<li><code>c.resize(n, x)</code>: Appended elements are copies of <code>x</code>.</li>
</ul>
</li>
<li><code>c.capacity()</code>, <code>c.reserve(n)</code>, <code>c.shrink_to_fit()</code>: only for <code>string</code> and <code>vector</code>.
<ul>
<li><code>c.capacity()</code> returns the capacity (number of elements that <em>can</em> be stored in the current storage)</li>
<li><code>c.reserve(n)</code>: reserves space for at least <code>n</code> elements.</li>
<li><code>c.shrink_to_fit()</code>: requests to remove the unused capacity, so that <code>c.capacity() == c.size()</code>.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--style:section::after {

}
;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="interfaces-2">Interfaces</h2>
<p>Modifiers:</p>
<ul>
<li><code>c.push_back(x)</code>, <code>c.emplace_back(args...)</code>, <code>c.pop_back()</code>: insert/delete elements at the end of the container.</li>
<li><code>c.push_front(x)</code>, <code>c.emplace_front(args...)</code>, <code>c.pop_front()</code>: insert/delete elements at the beginning of the container.</li>
<li><code>c.clear()</code> removes all the elements in <code>c</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-style="section::after {

<h2 id="interfaces-3">Interfaces</h2>
<p>Modifiers:</p>
<ul>
<li><code>c.insert(...)</code>, <code>c.emplace(...)</code>, <code>c.erase(...)</code>: insert/delete elements at a specified location.
<ul>
<li><strong>Warning</strong>: For containers that need to maintain contiguous storage (<code>string</code>, <code>vector</code>, <code>deque</code>), insertion and deletion somewhere in the middle can be <strong>very slow</strong> (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="4.844ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2141 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g><g data-mml-node="mo" transform="translate(763,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="mi" transform="translate(1152,0)"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mo" transform="translate(1752,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250 <li>These functions have a lot of overloads. Remember a few common ones, and STFW (Search The Friendly Web) when you need to use them.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-style="section::after {

" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--style:section::after {

<h2 id="interfaces-4">Interfaces</h2>
<p>Some of these member functions are not supported on some containers, <strong>depending on the underlying data structure</strong>. For example:</p>
<ul>
<li>Any operation that modifies the length of the container is not allowed for <code>array</code>.</li>
<li><code>push_front</code>, <code>emplace_front</code> and <code>pop_front</code> are not supported on <code>string</code>, <code>vector</code> and <code>array</code>.</li>
<li><code>size</code> is not supported on <code>forward_list</code> in order to save time and space.</li>
<li><code>operator[]</code> and <code>at</code> are not supported on linked-lists.</li>
</ul>
<p><a href="https://en.cppreference.com/w/cpp/container#Member_function_table">This table</a> tells you everything.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-style="section::after {

<h2 id="iterators-2">Iterators</h2>
<p>Every container has its iterator: <code>Container::iterator</code>. e.g. <code>std::vector&lt;int&gt;::iterator</code>, <code>std::forward_list&lt;std::string&gt;::iterator</code></p>
<ul>
<li><code>auto</code> comes to our rescue!</li>
</ul>
<p><code>c.begin()</code> returns the iterator to the first element of <code>c</code>.</p>
<p><code>c.end()</code> returns the iterator to <strong>the element following the last element</strong> of <code>c</code>.</p>
<a align="center">
  <img src="img/range-begin-end.svg", width=800 />
</a>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-style="section::after {

" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--style:section::after {

}
;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="iterator-categories">Iterator categories</h2>
<p><a href="https://en.cppreference.com/w/cpp/named_req/ForwardIterator"><strong>ForwardIterators</strong></a>: supports <code>*it</code>, <code>it-&gt;mem</code>, <code>++it</code>, <code>it++</code>, <code>it1 == it2</code>, <code>it1 != it2</code></p>
<p><a href="https://en.cppreference.com/w/cpp/named_req/BidirectionalIterator"><strong>BidirectionalIterator</strong></a>: a ForwardIterator that can be moved in both directions</p>
<ul>
<li>supports <code>--it</code> and <code>it--</code>.</li>
</ul>
<p><a href="https://en.cppreference.com/w/cpp/named_req/RandomAccessIterator"><strong>RandomAccessIterator</strong></a>: a BidirectionalIterator that can be moved to point to any element in constant time.</p>
<ul>
<li>supports <code>it + n</code>, <code>n + it</code>, <code>it - n</code>, <code>it += n</code>, <code>it -= n</code> for an integer <code>n</code>.</li>
<li>supports <code>it[n]</code>, equivalent to <code>*(it + n)</code>.</li>
<li>supports <code>it1 - it2</code>, returns the <strong>distance</strong> of two iterators.</li>
<li>supports <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="iterator-categories-1">Iterator categories</h2>
<p><a href="https://en.cppreference.com/w/cpp/named_req/ForwardIterator"><strong>ForwardIterators</strong></a>: an iterator that can be moved forward.</p>
<ul>
<li><code>forward_list&lt;T&gt;::iterator</code></li>
</ul>
<p><a href="https://en.cppreference.com/w/cpp/named_req/BidirectionalIterator"><strong>BidirectionalIterator</strong></a>: a ForwardIterator that can be moved in both directions</p>
<ul>
<li><code>list&lt;T&gt;::iterator</code></li>
</ul>
<p><a href="https://en.cppreference.com/w/cpp/named_req/RandomAccessIterator"><strong>RandomAccessIterator</strong></a>: a BidirectionalIterator that can be moved to point to any element in constant time.</p>
<ul>
<li><code>string::iterator</code>, <code>vector&lt;T&gt;::iterator</code>, <code>deque&lt;T&gt;::iterator</code>, <code>array&lt;T,N&gt;::iterator</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-style="section::after {

" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--style:section::after {

}
;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="iterator-categories-2">Iterator categories</h2>
<p>To know the category of an iterator of a container, consult its type alias member <code>iterator_category</code>.</p>
<pre><code class="language-cpp"><span class="hljs-keyword">using</span> vec_iter = std::vector&lt;<span class="hljs-type">int</span>&gt;::iterator;
<span class="hljs-keyword">using</span> category = vec_iter::iterator_category;
</code></pre>
<p>Put your mouse on <code>category</code>, and the IDE will tell you what it is.</p>
<p>It is one of the following tags: <code>std::forward_iterator_tag</code>, <code>std::bidirectional_iterator_tag</code>, <code>std::random_access_iterator_tag</code>.</p>
<p>Note: Two other categories InputIterator and OutputIterator will be discussed in recitations.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-style="section::after {

" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--style:section::after {

;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="constructors-of-containers">Constructors of containers</h2>
<p>All sequence containers can be constructed in the following ways:</p>
<ul>
<li><code>Container c(b, e)</code>, where <code>[b, e)</code> is an <strong>iterator range</strong>.
<ul>
<li>Copies elements from the iterator range <code>[b, e)</code>.</li>
</ul>
</li>
<li><code>Container c(n, x)</code>, where <code>n</code> is a nonnegative integer and <code>x</code> is a value.
<ul>
<li>Initializes the container with <code>n</code> copies of <code>x</code>.</li>
</ul>
</li>
<li><code>Container c(n)</code>, where <code>n</code> is a nonnegative integer.
<ul>
<li>Initializes the container with <code>n</code> elements. All elements are <strong>value-initialized</strong>.</li>
<li>This is not supported by <code>string</code>. (Why?)</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-style="section::after {

<h2 id="constructors-of-containers-1">Constructors of containers</h2>
<p>All sequence containers can be constructed in the following ways:</p>
<ul>
<li><code>Container c(b, e)</code>, where <code>[b, e)</code> is an <strong>iterator range</strong>.
<ul>
<li>Copies elements from the iterator range <code>[b, e)</code>.</li>
</ul>
</li>
<li><code>Container c(n, x)</code>, where <code>n</code> is a nonnegative integer and <code>x</code> is a value.
<ul>
<li>Initializes the container with <code>n</code> copies of <code>x</code>.</li>
</ul>
</li>
<li><code>Container c(n)</code>, where <code>n</code> is a nonnegative integer.
<ul>
<li>Initializes the container with <code>n</code> elements. All elements are <strong>value-initialized</strong>.</li>
<li>This is not supported by <code>string</code>, because it is meaningless to have <code>n</code> value-initializes <code>char</code>s (all of them will be <code>'\0'</code>)!</li>
</ul>
</li>
</ul>
</section>

<h2 id="motivation-set">Motivation: set</h2>
<p>Represent a &quot;set&quot;:</p>
<ul>
<li>Quick insertion, lookup and deletion of elements.</li>
<li>Order does not matter.</li>
</ul>
<p>Sequence containers do not suffice:</p>
<ul>
<li>Lookup of elements is <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="4.844ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2141 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g><g data-mml-node="mo" transform="translate(763,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="mi" transform="translate(1152,0)"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mo" transform="translate(1752,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z"></path></g></g></g></svg></mjx-container>.</li>
<li>Quick insertion/deletion only happens at certain positions for some containers.
<ul>
<li>e.g. <code>vector</code> only supports quick insertion/deletion at the end.</li>
</ul>
</li>
<li>The order of elements is preserved, which is not important.</li>
</ul>
<p>You will learn the appropriate data structures in CS101.</p>
</section>

<h2 id="stdset"><code>std::set</code></h2>
<p>Defined in <code>&lt;set&gt;</code>.</p>
<ul>
<li><code>std::set&lt;T&gt;</code> is a set whose elements are of type <code>T</code>. <strong><code>operator&lt;(const T, const T)</code> should be supported</strong>, because it is usually implemented as Red-black trees.</li>
<li><code>std::set&lt;T, Cmp&gt;</code> is also available. <code>x &lt; y</code> will be replaced with <code>cmp(x, y)</code>, where <code>cmp</code> is a function object of type <code>Cmp</code>.</li>
</ul>
<pre><code class="language-cpp">std::set&lt;<span class="hljs-type">int</span>&gt; s1; <span class="hljs-comment">// An empty set of ints</span>
std::set&lt;std::string&gt; s2{<span class="hljs-string">&quot;hello&quot;</span>, <span class="hljs-string">&quot;world&quot;</span>}; <span class="hljs-comment">// A set of strings,</span>
                                            <span class="hljs-comment">// initialized with two elements</span>
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">Student</span> { std::string name; <span class="hljs-type">int</span> id; };
std::set&lt;Student&gt; s3; <span class="hljs-comment">// No operator&lt; for Student is available.</span>
                      <span class="hljs-comment">// This line alone does not cause error, but you cannot</span>
                      <span class="hljs-comment">// insert elements into it.</span>
s<span class="hljs-number">3.</span><span class="hljs-built_in">insert</span>(Student{<span class="hljs-string">&quot;Alice&quot;</span>, <span class="hljs-number">42</span>}); <span class="hljs-comment">// Error: No operator&lt; available.</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-style="section::after {

<h2 id="stdset-1"><code>std::set</code></h2>
<p>Defined in <code>&lt;set&gt;</code>.</p>
<ul>
<li><code>std::set&lt;T&gt;</code> is a set whose elements are of type <code>T</code>. <strong><code>operator&lt;(const T, const T)</code> should be supported</strong>, because <code>set</code> is usually implemented as Red-black trees.</li>
<li><code>std::set&lt;T, Cmp&gt;</code> is also available. <code>x &lt; y</code> will be replaced with <code>cmp(x, y)</code>, where <code>cmp</code> is a function object of type <code>Cmp</code>.</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">Student</span> { std::string name; <span class="hljs-type">int</span> id; };
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">CmpStudentByName</span> {
  <span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">operator</span><span class="hljs-params">()</span><span class="hljs-params">(<span class="hljs-type">const</span> Student &amp;a, <span class="hljs-type">const</span> Student &amp;b)</span> <span class="hljs-type">const</span> </span>{
    <span class="hljs-keyword">return</span> a.name &lt; b.name;
  }
};
std::set&lt;Student, CmpStudentByName&gt; students; <span class="hljs-comment">// OK</span>
students.<span class="hljs-built_in">insert</span>(Student{<span class="hljs-string">&quot;Alice&quot;</span>, <span class="hljs-number">42</span>}); <span class="hljs-comment">// OK</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-style="section::after {

" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--style:section::after {

<h2 id="stdset-2"><code>std::set</code></h2>
<p>Constructors</p>
<pre><code class="language-cpp">std::set&lt;Type&gt; s1{a, b, c, ...};
<span class="hljs-function">std::set&lt;Type&gt; <span class="hljs-title">s2</span><span class="hljs-params">(begin, end)</span></span>; <span class="hljs-comment">// An iterator range [begin, end)</span>
</code></pre>
<p>C++17 CTAD (Class Template Argument Deduction) also applies:</p>
<pre><code class="language-cpp">std::set s1{a, b, c, ...}; <span class="hljs-comment">// Element type is deduced according to the list</span>
<span class="hljs-function">std::set <span class="hljs-title">s2</span><span class="hljs-params">(begin, end)</span></span>; <span class="hljs-comment">// Element type is deduced according to</span>
                         <span class="hljs-comment">// the type of elements pointed by `begin` and `end`.</span>
</code></pre>
<p>Besides, <code>std::set</code> is copy-constructible, copy-assignable, move-constructible and move-assignable, just as the sequence containers we have learned.</p>
<p><strong><code>std::set</code> does not contain duplicate elements.</strong> These constructors will ignore duplicate elements.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-style="section::after {

" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--style:section::after {

;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="stdset-operations"><code>std::set</code>: operations</h2>
<p>Common operations: <code>s.empty()</code>, <code>s.size()</code>, <code>s.clear()</code>.</p>
<p>Insertion: <code>insert</code> and <code>emplace</code>. <strong>Duplicate elements will not be inserted.</strong></p>
<ul>
<li><code>s.insert(x)</code>, <code>s.insert({a, b, ...})</code>, <code>s.insert(begin, end)</code>.</li>
</ul>
<pre><code class="language-cpp">std::set s{<span class="hljs-number">3</span>, <span class="hljs-number">2</span>, <span class="hljs-number">5</span>, <span class="hljs-number">5</span>, <span class="hljs-number">1</span>}; <span class="hljs-comment">// {1, 2, 3, 5}. The duplicate 5 is removed.</span>
std::cout &lt;&lt; s.<span class="hljs-built_in">size</span>() &lt;&lt; std::endl; <span class="hljs-comment">// 4</span>
s.<span class="hljs-built_in">insert</span>(<span class="hljs-number">42</span>); <span class="hljs-comment">// {1, 2, 3, 5, 42}</span>
s.<span class="hljs-built_in">insert</span>(<span class="hljs-number">42</span>); <span class="hljs-comment">// Nothing is inserted. (No errors.)</span>
<span class="hljs-type">int</span> a[]{<span class="hljs-number">10</span>, <span class="hljs-number">20</span>, <span class="hljs-number">30</span>};
s.<span class="hljs-built_in">insert</span>(a, a + <span class="hljs-number">3</span>); <span class="hljs-comment">// An iterator range.</span>
                    <span class="hljs-comment">// s now contains {1, 2, 3, 5, 10, 20, 30, 42}.</span>
s.<span class="hljs-built_in">insert</span>({<span class="hljs-number">11</span>, <span class="hljs-number">12</span>}); <span class="hljs-comment">// {1, 2, 3, 5, 10, 11, 12, 20, 30, 42}.</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-style="section::after {

" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--style:section::after {

;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="stdset-insertion"><code>std::set</code>: insertion</h2>
<p>Insertion: <code>insert</code> and <code>emplace</code>. <strong>Duplicate elements will not be inserted.</strong></p>
<ul>
<li><code>s.emplace(args...)</code>. <strong>Forwards</strong> the arguments <code>args...</code> to the constructor of the element type, and constructs the element in-place.</li>
</ul>
<pre><code class="language-cpp">std::set&lt;std::string&gt; s;
s.<span class="hljs-built_in">emplace</span>(<span class="hljs-number">10</span>, <span class="hljs-string">&#x27;c&#x27;</span>); <span class="hljs-comment">// inserts a string &quot;cccccccccc&quot;</span>
</code></pre>
<p><code>s.insert(x)</code> and <code>s.emplace(args...)</code> returns <strong><code>std::pair&lt;iterator, bool&gt;</code></strong>:</p>
<ul>
<li>On success, <code>.first</code> is an <code>iterator</code> pointing to the inserted element, and <code>.second</code> is <code>true</code>.</li>
<li>On failure, <code>.first</code> is an <code>iterator</code> pointing to the element that prevented the insertion, and <code>.second</code> is <code>false</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-style="section::after {

" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--style:section::after {

}
;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="stdset-iterators"><code>std::set</code>: iterators</h2>
<p><code>s.begin()</code>, <code>s.end()</code>: Begin and off-the-end iterators.</p>
<p>The iterator of <code>std::set</code> is <strong>BidirectionalIterator</strong>:</p>
<ul>
<li>Supports <code>*it</code>, <code>it-&gt;mem</code>, <code>++it</code>, <code>it++</code>, <code>--it</code>, <code>it--</code>, <code>it1 == it2</code>, <code>it1 != it2</code>.</li>
</ul>
<p><strong>The elements are in ascending order</strong>: The following assertion always succeeds (if both <code>tmp</code> and <code>iter</code> are dereferenceable).</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> tmp = iter;
++iter;
<span class="hljs-built_in">assert</span>(*tmp &lt; *iter);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="stdset-iterators-1"><code>std::set</code>: iterators</h2>
<p><strong>Elements in a <code>set</code> cannot be modified directly</strong>: <code>*iter</code> returns a reference-to-<code>const</code>.</p>
<ul>
<li>The elements are stored in specific positions in the red-black tree, according to their values.</li>
<li>You cannot change their values arbitrarily.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="stdset-traversal"><code>std::set</code>: traversal</h2>
<p>Range-for still works!</p>
<pre><code class="language-cpp">std::set&lt;<span class="hljs-type">int</span>&gt; s{<span class="hljs-number">5</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span>, <span class="hljs-number">3</span>, <span class="hljs-number">20</span>, <span class="hljs-number">12</span>, <span class="hljs-number">42</span>};
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> x : s)
  std::cout &lt;&lt; x &lt;&lt; <span class="hljs-string">&#x27; &#x27;</span>;
std::cout &lt;&lt; std::endl;
</code></pre>
<p>Output: <code>3, 5, 7, 12, 20, 42 </code>. The elements are in ascending order.</p>
<p>Equivalent way: Use iterators</p>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> it = s.<span class="hljs-built_in">begin</span>(); it != s.<span class="hljs-built_in">end</span>(); ++it)
  std::cout &lt;&lt; *it &lt;&lt; <span class="hljs-string">&#x27; &#x27;</span>;
std::cout &lt;&lt; std::endl;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:x5615t8ea5ssm6kron74a6xsaj6kbe9agezj69dd8jp;" data-marpit-pagination-total="51">
<h2 id="stdset-deletion"><code>std::set</code>: deletion</h2>
<p>Delete elements: <code>erase</code></p>
<ul>
<li><code>s.erase(x)</code>, <code>s.erase(pos)</code>, <code>s.erase(begin, end)</code>, where <code>pos</code> is an iterator pointing to some element in <code>s</code>, and <code>[begin, end)</code> is an iterator range in <code>s</code>.</li>
<li><code>s.erase(x)</code> removes the element that is equivalent to <code>x</code>, <strong>if any</strong>.
<ul>
<li>returns <code>0</code> or <code>1</code>, indicating the number of elements removed.</li>
</ul>
</li>
</ul>
<pre><code class="language-cpp">std::set&lt;<span class="hljs-type">int</span>&gt; s{<span class="hljs-number">5</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span>, <span class="hljs-number">3</span>, <span class="hljs-number">20</span>, <span class="hljs-number">12</span>, <span class="hljs-number">42</span>};
std::cout &lt;&lt; s.<span class="hljs-built_in">erase</span>(<span class="hljs-number">42</span>) &lt;&lt; std::endl; <span class="hljs-comment">// 42 is removed. output: 1</span>
<span class="hljs-comment">// s is now {3, 5, 7, 12, 20}.</span>
s.<span class="hljs-built_in">erase</span>(++++s.<span class="hljs-built_in">begin</span>()); <span class="hljs-comment">// 7 is removed.</span>
</code></pre>

<h2 id="stdset-element-lookup"><code>std::set</code>: element lookup</h2>
<p><code>s.find(x)</code>, <code>s.count(x)</code>, and some other functions.</p>
<p><code>s.find(x)</code> returns an iterator pointing to the element equivalent to <code>x</code> (if found), or <code>s.end()</code> (if not found).</p>
<pre><code class="language-cpp">std::set&lt;<span class="hljs-type">int</span>&gt; s = <span class="hljs-built_in">someValues</span>();
<span class="hljs-keyword">if</span> (s.<span class="hljs-built_in">find</span>(x) != s.<span class="hljs-built_in">end</span>()) <span class="hljs-comment">// x is found</span>
  <span class="hljs-comment">// ...</span>
</code></pre>
</section>

<h2 id="other-kinds-of-sets">Other kinds of sets:</h2>
<p>Sets based on red-black trees:</p>
<ul>
<li><a href="https://en.cppreference.com/w/cpp/container/set"><code>std::set</code></a></li>
<li><a href="https://en.cppreference.com/w/cpp/container/multiset"><code>std::multiset</code></a>: allows duplicate elements</li>
</ul>
<p>Sets based on hash-tables: (since C++11)</p>
<ul>
<li><a href="https://en.cppreference.com/w/cpp/container/unordered_set"><code>std::unordered_set</code></a>: hash-table version of <code>std::set</code></li>
<li><a href="https://en.cppreference.com/w/cpp/container/unordered_multiset"><code>std::unordered_multiset</code></a>: allows duplicate elements</li>
</ul>
<p>Sets based on hash-tables provides (average-case) <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="4.618ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2041 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g><g data-mml-node="mo" transform="translate(763,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="mn" transform="translate(1152,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g><g data-mml-node="mo" transform="translate(1652,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z"></path></g></g></g></svg></mjx-container> time operations, but requires the data to be hashable.</p>

<h2 id="motivation-map-1">Motivation: map</h2>
<p>Example: Count the occurrences of strings.</p>
<pre><code class="language-cpp">std::map&lt;std::string, <span class="hljs-type">int</span>&gt; counter; <span class="hljs-comment">// maps every string to an integer</span>
std::string word;
<span class="hljs-keyword">while</span> (std::cin &gt;&gt; word)
  ++counter[word]; <span class="hljs-comment">// !!</span>
</code></pre>
<p>Now for any string <code>str</code>, <code>counter[str]</code> is an integer indicating how many times <code>str</code> has occurred.</p>

<h2 id="stdmap-comparison-with-stdset"><code>std::map</code>: comparison with <code>std::set</code></h2>
<p><code>std::map&lt;Key, Value&gt;</code> has two template parameters: <code>Key</code> and <code>Value</code>.</p>
<ul>
<li>If we ignore <code>Value</code>, it is a <code>std::set&lt;Key&gt;</code>.
<ul>
<li>Duplicate keys are not allowed.</li>
<li><code>operator&lt;(const Key, const Key)</code> is required.</li>
<li>Elements are stored <strong>in ascending order of keys</strong>.</li>
<li>Keys cannot be modified directly.</li>
</ul>
</li>
<li>The element type of <code>std::map&lt;Key, Value&gt;</code> is <code>std::pair&lt;const Key, Value&gt;</code>.
<ul>
<li><code>*iter</code> returns <code>std::pair&lt;const Key, Value&gt; &amp;</code>.</li>
</ul>
</li>
</ul>
</section>

<h2 id="stdmap-comparison-with-stdset-1"><code>std::map</code>: comparison with <code>std::set</code></h2>
<p>Constructors:</p>
<ul>
<li>
<p><code>std::map&lt;Key, Value&gt; m{{key1, value1}, {key2, value2}, ...};</code></p>
</li>
<li>
<p><code>std::map&lt;Key, Value&gt; m(begin, end)</code>, but the elements should be pairs:</p>
<pre><code class="language-cpp">std::vector&lt;std::pair&lt;<span class="hljs-type">int</span>, <span class="hljs-type">int</span>&gt;&gt; v{{<span class="hljs-number">1</span>, <span class="hljs-number">2</span>}, {<span class="hljs-number">3</span>, <span class="hljs-number">4</span>}};
<span class="hljs-function">std::map&lt;<span class="hljs-type">int</span>, <span class="hljs-type">int</span>&gt; <span class="hljs-title">m</span><span class="hljs-params">(v.begin(), v.end())</span></span>;
</code></pre>
</li>
</ul>
<p>Insertion:</p>
<ul>
<li><code>m.insert({key, value})</code></li>
<li><code>m.insert({{key1, value1}, {key2, value2}, ...})</code></li>
<li><code>m.insert(begin, end)</code></li>
</ul>
</section>

<h2 id="stdmap-comparison-with-stdset-2"><code>std::map</code>: comparison with <code>std::set</code></h2>
<p>Deletion:</p>
<ul>
<li><code>m.erase(pos)</code>, <code>m.erase(begin, end)</code>: same as <code>std::set&lt;T&gt;::erase</code>.</li>
<li><code>m.erase(key)</code>: Removes the element whose <em>key</em> is <code>key</code>.</li>
</ul>
<p>Iterators: <strong>BidirectionalIterator</strong>, pointing to <code>std::pair&lt;const Key, Value&gt;</code>.</p>
<pre><code class="language-cpp">std::map&lt;std::string, <span class="hljs-type">int</span>&gt; counter = <span class="hljs-built_in">someValues</span>();
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> it = counter.<span class="hljs-built_in">begin</span>(); it != counter.<span class="hljs-built_in">end</span>(); ++it)
  std::cout &lt;&lt; it-&gt;first &lt;&lt; <span class="hljs-string">&quot; occurred &quot;</span> &lt;&lt; it-&gt;second &lt;&lt; <span class="hljs-string">&quot; times.\n&quot;</span>;
</code></pre>
</section>

<h2 id="stdmap-traversal"><code>std::map</code>: traversal</h2>
<p>Use range-for:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;kvpair : counter)
  std::cout &lt;&lt; kvpair.first &lt;&lt; <span class="hljs-string">&quot; occurred &quot;</span> &lt;&lt; kvpair.second &lt;&lt; <span class="hljs-string">&quot; times.\n&quot;</span>;
</code></pre>
<p>It's so annoying to deal with the <code>pair</code> stuff...</p>

<h2 id="stdmap-traversal-1"><code>std::map</code>: traversal</h2>
<p>Use range-for:</p>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;kvpair : counter)
  std::cout &lt;&lt; kvpair.first &lt;&lt; <span class="hljs-string">&quot; occurred &quot;</span> &lt;&lt; kvpair.second &lt;&lt; <span class="hljs-string">&quot; times.\n&quot;</span>;
</code></pre>
<p>It's so annoying to deal with the <code>pair</code> stuff...</p>
<p><strong>C++17 structured binding</strong> kills the game!</p>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;[word, occ] : counter)
  std::cout &lt;&lt; word &lt;&lt; <span class="hljs-string">&quot; occurred &quot;</span> &lt;&lt; occ &lt;&lt; <span class="hljs-string">&quot; times.\n&quot;</span>;
</code></pre>
<p>(Looks very much like Python unpacking.)</p>

<h2 id="stdmap-specific-operator"><code>std::map</code>-specific: <code>operator[]</code></h2>
<p><code>m[key]</code> finds the key-value pair whose <em>key</em> is equivalent to <code>key</code>.</p>
<ul>
<li>If such <em>key</em> does not exist, inserts <code>{key, Value{}}</code> - the <em>value</em> is <strong>value-initialized</strong>.</li>
<li>Then, returns reference to the <em>value</em>.</li>
</ul>
<pre><code class="language-cpp">std::map&lt;std::string, <span class="hljs-type">int</span>&gt; counter;
std::string word;
<span class="hljs-keyword">while</span> (std::cin &gt;&gt; word)
  ++counter[word]; <span class="hljs-comment">// If `word` does not exist in `counter`,</span>
                   <span class="hljs-comment">// a pair {word, 0} is inserted first.</span>
</code></pre>
</section>

<h2 id="stdmap-element-lookup"><code>std::map</code>: element lookup</h2>
<p><code>m.find(key)</code>, <code>m.count(key)</code>, and some other member functions.</p>
<p>Note: <code>m.find(key)</code> does not insert elements. <code>m[key]</code> will insert an element if that <em>key</em> does not exist.</p>

<h2 id="other-kinds-of-maps">Other kinds of maps:</h2>
<p>Maps based on red-black trees:</p>
<ul>
<li><a href="https://en.cppreference.com/w/cpp/container/map"><code>std::map</code></a></li>
<li><a href="https://en.cppreference.com/w/cpp/container/multimap"><code>std::multimap</code></a>: allows duplicate <em>keys</em></li>
</ul>
<p>Maps based on hash-tables: (since C++11)</p>
<ul>
<li><a href="https://en.cppreference.com/w/cpp/container/unordered_map"><code>std::unordered_map</code></a>: hash-table version of <code>std::map</code></li>
<li><a href="https://en.cppreference.com/w/cpp/container/unordered_multimap"><code>std::unordered_multimap</code></a>: allows duplicate <em>keys</em></li>
</ul>
