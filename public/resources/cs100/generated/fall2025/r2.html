<h4 id="21-undefined-behavior%E6%9C%AA%E5%AE%9A%E4%B9%89%E8%A1%8C%E4%B8%BA">2.1. Undefined Behavior（未定义行为）</h4>
<blockquote>
<p><a href="https://en.cppreference.com/w/c/language/behavior">Undefined Behavior（未定义行为）</a></p>
<p>UB 的出现意味着：<strong>程序行为没有任何限制</strong>。</p>
</blockquote>
<p>常见的 UB 包括：</p>
<ul>
<li><strong>有符号整数溢出</strong></li>
<li>数组越界的内存访问（后续讲解）</li>
<li>空指针解引用（后续讲解）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-class="bq-red" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" class="bq-red" data-marpit-pagination="9" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--class:bq-red;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="2-%E8%AF%BE%E7%A8%8B%E8%AE%B2%E4%B9%89-review-3">2. 课程讲义 Review</h2>

<h4 id="21-undefined-behavior%E6%9C%AA%E5%AE%9A%E4%B9%89%E8%A1%8C%E4%B8%BA-1">2.1. Undefined Behavior（未定义行为）</h4>
<blockquote>
<p>Undefined Behavior（未定义行为）</p>
<p>UB 的出现意味着：<strong>程序行为没有任何限制</strong>。</p>
</blockquote>
<blockquote>
<p>Unspecified Behavior（未指定行为）</p>
<p><strong>允许两种或以上的行为</strong>，且实现（编译器/平台）不要求记录每种行为的具体效果。<br />
一个比较有代表性的例子是：函数参数中的求值顺序是一个 Unspecified Behavior</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="2-%E8%AF%BE%E7%A8%8B%E8%AE%B2%E4%B9%89-review-4">2. 课程讲义 Review</h2>
<h4 id="22-integer-promption%E6%95%B4%E5%9E%8B%E6%8F%90%E5%8D%87">2.2. Integer Promption（整型提升）</h4>
<p>整型的 Rank 是什么？<s>原来数据类型也有排名吗，硅基生物如此可怕...</s></p>
<p>在 C 语言中，​Rank（等级）​​ 是每个整数类型的一个<strong>固有属性</strong>，它决定了在整型提升 (Integer Promotion)​​ 和寻常算术转换 (Usual Arithmetic Conversions)​​ 中，不同类型之间如何进行隐式转换。</p>
<p>简单来说，Rank 定义了一个整数类型的“优先级”，Rank 高的类型在转换中“更强”，Rank 低的类型操作数会被转换为 Rank 高的类型。在涉及两个不同整数类型的操作中，编译器通过比较它们的 Rank 来决定将哪个操作数转换为何种类型，以<strong>确保运算在一个“共同的真实类型 (common real type)”中进行</strong>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-class="cols-2" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" class="cols-2" data-marpit-pagination="11" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--class:cols-2;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="2-%E8%AF%BE%E7%A8%8B%E8%AE%B2%E4%B9%89-review-5">2. 课程讲义 Review</h2>
<h4 id="22-integer-promption">2.2. Integer Promption</h4>
<div class="ldiv">
<ul>
<li>
<p>定义：<a href="https://en.cppreference.com/w/c/language/conversion">Integer Promotion（整型提升)</a> 是将 Rank 小于或等于 <code>int</code> 的任意整数类型，隐式转换为 <code>int</code> 或 <code>unsigned int</code> 的过程。</p>
</li>
<li>
<p>Example: 在 <code>==</code>, <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> 等二元算术运算符中，若操作数类型 Rank 小于或等于 <code>int</code>，则会进行整型提升。</p>
</li>
<li>
<p>右侧代码示例：参与 <code>==</code> 运算的两个类型是 <code>char</code> 和 <code>unsigned char</code>，它们的 Rank 都小于 <code>int</code>，因此会被提升为 <code>int</code> 进行比较。实际上，<code>a == b</code> 在编译器中的实现是 <code>((int)a) == ((int)b)</code>。</p>
</li>
</ul>
</div>
<div class="rdiv">
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>{
    <span class="hljs-type">char</span> a = <span class="hljs-number">251</span>;
    <span class="hljs-type">unsigned</span> <span class="hljs-type">char</span> b = a;

    <span class="hljs-keyword">if</span> (a == b)
        <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Same.\n&quot;</span>);
    <span class="hljs-keyword">else</span>
        <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Not Same.\n&quot;</span>);

    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="2-%E8%AF%BE%E7%A8%8B%E8%AE%B2%E4%B9%89-review-6">2. 课程讲义 Review</h2>
<h4 id="22-integer-promption-1">2.2. Integer Promption</h4>
<p>整型提升的两个主要应用场景：</p>
<ul>
<li><strong>寻常算术转换 (Usual Arithmetic Conversions)</strong>：在二元算术运算符中，若两个操作数类型不同，则会进行一系列隐式转换，以确保运算在一个“共同的真实类型 (common real type)”中进行。整型提升是寻常算术转换的一部分。
<ul>
<li>还有浮点类型呢！</li>
</ul>
</li>
<li><strong>默认参数提升 (Default Argument Promotions)</strong>：在可变参数函数（如 <code>printf</code>）中，传递给函数的实参会进行默认参数提升。整型类型会被提升为 <code>int</code> 或 <code>unsigned int</code>，而浮点类型会被提升为 <code>double</code>。
<ul>
<li>例如 <code>printf(&quot;%d\n&quot;, (char)5);</code> 实际上传递给 <code>printf</code> 的是一个 <code>int</code> 类型的值 <code>5</code>。</li>
</ul>
</li>
</ul>
<p>是不是觉得很弯弯绕？实际上只需要记住一个核心需求：在一个<strong>共同的真实类型中进行运算</strong>。</p>
</section>

<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="3-arithmetic-types-4">3. Arithmetic Types</h2>
<h4 id="32-%E6%95%B4%E5%9E%8B%E5%AE%BD%E5%BA%A6%E4%B8%8E-sizeof-1">3.2. 整型宽度与 <code>sizeof</code></h4>
<ul>
<li data-marpit-fragment="1">
<p>大多数平台上 1 byte = 8 bits。</p>
</li>
<li data-marpit-fragment="2">
<p><code>sizeof(T)</code> 返回类型 <code>T</code> 占用的<strong>字节</strong>数。</p>
<ul>
<li data-marpit-fragment="3"><code>sizeof()</code> 的返回类型是 <a href="https://en.cppreference.com/w/c/types/size_t"><code>size_t</code></a>。（后续讲解），其转换说明符为 <code>%zu</code>：</li>
</ul>
<pre><code class="language-c"><span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%zu\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
</code></pre>
</li>
<li data-marpit-fragment="4">
<p>若 MinGW 对 <code>%zu</code> 有问题，可转为 <code>int</code> 并使用 <code>%d</code>：</p>
<pre><code class="language-c"><span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, (<span class="hljs-type">int</span>)<span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-fragments="3" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="3-arithmetic-types-5">3. Arithmetic Types</h2>
<h4 id="32-%E6%95%B4%E5%9E%8B%E5%AE%BD%E5%BA%A6%E4%B8%8E-sizeof-2">3.2. 整型宽度与 <code>sizeof</code></h4>
<table>
<thead>
<tr>
<th>类型</th>
<th>最小宽度</th>
<th>常见宽度</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>short</code></td>
<td>16 bits</td>
<td>16 bits</td>
</tr>
<tr>
<td><code>int</code></td>
<td>16 bits</td>
<td>32 bits</td>
</tr>
<tr>
<td><code>long</code></td>
<td>32 bits</td>
<td><strong>32 或 64 bits</strong></td>
</tr>
<tr>
<td><code>long long</code></td>
<td>64 bits</td>
<td>64 bits</td>
</tr>
</tbody>
</table>
<ul>
<li data-marpit-fragment="1"><code>sizeof(signed T) == sizeof(unsigned T)</code></li>
<li data-marpit-fragment="2"><strong>保证</strong>：<code>sizeof(short)</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.312ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="1.751ex" role="img" focusable="false" viewBox="0 -636 778 774"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2A7D" d="M674 636Q682 636 688 630T694 615T687 601Q686 600 417 472L151 346L399 228Q687 92 691 87Q694 81 694 76Q694 58 676 56H670L382 192Q92 329 90 331Q83 336 83 348Q84 359 96 365Q104 369 382 500T665 634Q669 636 674 636ZM94 170Q102 172 104 172Q110 171 254 103T535 -30T678 -98Q694 -106 694 -118Q694 -136 676 -138H670L382 -2Q92 135 90 137Q83 142 83 154Q84 164 94 170Z"></path></g></g></g></svg></mjx-container> <code>sizeof(int)</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.312ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="1.751ex" role="img" focusable="false" viewBox="0 -636 778 774"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2A7D" d="M674 636Q682 636 688 630T694 615T687 601Q686 600 417 472L151 346L399 228Q687 92 691 87Q694 81 694 76Q694 58 676 56H670L382 192Q92 329 90 331Q83 336 83 348Q84 359 96 365Q104 369 382 500T665 634Q669 636 674 636ZM94 170Q102 172 104 172Q110 171 254 103T535 -30T678 -98Q694 -106 694 -118Q694 -136 676 -138H670L382 -2Q92 135 90 137Q83 142 83 154Q84 164 94 170Z"></path></g></g></g></svg></mjx-container> <code>sizeof(long)</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.312ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="1.751ex" role="img" focusable="false" viewBox="0 -636 778 774"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2A7D" d="M674 636Q682 636 688 630T694 615T687 601Q686 600 417 472L151 346L399 228Q687 92 691 87Q694 81 694 76Q694 58 676 56H670L382 192Q92 329 90 331Q83 336 83 348Q84 359 96 365Q104 369 382 500T665 634Q669 636 674 636ZM94 170Q102 172 104 172Q110 171 254 103T535 -30T678 -98Q694 -106 694 -118Q694 -136 676 -138H670L382 -2Q92 135 90 137Q83 142 83 154Q84 164 94 170Z"></path></g></g></g></svg></mjx-container> <code>sizeof(long long)</code>。</li>
<li data-marpit-fragment="3">你可以打印各类型宽度来观察不同机器/ABI 的实现差异。</li>

<p>同理，浮点数作为一种<strong>有限精度的二进制小数表示</strong>，会无法准确表达大量实数。</p>
<p>例如经典的浮点误差梗 <code>0.1 + 0.2 != 0 .3</code>。（实际上其结果是 <code>0.30000000000000004</code>）</p>
<blockquote>
<p>智械入侵的时候非常有用的知识 OvO</p>

<h4 id="exercise-1-1">Exercise 1</h4>
<p>拿下！</p>
<pre><code class="language-c"><span class="hljs-type">double</span> <span class="hljs-title function_">midpoint</span><span class="hljs-params">(<span class="hljs-type">double</span> a, <span class="hljs-type">double</span> b)</span> {

<h4 id="33-%E6%B5%AE%E7%82%B9%E6%95%B0%E8%AF%AF%E5%B7%AEerror-of-floating-points-1">3.3. 浮点数误差（Error of floating-points）</h4>

</li>
<li data-marpit-fragment="2"><strong>判断相等</strong>：使用 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.564ex;" xmlns="http://www.w3.org/2000/svg" width="10.127ex" height="2.26ex" role="img" focusable="false" viewBox="0 -749.5 4476 999"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo" transform="translate(0 -0.5)"><path data-c="7C" d="M139 -249H137Q125 -249 119 -235V251L120 737Q130 750 139 750Q152 750 159 735V-235Q151 -249 141 -249H139Z"></path></g><g data-mml-node="mi" transform="translate(278,0)"><path data-c="1D44E" d="M33 157Q33 258 109 349T280 441Q331 441 370 392Q386 422 416 422Q429 422 439 414T449 394Q449 381 412 234T374 68Q374 43 381 35T402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487Q506 153 506 144Q506 138 501 117T481 63T449 13Q436 0 417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157ZM351 328Q351 334 346 350T323 385T277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q217 26 254 59T298 110Q300 114 325 217T351 328Z"></path></g><g data-mml-node="mo" transform="translate(1029.2,0)"><path data-c="2212" d="M84 237T84 250T98 270H679Q694 262 694 250T679 230H98Q84 237 84 250Z"></path></g><g data-mml-node="mi" transform="translate(2029.4,0)"><path data-c="1D44F" d="M73 647Q73 657 77 670T89 683Q90 683 161 688T234 694Q246 694 246 685T212 542Q204 508 195 472T180 418L176 399Q176 396 182 402Q231 442 283 442Q345 442 383 396T422 280Q422 169 343 79T173 -11Q123 -11 82 27T40 150V159Q40 180 48 217T97 414Q147 611 147 623T109 637Q104 637 101 637H96Q86 637 83 637T76 640T73 647ZM336 325V331Q336 405 275 405Q258 405 240 397T207 376T181 352T163 330L157 322L136 236Q114 150 114 114Q114 66 138 42Q154 26 178 26Q211 26 245 58Q270 81 285 114T318 219Q336 291 336 325Z"></path></g><g data-mml-node="mo" transform="translate(2458.4,0) translate(0 -0.5)"><path data-c="7C" d="M139 -249H137Q125 -249 119 -235V251L120 737Q130 750 139 750Q152 750 159 735V-235Q151 -249 141 -249H139Z"></path></g><g data-mml-node="mo" transform="translate(3014.2,0)"><path data-c="3C" d="M694 -11T694 -19T688 -33T678 -40Q671 -40 524 29T234 166L90 235Q83 240 83 250Q83 261 91 266Q664 540 678 540Q681 540 687 534T694 519T687 505Q686 504 417 376L151 250L417 124Q686 -4 687 -5Q694 -11 694 -19Z"></path></g><g data-mml-node="mi" transform="translate(4070,0)"><path data-c="1D716" d="M227 -11Q149 -11 95 41T40 174Q40 262 87 322Q121 367 173 396T287 430Q289 431 329 431H367Q382 426 382 411Q382 385 341 385H325H312Q191 385 154 277L150 265H327Q340 256 340 246Q340 228 320 219H138V217Q128 187 128 143Q128 77 160 52T231 26Q258 26 284 36T326 57T343 68Q350 68 354 58T358 39Q358 36 357 35Q354 31 337 21T289 0T227 -11Z"></path></g></g></g></svg></mjx-container>。<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">isEqual</span><span class="hljs-params">(<span class="hljs-type">double</span> a, <span class="hljs-type">double</span> b)</span> {

</li>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-fragments="5" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-class="cols-2-37" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" class="cols-2-37" data-marpit-pagination="29" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--class:cols-2-37;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="4-literals%E5%AD%97%E9%9D%A2%E5%80%BC">4. Literals（字面值）</h2>
<div class = "limg">
<p><img src="../Emoji/Here.png" alt="#c" /></p>
</div>
<div class = "rdiv">
<h4 id="overview-of-this-section-1">Overview of this Section</h4>
<ul>
<li data-marpit-fragment="1">整数字面值（Integer Literals）</li>
<li data-marpit-fragment="2">浮点数字面值（Floating-point Literals）</li>
<li data-marpit-fragment="3">字符字面值（Character Literals）</li>
<li data-marpit-fragment="4"><s>字符串字面值（String Literals）</s></li>
<li data-marpit-fragment="5"><s>复合字面值（Compound Literals）</s></li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-fragments="5" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="4-literals-1">4. Literals</h2>
<h4 id="overview-of-this-section-2">Overview of this Section</h4>
<ul>
<li data-marpit-fragment="1">每个 C 表达式在编译期都有确定类型。
<ul>
<li data-marpit-fragment="2">表达式是 operators 与 operands 的组合，描述一次计算。</li>
</ul>
</li>
<li data-marpit-fragment="3">例如：<code>int a = 42;</code> <code>double b = 3.14</code>
<ul>
<li data-marpit-fragment="4"><code>a</code> 和 <code>b</code> 的类型分别是什么？</li>
<li data-marpit-fragment="5"><code>42</code> 与 <code>3.14</code> 的类型又是什么？</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-fragments="2" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="4-literals-2">4. Literals</h2>
<h4 id="overview-of-this-section-3">Overview of this Section</h4>
<p>像 <code>42</code> 这样直接写在代码中的值称为 <strong>字面值（literal）</strong>。</p>
<ul>
<li data-marpit-fragment="1">字面值顾名思义，就是“把值写在脸上”的值（字面即是值）。</li>
<li data-marpit-fragment="2">字面值是不可变的（immutable）。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-fragments="6" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="4-literals-3">4. Literals</h2>
<h4 id="41-%E6%95%B4%E6%95%B0%E5%AD%97%E9%9D%A2%E5%80%BCinteger-literals">4.1. 整数字面值（Integer literals）</h4>
<h4 id="example-42-100l-0ll-405ul">Example: <code>42</code>, <code>100L</code>, <code>0ll</code>, <code>405ul</code></h4>
<ul>
<li data-marpit-fragment="1">
<p>后缀：<code>L</code>（long）、<code>ll</code>（long long）、<code>ul</code>（unsigned long）——指示字面值的类型，大小写不敏感。</p>
<ul>
<li data-marpit-fragment="2">建议不要混用小写 <code>l</code> 与大写 <code>L</code>（如 <code>lL</code> 或 <code>Ll</code>），统一使用 <code>L</code> 更清晰。</li>
<li data-marpit-fragment="3">后缀可以组合。</li>
</ul>
</li>
<li data-marpit-fragment="4">
<p>若无后缀，默认类型为 <code>int</code>。</p>
<ul>
<li data-marpit-fragment="5">若超出 <code>int</code> 范围，会依次匹配 <code>int</code> → <code>long</code> → <code>long long</code> → <code>__int128</code>。若不支持 <code>__int128</code>，则这个字面值会成为一个 ill-formed（编译错误）。</li>
</ul>
</li>
<li data-marpit-fragment="6">
<p>注意：<strong>并不存在“负字面值”</strong>。例如 <code>-42</code> 是对字面值 <code>42</code> 应用一元负号运算所得。</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-marpit-fragments="6" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="4-literals-4">4. Literals</h2>
<h4 id="41-%E6%95%B4%E6%95%B0%E5%AD%97%E9%9D%A2%E5%80%BCinteger-literals-1">4.1. 整数字面值（Integer literals）</h4>
<h4 id="%E6%95%B4%E6%95%B0%E5%AD%97%E9%9D%A2%E5%80%BC%E7%9A%84%E8%BF%9B%E5%88%B6base">整数字面值的进制（Base）</h4>
<ul>
<li data-marpit-fragment="1">示例：<code>0xBAADF00D</code>、<code>052</code>、<code>0b101010</code>（C23）</li>
<li data-marpit-fragment="2"><strong>前缀</strong>（大小写不敏感）：
<ul>
<li data-marpit-fragment="3">
<p>十六进制：<code>0x</code></p>
</li>
<li data-marpit-fragment="4">
<p>八进制：<code>0</code></p>
</li>
<li data-marpit-fragment="5">
<p>二进制：<code>0b</code>（自 C23 起）</p>
<ul>
<li data-marpit-fragment="6">（说明：C++ 自 C++14 起已支持二进制字面值）</li>
</ul>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-fragments="7" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="4-literals-5">4. Literals</h2>
<h4 id="42-%E6%B5%AE%E7%82%B9%E6%95%B0%E5%AD%97%E9%9D%A2%E5%80%BCfloating-point-literals">4.2. 浮点数字面值（Floating-point Literals）</h4>
<ul>
<li data-marpit-fragment="1">
<p>示例：<code>3.14</code>、<code>3.14f</code>、<code>3.14l</code>、<code>1e8</code>、<code>3e-8</code></p>
</li>
<li data-marpit-fragment="2">
<p>后缀 <strong>（大小写不敏感）</strong>：</p>
<ul>
<li data-marpit-fragment="3"><em>默认</em>：<code>double</code></li>
<li data-marpit-fragment="4"><code>f</code> ：<code>float</code></li>
<li data-marpit-fragment="5"><code>l</code> ：<code>long double</code></li>
</ul>
</li>
<li data-marpit-fragment="6">
<p><strong>科学计数法总是浮点数</strong>。</p>
<ul>
<li data-marpit-fragment="7">如 <code>1e8</code> 表示 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="3.25ex" height="2.005ex" role="img" focusable="false" viewBox="0 -864 1436.6 886"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(500,0)"></path></g><g data-mml-node="mn" transform="translate(1033,393.1) scale(0.707)"><path data-c="38" d="M70 417T70 494T124 618T248 666Q319 666 374 624T429 515Q429 485 418 459T392 417T361 389T335 371T324 363L338 354Q352 344 366 334T382 323Q457 264 457 174Q457 95 399 37T249 -22Q159 -22 101 29T43 155Q43 263 172 335L154 348Q133 361 127 368Q70 417 70 494ZM286 386L292 390Q298 394 301 396T311 403T323 413T334 425T345 438T355 454T364 471T369 491T371 513Q371 556 342 586T275 624Q268 625 242 625Q201 625 165 599T128 534Q128 511 141 492T167 463T217 431Q224 426 228 424L286 386ZM250 21Q308 21 350 55T392 137Q392 154 387 169T375 194T353 216T330 234T301 253T274 270Q260 279 244 289T218 306L210 311Q204 311 181 294T133 239T107 157Q107 98 150 60T250 21Z"></path></g></g></g></g></svg></mjx-container>，但其类型是 <code>double</code> 而不是 <code>int</code>。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-marpit-fragments="4" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-class="bq-red" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" class="bq-red" data-marpit-pagination="35" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--class:bq-red;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="4-literals-6">4. Literals</h2>

<h4 id="43-%E5%AD%97%E7%AC%A6%E5%AD%97%E9%9D%A2%E5%80%BCcharacter-literals">4.3. 字符字面值（Character Literals）</h4>
<h4 id="example-an1">Example: <code>'a'</code>、<code>'\n'</code>、<code>'1'</code></h4>
<ul>
<li data-marpit-fragment="1">在 C 中，类型为 <code>int</code>；在 C++ 中，类型为 <code>char</code>。</li>
</ul>
<blockquote>
<p>字符字面值</p>
<p>字符字面值是适于转换为字符类型的 <code>int</code>，或类型 <code>char8_t</code>（自 C23 起）、<code>char16_t</code>、<code>char32_t</code>、<code>wchar_t</code>（自 C11 起）的单个字符。</p>
</blockquote>
<ul>
<li data-marpit-fragment="2">例：<code>char c = 'a';</code>
<ul>
<li data-marpit-fragment="3">变量 <code>c</code> 存的是整数 97，即字符 <code>'a'</code> 的 <a href="https://en.cppreference.com/w/c/language/ascii">ASCII</a> 码。</li>
<li data-marpit-fragment="4"><strong>字符与其 ASCII 码之间不存在“转换”——本质上它们就是同一数值。</strong></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-marpit-fragments="3" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-class="cols-2-64" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" class="cols-2-64" data-marpit-pagination="36" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--class:cols-2-64;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="4-literals-7">4. Literals</h2>
<div class = "ldiv">
<h4 id="exercise-2">Exercise 2</h4>
<p>给定字符 <code>'c'</code>（且 <code>'c'</code> 为数字字符 <code>'1'</code>、<code>'2'</code>、…），求其对应的<strong>整数</strong>值。</p>
<ul>
<li data-marpit-fragment="1">输入：单个数字字符 <code>c</code>。若 <code>c</code> 非数字字符，行为未定义。
<ul>
<li data-marpit-fragment="2">你可以输出一个错误！</li>
</ul>
</li>
<li data-marpit-fragment="3">输出：对应的整数值（<code>int</code>）。</li>
</ul>
</div>
<div class = "rimg">
<p><img src="../Emoji/Think-1.png" alt="#c" style="width:400px;" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-class="cols-2-73" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" class="cols-2-73" data-marpit-pagination="37" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--class:cols-2-73;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="4-literals-8">4. Literals</h2>
<div class = "ldiv">
<h4 id="exercise-2-solution">Exercise 2: Solution</h4>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">charToInt</span><span class="hljs-params">(<span class="hljs-type">char</span> c)</span> {
    <span class="hljs-comment">// 检查字符是否为数字字符</span>
    <span class="hljs-keyword">if</span> (c &gt;= <span class="hljs-string">&#x27;0&#x27;</span> &amp;&amp; c &lt;= <span class="hljs-string">&#x27;9&#x27;</span>) {
        <span class="hljs-keyword">return</span> c - <span class="hljs-string">&#x27;0&#x27;</span>;  <span class="hljs-comment">// 通过减去 &#x27;0&#x27; 的ASCII值得到对应的整数</span>
    } <span class="hljs-keyword">else</span> {
        <span class="hljs-comment">// 如果输入不是数字字符，输出错误信息并返回一个特殊值（例如 -1）</span>
        <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;错误：输入字符 &#x27;%c&#x27; 不是数字字符！\n&quot;</span>, c);
        <span class="hljs-keyword">return</span> <span class="hljs-number">-1</span>;  <span class="hljs-comment">// 返回 -1 表示错误</span>
    }
}
</code></pre>
</div>
<div class = "rimg">
<p><img src="../Emoji/SoEasy.png" alt="#c" /></p>
</div>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-fragments="2" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-class="cols-2-37" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" class="cols-2-37" data-marpit-pagination="40" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--class:cols-2-37;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="5-operators">5. Operators</h2>
<div class = "limg">
<p><img src="../Emoji/Here.png" alt="#c" /></p>
</div>
<div class = "rdiv">
<h4 id="overview-of-this-section-4">Overview of this Section</h4>
<ul>
<li data-marpit-fragment="1">Precedence（优先级）、Associativity（结合性）、Order of Evaluation（求值顺序）</li>
<li data-marpit-fragment="2">Bitwise operators（位运算符）</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-fragments="6" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="5-%E8%BF%90%E7%AE%97%E7%AC%A6">5. 运算符</h2>
<h4 id="51-precedence%E4%BC%98%E5%85%88%E7%BA%A7%E4%B8%8E-associativity%E7%BB%93%E5%90%88%E6%80%A7">5.1. Precedence（优先级）与 Associativity（结合性）</h4>
<ul>
<li data-marpit-fragment="1"><strong>优先级</strong>：决定<strong>先</strong>计算哪个运算符
<ul>
<li data-marpit-fragment="2">表达式 <code>f() + g() * h()</code> 解释为 <code>f() + (g() * h())</code>，而非 <code>(f() + g()) * h()</code>。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>结合性</strong>：决定<strong>相同优先级</strong>的运算符如何分组
<ul>
<li data-marpit-fragment="4">表达式 <code>f() - g() + h()</code> 解释为 <code>(f() - g()) + h()</code>，而非 <code>f() - (g() + h())</code>。</li>
</ul>
</li>
<li data-marpit-fragment="5">参考表： <a href="https://en.cppreference.com/w/c/language/operator_precedence">CppReference 运算符优先级/结合性</a></li>
<li data-marpit-fragment="6">经典问题：见 <a href="https://piazza.com/class/lszwrwj2s8231h/post/17">Piazza</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-marpit-fragments="7" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="5-%E8%BF%90%E7%AE%97%E7%AC%A6-1">5. 运算符</h2>
<h4 id="51-precedence%E4%BC%98%E5%85%88%E7%BA%A7%E4%B8%8E-associativity%E7%BB%93%E5%90%88%E6%80%A7-1">5.1. Precedence（优先级）与 Associativity（结合性）</h4>
<p>结合性：相同优先级的运算符如何分组</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>左结合</strong>（Left Associativity）：从左向右分组</p>
<ul>
<li data-marpit-fragment="2">例如 <code>f() - g() + h()</code> → <code>(f() - g()) + h()</code></li>
</ul>
</li>
<li data-marpit-fragment="3">
<p><strong>右结合</strong>（Right Associativity）：从右向左分组</p>
<ul>
<li data-marpit-fragment="4">
<p>例如赋值运算符 <code>=</code>：<code>a = b = c</code></p>
<ul>
<li data-marpit-fragment="5">第一步：<code>a = (b = c)</code></li>
<li data-marpit-fragment="6">第二步：<code>b = c</code> 的结果是 <code>b</code>（且等于 <code>c</code>）</li>
<li data-marpit-fragment="7">第三步：<code>a = b</code></li>
</ul>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-marpit-fragments="2" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="5-%E8%BF%90%E7%AE%97%E7%AC%A6-2">5. 运算符</h2>
<h4 id="52-order-of-evaluation%E6%B1%82%E5%80%BC%E9%A1%BA%E5%BA%8F">5.2. Order of Evaluation（求值顺序）</h4>
<ul>
<li data-marpit-fragment="1"><strong>非常重要</strong>：求值顺序与优先级、结合性<strong>相互独立</strong>。</li>
<li data-marpit-fragment="2"><strong>更重要</strong>：除特别说明外，C 语言<strong>大多数运算符的操作数求值顺序是未指定的（unspecified）</strong>。
<ul>
<li>某些破学校的上古 C 语言课甚至会强行制定某些规则作为考试，看到这种教学请一律忽略！</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-marpit-fragments="5" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="5-%E8%BF%90%E7%AE%97%E7%AC%A6-3">5. 运算符</h2>
<h4 id="52-order-of-evaluation%E6%B1%82%E5%80%BC%E9%A1%BA%E5%BA%8F-1">5.2. Order of Evaluation（求值顺序）</h4>
<ul>
<li data-marpit-fragment="1">
<p>之前的例子 <code>f() - g() + h()</code>、<code>f() - (g() + h())</code> 中，<code>f()</code>、<code>g()</code>、<code>h()</code> 的<strong>调用顺序</strong>是什么？</p>
<ul>
<li data-marpit-fragment="2"><strong>未指定（unspecified）</strong>。</li>
<li data-marpit-fragment="3">很多时候你无法精确定义“未指定”的含义；理解编译期如何处理才是关键。详见 <a href="https://en.cppreference.com/w/c/language/eval_order">order of evaluation - CppReference</a>。</li>
</ul>
</li>
<li data-marpit-fragment="4">
<p>另例：<code>func(f(), g(), h())</code></p>
<ul>
<li data-marpit-fragment="5">这里 <code>f()</code>、<code>g()</code>、<code>h()</code> 的调用顺序同样未指定。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-marpit-fragments="6" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="5-%E8%BF%90%E7%AE%97%E7%AC%A6-4">5. 运算符</h2>
<h4 id="52-order-of-evaluation%E6%B1%82%E5%80%BC%E9%A1%BA%E5%BA%8F-2">5.2. Order of Evaluation（求值顺序）</h4>
<p>若两个表达式 <code>A</code> 与 <code>B</code> 的求值顺序未指定，且它们：</p>
<ul>
<li data-marpit-fragment="1">都修改同一变量的值，或</li>
<li data-marpit-fragment="2">一个修改某变量值，另一个读取该变量值，</li>
</ul>
<p>则构成<strong>未定义行为（undefined behavior）</strong>。</p>
<ul>
<li data-marpit-fragment="3">
<p>例：<code>i = i++ + 2</code> 的结果是什么？</p>
<ul>
<li data-marpit-fragment="4">
<p>一旦开始分析它是 <code>+1</code> 还是 <code>+2</code>，你就<strong>掉入了未定义行为的陷阱</strong>。</p>
<ul>
<li data-marpit-fragment="5"><code>++</code> 修改了 <code>i</code>，赋值也修改了 <code>i</code>，而两者的<strong>先后顺序未指定</strong>，因此是 <strong>undefined behavior</strong>。</li>
<li data-marpit-fragment="6">类比：<code>double pi = 3.14; printf(&quot;%d\n&quot;, pi);</code>（类型不匹配导致 UB）</li>
</ul>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-marpit-fragments="6" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="5-%E8%BF%90%E7%AE%97%E7%AC%A6-5">5. 运算符</h2>
<h4 id="52-order-of-evaluation%E6%B1%82%E5%80%BC%E9%A1%BA%E5%BA%8F-3">5.2. Order of Evaluation（求值顺序）</h4>
<p>在常见运算符中，只有 4 个具有确定的求值顺序：<code>&amp;&amp;</code>、<code>||</code>、<code>?:</code>、<code>,</code>。</p>
<ul>
<li data-marpit-fragment="1">
<p><code>&amp;&amp;</code> 与 <code>||</code>：短路求值（short-circuit / minimal evaluation / McCarthy evaluation）</p>
<ul>
<li data-marpit-fragment="2"><strong>先</strong>计算左操作数；若结果已足以确定整体值，则<strong>右操作数不再求值</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="3">
<p>条件运算符 <code>cond ? t : f</code></p>
<ul>
<li data-marpit-fragment="4"><strong>先</strong>计算 <code>cond</code>，再根据其真假计算 <code>t</code> 或 <code>f</code>；两者<strong>只会计算其一</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="5">
<p>逗号运算符 <code>,</code></p>
<ul>
<li data-marpit-fragment="6">依次计算多个表达式，整个逗号表达式的<strong>值</strong>为<strong>最后一个</strong>子表达式的值。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-class="cols-2-64" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" class="cols-2-64" data-marpit-pagination="47" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--class:cols-2-64;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="5-%E8%BF%90%E7%AE%97%E7%AC%A6-6">5. 运算符</h2>
<div class = "ldiv">
<h4 id="exercise-4">Exercise 4</h4>
<pre><code class="language-C"><span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>{
  <span class="hljs-type">int</span> a = <span class="hljs-number">1</span>;
  <span class="hljs-type">int</span> b = (a++, a + <span class="hljs-number">100</span>, a - <span class="hljs-number">10</span>);
}
</code></pre>
<blockquote>
<p>上述程序中 <code>b</code> 的值是多少？（提示：逗号表达式取最后一个子表达式的值）</p>
</blockquote>
</div>
<div class = "rimg">
<p><img src="../Emoji/Think-1.png" alt="#c" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="5-%E8%BF%90%E7%AE%97%E7%AC%A6-7">5. 运算符</h2>
<h4 id="exercise-4-solution">Exercise 4: Solution</h4>
<p>答案上 <code>b = -8</code>！</p>
<ol>
<li><code>a++</code>：先使用 <code>a</code> 的值（<code>1</code>），然后 <code>a</code> 自增为 <code>2</code></li>
<li><code>a + 100</code>：计算 <code>2 + 100 = 102</code>（但结果被丢弃，因为不是最后一个表达式）</li>
<li><code>a - 10</code>：计算 <code>2 - 10 = -8</code>，这是最后一个表达式，因此作为整个逗号表达式的值，赋值给 <code>b</code></li>
</ol>
<p>所以 <code>b</code> 的值是 ​<code>​-8</code>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 2</em> <em>Fall 2025</em></header>
<h2 id="5-%E8%BF%90%E7%AE%97%E7%AC%A6-8">5. 运算符</h2>
<h4 id="53-bitwise-operators%E4%BD%8D%E8%BF%90%E7%AE%97%E7%AC%A6">5.3. Bitwise Operators（位运算符）</h4>
<p><code>~</code>, <code>&amp;</code>, <code>^</code>, <code>|</code>, <code>&lt;&lt;</code>, <code>&gt;&gt;</code>，以及复合赋值（compound assignment）<code>&amp;=</code>, <code>|=</code>, <code>^=</code>, <code>&lt;&lt;=</code>, <code>&gt;&gt;=</code></p>
<table>
<thead>
<tr>
<th>运算符</th>
<th>名称</th>
<th>示例</th>
<th>含义</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td><code>~</code></td>
<td>按位非（NOT）</td>
<td><code>~a</code></td>
<td><code>a</code> 的逐位取反</td>
<td></td>
</tr>
<tr>
<td><code>&amp;</code></td>
<td>按位与（AND）</td>
<td><code>a &amp; b</code></td>
<td><code>a</code> 与 <code>b</code> 的逐位与</td>
<td></td>
</tr>
<tr>
<td>`</td>
<td>`</td>
<td>按位或（OR）</td>
<td><code>a | b</code></td>
<td><code>a</code> 与 <code>b</code> 的逐位或</td>
</tr>
<tr>
<td><code>^</code></td>
<td>按位异或（XOR）</td>
<td><code>a ^ b</code></td>
<td><code>a</code> 与 <code>b</code> 的逐位异或</td>
<td></td>
</tr>
<tr>
<td><code>&lt;&lt;</code></td>
<td>左移（Left Shift）</td>
<td><code>a &lt;&lt; i</code></td>
<td><code>a</code> 的二进制位左移 <code>i</code> 位</td>
<td></td>
</tr>
<tr>
<td><code>&gt;&gt;</code></td>
<td>右移（Right Shift）</td>
<td><code>a &gt;&gt; i</code></td>
<td><code>a</code> 的二进制位右移 <code>i</code> 位</td>
<td></td>
</tr>
</tbody>
</table>

<li data-marpit-fragment="3">

</li>

<p>设 <code>a</code> 为无符号整数。</p>
<ul>
<li data-marpit-fragment="1">
<p><code>a &lt;&lt; i</code>：把 <code>a</code> 的二进制位<strong>左移</strong> <code>i</code> 位</p>
<ul>
<li data-marpit-fragment="2"><code>a &lt;&lt; 1</code> 等价于 <code>a * 2</code>；一般 <code>a &lt;&lt; i</code> 等价于 <code>a * 2^i</code></li>
<li data-marpit-fragment="3"><em><strong>左侧移出的位被丢弃</strong></em></li>
</ul>
</li>
<li data-marpit-fragment="4">
<p><code>a &gt;&gt; i</code>：把 <code>a</code> 的二进制位<strong>右移</strong> <code>i</code> 位</p>
<ul>
<li data-marpit-fragment="5"><code>a &gt;&gt; 1</code> 等价于 <code>a / 2</code></li>
<li data-marpit-fragment="6"><em><strong>右侧移出的位被丢弃</strong></em></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header=" *CS100* *Tutorial 2* *Fall 2025*" data-class="cols-2-37" data-theme="3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u" lang="en-US" class="cols-2-37" data-marpit-pagination="52" style="--paginate:true;--header: *CS100* *Tutorial 2* *Fall 2025*;--class:cols-2-37;--theme:3e416od83y120st9fhuvhfdau3zhipn9vw7j7gr0a6u;" data-marpit-pagination-total="60" data-size="16:9">

<h2 id="5-%E8%BF%90%E7%AE%97%E7%AC%A6-14">5. 运算符</h2>
<h4 id="exercise-6-solution">Exercise 6: Solution</h4>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">test_bit</span><span class="hljs-params">(<span class="hljs-type">unsigned</span> x, <span class="hljs-type">unsigned</span> i)</span> {
    <span class="hljs-comment">// 将 x 右移 i 位，使目标位移动到最低位</span>
    <span class="hljs-comment">// 然后与 1 进行按位与操作，提取该位的值</span>
    <span class="hljs-keyword">return</span> (x &gt;&gt; i) &amp; <span class="hljs-number">1</span>;
}
</code></pre>
<p>假设 <code>x = 13</code>（二进制为 <code>1101</code>），我们想获取第2位的值：</p>
<ul>
<li data-marpit-fragment="1"><code>x &gt;&gt; 2</code>得到 <code>0011</code>（十进制为3）</li>
<li data-marpit-fragment="2"><code>(x &gt;&gt; 2) &amp; 1</code> 得到 <code>0011 &amp; 0001 = 0001</code>，即 <code>1</code>。</li>
</ul>
</section>

<div class = "ldiv">
<h4 id="exercise-7-solution">Exercise 7: Solution</h4>
<p>如何翻转无符号整数 <code>x</code> 的第 <code>i</code> 位？</p>
<pre><code class="language-c"><span class="hljs-type">unsigned</span> <span class="hljs-title function_">bit_flip</span><span class="hljs-params">(<span class="hljs-type">unsigned</span> x, <span class="hljs-type">unsigned</span> i)</span> {
    <span class="hljs-comment">// 创建一个只有第 i 位为 1 的掩码，然后与 x 进行异或操作</span>
    <span class="hljs-keyword">return</span> x ^ (<span class="hljs-number">1U</span> &lt;&lt; i);
}
</code></pre>
<ul>
<li data-marpit-fragment="1"><code>1U &lt;&lt; i</code>：将无符号整数 <code>1</code> 左移 <code>i</code> 位，创建一个只有第 <code>i</code> 位为 <code>1</code> 的掩码</li>
<li data-marpit-fragment="2"><code>x ^ mask</code>：通过异或操作翻转第 i位
<ul>
<li data-marpit-fragment="3">如果第 i位原来是 <code>0</code>，则 <code>0 ^ 1 = 1</code>（翻转）</li>
<li data-marpit-fragment="4">如果第 i位原来是 <code>1</code>，则 <code>1 ^ 1 = 0</code>（翻转）</li>
</ul>
</li>
</ul>

<h2 id="5-%E8%BF%90%E7%AE%97%E7%AC%A6-18">5. 运算符</h2>
<h4 id="exercise-8-solution">Exercise 8: Solution</h4>
<pre><code class="language-c"><span class="hljs-type">unsigned</span> <span class="hljs-title function_">bit_slice</span><span class="hljs-params">(<span class="hljs-type">unsigned</span> x, <span class="hljs-type">unsigned</span> low, <span class="hljs-type">unsigned</span> high)</span> {
    <span class="hljs-comment">// 创建一个掩码，用于提取指定的位区间</span>
    <span class="hljs-type">unsigned</span> mask = (<span class="hljs-number">1U</span> &lt;&lt; (high - low)) - <span class="hljs-number">1</span>;
    
    <span class="hljs-comment">// 右移 x 使目标位区间对齐到最低位，然后应用掩码</span>
    <span class="hljs-keyword">return</span> (x &gt;&gt; low) &amp; mask;
}
</code></pre>
