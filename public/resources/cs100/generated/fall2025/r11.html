<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">MinAndMax</span> {
  <span class="hljs-type">int</span> min;
  <span class="hljs-type">int</span> max;
};
<span class="hljs-function">MinAndMax <span class="hljs-title">getMinMax</span><span class="hljs-params">(<span class="hljs-type">const</span> std::vector&lt;<span class="hljs-type">int</span>&gt; &amp;vec)</span> </span>{
  <span class="hljs-type">int</span> min = INT_MAX, max = INT_MIN;
  <span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> x : vec) {
    <span class="hljs-comment">// ...</span>
  }
  <span class="hljs-keyword">return</span> <span class="hljs-comment">/* 这里怎么写？ */</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="1-%E5%A4%9A%E8%BF%94%E5%9B%9E%E5%80%BC%E6%93%8D%E4%BD%9C-3">1. 多返回值操作</h2>
<h4 id="12-%E6%9C%B4%E7%B4%A0%E7%9A%84%E6%96%B9%E6%B3%95%E7%BB%93%E6%9E%84%E4%BD%93-1">1.2. 朴素的方法：结构体</h4>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">MinAndMax</span> {
  <span class="hljs-type">int</span> min;
  <span class="hljs-type">int</span> max;
};
<span class="hljs-function">MinAndMax <span class="hljs-title">getMinMax</span><span class="hljs-params">(<span class="hljs-type">const</span> std::vector&lt;<span class="hljs-type">int</span>&gt; &amp;vec)</span> </span>{
  <span class="hljs-type">int</span> min = INT_MAX, max = INT_MIN;
  <span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> x : vec) {
    <span class="hljs-comment">// ...</span>
  }
  <span class="hljs-keyword">return</span> MinAndMax{min, max}; <span class="hljs-comment">// 或者 return {min, max};</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="1-%E5%A4%9A%E8%BF%94%E5%9B%9E%E5%80%BC%E6%93%8D%E4%BD%9C-4">1. 多返回值操作</h2>
<h4 id="13-%E8%81%9A%E5%90%88%E7%B1%BB-aggregate">1.3. 聚合类 (aggregate)</h4>
<p>聚合类是：所有 non-<code>static</code> 数据成员都是 public 、没有自定义构造函数且满足一些其它条件的类。</p>
<ul>
<li>核心特点一：数据成员都是 public ，看起来就如同是几个变量打包在一起，这些变量本身就是接口。</li>
<li>核心特点二：没有自定义构造函数，初始化 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="1.505ex" role="img" focusable="false" viewBox="0 -583 778 665"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g></g></g></svg></mjx-container> 对所有成员进行初始化。</li>
<li>其它条件，例如基类都是 public 继承，没有虚函数等。</li>
</ul>
<p>这样的类从使用的角度讲，与 C 的 <code>struct</code> 非常接近。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="1-%E5%A4%9A%E8%BF%94%E5%9B%9E%E5%80%BC%E6%93%8D%E4%BD%9C-5">1. 多返回值操作</h2>
<h4 id="14-%E4%BD%BF%E7%94%A8%E5%A4%A7%E6%8B%AC%E5%8F%B7%E5%88%97%E8%A1%A8">1.4. 使用大括号列表</h4>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">MinAndMax</span> {
  <span class="hljs-type">int</span> min;
  <span class="hljs-type">int</span> max;
};
MinAndMax result{a, b};
</code></pre>
  </div>
  <div>
<pre><code class="language-cpp"><span class="hljs-function">MinAndMax <span class="hljs-title">getMinMax</span><span class="hljs-params">(<span class="hljs-comment">/* ... */</span>)</span> </span>{
  <span class="hljs-type">int</span> min = INT_MAX, max = INT_MIN;
  <span class="hljs-comment">// ...</span>
  <span class="hljs-keyword">return</span> {min, max};
}
</code></pre>
  </div>
</div>
<p>一般地，如果用 <code>{e1, e2, ...}</code> 初始化一个 <code>T</code> 类型的对象，例如 <code>T x{a, b, c};</code>：</p>
<ul>
<li>如果 <code>T</code> 是一个聚合体，那么这是一种<strong>聚合初始化 (aggregate initialization)</strong>：<code>e1</code>, <code>e2</code>, ... 依次用来初始化第一个子对象、第二个子对象、……</li>
<li>否则，如果 <code>T</code> 含有接受 <code>std::initializer_list&lt;V&gt;</code> 的构造函数，则这个列表被传给这个构造函数。</li>
<li>否则，就如同 <code>T x(a, b, c);</code> ，走正常的构造函数（<strong>直接初始化 (direct initialization)</strong>）。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="1-%E5%A4%9A%E8%BF%94%E5%9B%9E%E5%80%BC%E6%93%8D%E4%BD%9C-6">1. 多返回值操作</h2>
<h4 id="14-%E4%BD%BF%E7%94%A8%E5%A4%A7%E6%8B%AC%E5%8F%B7%E5%88%97%E8%A1%A8-1">1.4. 使用大括号列表</h4>
<p>如果 <code>MinAndMax</code> 有一个用户提供的构造函数：</p>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">MinAndMax</span> {
  <span class="hljs-type">int</span> min;
  <span class="hljs-type">int</span> max;
  <span class="hljs-built_in">MinAndMax</span>(<span class="hljs-type">int</span> min_, <span class="hljs-type">int</span> max_) : min{min_}, max{max_} {}
};
</code></pre>
<p>那么 <code>MinAndMax</code> 就不再是聚合类，但是我们仍然可以用 <code>{a, b}</code> 初始化一个该类型的对象，也仍然可以 <code>return {min, max};</code>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="1-%E5%A4%9A%E8%BF%94%E5%9B%9E%E5%80%BC%E6%93%8D%E4%BD%9C-7">1. 多返回值操作</h2>
<h4 id="14-%E4%BD%BF%E7%94%A8%E5%A4%A7%E6%8B%AC%E5%8F%B7%E5%88%97%E8%A1%A8-2">1.4. 使用大括号列表</h4>
<p>总之，<strong>下面这种做法一定是可以避免、需要避免的</strong>：</p>
<pre><code class="language-cpp">MinAndMax result;
result.min = a;
result.max = b;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="1-%E5%A4%9A%E8%BF%94%E5%9B%9E%E5%80%BC%E6%93%8D%E4%BD%9C-8">1. 多返回值操作</h2>
<h4 id="15-%E7%BB%93%E6%9E%84%E5%8C%96%E7%BB%91%E5%AE%9A-structured-binding">1.5. 结构化绑定 (Structured binding)</h4>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">MinAndMax</span> { <span class="hljs-type">int</span> min, max; };
<span class="hljs-function">MinAndMax <span class="hljs-title">getMinMax</span><span class="hljs-params">(<span class="hljs-type">const</span> std::vector&lt;<span class="hljs-type">int</span>&gt; &amp;)</span></span>;
</code></pre>
<p>调用者怎么获得这个返回值？</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> result = <span class="hljs-built_in">getMinMax</span>(numbers);
std::cout &lt;&lt; result.min &lt;&lt; <span class="hljs-string">&#x27; &#x27;</span> &lt;&lt; result.max &lt;&lt; <span class="hljs-string">&#x27;\n&#x27;</span>;
</code></pre>
<p>这当然可以。但是，有没有更好的办法呢？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="1-%E5%A4%9A%E8%BF%94%E5%9B%9E%E5%80%BC%E6%93%8D%E4%BD%9C-9">1. 多返回值操作</h2>
<h4 id="15-%E7%BB%93%E6%9E%84%E5%8C%96%E7%BB%91%E5%AE%9A-structured-binding-1">1.5. 结构化绑定 (Structured binding)</h4>
<p>有没有更好的办法呢？</p>
<p><img src="img/image.png" alt="#c" style="width:400px;" /></p>
<p>但是有更好的办法：<strong>结构化绑定</strong></p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> [minVal, maxVal] = <span class="hljs-built_in">getMinMax</span>(numbers);
std::cout &lt;&lt; minVal &lt;&lt; <span class="hljs-string">&#x27; &#x27;</span> &lt;&lt; maxVal &lt;&lt; <span class="hljs-string">&#x27;\n&#x27;</span>;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="1-%E5%A4%9A%E8%BF%94%E5%9B%9E%E5%80%BC%E6%93%8D%E4%BD%9C-10">1. 多返回值操作</h2>
<h4 id="15-%E7%BB%93%E6%9E%84%E5%8C%96%E7%BB%91%E5%AE%9A-structured-binding-2">1.5. 结构化绑定 (Structured binding)</h4>
<p>结构化绑定的声明可以带有 <code>const</code> 、引用等，也可以放在基于范围的 <code>for</code> 语句里：</p>
<pre><code class="language-cpp"><span class="hljs-keyword">enum class</span> <span class="hljs-title class_">Gender</span> { Male, Female };
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">PersonInfo</span> {
  std::string name;
  Gender gender;
  <span class="hljs-type">int</span> birthYear;
};
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">foo</span><span class="hljs-params">(<span class="hljs-type">const</span> std::vector&lt;PersonInfo&gt; &amp;persons)</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> &amp;[n, g, by] : persons) {
    <span class="hljs-comment">// ...</span>
  }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="1-%E5%A4%9A%E8%BF%94%E5%9B%9E%E5%80%BC%E6%93%8D%E4%BD%9C-11">1. 多返回值操作</h2>
<h4 id="16-stdpair">1.6. <code>std::pair</code></h4>
<p><code>std::pair</code> 是定义在 <code>&lt;utility&gt;</code> 中的一个快速、随意的数据结构。</p>
<pre><code class="language-cpp">std::pair&lt;T1, T2&gt; p1{a, b}; <span class="hljs-comment">// 用圆括号也可以</span>
<span class="hljs-keyword">auto</span> p2 = std::<span class="hljs-built_in">make_pair</span>(a, b); <span class="hljs-comment">// 等价的写法</span>
std::pair p3{a, b}; <span class="hljs-comment">// 编译器根据 a 和 b 的类型来推导模板参数</span>
                    <span class="hljs-comment">// 这里用圆括号也可以，但 {} 更 modern</span>
</code></pre>
<p>C++17 有了 CTAD（Class Template Argument Deduction，类模板参数推导，允许编译器根据构造函数的参数自动推导模板参数），几乎不再需要 <code>std::make_pair</code> 了。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="1-%E5%A4%9A%E8%BF%94%E5%9B%9E%E5%80%BC%E6%93%8D%E4%BD%9C-12">1. 多返回值操作</h2>
<h4 id="16-stdpair-1">1.6. <code>std::pair</code></h4>
<p>如果返回的是两个值，直接装进 <code>pair</code> 里就行</p>
<pre><code class="language-cpp"><span class="hljs-function">std::pair&lt;<span class="hljs-type">int</span>, std::string&gt; <span class="hljs-title">foo</span><span class="hljs-params">()</span> </span>{
  <span class="hljs-comment">// ...</span>
  <span class="hljs-keyword">return</span> {<span class="hljs-number">42</span>, <span class="hljs-string">&quot;hello&quot;</span>};
}
</code></pre>
<p>访问 <code>pair</code> 中的元素：<code>p.first</code>, <code>p.second</code></p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> p = <span class="hljs-built_in">foo</span>();
std::cout &lt;&lt; foo.first &lt;&lt; <span class="hljs-string">&quot;, &quot;</span> &lt;&lt; foo.second &lt;&lt; std::endl;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="1-%E5%A4%9A%E8%BF%94%E5%9B%9E%E5%80%BC%E6%93%8D%E4%BD%9C-13">1. 多返回值操作</h2>
<h4 id="16-stdpair-2">1.6. <code>std::pair</code></h4>
<p>结构化绑定也可以用于 <code>std::pair</code> ：</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> [ival, sval] = <span class="hljs-built_in">foo</span>();
std::cout &lt;&lt; ival &lt;&lt; <span class="hljs-string">&quot;, &quot;</span> &lt;&lt; sval &lt;&lt; std::endl;
</code></pre>
<p><code>std::pair</code> 有比较运算符：按照 <code>.first</code> 为第一关键字、<code>.second</code> 为第二关键字比较。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="1-%E5%A4%9A%E8%BF%94%E5%9B%9E%E5%80%BC%E6%93%8D%E4%BD%9C-14">1. 多返回值操作</h2>
<h4 id="16-stdpair-3">1.6. <code>std::pair</code></h4>
<p>不要滥用 <code>std::pair</code>！</p>
<pre><code class="language-cpp"><span class="hljs-keyword">using</span> Complex = std::pair&lt;<span class="hljs-type">double</span>, <span class="hljs-type">double</span>&gt;;   <span class="hljs-comment">// bad idea!</span>
<span class="hljs-keyword">using</span> Student = std::pair&lt;std::string, <span class="hljs-type">int</span>&gt;; <span class="hljs-comment">// bad idea!</span>
</code></pre>
<p><strong>不要用 <code>std::pair</code> 代表有具体含义的类型！</strong></p>
<p><code>std::pair</code> 只是一个临时的、随意的数据结构，更多的被用于临时传递数据。正式的类型应该被定义成一个明确的类或结构体。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-class="trans" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" class="trans" style="--class:trans;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-size="16:9">
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading">2. 重载运算符 (Operator overloading)</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-1">2. 重载运算符 (Operator overloading)</h2>
<h4 id="21-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-overview">2.1. 重载运算符 Overview</h4>
<p>运算符重载的方式是定义一个名为 <code>operator@</code> 的函数：</p>
<ul>
<li>各个运算对象从左向右依次作为这个函数的参数。</li>
<li>如果是成员函数，则最左侧的运算对象绑定到 <code>*this</code>。</li>
</ul>
<p>不能发明新的运算符。不能为内置类型定义运算符。</p>
<p>不能被重载的运算符：<code>?:</code>, <code>.</code>, <code>::</code> 等，具有特别意义的运算符</p>
<p>不建议被重载：<code>&amp;&amp;</code>, <code>||</code>, <code>,</code>, <code>&amp;</code> (address-of)</p>
<ul>
<li>为什么？</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-2">2. 重载运算符 (Operator overloading)</h2>
<h4 id="21-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-overview-1">2.1. 重载运算符 Overview</h4>
<p>不能被重载：</p>
<ul>
<li><code>?:</code>, <code>.</code>, <code>::</code> 等，具有特别意义的运算符</li>
<li><code>?:</code> 无法被重载，因为它有一个运算对象不被求值，这一点用函数传参不可能做到</li>
</ul>
<p>不建议被重载：（为什么？）</p>
<ul>
<li><code>&amp;&amp;</code>, <code>||</code>, <code>,</code>, <code>&amp;</code> (一元取地址运算符)</li>
<li><code>&amp;&amp;</code> 和 <code>||</code> 的短路求值会失效。<code>,</code> 和 <code>&amp;</code> 本来就能作用于一切类型。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-3">2. 重载运算符 (Operator overloading)</h2>
<h4 id="21-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-overview-2">2.1. 重载运算符 Overview</h4>
<p><strong>重载的行为需要和内置的行为保持某种程度上的一致</strong>，除非你有很好的理由不这么做</p>
<ul>
<li><code>++i</code> 返回 <code>i</code> 的引用，<code>i++</code> 返回递增前的 <code>i</code> 的一份拷贝。</li>
<li>赋值、复合赋值都返回左侧运算对象的引用。</li>
<li>解引用 <code>*p</code> 通常返回左值引用</li>
<li>比较运算符需要符合逻辑：<code>a == b</code> 意味着 <code>b == a</code>，<code>a != b</code> 意味着 <code>!(a == b)</code>。</li>
</ul>
<p>C++20 的比较运算符的相关规则发生了巨大的变化：</p>
<ul>
<li>允许用 <code>=default</code> 让编译器合成</li>
<li>新增了 <code>operator&lt;=&gt;</code> 用来定义数学上对应的<strong>序关系</strong>（partial ordering, strong ordering, weak ordering）</li>
<li>定义了 <code>operator==</code> 和 <code>operator&lt;=&gt;</code> 后编译器会合成其它关系运算符，还会照顾对称性。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-4">2. 重载运算符 (Operator overloading)</h2>
<h4 id="21-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-overview-3">2.1. 重载运算符 Overview</h4>
<p>通常是成员：<code>++</code>, <code>--</code>, <code>*</code> (解引用), <code>-&gt;</code>, <code>=</code> (赋值，必须是成员), 各种复合赋值运算符（<code>+=</code>, <code>-=</code>, ...）</p>
<p>成员或非成员皆可：比较运算符 <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>, <code>==</code>, <code>!=</code>，算术运算符等</p>
<p><strong>如果需要左侧运算对象也能隐式转换，则它不能是成员。</strong></p>
<ul>
<li><code>r == 1</code> 被视为 <code>r.operator==(1)</code>，即 <code>r.operator==(Rational(1))</code></li>
<li>但 <code>1 == r</code> 会被视为 <code>1.operator==(r)</code> （显然是错误），不会被进一步推断为 <code>Rational(1).operator==(r)</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-5">2. 重载运算符 (Operator overloading)</h2>
<h4 id="%E4%B8%8D%E8%A6%81%E6%BC%8F-const">不要漏 <code>const</code>！</h4>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>==(<span class="hljs-type">const</span> Rational &amp;) <span class="hljs-type">const</span>;
};
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>!=(<span class="hljs-type">const</span> Rational &amp;, <span class="hljs-type">const</span> Rational &amp;);
</code></pre>
<p>非成员有两个 <code>const</code>，成员也必然有两个 <code>const</code>，只是其中一个变成了这个成员函数的 qualifier。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-6">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-1-%E5%90%8E%E7%BD%AE%E9%80%92%E5%A2%9E-i">2.2. 特殊的运算符 (1): 后置递增 <code>i++</code></h4>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  Rational &amp;<span class="hljs-keyword">operator</span>++() { <span class="hljs-comment">/* ... */</span> <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span>; }
  Rational <span class="hljs-keyword">operator</span>++(<span class="hljs-type">int</span>) {
    <span class="hljs-comment">// 若无特殊情况，后置递增运算符几乎总是这样写</span>
    <span class="hljs-keyword">auto</span> tmp = *<span class="hljs-keyword">this</span>; <span class="hljs-comment">// 拷贝原来的对象</span>
    ++*<span class="hljs-keyword">this</span>;          <span class="hljs-comment">// 真正的“递增”由前置版本完成</span>
    <span class="hljs-keyword">return</span> tmp;       <span class="hljs-comment">// 返回递增前的拷贝</span>
  }
};
</code></pre>
<ul>
<li><code>int</code> 参数：<strong>仅仅是为了区分前置版本和后置版本</strong>，没有实际意义，也不需要用到，自然也就没有名字。
<ul>
<li>如果一个参数没有被用到，它的名字可以不被写出来，也可以标上 <code>[[maybe_unused]]</code></li>
</ul>
</li>
<li><code>++i</code> 被视为 <code>i.operator++()</code>，<code>i++</code> 被视为 <code>i.operator++(0)</code>。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-7">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-2-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6">2.2. 特殊的运算符 (2): 特殊的运算符：<code>-&gt;</code></h4>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">SharedPtr</span> {
<span class="hljs-keyword">public</span>:
  Object &amp;<span class="hljs-keyword">operator</span>*() <span class="hljs-type">const</span>;
  Object *<span class="hljs-keyword">operator</span>-&gt;() <span class="hljs-type">const</span> {
    <span class="hljs-comment">// 若无特殊情况，箭头运算服几乎总是这样写，以使 p-&gt;mem 和 (*p).mem 等价</span>
    <span class="hljs-keyword">return</span> std::<span class="hljs-built_in">addressof</span>(<span class="hljs-keyword">this</span>-&gt;<span class="hljs-keyword">operator</span>*());
  }
};
</code></pre>
<ul>
<li>为了让 <code>p-&gt;mem</code> 和 <code>(*p).mem</code> 等价，<code>operator-&gt;</code> 几乎总是应该这样定义。
<ul>
<li>这个运算符有一点怪（比如，它是一元的还是二元的？）。不用太纠结，实在好奇可以上网查。</li>
</ul>
</li>
<li>注意在本例中 <code>operator*</code> 和 <code>operator-&gt;</code> 都是 <code>const</code>：它们都允许在 <code>const SharedPtr</code> 上调用。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-8">2. 重载运算符 (Operator overloading)</h2>
<h4 id="%E9%81%BF%E5%85%8D%E9%87%8D%E5%A4%8D%E6%AF%94%E8%BE%83%E8%BF%90%E7%AE%97%E7%AC%A6">避免重复：比较运算符</h4>
<p>定义 <code>operator==</code> 和 <code>operator&lt;</code>，让剩下四个依赖于它们。</p>
<pre><code class="language-cpp"><span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>!=(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> !(lhs == rhs);
}
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&gt;(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> rhs &lt; lhs;
}
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;=(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> !(lhs &gt; rhs); <span class="hljs-comment">// 你只会 lhs &lt; rhs || lhs == rhs ?</span>
}
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&gt;=(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> !(lhs &lt; rhs);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-9">2. 重载运算符 (Operator overloading)</h2>
<h4 id="%E9%81%BF%E5%85%8D%E9%87%8D%E5%A4%8D%E7%AE%97%E6%9C%AF%E8%BF%90%E7%AE%97%E7%AC%A6">避免重复：算术运算符</h4>
<p>定义一元负号 <code>-</code> 和 <code>+=</code>，那么 <code>+</code>, <code>-</code>, <code>-=</code> 都可以用它们实现。</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span> {
<span class="hljs-keyword">public</span>:
  Rational &amp;<span class="hljs-keyword">operator</span>-=(<span class="hljs-type">const</span> Rational &amp;rhs) {
    <span class="hljs-keyword">return</span> *<span class="hljs-keyword">this</span> += -rhs;
  }
};
Rational <span class="hljs-keyword">operator</span>+(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> <span class="hljs-built_in">Rational</span>(lhs) += rhs;
}
Rational <span class="hljs-keyword">operator</span>-(<span class="hljs-type">const</span> Rational &amp;lhs, <span class="hljs-type">const</span> Rational &amp;rhs) {
  <span class="hljs-keyword">return</span> <span class="hljs-built_in">Rational</span>(lhs) -= rhs;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-10">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-3-%E8%BE%93%E5%85%A5%E8%BE%93%E5%87%BA%E8%BF%90%E7%AE%97%E7%AC%A6operator-%E5%92%8C-operator">2.2. 特殊的运算符 (3): 输入、输出运算符：<code>operator&lt;&lt;</code> 和 <code>operator&gt;&gt;</code></h4>
<p>首先搞清楚：输入流（例如 <code>std::cin</code>）的类型是 <code>std::istream</code>，输出流（例如 <code>std::cout</code>）的类型是 <code>std::ostream</code>。</p>
<p>这两个运算符应该是成员还是非成员？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-11">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-3-%E8%BE%93%E5%85%A5%E8%BE%93%E5%87%BA%E8%BF%90%E7%AE%97%E7%AC%A6-operator-%E5%92%8C-operator">2.2. 特殊的运算符 (3): 输入、输出运算符 (<code>operator&lt;&lt;</code> 和 <code>operator&gt;&gt;</code>)</h4>
<p>输入流（例如 <code>std::cin</code>）的类型是 <code>std::istream</code>，输出流（例如 <code>std::cout</code>）的类型是 <code>std::ostream</code>。</p>
<p>这两个运算符只能是非成员：你无法给 <code>std::istream</code> 和 <code>std:ostream</code> 添加成员。</p>
<ul>
<li>若一个运算符是成员，它只可能是最左侧运算对象的成员。</li>
</ul>
<p><code>std::istream</code> 和 <code>std::ostream</code> 都不能拷贝，必须按引用传递，而且不能是常量引用。</p>
<pre><code class="language-cpp">std::istream &amp;<span class="hljs-keyword">operator</span>&gt;&gt;(std::istream &amp;, Rational &amp;r);
std::ostream &amp;<span class="hljs-keyword">operator</span>&lt;&lt;(std::ostream &amp;, <span class="hljs-type">const</span> Rational &amp;r);
</code></pre>
<ul>
<li>为了支持连续的输入输出 <code>std::cin &gt;&gt; a &gt;&gt; b &gt;&gt; c</code>，这两个运算符需要把左侧运算对象返回出来。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-12">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-3-%E8%BE%93%E5%85%A5%E8%BE%93%E5%87%BA%E8%BF%90%E7%AE%97%E7%AC%A6">2.2. 特殊的运算符 (3): 输入、输出运算符</h4>
<p>输入运算符需要考虑输入错误的情况。</p>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">Vec3</span> {
  <span class="hljs-type">double</span> x_, y_, z_;
  <span class="hljs-type">double</span> l2_norm_;
};
std::istream &amp;<span class="hljs-keyword">operator</span>&gt;&gt;(std::istream &amp;is, Vec3 &amp;v) {
  is &gt;&gt; v.x_ &gt;&gt; v.y_ &gt;&gt; v.z_;
  <span class="hljs-keyword">if</span> (!is) <span class="hljs-comment">// 如果输入发生错误，要将对象置于有效的状态。</span>
    v.x_ = v.y_ = v.z_ = <span class="hljs-number">0</span>;
  v.l2_norm_ = std::<span class="hljs-built_in">sqrt</span>(v.x_ * v.x_ + v.y_ * v.y_ + v.z_ * v.z_);
  <span class="hljs-keyword">return</span> is;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-13">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-3-%E8%BE%93%E5%85%A5%E8%BE%93%E5%87%BA%E8%BF%90%E7%AE%97%E7%AC%A6-1">2.2. 特殊的运算符 (3): 输入、输出运算符</h4>
<p>不能直接将 <code>is</code>、<code>os</code> 替换为 <code>std::cin</code> 和 <code>std::cout</code>：除它们之外还有其它的流对象</p>
<pre><code class="language-cpp"><span class="hljs-function">std::ifstream <span class="hljs-title">file</span><span class="hljs-params">(<span class="hljs-string">&quot;infile.txt&quot;</span>)</span></span>;
<span class="hljs-type">int</span> x, y, z;
file &gt;&gt; x &gt;&gt; y &gt;&gt; z;
</code></pre>
<p>由于 <code>std::ifstream</code> 继承自 <code>std::istream</code>，它可以被 <code>std::istream &amp;</code> 绑定</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-14">2. 重载运算符 (Operator overloading)</h2>
<h4 id="%E9%81%BF%E5%85%8D%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6%E7%9A%84%E6%BB%A5%E7%94%A8">避免重载运算符的滥用</h4>
<p>函数的名称可以透露很多信息，而运算符不行：</p>
<ul>
<li><code>a * b</code> 和 <code>dot_product(a, b)</code></li>
<li><code>a &lt; b</code> 和 <code>compare_by_id(a, b)</code></li>
<li><code>a + b</code> 和 <code>concat(a, b)</code></li>
</ul>
<p>避免滥用重载运算符：除非这个运算符有唯一明确合理的定义，否则不要定义它。</p>
<ul>
<li>为什么 <code>std::string</code> 可以用 <code>+</code> 连接，而 <code>std::vector</code> 不行？</li>
<li>MATLAB 的 <code>a * b</code> 和 <code>a .* b</code> 的区别</li>
</ul>
<p><code>operator+</code> 应该加而不是减，<code>operator&lt;</code> 应该是“小于”而非“大于”。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-15">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-4-%E5%87%BD%E6%95%B0%E8%B0%83%E7%94%A8%E8%BF%90%E7%AE%97%E7%AC%A6-operator">2.2. 特殊的运算符 (4): 函数调用运算符 <code>operator()</code></h4>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">Adder</span> {
  <span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">operator</span><span class="hljs-params">()</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b)</span> <span class="hljs-type">const</span> </span>{
    <span class="hljs-keyword">return</span> a + b;
  }
};
std::cout &lt;&lt; Adder{}(<span class="hljs-number">2</span>, <span class="hljs-number">3</span>) &lt;&lt; std::endl; <span class="hljs-comment">// 5</span>
</code></pre>
<ul>
<li><code>Adder{}</code> 创建了一个 <code>Adder</code> 类型的对象。（也可以写作 <code>Adder()</code>）</li>
<li><code>Adder{}(2, 3)</code> 相当于 <code>Adder{}.operator()(2, 3)</code></li>
</ul>
<p>一般地，<code>f(arg1, arg2, ...)</code> 被视为 <code>f.operator()(arg1, arg2, ...)</code>。</p>
<p><strong>* 分清这里的各个括号的含义！</strong> 要理解每个括号所发挥的功能，不要瞎猜。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-16">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-5-%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E8%BF%90%E7%AE%97%E7%AC%A6">2.2. 特殊的运算符 (5): 类型转换运算符</h4>
<p>除了接受单个参数的构造函数，我们还有另一种方式自定义类型转换：</p>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">Rational</span> {
  <span class="hljs-type">int</span> n, d;
  <span class="hljs-function"><span class="hljs-keyword">operator</span> <span class="hljs-title">double</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{ <span class="hljs-comment">// 定义了从 Rational 到 double 的类型转换</span>
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">double</span>&gt;(n) / d;
  }
};

Rational r{<span class="hljs-number">3</span>, <span class="hljs-number">2</span>};
<span class="hljs-type">double</span> d = r; <span class="hljs-comment">// 1.5</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-17">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-5-%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E8%BF%90%E7%AE%97%E7%AC%A6-1">2.2. 特殊的运算符 (5): 类型转换运算符</h4>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">Rational</span> {
  <span class="hljs-type">int</span> n, d;
  <span class="hljs-function"><span class="hljs-keyword">operator</span> <span class="hljs-title">double</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">double</span>&gt;(n) / d;
  }
};
Rational r{<span class="hljs-number">3</span>, <span class="hljs-number">2</span>};
<span class="hljs-type">double</span> d = r; <span class="hljs-comment">// 1.5</span>
</code></pre>
<ul>
<li>函数名是 <code>operator Type</code></li>
<li>不接受参数，不写返回值类型（因为返回值类型就是 <code>Type</code>）</li>
<li>通常是 <code>const</code>：类型转换一般不应改变这个对象本身。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-18">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-5-%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E8%BF%90%E7%AE%97%E7%AC%A6-2">2.2. 特殊的运算符 (5): 类型转换运算符</h4>
<p><code>std::istream</code> 对象可以放在条件部分，来判断这个输入流正不正常：</p>
<pre><code class="language-cpp">std::cin &gt;&gt; a &gt;&gt; b;
<span class="hljs-keyword">if</span> (!std::cin)
  <span class="hljs-built_in">handle_input_failure</span>();                                                                                
</code></pre>
<p>所以标准库定义了 <code>std::istream</code> 向 <code>bool</code> 的类型转换，对吗？</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">istream</span> {
  <span class="hljs-type">bool</span> fail, bad;
<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-keyword">operator</span> <span class="hljs-title">bool</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{
    <span class="hljs-keyword">return</span> !fail &amp;&amp; !bad;                                                                                          
  }
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-19">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-5-%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E8%BF%90%E7%AE%97%E7%AC%A6-3">2.2. 特殊的运算符 (5): 类型转换运算符</h4>
<p>标准库定义了 <code>std::istream</code> 向 <code>bool</code> 的类型转换，对吗？</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">istream</span> {
  <span class="hljs-type">bool</span> fail, bad;
<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-keyword">operator</span> <span class="hljs-title">bool</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{ <span class="hljs-keyword">return</span> !fail &amp;&amp; !bad; }
};
istream cin;
</code></pre>
<p>下面的代码居然也乐呵呵地编译了！为什么？</p>
<pre><code class="language-cpp"><span class="hljs-type">int</span> ival;
cin &lt;&lt; ival; <span class="hljs-comment">// 写反了！</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-20">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-5-%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E8%BF%90%E7%AE%97%E7%AC%A6-4">2.2. 特殊的运算符 (5): 类型转换运算符</h4>
<p>标准库定义了 <code>std::istream</code> 向 <code>bool</code> 的类型转换，对吗？</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">istream</span> {
  <span class="hljs-type">bool</span> fail, bad;
<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-keyword">operator</span> <span class="hljs-title">bool</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{ <span class="hljs-keyword">return</span> !fail &amp;&amp; !bad; }
};
istream cin;
</code></pre>
<p>下面的代码居然也乐呵呵地编译了！为什么？</p>
<pre><code class="language-cpp"><span class="hljs-type">int</span> ival;
cin &lt;&lt; ival; <span class="hljs-comment">// cin 隐式转换成 bool 类型，又提升成 int：这个 &lt;&lt; 其实是作用于两个 int 的移位运算符！</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-21">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-5-%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E8%BF%90%E7%AE%97%E7%AC%A6-5">2.2. 特殊的运算符 (5): 类型转换运算符</h4>
<p>为了避免 <code>std::cin &lt;&lt; ival</code> 通过编译，在 C++11 以前标准库定义的是向 <code>void *</code> 的类型转换：在输入流正常的时候返回一个非空指针，不正常的时候返回空指针。</p>
<p>(since C++11): <code>explicit</code> 类型转换运算符</p>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">Rational</span> {
  <span class="hljs-type">int</span> n, d;
  <span class="hljs-function"><span class="hljs-keyword">explicit</span> <span class="hljs-keyword">operator</span> <span class="hljs-title">double</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">double</span>&gt;(n) / d;
  }
};
Rational r{<span class="hljs-number">3</span>, <span class="hljs-number">2</span>};
<span class="hljs-type">double</span> d = r; <span class="hljs-comment">// 错误：隐式转换</span>
<span class="hljs-type">double</span> d2 = <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">double</span>&gt;(r); <span class="hljs-comment">// 正确</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-22">2. 重载运算符 (Operator overloading)</h2>
<h4 id="22-%E7%89%B9%E6%AE%8A%E7%9A%84%E8%BF%90%E7%AE%97%E7%AC%A6-5-%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E8%BF%90%E7%AE%97%E7%AC%A6-6">2.2. 特殊的运算符 (5): 类型转换运算符</h4>
<p>为了避免 <code>std::cin &lt;&lt; ival</code> 通过编译，在 C++11 以前标准库定义的是向 <code>void *</code> 的类型转换：在输入流正常的时候返回一个非空指针，不正常的时候返回空指针。</p>
<p>(since C++11): <code>explicit</code> 类型转换运算符</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">istream</span> {
  <span class="hljs-type">bool</span> fail, bad;
<span class="hljs-keyword">public</span>:
  <span class="hljs-function"><span class="hljs-keyword">explicit</span> <span class="hljs-keyword">operator</span> <span class="hljs-title">bool</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{ <span class="hljs-keyword">return</span> !fail &amp;&amp; !bad; }
};
istream cin;
</code></pre>
<p>从 <code>istream</code> 向 <code>bool</code> 的类型转换必须显式发生。</p>
<p>那 <code>if (cin)</code> 还能用吗？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-23">2. 重载运算符 (Operator overloading)</h2>
<h4 id="contextual-conversions%E4%B8%8A%E4%B8%8B%E6%96%87%E8%BD%AC%E6%8D%A2">Contextual conversions（上下文转换）</h4>
<p>下列情况中，<code>e</code> 向 <code>bool</code> 的类型转换允许使用 explicit 类型转换运算符：</p>
<ul>
<li><code>if (e)</code>, <code>while (e)</code>, <code>for (xxx; e; xxx)</code></li>
<li><code>!e</code>, <code>e &amp;&amp; e</code>, <code>e || e</code>, <code>e ? a : b</code></li>
<li>（你们没学过的）<code>static_assert(e)</code>, <code>noexcept(e)</code>, <code>explicit(e)</code> (since C++20)</li>
</ul>
<p>因此 <code>if (cin)</code> 也就没问题了。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-24">2. 重载运算符 (Operator overloading)</h2>
<h2 id="23-%E9%81%BF%E5%85%8D%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E8%BF%90%E7%AE%97%E7%AC%A6%E7%9A%84%E6%BB%A5%E7%94%A8">2.3. 避免类型转换运算符的滥用</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">Rational</span> {
  <span class="hljs-type">int</span> n, d;
  <span class="hljs-function"><span class="hljs-keyword">operator</span> <span class="hljs-title">double</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">double</span>&gt;(n) / d;
  }
  <span class="hljs-function"><span class="hljs-keyword">operator</span> <span class="hljs-title">std::string</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{
    <span class="hljs-keyword">return</span> std::<span class="hljs-built_in">to_string</span>(n) + <span class="hljs-string">&#x27;/&#x27;</span> + std::<span class="hljs-built_in">to_string</span>(d);
  }
};

Rational r{<span class="hljs-number">3</span>, <span class="hljs-number">2</span>};
std::cout &lt;&lt; r &lt;&lt; std::endl; <span class="hljs-comment">// 1.5 还是 3/2 ？</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-25">2. 重载运算符 (Operator overloading)</h2>
<h2 id="23-%E9%81%BF%E5%85%8D%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E8%BF%90%E7%AE%97%E7%AC%A6%E7%9A%84%E6%BB%A5%E7%94%A8-1">2.3. 避免类型转换运算符的滥用</h2>
<p>更好的设计：定义成普通的函数</p>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">Rational</span> {
  <span class="hljs-type">int</span> n, d;
  <span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">to_double</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">static_cast</span>&lt;<span class="hljs-type">double</span>&gt;(n) / d;
  }
  <span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">to_string</span><span class="hljs-params">()</span> <span class="hljs-type">const</span> </span>{
    <span class="hljs-keyword">return</span> std::<span class="hljs-built_in">to_string</span>(n) + <span class="hljs-string">&#x27;/&#x27;</span> + std::<span class="hljs-built_in">to_string</span>(d);
  }
};
</code></pre>
<p>一般来说，只为某些特殊的行为定义类型转换，尤其是不要轻易定义向内置类型的类型转换！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-26">2. 重载运算符 (Operator overloading)</h2>
<h2 id="24-%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E5%BC%95%E5%8F%91%E7%9A%84%E4%BA%8C%E4%B9%89%E6%80%A7">2.4. 类型转换引发的二义性</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">A</span> {
  <span class="hljs-built_in">A</span>(<span class="hljs-type">const</span> B &amp;);
};
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">B</span> {
  <span class="hljs-function"><span class="hljs-keyword">operator</span> <span class="hljs-title">A</span><span class="hljs-params">()</span> <span class="hljs-type">const</span></span>;
};

B b{};
A a = b; <span class="hljs-comment">// 到底是调用了 `A::A(const B &amp;)` 还是 `B::operator A() const`？</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header=" *CS100* *Tutorial 11* *Fall 2025*" data-theme="hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--header: *CS100* *Tutorial 11* *Fall 2025*;--theme:hgooytb7d8ofc65u43c81raz88zpoocvda2ml53a99sq;" data-marpit-pagination-total="46" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 11</em> <em>Fall 2025</em></header>
<h2 id="2-%E9%87%8D%E8%BD%BD%E8%BF%90%E7%AE%97%E7%AC%A6-operator-overloading-27">2. 重载运算符 (Operator overloading)</h2>
<h2 id="24-%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E5%BC%95%E5%8F%91%E7%9A%84%E4%BA%8C%E4%B9%89%E6%80%A7-1">2.4. 类型转换引发的二义性</h2>
<p>当类型转换遇上重载决议，情况就彻底乱套了...</p>
<pre><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">Rational</span> {
  <span class="hljs-function"><span class="hljs-keyword">operator</span> <span class="hljs-title">double</span><span class="hljs-params">()</span> <span class="hljs-type">const</span></span>;
};
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">X</span> {
  <span class="hljs-built_in">X</span>(<span class="hljs-type">const</span> Rational &amp;);
};
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">foo</span><span class="hljs-params">(<span class="hljs-type">int</span>)</span></span>;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">foo</span><span class="hljs-params">(X)</span></span>;
Rational r{<span class="hljs-number">3</span>, <span class="hljs-number">2</span>};
<span class="hljs-built_in">foo</span>(r); <span class="hljs-comment">// 到底是先转成 double 然后转成 int 匹配 foo(int)，还是直接转成 X 匹配 foo(X)？</span>
</code></pre>
<p><strong>避免这样的情况发生！</strong> 不要滥用类型转换运算符。</p>
</section>
