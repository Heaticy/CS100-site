<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="11-pointer-types-1">1.1. Pointer Types</h2>
<h4 id="111-basics">1.1.1. Basics</h4>
<p>为什么我们需要指针？</p>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">int</span> n = <span class="hljs-number">42</span>;
    <span class="hljs-type">int</span>* p = &amp;n; <span class="hljs-comment">// p 是一个指针，指向 n 的地址</span>
    *p = <span class="hljs-number">100</span>; <span class="hljs-comment">// 通过指针 p 修改 n 的值</span>
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h3 id="%E5%87%BD%E6%95%B0%E5%8F%82%E6%95%B0%E5%BD%A2%E5%BC%8F%E5%8F%82%E6%95%B0">函数参数：形式参数</h3>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">eat</span><span class="hljs-params">(<span class="hljs-type">int</span> hungry_state)</span> {
    hungry_state = <span class="hljs-number">0</span>; <span class="hljs-comment">// 修改的是形参 hungry_state 的副本，而不是实参 hungry_state 的值</span>
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">int</span> hungry_state = <span class="hljs-number">1</span>;
    eat(hungry_state);<span class="hljs-comment">// 没有任何作用</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h3 id="%E5%87%BD%E6%95%B0%E5%8F%82%E6%95%B0%E6%8C%87%E9%92%88%E5%8F%82%E6%95%B0">函数参数：指针参数</h3>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">eat</span><span class="hljs-params">(<span class="hljs-type">int</span>* hungry_state)</span> {
    *hungry_state = <span class="hljs-number">0</span>; <span class="hljs-comment">// 修改实参的值</span>
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">int</span> hungry_state = <span class="hljs-number">1</span>;
    eat(&amp;hungry_state);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="11-pointer-types-2">1.1. Pointer Types</h2>
<h3 id="111-basics-1">1.1.1. Basics</h3>
<ul>
<li>
<p>指针的类型是 <code>PointeeType *</code>。</p>
</li>
<li>
<p>对于两个不同的类型 <code>T1</code> 和 <code>T2</code>，指针类型 <code>T1 *</code> 和 <code>T2 *</code> 是<strong>不同的类型</strong>，尽管它们可能指向同一个内存地址。</p>
<pre><code class="language-c"><span class="hljs-type">int</span> i = <span class="hljs-number">42</span>;
<span class="hljs-type">float</span> *fp = &amp;i;
++*fp; <span class="hljs-comment">// 未定义行为。这并非对 i 进行自增操作。</span>
</code></pre>
</li>
<li>
<p>在 C 语言中，不同类型的指针可以（可能会产生警告）相互隐式转换。这是<strong>极不安全</strong>的，并且在 C++ 中属于错误。</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="11-pointer-types-3">1.1. Pointer Types</h2>
<h3 id="112-legal-pointer-type-cconversion">1.1.2. Legal Pointer Type Cconversion</h3>
<p>当试图解引用一个类型为 <code>T1 *</code> 的指针，而它实际指向的是一个 <code>T2</code> 类型的对象时，这<strong>几乎总是</strong>未定义行为，<strong>除非</strong>满足以下情况：</p>
<ol>
<li>
<p><code>T2</code> 与 <code>T1</code> 是 <strong>兼容类型(compatible type)</strong>（即足够相似的类型）。</p>
<pre><code class="language-c"><span class="hljs-type">int</span> x = <span class="hljs-number">1</span>; <span class="hljs-type">int</span> *p = &amp;x; <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, *p); 
<span class="hljs-comment">// *p 是 int 类型的左值表达式；与 int 兼容（即相同）</span>
</code></pre>
</li>
<li>
<p><code>T2</code> 是与 <code>T1</code> 兼容的类型，但带有 const、volatile 或 restrict 限定符的版本。</p>
<pre><code class="language-c"><span class="hljs-type">int</span> x = <span class="hljs-number">1</span>; <span class="hljs-type">const</span> <span class="hljs-type">int</span> *p = &amp;x; <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, *p); 
</code></pre>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="11-pointer-types-4">1.1. Pointer Types</h2>
<h2 id="112-legal-pointer-type-cconversion-1">1.1.2. Legal Pointer Type Cconversion</h2>
<ol start="3">
<li>
<p><code>T2</code> 是与 <code>T1</code> 兼容的类型的有符号或无符号版本。</p>
<pre><code class="language-c"><span class="hljs-type">int</span> x = <span class="hljs-number">1</span>; <span class="hljs-type">unsigned</span> <span class="hljs-type">int</span> *p = (<span class="hljs-type">unsigned</span> <span class="hljs-type">int</span>*)&amp;x; <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%u\n&quot;</span>, *p ); 
</code></pre>
</li>
<li>
<p><code>T2</code> 是一个字符类型（<code>char</code>、<code>signed char</code> 或 <code>unsigned char</code>）。</p>
<pre><code class="language-c"><span class="hljs-type">int</span> x = <span class="hljs-number">65</span>; <span class="hljs-type">char</span> *p = (<span class="hljs-type">char</span> *)&amp;x; <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%c\n&quot;</span>, *p);
</code></pre>
</li>
<li>
<p>等等。</p>
</li>
</ol>
<p>更多详细信息，请参阅<a href="https://en.cppreference.com/w/c/language/type#Compatible_types">兼容类型</a>。<strong>（超出范围）</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="11-pointer-types-5">1.1. Pointer Types</h2>
<h4 id="113-pointer-aliasing%E6%8C%87%E9%92%88%E5%88%AB%E5%90%8D---beyond-the-scope">1.1.3. Pointer Aliasing（指针别名） - Beyond the Scope</h4>
<p>在 C 和 C++ 中，当多个指针指向同一内存区域时，会发生<strong>别名（aliasing）</strong>。</p>
<pre><code class="language-c"><span class="hljs-type">void</span> <span class="hljs-title function_">foo</span><span class="hljs-params">(<span class="hljs-type">double</span>* a, <span class="hljs-type">double</span>* b, <span class="hljs-type">int</span> n)</span> {
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; n; i++) {
        b[i] += a[i];
    }
}
</code></pre>
<ul>
<li>如果 <code>a</code> 和 <code>b</code> 指向不同的内存块，代码是完全可并行化的，并且可以进行优化。</li>
<li>然而，如果我们以 <code>foo(a, a + 1, n - 1);</code> 的方式调用 <code>foo</code>，优化可能会出现问题。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="11-pointer-types-6">1.1. Pointer Types</h2>
<h4 id="113-strict-aliasing%E4%B8%A5%E6%A0%BC%E5%88%AB%E5%90%8D---beyond-the-scope">1.1.3. Strict Aliasing（严格别名） - Beyond the Scope</h4>
<ul>
<li>
<p>C/C++ <strong>编译器假定（compilers assume）</strong> <strong>不同类型</strong>的指针永远不会指向同一内存位置，即它们彼此不是别名。</p>
<ul>
<li>“不同类型”的具体细节在“<strong>合法指针转换（Legal Pointer Conversion）</strong>”章节中提及。</li>
<li>严格别名规则（strict aliasing rule）在优化级别 2 及更高级别默认启用。</li>
</ul>
</li>
<li>
<p><strong>简言之（In short）</strong>，即使我们<strong>从未</strong>将同一个指针传递给函数，如果函数的两个参数<strong>可能（potentially）</strong> 接受指针别名，编译器也不会执行某些优化以确保正确性。</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-class="cols-2" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" class="cols-2" data-marpit-pagination="15" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--class:cols-2;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="113-strict-aliasing%E4%B8%A5%E6%A0%BC%E5%88%AB%E5%90%8D---example">1.1.3. Strict Aliasing（严格别名） - Example</h2>
<div class = "ldiv">
<p>编译器无法将代码优化成如下所示的形式，因为 <code>ptr1</code> 和 <code>ptr2</code> 可能互为别名。</p>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">foo</span><span class="hljs-params">(<span class="hljs-type">int</span>* ptr1, <span class="hljs-type">int</span>* ptr2)</span>{ 
  *ptr1 = <span class="hljs-number">10</span>; 
  *ptr2 = <span class="hljs-number">11</span>; 
  <span class="hljs-keyword">return</span> *ptr1; 
} 
</code></pre>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">foo</span><span class="hljs-params">(<span class="hljs-type">int</span>* ptr1, <span class="hljs-type">int</span>* ptr2)</span>{ 
  *ptr1 = <span class="hljs-number">10</span>; *ptr2 = <span class="hljs-number">11</span>;
  <span class="hljs-keyword">return</span> <span class="hljs-number">10</span>;
} 
</code></pre>
</div>
<div class = "rdiv">
<p>在这种情况下，该优化是正确的。</p>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">foo</span><span class="hljs-params">(<span class="hljs-type">int</span>* ptr1, <span class="hljs-type">double</span>* ptr2)</span>{ 
    *ptr1 = <span class="hljs-number">10</span>; 
    *ptr2 = <span class="hljs-number">21.02</span>; 
    <span class="hljs-keyword">return</span> *ptr1; 
} 
 
</code></pre>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">foo</span><span class="hljs-params">(<span class="hljs-type">int</span>* ptr1, <span class="hljs-type">double</span>* ptr2)</span>{ 
  *ptr1 = <span class="hljs-number">10</span>; *ptr2 = <span class="hljs-number">21.02</span>; 
  <span class="hljs-keyword">return</span> <span class="hljs-number">10</span>;
} 
</code></pre>
</div>
</div>
<ul>
<li>For more information, see <a href="https://en.cppreference.com/w/c/language/object#Strict_aliasing"><code>CppReference - Strict Aliasing</code></a>.</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="11-pointer-types-7">1.1. Pointer Types</h2>
<h4 id="114-pointers-type-void">1.1.4. Pointers type: <code>void *</code></h4>
<p>指向<strong>任何类型对象</strong>的指针都可以隐式转换为 <code>void *</code>，反之亦然（vice versa）。</p>
<ul>
<li>在 C++ 中，从 <code>void *</code> 到任何其他指针类型的转换必须显式进行。</li>
</ul>
<p>混乱之处在于：</p>
<pre><code class="language-c"><span class="hljs-type">int</span> n = <span class="hljs-number">1</span>
<span class="hljs-type">int</span>* p = &amp;n;
<span class="hljs-type">void</span>* pv = p; <span class="hljs-comment">// int* to void*</span>
<span class="hljs-type">int</span>* p2 = pv; <span class="hljs-comment">// void* to int*</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="11-pointer-types-8">1.1. Pointer Types</h2>
<h4 id="114-pointers-type-void-1">1.1.4. Pointers type: <code>void *</code></h4>
<p><code>void *</code> 类型在 C 类型系统中引入了一个弱点，但在传递<strong>未知类型对象</strong>给函数时可能非常有用。以下是一些常见用例：</p>
<ul>
<li><a href="https://en.cppreference.com/w/c/memory/malloc"><code>malloc</code></a> 返回 <code>void *</code>。返回的指针应适用于任何对象类型。
<ul>
<li>此外，不应强制转换 <code>malloc</code> 的结果。参见 <a href="https://stackoverflow.com/a/605858">StackOverflow</a>。</li>
<li>使用 <code>int* p = malloc(size);</code> 而非 <code>int* p = (int *)malloc(size);</code></li>
</ul>
</li>
<li><a href="https://en.cppreference.com/w/c/algorithm/qsort"><code>qsort</code></a> 要求用户提供的回调函数接受两个 <code>const void*</code> 参数。
<ul>
<li><code>void qsort( void* ptr, size_t count, size_t size, int (*comp)(const void*, const void*));</code></li>
</ul>
</li>
<li>*<a href="http://pubs.opengroup.org/onlinepubs/9699919799/functions/pthread_create.html"><code>pthread_create</code></a> 要求用户提供的回调函数接受并返回 <code>void *</code>。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="%E4%B8%8D%E9%9C%80%E8%A6%81%E5%AF%B9malloc%E8%BF%94%E5%9B%9E%E5%80%BC%E5%BC%BA%E5%88%B6%E8%BD%AC%E6%8D%A2">不需要对malloc返回值强制转换</h2>
<p><img src="img/20251017185052.png" alt="" style="height:400px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="1-pointers-3">1. Pointers</h2>
<h4 id="12-null-pointers-and-null-pointer-values">1.2. Null Pointers and Null Pointer Values</h4>
<ul>
<li>Null pointers</li>
<li>Null pointer values</li>
<li><code>NULL</code> and  <code>nullptr</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="12-null-pointers-and-null-pointer-values-1">1.2. Null Pointers and Null Pointer Values</h2>
<h4 id="121-null-pointers">1.2.1. Null Pointers</h4>
<ul>
<li>空指针（Null Pointers）是指不指向任何对象的指针。</li>
<li>空指针与任何指向<strong>对象</strong>的指针比较时结果都不相等。</li>
<li>初始化或赋值：可通过空指针常量（值）实现。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="12-null-pointers-and-null-pointer-values-2">1.2. Null Pointers and Null Pointer Values</h2>
<h4 id="121-null-pointers-1">1.2.1. Null Pointers</h4>
<p><strong>Usage:</strong></p>
<ul>
<li>
<p>表示一个对象的缺失。</p>
</li>
<li>
<p>表示其他类型的<strong>错误条件</strong>；例如，如果分配失败，<code>malloc</code> 会返回一个空指针。</p>
<pre><code class="language-c"><span class="hljs-type">int</span>* ptr = <span class="hljs-built_in">malloc</span>(<span class="hljs-keyword">sizeof</span>(<span class="hljs-type">int</span>));
<span class="hljs-keyword">if</span> (ptr == <span class="hljs-literal">NULL</span>){ <span class="hljs-comment">// 或者 if(!ptr)</span>
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Allocation failed\n&quot;</span>);
}
<span class="hljs-built_in">free</span>(ptr);
</code></pre>
<p>通常，接收指针参数的函数几乎总是需要<strong>检查该值是否为空</strong>，并<strong>以不同的方式处理这种情况</strong>。</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="12-null-pointers-and-null-pointer-values-3">1.2. Null Pointers and Null Pointer Values</h2>
<h4 id="122-null-pointers-value">1.2.2. Null Pointers Value</h4>
<ul>
<li>空指针值（Null pointer value）是指针类型的 <strong>“零”值</strong>。</li>
<li>每种指针类型都有一个特殊值，称为<strong>该类型的空指针值</strong>。</li>
<li>两个空指针值比较时相等，这是由<a href="https://en.cppreference.com/w/c/language/operator_comparison">比较运算符</a>定义的。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="12-null-pointers-and-null-pointer-values-4">1.2. Null Pointers and Null Pointer Values</h2>
<h4 id="122-null-pointers-value-1">1.2.2. Null Pointers Value</h4>
<p><strong>空指针常量的分类：</strong></p>
<ul>
<li>
<p><a href="https://en.cppreference.com/w/c/types/NULL"><code>NULL</code></a>：该宏定义可从多个标准库头文件中获取（如 <code>&lt;stddef.h&gt;</code>, <code>&lt;stdio.h&gt;</code>, <code>&lt;stdlib.h&gt;</code>）</p>
<pre><code class="language-c"><span class="hljs-type">int</span>* ptr = <span class="hljs-literal">NULL</span>; 
</code></pre>
</li>
<li>
<p>值为零的整型常量</p>
<pre><code class="language-c"><span class="hljs-type">double</span>* ptr_1 = <span class="hljs-number">0</span>;
<span class="hljs-type">double</span>* ptr_2 = <span class="hljs-number">2</span> - <span class="hljs-number">2</span>;
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="12-null-pointers-and-null-pointer-values-5">1.2. Null Pointers and Null Pointer Values</h2>
<h4 id="123-null-and-nullptr">1.2.3. <code>NULL</code> and <code>nullptr</code></h4>
<ul>
<li>
<p>宏 <code>NULL</code> 是一个 <strong>实现定义(implementation-defined)</strong> 的空指针常量，其可能为：</p>
<ul>
<li>值为 <code>​0​</code> 的整型常量表达式（例如 <code>2 - 2</code>）</li>
<li>值为 <code>​0​</code> 且强制转换为 <code>void *</code> 类型的整型常量表达式（例如 <code>(void *)0</code> 或 0x00000000）</li>
<li>[C23 起] 预定义常量 <a href="https://en.cppreference.com/w/c/language/nullptr"><code>nullptr</code></a></li>
</ul>
</li>
<li>
<p><code>nullptr</code>：<strong>类型安全</strong></p>
<ul>
<li>属于 <code>nullptr_t</code> 类型：一种独特的类型，本身不是指针类型，仅有一个有效值 <code>nullptr</code></li>
<li>可转换为指针类型或 <strong>bool</strong> 类型：分别转换为该类型的空指针值或 <code>false</code></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="13undefined-dereferencing">1.3.Undefined Dereferencing</h2>
<p>尝试解引用一个<strong>不指向实际对象</strong>的指针会导致<strong>未定义行为</strong>，这通常被视为<strong>严重的运行时错误</strong>。可能发生这种情况的场景包括：</p>
<ul>
<li><strong>空指针</strong></li>
<li><strong>野指针（未初始化的指针）</strong>：<code>int* p;</code></li>
<li><strong>悬垂指针</strong>：指向刚刚被释放的内存的指针。
<ul>
<li>曾经指向通过 <code>malloc</code> 分配但随后已被 <code>free</code> 的内存。</li>
<li>指向已超出作用域的变量的指针，例如：<pre><code class="language-c"><span class="hljs-type">int</span>* <span class="hljs-title function_">foo</span><span class="hljs-params">(<span class="hljs-type">int</span> n)</span> { <span class="hljs-keyword">return</span> &amp;n; }
</code></pre>
</li>
</ul>
</li>
<li><strong>指向另一个无效或无意义的地址</strong>：<code>int* p = (int*)123;</code>。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="ub%E8%A1%8C%E4%B8%BA%E7%9A%84%E5%8D%B1%E5%AE%B3">UB行为的危害</h2>
<p>未定义行为（Undefined Behavior, UB）可能导致程序出现各种不可预测的后果，包括但不限于：</p>
<ul>
<li>程序崩溃（Crash）（Runtime error）</li>
<li>数据损坏</li>
<li>安全漏洞</li>
<li>不可预见的输出</li>
<li>程序挂起或进入无限循环</li>
<li>看似正常的行为，但在不同的编译器或编译选项下表现不同</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="ub%E8%A1%8C%E4%B8%BA%E7%9A%84%E5%8D%B1%E5%AE%B3-1">UB行为的危害</h2>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> x[<span class="hljs-number">4</span>] = {<span class="hljs-number">0</span>, <span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>};
  <span class="hljs-type">int</span> y[<span class="hljs-number">4</span>] = {<span class="hljs-number">0</span>, <span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>};
  x[<span class="hljs-number">4</span>] = <span class="hljs-number">10</span>; <span class="hljs-comment">// Undefined behavior: 改了非法地址x[4]</span>
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;address of x:%x\n&quot;</span>, (<span class="hljs-type">unsigned</span> <span class="hljs-type">int</span>)&amp;x);
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;address of x[4]:%x\n&quot;</span>, (<span class="hljs-type">unsigned</span> <span class="hljs-type">int</span>)&amp;(x[<span class="hljs-number">4</span>]));
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;address of y:%x\n&quot;</span>, (<span class="hljs-type">unsigned</span> <span class="hljs-type">int</span>)&amp;y);
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, y[<span class="hljs-number">0</span>]); <span class="hljs-comment">// 你虽然没有改y的值, 但是y[0]可能被改了</span>
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<pre><code class="language-output">address of x:1f692070
address of x[4]:1f692080
address of y:1f692080
y[0] = 10
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="%E5%A6%82%E4%BD%95%E6%A3%80%E6%B5%8Bub%E8%A1%8C%E4%B8%BA">如何检测UB行为</h2>
<ul>
<li>(Linux)使用编译器选项启用运行时检查（如 <code>-fsanitize=undefined -fsanitize=address</code>）。</li>
</ul>
<pre><code class="language-bash">gcc ub.c -o ub -fsanitize=undefined -fsanitize=address -g
</code></pre>
<p><img src="img/20251017184534.png" alt="20251017184534" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="14-subscript-operator">1.4. Subscript Operator <code>[]</code></h2>
<p><strong>语法：</strong></p>
<ul>
<li>形式1：<em>指针表达式</em> <code>[</code> <em>整数表达式</em> <code>]</code></li>
<li>形式2：<em>整数表达式</em> <code>[</code> <em>指针表达式</em> <code>]</code></li>
</ul>
<p><strong>定义：</strong> 表达式 <code>E1[E2]</code> 完全等价于 <code>*((E1) + (E2))</code>。</p>
<ul>
<li>若任一形式中的<em>指针表达式</em>为数组表达式，则会进行<strong>隐式数组到指针转换</strong>，生成指向数组首元素的指针。</li>
<li><code>arr[N]</code> 等价于数组 <code>arr</code> 的第 N 个元素，这是指针算术运算（特别是指针与整数的加法）的直接结果，符合上述定义。</li>
<li>对于定义为 <code>int a[3] = {1, 2, 3};</code> 的数组，表达式 <code>a[2] == 2[a]</code> 的计算结果为真。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="15-const-qualification">1.5. <code>const</code> Qualification</h2>
<ul>
<li>
<p><code>const</code> Semantics</p>
</li>
<li>
<p>Low-level <code>const</code>ness of Pointers &amp; Top-level <code>const</code>ness of Pointers</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="15-const-qualification-1">1.5. <code>const</code> Qualification</h2>
<h4 id="151-const-semantics%E8%AF%AD%E4%B9%89">1.5.1. <code>const</code> Semantics(语义)</h4>
<p><code>const</code> 限定符的语义仅适用于具有标识的<em>左值</em>表达式。此类表达式不可修改，尤其不可<strong>赋值</strong>。</p>
<pre><code class="language-c"><span class="hljs-type">const</span> <span class="hljs-type">int</span> n = <span class="hljs-number">1</span>; <span class="hljs-comment">// const 限定类型的对象</span>
n = <span class="hljs-number">2</span>;           <span class="hljs-comment">// 错误：n 是 const 限定类型</span>

<span class="hljs-type">int</span> x = <span class="hljs-number">2</span>;       <span class="hljs-comment">// 非限定类型的对象</span>
<span class="hljs-type">const</span> <span class="hljs-type">int</span>* p = &amp;x;
*p = <span class="hljs-number">3</span>;          <span class="hljs-comment">// 错误：左值 *p 是 const 限定类型</span>

<span class="hljs-type">int</span> <span class="hljs-type">const</span> ci;    <span class="hljs-comment">// 未初始化</span>
ci = <span class="hljs-number">5</span>;          <span class="hljs-comment">// 错误：ci 是 const 限定类型</span>
</code></pre>
<p>使用 <code>const</code> 限定类型声明的对象可能会被编译器放置在<strong>只读内存</strong>中。此外，如果一个 <code>const</code> 对象的地址在程序中从未被获取，<em>该对象可能根本不会被存储</em>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="15-const-qualification-2">1.5. <code>const</code> Qualification</h2>
<h4 id="152-low-level-and-top-level-const-ness-of-pointers">1.5.2. Low-level and Top-level <code>const</code>-ness of Pointers</h4>
<ul>
<li><strong>指向 <code>const</code> 的指针</strong>：底层 <code>const</code>（const 限定适用于被指向的对象）
<ul>
<li>
<p>指向 <code>const</code> 的指针可以指向非 <code>const</code> 对象。</p>
</li>
<li>
<p>指向非 <code>const</code> 类型的指针可以隐式转换为指向同一类型的 <code>const</code> 限定版本的指针。<strong>然而，反向转换需要显式类型转换。</strong></p>
<pre><code class="language-c"><span class="hljs-type">int</span> n = <span class="hljs-number">42</span>; <span class="hljs-type">int</span>* p = &amp;n;
<span class="hljs-type">const</span> <span class="hljs-type">int</span>* cp = p; <span class="hljs-comment">// 正确：添加限定符（int 到 const int）</span>
p = cp;            <span class="hljs-comment">// 错误：丢弃限定符（const int 到 int）</span>
p = (<span class="hljs-type">int</span> *)cp;     <span class="hljs-comment">// 正确：使用类型转换</span>
</code></pre>
<blockquote>
<p><strong>但是，使用 <code>p</code> 来修改 <code>n</code>（它所指向的对象）的值会导致未定义行为。</strong></p>
</blockquote>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="15-const-qualification-3">1.5. <code>const</code> Qualification</h2>
<h4 id="152-low-level-and-top-level-const-ness-of-pointers-1">1.5.2. Low-level and Top-level <code>const</code>-ness of Pointers</h4>
<ul>
<li><strong><code>const</code> 指针</strong>：顶层 <code>const</code>（const 限定适用于指针本身）
<ul>
<li>在这种情况下，<strong>被指向的对象是可修改的</strong>，但指针本身不可修改。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="c%E8%AF%AD%E8%A8%80%E4%B8%AD%E5%A4%9A%E7%BA%A7%E6%8C%87%E9%92%88%E7%9A%84-const-%E4%BF%AE%E9%A5%B0">C语言中多级指针的 <code>const</code> 修饰</h2>
<h3 id="%E4%BB%8E%E5%8F%B3%E5%BE%80%E5%B7%A6%E8%AF%BB%E7%9A%84%E5%8E%9F%E5%88%99">从右往左读的原则</h3>
<blockquote>
<p><strong>阅读规则</strong>：从变量名开始，向右看，再向左看。</p>
</blockquote>
<pre><code class="language-c"><span class="hljs-type">int</span>** p <span class="hljs-type">const</span>;
</code></pre>
<p>阅读顺序：</p>
<p>p 是一个 “const pointer”<br />
*p 是一个指针<br />
**p 是一个 “const pointer”，指向 int*</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h3 id="%E4%BB%8E%E5%8F%B3%E5%BE%80%E5%B7%A6%E8%AF%BB%E7%9A%84%E5%8E%9F%E5%88%99-1">从右往左读的原则</h3>
<blockquote>
<p><strong>阅读规则</strong>：从变量名开始，向右看，再向左看。</p>
</blockquote>
<pre><code class="language-c"><span class="hljs-type">int</span>* <span class="hljs-type">const</span> *p;
</code></pre>
<p>阅读顺序：</p>
<p>p 是一个指针<br />
<em>p 是一个 “const pointer”<br />
指向 int</em><br />
⇒ “pointer to const pointer to int”</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="exercise-1">Exercise 1</h2>
<p>What level of <code>const</code>-ness is specified by the following <code>const</code>-qualified pointer types?</p>
<ul>
<li><code>int** const p</code></li>
<li><code>int* const* p</code></li>
<li><code>int const** p</code></li>
<li><code>int* const* const p</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="exercise-1-1">Exercise 1</h2>
<ul>
<li><strong><code>int** const</code></strong>: A <code>const</code> pointer to a pointer to an <code>int</code>.
<ul>
<li>The pointer itself is constant and cannot change, but the <code>int</code> it points to can be modified.</li>
</ul>
</li>
<li><strong><code>int* const*</code></strong>: A pointer to a <code>const</code> pointer to an <code>int</code>.<pre><code class="language-c"><span class="hljs-type">int</span> a = <span class="hljs-number">42</span>;
<span class="hljs-type">int</span>* <span class="hljs-type">const</span> p = &amp;a; <span class="hljs-comment">// const pointer to int</span>
<span class="hljs-type">int</span>* <span class="hljs-type">const</span>* ptr = &amp;p; <span class="hljs-comment">// pointer to a const pointer</span>
</code></pre>
<ul>
<li>The <code>const</code> pointer cannot change, but the <code>int</code> it points to can.</li>
</ul>
</li>
<li><strong><code>int const**</code></strong> or <strong><code>const int**</code></strong>: A pointer to a pointer to a <code>const int</code>.
<ul>
<li>The <code>int</code> is <code>const</code> and cannot be modified, but the pointers can change.</li>
</ul>
</li>
<li><strong><code>int* const* const</code></strong>: A <code>const</code> pointer to a <code>const</code> pointer to an <code>int</code>.
<ul>
<li>Both pointers are <code>const</code> and cannot change, but the <code>int</code> can be modified.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-class="trans" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" class="trans" style="--class:trans;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-class="cols-2" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" class="cols-2" data-marpit-pagination="40" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--class:cols-2;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="2-arrays-2">2. Arrays</h2>
<div class = "ldiv">
<h4 id="21-variable-length-array-vla">2.1. Variable-Length Array (VLA)</h4>
<p>区别于常量大小的数组：</p>
<pre><code class="language-c"><span class="hljs-type">int</span> n[<span class="hljs-number">10</span>];
<span class="hljs-type">char</span> str[] = <span class="hljs-string">&quot;abc&quot;</span>;
Type arr[N]; <span class="hljs-comment">// `N` 是一个在编译时值已知的常量表达式。</span>
...
</code></pre>
</div>
<div class = "rdiv">
<p>如果数组的大小在<strong>运行时</strong>确定，则其为变长数组（VLA）：</p>
<pre><code class="language-c"><span class="hljs-type">int</span> n;
<span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d&quot;</span>, &amp;n);
<span class="hljs-type">int</span> a[n];
</code></pre>
<ul>
<li>变长数组的生命周期在其声明的作用域结束时终止。</li>
<li>每次控制流到达该声明时，都会重新计算大小表达式并重新分配数组。</li>
<li>在后续执行同一代码时，变长数组可能会<strong>以不同大小</strong>重新分配。</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="2-arrays-3">2. Arrays</h2>
<h4 id="21-variable-length-array-vla-1">2.1. Variable-Length Array (VLA)</h4>
<pre><code class="language-c"><span class="hljs-type">int</span> n;
<span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d&quot;</span>, &amp;n);
<span class="hljs-type">int</span> a[n];
</code></pre>
<ul>
<li>变长数组（VLA）是在 <strong>C99</strong> 标准中被引入 C 语言的，但自 <strong>C11</strong> 起，编译器不再被强制要求支持此特性。</li>
<li><strong>我们不推荐也不允许使用变长数组</strong>。
<ul>
<li>你应当改用 <code>malloc</code> 或 <code>calloc</code> 进行动态内存分配。</li>
</ul>
</li>
<li>在 C++14 的讨论过程中，曾考虑过引入变长数组，但最终<strong>投票否决</strong>了该提案。
<ul>
<li>更多细节可参考 <a href="https://blog.csdn.net/qq_39677783/article/details/129219624?spm=1001.2014.3001.5501">Gkxx 的 CSDN 博客</a>。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="22-array-to-pointer-conversion-1">2.2. Array to Pointer Conversion</h2>
<h4 id="221-sizeof-operator-on-arrays">2.2.1. <code>sizeof</code> Operator on Arrays</h4>
<p>必须强调的是，数组和指针是两种不同的类型，<strong>尽管存在从数组到指针的常见转换。</strong></p>
<blockquote>
<p>回顾：<code>sizeof</code> 是一个返回类型字节大小的运算符。<code>sizeof(type)</code> 的返回类型是 <code>size_t</code>，这是一种由实现定义的无符号整数类型。<br />
<strong>注意：</strong> 对于变长数组（VLA），<code>sizeof</code> 是在运行时计算的。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="22-array-to-pointer-conversion-2">2.2. Array to Pointer Conversion</h2>
<h4 id="221-sizeof-operator-on-arrays-example">2.2.1. <code>sizeof</code> Operator on Arrays: Example</h4>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>{
    <span class="hljs-type">int</span> a[] = {<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>, <span class="hljs-number">5</span>};
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Size of the array: %zu\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(a));
    <span class="hljs-comment">// 20 (5 elements * 4 bytes each)</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Size of a pointer to the array: %zu\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(&amp;a));  <span class="hljs-comment">// 8</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Size of a pointer to the first element: %zu\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(&amp;a[<span class="hljs-number">0</span>])); <span class="hljs-comment">// 8</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="22-array-to-pointer-conversion-3">2.2. Array to Pointer Conversion</h2>
<h4 id="222-decay-from-arrays-to-pointers">2.2.2. Decay From Arrays to Pointers</h4>
<p>“退化”（Decay）指的是数组隐式转换为指向其首元素的指针这一过程。</p>
<ul>
<li>类型为 <code>Type [N]</code> 的数组会退化为类型为 <code>Type *</code> 的指针。</li>
<li>表达式 <code>p = &amp;arr[0]</code> 可以简写为 <code>p = arr</code>。</li>
<li>表达式 <code>*arr</code> 等价于 <code>*(&amp;arr[0])</code> 或 <code>arr[0]</code>。</li>
</ul>
<p>这一转换由 C 语言标准定义。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="22-array-to-pointer-conversion-4">2.2. Array to Pointer Conversion</h2>
<h4 id="222-decay-from-arrays-to-pointers-1">2.2.2. Decay From Arrays to Pointers</h4>
<p>任何数组类型的左值表达式（例如，数组的标识符/名称）在用于以下情况<strong>之外</strong>的任何上下文时，都会发生此转换：</p>
<ul>
<li><strong>作为取地址运算符 <code>&amp;</code> 的操作数</strong>:
<ul>
<li>(&amp;arr = arr)但是(arr + 1 != &amp;arr + 1)</li>
</ul>
</li>
<li><strong>作为 <code>sizeof</code> 的操作数</strong>
<ul>
<li><code>sizeof(ptr) = 8</code> (在64位系统上)，但是<code>sizeof(arr) = 20</code> (假设arr有5个int元素)</li>
</ul>
</li>
<li><strong>作为用于数组初始化的字符串字面量</strong>
<ul>
<li><code>char s[] = &quot;hi&quot;;</code> 会复制字符串，而不是指针</li>
</ul>
</li>
<li>作为 <code>typeof</code> 和 <code>typeof_unqual</code> 的操作数（自 C23 起），*[超出范围]</li>
</ul>
<p>在上述这些上下文中，数组<strong>不会</strong>退化为指针。(数组和指针是不同的类型)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-class="trans" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" class="trans" style="--class:trans;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-size="16:9">

<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="31-string-io-1">3.1. String I/O</h2>
<h4 id="311-error-prone-input-scanf-gets">3.1.1. Error-Prone Input: <code>scanf</code>, <code>gets</code></h4>
<ul>
<li>
<p><a href="https://en.cppreference.com/w/c/io/fscanf"><code>scanf</code></a> / <a href="https://en.cppreference.com/w/c/io/fprintf"><code>printf</code></a>：使用 <code>&quot;%s&quot;</code></p>
<ul>
<li>使用格式说明符 <code>&quot;%s&quot;</code> 的 <code>scanf</code> 函数存在内存安全问题，因为它仅接受 <code>char *</code> 类型的指针，而未指定数组的长度。</li>
</ul>
</li>
<li>
<p><code>gets(char* str)</code>：读取字符串时不进行<strong>边界检查</strong>。</p>
<ul>
<li>
<p>该函数自 <strong>C11 起已从标准中移除</strong>。</p>
</li>
<li>
<p>具有边界检查功能的替代函数是 <code>gets_s</code>，但并非所有编译器（包括 GCC）都支持它。</p>
<blockquote>
<p><code>char* gets_s(char* str, rsize_t n);</code></p>
</blockquote>
<p><code>gets_s</code> 函数最多写入 <code>n - 1</code> 个字符，以确保有空位容纳空终止符。</p>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="2024fall-quiz1-q4-find-bugs">2024Fall quiz1 Q4: Find bugs!</h2>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;string.h&gt;</span></span>
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">char</span> buffer[<span class="hljs-number">6</span>];    <span class="hljs-comment">// (1)</span>
    <span class="hljs-type">int</span> pass = <span class="hljs-number">0</span>;    <span class="hljs-comment">// (2)</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Enter the password:\n&quot;</span>);
    <span class="hljs-keyword">if</span> (gets(buffer) != <span class="hljs-literal">NULL</span>) {    <span class="hljs-comment">// (3)</span>
        <span class="hljs-keyword">if</span> (<span class="hljs-built_in">strcmp</span>(buffer, <span class="hljs-string">&quot;CS100&quot;</span>) != <span class="hljs-number">0</span>) {    <span class="hljs-comment">// (4)</span>
            <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;!!! Wrong Password. \n&quot;</span>);
        }
        <span class="hljs-keyword">else</span> {
            <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;!!! Correct Password. \n&quot;</span>);
            pass = <span class="hljs-number">1</span>;
        }
        <span class="hljs-keyword">if</span> (pass)    <span class="hljs-comment">// (5)</span>
            <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;!!! You are the root. \n&quot;</span>); 
    }
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-class="cols-2-64" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" class="cols-2-64" data-marpit-pagination="52" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--class:cols-2-64;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="31-string-io-2">3.1. String I/O</h2>
<div class = "ldiv">
<h4 id="312-memory-safe-input-fgets">3.1.2. Memory-Safe Input: <a href="https://en.cppreference.com/w/c/io/fgets"><code>fgets</code></a></h4>
<ul>
<li><strong>Signature:</strong> (Defined in header <code>&lt;stdio.h&gt;</code>)<pre><code class="language-c"><span class="hljs-type">char</span>* <span class="hljs-title function_">fgets</span><span class="hljs-params">(<span class="hljs-type">char</span>* str, <span class="hljs-type">int</span> count, FILE* stream)</span>;
</code></pre>
</li>
<li><code>fgets</code> 比其他输入函数更具可移植性、通用性和安全性，因为它包含边界检查：
<ul>
<li>它从指定流中最多读取 <code>count - 1</code> 个字符。</li>
<li>当遇到换行符（<code>\n</code>）或文件结束符（<code>EOF</code>）时停止读取。</li>
<li>成功时返回指向 <code>str</code> 的指针；失败时返回空指针。</li>
</ul>
</li>
</ul>
</div>
<div class = "rdiv">
<p><strong>Example:</strong></p>
<pre><code class="language-c"><span class="hljs-type">char</span> str[<span class="hljs-number">100</span>];
fgets(str, <span class="hljs-keyword">sizeof</span>(str), <span class="hljs-built_in">stdin</span>);
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="31-string-io-3">3.1. String I/O</h2>
<h4 id="313-output-puts">3.1.3. Output: <code>puts</code></h4>
<p><strong>Signature:</strong> (Defined in header <code>&lt;stdio.h&gt;</code>)</p>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">puts</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">char</span>* str)</span>;
</code></pre>
<ul>
<li><code>puts</code> 函数将空终止字符串 <code>str</code> 中的每个字符写入输出流 <code>stdout</code>，并在末尾额外添加一个换行符（<code>\n</code>）。</li>
<li><code>str</code> 的终止空字符（<code>\0</code>）不会被写入输出。</li>
</ul>
<br />
<p><strong>Question：</strong><br />
为什么 <code>puts</code> 的参数声明为 <code>const</code>，而 <code>fgets</code> 的参数却不是？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="32-c-strings-library">3.2. C Strings Library</h2>
<ul>
<li>Review of In-class Implementation of <code>strlen</code></li>
<li>Implementation of <code>strcpy</code>**</li>
<li>Overview of C Strings Library</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="32-c-strings-library-1">3.2. C Strings Library</h2>
<h4 id="321-review-of-in-class-implementation-of-strlen">3.2.1. Review of In-Class Implementation of <code>strlen</code></h4>
<pre><code class="language-c"><span class="hljs-type">size_t</span> <span class="hljs-title function_">my_strlen</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">char</span>* str)</span> {
    <span class="hljs-type">size_t</span> ans = <span class="hljs-number">0</span>;
    <span class="hljs-keyword">while</span> (*str++ != <span class="hljs-string">&#x27;\0&#x27;</span>)   <span class="hljs-comment">// How about while (++str != &#x27;\0&#x27;)?</span>
        ++ans;
    <span class="hljs-keyword">return</span> ans;
}
</code></pre>
<ul>
<li><strong>运算符优先级</strong>：后缀递增运算符 <code>++</code> 的优先级高于解引用运算符 <code>*</code>。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="32-c-strings-library-2">3.2. C Strings Library</h2>
<h4 id="321-review-of-in-class-implementation-of-strlen-1">3.2.1. Review of In-Class Implementation of <code>strlen</code></h4>
<p>函数 <code>strlen(s)</code> 每次被调用时都会扫描整个字符串 <code>s</code>。</p>
<pre><code class="language-c"><span class="hljs-keyword">for</span> (<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i &lt; <span class="hljs-built_in">strlen</span>(s); ++i)
    <span class="hljs-comment">// ...</span>
</code></pre>
<p>在此循环中，条件 <code>i &lt; strlen(s)</code> 在每次迭代结束时都会被重新求值。由于 <code>strlen(s)</code> 每次被调用时都需要完整遍历整个字符串，这会导致<strong>性能非常低下</strong>，时间复杂度为 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.791ex;" xmlns="http://www.w3.org/2000/svg" width="6.521ex" height="2.713ex" role="img" focusable="false" viewBox="0 -849.5 2882.2 1199"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g><g data-mml-node="mrow" transform="translate(929.7,0)"><g data-mml-node="mo" transform="translate(0 -0.5)"><path data-c="28" d="M152 251Q152 646 388 850H416Q422 844 422 841Q422 837 403 816T357 753T302 649T255 482T236 250Q236 124 255 19T301 -147T356 -251T403 -315T422 -340Q422 -343 416 -349H388Q359 -325 332 -296T271 -213T212 -97T170 56T152 251Z"></path></g><g data-mml-node="msup" transform="translate(458,0)"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mn" transform="translate(633,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 </section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="32-c-strings-library-3">3.2. C Strings Library</h2>
<h4 id="321-review-of-in-class-implementation-of-strlen-2">3.2.1. Review of In-Class Implementation of <code>strlen</code></h4>
<p><strong>为提升性能，应将其修改为：</strong></p>
<pre><code class="language-c"><span class="hljs-keyword">for</span> (<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>, n = <span class="hljs-built_in">strlen</span>(s); i &lt; n; ++i)
    <span class="hljs-comment">// ...</span>
</code></pre>
<p>通过预先计算字符串长度并将其存储在变量 <code>n</code> 中，循环可以在线性时间 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="5.221ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2307.7 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g><g data-mml-node="mrow" transform="translate(929.7,0)"><g data-mml-node="mo"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="mi" transform="translate(389,0)"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mo" transform="translate(989,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z"></path></g></g></g></g></svg></mjx-container> 内完成执行。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="32-c-strings-library-4">3.2. C Strings Library</h2>
<h4 id="321-review-of-in-class-implementation-of-strlen-3">3.2.1. Review of In-Class Implementation of <code>strlen</code></h4>
<pre><code class="language-c"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; <span class="hljs-built_in">strlen</span>(s); ++i)
    <span class="hljs-comment">// ...</span>
</code></pre>
<p><strong>为什么编译器会对 <code>i &lt; strlen(s)</code> 发出警告？</strong></p>
<ul>
<li><code>strlen</code> 的返回类型是 <code>size_t</code>，这是一种无符号整数类型。</li>
<li>当在 <code>int</code> 和 <code>size_t</code> 之间执行操作或比较时，<code>int</code> 值会被隐式转换为 <code>size_t</code>。
<ul>
<li>因此，如果 <code>i</code> 为负数（例如 <code>-1</code>），比较 <code>-1 &lt; strlen(s)</code> 几乎肯定会被判定为 <strong><code>false</code></strong>（假）。</li>
</ul>
</li>
</ul>
<p><strong>* 应避免混合使用有符号和无符号整数。</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="32-c-strings-library-5">3.2. C Strings Library</h2>
<h4 id="322-implementation-of-strcpy">3.2.2.  Implementation of <a href="https://en.cppreference.com/w/c/string/byte/strcpy"><code>strcpy</code></a></h4>
<ul>
<li>
<p><strong>Signature:</strong> (Defined in header <code>&lt;string.h&gt;</code>)</p>
<pre><code class="language-c"><span class="hljs-type">char</span> *<span class="hljs-title function_">strcpy</span><span class="hljs-params">(<span class="hljs-type">char</span>* dest, <span class="hljs-type">const</span> <span class="hljs-type">char</span>* src)</span>;
</code></pre>
</li>
<li>
<p><strong>Behavior:</strong></p>
<ul>
<li><code>strcpy</code> 函数将以 <code>src</code> 指向的空终止字节字符串（包括空终止符 <code>\0</code>）复制到以 <code>dest</code> 指向其首元素的字符数组中。</li>
<li>在以下情况下，行为是未定义的：
<ul>
<li><code>dest</code> 数组不够大，无法容纳 <code>src</code> 的内容。</li>
<li>字符串存在重叠。</li>
<li><code>dest</code> 不是指向字符数组的指针，或 <code>src</code> 不是指向空终止字节字符串的指针。</li>
</ul>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="exercise-2-implement-your-own-strcpy-function">Exercise 2: Implement Your <strong>Own</strong> <code>strcpy</code> Function</h2>
<pre><code class="language-c"><span class="hljs-type">char</span> *<span class="hljs-title function_">strcpy</span><span class="hljs-params">(<span class="hljs-type">char</span>* dest, <span class="hljs-type">const</span> <span class="hljs-type">char</span>* src)</span>;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="exercise-2">Exercise 2</h2>
<p>Most people cannot resist the urge to use <strong>indexing</strong> and thus call <code>strlen</code> first:</p>
<pre><code class="language-c"><span class="hljs-type">char</span> *<span class="hljs-title function_">strcpy</span><span class="hljs-params">(<span class="hljs-type">char</span> *dest, <span class="hljs-type">const</span> <span class="hljs-type">char</span> *src)</span> {
  <span class="hljs-type">size_t</span> length = <span class="hljs-built_in">strlen</span>(src);
  <span class="hljs-keyword">for</span> (<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i &lt;= length; ++i)
    dest[i] = src[i];
  <span class="hljs-keyword">return</span> dest;
}
</code></pre>
<p>However, <code>strlen</code> also scans the <code>src</code> string.</p>
<ul>
<li>Why scan it twice?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="exercise-2-1">Exercise 2</h2>
<p>It is possible to scan only once: the termination condition should be <strong>when encountering <code>'\0'</code></strong>, rather than <code>i == strlen(src)</code>.</p>
<pre><code class="language-c"><span class="hljs-type">char</span> *<span class="hljs-title function_">strcpy</span><span class="hljs-params">(<span class="hljs-type">char</span> *dest, <span class="hljs-type">const</span> <span class="hljs-type">char</span> *src)</span> {
  <span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>;
  <span class="hljs-keyword">while</span> (src[i] != <span class="hljs-string">&#x27;\0&#x27;</span>) {
    dest[i] = src[i];
    ++i;
  }
  dest[i] = <span class="hljs-string">&#x27;\0&#x27;</span>;
  <span class="hljs-keyword">return</span> dest;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="exercise-2-a-more-direct-approach">Exercise 2: A More Direct Approach</h2>
<p>You can directly <strong>manipulate pointers</strong> without needing indexing.</p>
<ul>
<li>Both <code>dest</code> and <code>src</code> are local variables within your function, so you can modify them freely!</li>
</ul>
<pre><code class="language-c"><span class="hljs-type">char</span> *<span class="hljs-title function_">strcpy</span><span class="hljs-params">(<span class="hljs-type">char</span> *dest, <span class="hljs-type">const</span> <span class="hljs-type">char</span> *src)</span> {
  <span class="hljs-type">char</span> *ret = dest;
  <span class="hljs-keyword">while</span> (*src != <span class="hljs-string">&#x27;\0&#x27;</span>)
    *dest++ = *src++;
  *dest = <span class="hljs-string">&#x27;\0&#x27;</span>;
  <span class="hljs-keyword">return</span> ret;
}
</code></pre>
<pre><code class="language-c"><span class="hljs-type">char</span> a[<span class="hljs-number">100</span>], b[] = <span class="hljs-string">&quot;hello&quot;</span>;
<span class="hljs-built_in">strcpy</span>(a, b); <span class="hljs-comment">// This works fine.</span>
</code></pre>
</section>
