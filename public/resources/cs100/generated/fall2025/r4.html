<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="4-dynamic-memory-management-2">4. Dynamic Memory Management</h2>
<h4 id="41-malloc-calloc">4.1. <a href="https://en.cppreference.com/w/c/memory/malloc"><code>malloc</code></a>, <a href="https://en.cppreference.com/w/c/memory/calloc"><code>calloc</code></a></h4>
<pre><code class="language-c"><span class="hljs-type">void</span>* <span class="hljs-title function_">malloc</span><span class="hljs-params">(<span class="hljs-type">size_t</span> size)</span>;
<span class="hljs-type">void</span>* <span class="hljs-title function_">calloc</span><span class="hljs-params">(<span class="hljs-type">size_t</span> num, <span class="hljs-type">size_t</span> each_size)</span>;
</code></pre>
<ul>
<li>
<p><strong><code>malloc</code></strong>：分配 <code>size</code> 字节的<strong>未初始化内存</strong>，这意味着所分配元素的值是不确定的。</p>
</li>
<li>
<p><strong><code>calloc</code></strong>：为 <code>num</code> 个对象（每个大小为 <code>each_size</code>）分配内存，并<strong>将所有字节初始化为零</strong>。</p>
<ul>
<li>由于<strong>对齐要求</strong>，实际分配的字节数可能大于 <code>num * size</code>。</li>
<li>注意：将所有字节初始化为零<strong>并不能保证</strong>浮点值被设置为 <code>0.0</code> 或指针被设置为<strong>空指针值</strong>。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-class="cols-2" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" class="cols-2" data-marpit-pagination="68" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--class:cols-2;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="411-malloc">4.1.1. <code>malloc</code></h2>
<div class = "ldiv">
<h4 id="try-the-following-code-snippet">Try the following code snippet</h4>
<p>根据 C 标准，<code>malloc</code> 分配的内存包含<strong>不确定的值</strong>，但在实践中，这些值通常表现为零。这仅仅是巧合吗？</p>
<p><strong>一般来说不是！</strong></p>
<ul>
<li>分配的内存可能是<strong>回收</strong>自先前释放的内存，或是操作系统直接提供的。</li>
<li>出于安全原因，操作系统通常会返回<strong>清零后的内存</strong>，以避免泄露其他进程的数据。</li>
</ul>
<p>更多详细信息，您可以查看 <a href="https://stackoverflow.com/a/8029624">StackOverflow 上的这个回答</a>。</p>
</div>
<div class = "rdiv">
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdlib.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">()</span> {
    <span class="hljs-type">int</span> n = <span class="hljs-number">5</span>;
    <span class="hljs-type">int</span> *arr = <span class="hljs-built_in">malloc</span>(n * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">int</span>));
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Array values:\n&quot;</span>);
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; n; i++) {
        <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d &quot;</span>, arr[i]);
    }
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;\n&quot;</span>);
    <span class="hljs-built_in">free</span>(arr);
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="69" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="42-realloc-reallocates-a-specified-area-of-memory">4.2. <a href="https://en.cppreference.com/w/c/memory/realloc"><code>realloc</code></a>: reallocates a specified area of memory</h2>
<pre><code class="language-c"><span class="hljs-type">void</span>* <span class="hljs-title function_">realloc</span><span class="hljs-params">(<span class="hljs-type">void</span>* ptr, <span class="hljs-type">size_t</span> new_size)</span>;
</code></pre>
<p>参数 <code>ptr</code> 可以是 <code>NULL</code>，也可以是由 <code>malloc</code>、<code>calloc</code> 或 <code>realloc</code> 先前分配且<strong>尚未通过调用 <code>free</code> 或 <code>realloc</code> 释放</strong>的指针。</p>
<ul>
<li>如果 <code>ptr</code> 为 <code>NULL</code>，则行为等同于 <code>malloc(new_size)</code>。</li>
<li>如果 <code>ptr</code> 不为 <code>NULL</code>，则通过以下方式执行分配：
<ul>
<li>扩展或收缩 <code>ptr</code> 指向的现有内存区域，或</li>
<li>分配一个大小为 <code>new_size</code> 字节的新内存块，复制新旧大小中较小者所对应的内存内容，并释放旧内存块。</li>
</ul>
</li>
</ul>
<p><strong>如果可用内存不足，旧内存块不会被释放，并返回空指针。</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="70" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="42-malloc-calloc-and-realloc">4.2. <code>malloc</code>, <code>calloc</code>, and <code>realloc</code></h2>
<ul>
<li>
<p>为避免内存泄漏，这些函数返回的任何指针都必须使用 <code>free</code>（或 <code>realloc</code>）进行释放。需要注意的是，原始指针 <code>ptr</code> 在重新分配后即失效，后续对其的任何访问都会导致未定义行为——即使重新分配是原地进行的。</p>
</li>
<li>
<p><code>malloc(0)</code>、<code>calloc(0, N)</code>、<code>calloc(N, 0)</code> 和 <code>realloc(ptr, 0)</code> 的行为是<strong>由实现定义的</strong>。</p>
<ul>
<li>这些函数可能不分配内存并返回空指针。</li>
<li>或者，它们可能分配一定量的内存并返回指向其起始地址的指针。
<ul>
<li>但解引用此类指针会导致未定义行为。</li>
<li>这部分分配的内存<strong>仍必须被释放</strong>，以避免内存泄漏。</li>
</ul>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="71" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="4-dynamic-memory-management-3">4. Dynamic Memory Management</h2>
<h4 id="43-free-void-freevoid-ptr">4.3. <a href="https://en.cppreference.com/w/c/memory/free"><code>free</code></a>: <code>void free(void* ptr)</code></h4>
<p><strong>正确操作：</strong></p>
<ul>
<li>释放空指针：无需检查 <code>ptr != NULL</code>。</li>
</ul>
<p><strong>未定义行为：</strong></p>
<ul>
<li>在指针已被 <code>free</code> 释放后，继续使用或再次释放该悬垂指针。</li>
<li>释放的地址不是由 <code>malloc</code>、<code>calloc</code>、<code>realloc</code> 或 C11 的 <a href="https://en.cppreference.com/w/c/memory/aligned_alloc"><code>aligned_alloc</code></a> 返回的指针。
<ul>
<li>指针必须指向已分配内存块的<strong>起始位置</strong>，而非中间地址。</li>
</ul>
</li>
</ul>
<p><strong>提醒：</strong><br />
忘记调用 <code>free</code> 会导致内存泄漏，这可能使您无法通过在线评测平台（OJ）的测试。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="72" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="73" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="example-1-creating-a-dynamic-2-dimensional-array">Example 1: Creating a Dynamic 2-Dimensional Array</h2>
<p><img src="img/malloc2d.png" alt="#c" style="width:500px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-class="cols-2" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" class="cols-2" data-marpit-pagination="74" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--class:cols-2;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="example-1-creating-a-dynamic-2-dimensional-array-1">Example 1: Creating a Dynamic 2-Dimensional Array</h2>
<div class = "ldiv">
<h4 id="method-1-create-an-real-2d-array">Method 1: Create an real 2D Array</h4>
<pre><code class="language-c"><span class="hljs-type">int</span> **p = <span class="hljs-built_in">malloc</span>(<span class="hljs-keyword">sizeof</span>(<span class="hljs-type">int</span> *) * n);
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != n; ++i)
  p[i] = <span class="hljs-built_in">malloc</span>(<span class="hljs-keyword">sizeof</span>(<span class="hljs-type">int</span>) * m);
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != n; ++i)
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> j = <span class="hljs-number">0</span>; j != m; ++j)
    p[i][j] = <span class="hljs-comment">/* ... */</span>
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != n; ++i)
  <span class="hljs-built_in">free</span>(p[i]);
<span class="hljs-built_in">free</span>(p);
</code></pre>
</div>
<div class = "rdiv">
<h4 id="method-2-create-an-1d-array">Method 2: Create an 1D array</h4>
<pre><code class="language-c"><span class="hljs-type">int</span> *p = <span class="hljs-built_in">malloc</span>(<span class="hljs-keyword">sizeof</span>(<span class="hljs-type">int</span>) * n * m);
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i != n; ++i)
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> j = <span class="hljs-number">0</span>; j != m; ++j)
    p[i * m + j] = <span class="hljs-comment">/* ... */</span>
<span class="hljs-comment">// ...</span>
<span class="hljs-built_in">free</span>(p);
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="75" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="example-2-reading-a-string-of-unknown-length">Example 2: Reading a String of Unknown Length</h2>
<p>假设我们需要读取一个未知长度的非空白字符序列。在这种情况下，我们可以使用 <code>malloc</code> 动态分配内存，并根据需要使用 <code>realloc</code> 调整其大小。具体步骤包括：</p>
<ul>
<li>动态分配内存以存储字符串</li>
<li>如果缓冲区已满，则重新分配一个更大的缓冲区，并将现有数据复制到新缓冲区中</li>
<li>完成后释放已分配的内存，避免内存泄漏</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-class="cols-2" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" class="cols-2" data-marpit-pagination="76" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--class:cols-2;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="example-2-reading-a-string-of-unknown-length-1">Example 2: Reading a String of Unknown Length</h2>
<div class = "ldiv">
<pre><code class="language-c"><span class="hljs-comment">// Snippet 1</span>
<span class="hljs-type">char</span> *<span class="hljs-title function_">read_string</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-comment">// ignore leading whitespaces</span>
  <span class="hljs-type">char</span> c = getchar();
  <span class="hljs-keyword">while</span> (<span class="hljs-built_in">isspace</span>(c))
    c = getchar();

  <span class="hljs-type">char</span> *buffer = <span class="hljs-built_in">malloc</span>(INITIAL_SIZE);
  <span class="hljs-type">int</span> capacity = INITIAL_SIZE;
  <span class="hljs-type">int</span> cur_pos = <span class="hljs-number">0</span>;
</code></pre>
</div>
<div class = "rdiv">
<pre><code class="language-c"><span class="hljs-comment">// Snippet 2</span>
<span class="hljs-keyword">while</span> (!<span class="hljs-built_in">isspace</span>(c)) {
  <span class="hljs-keyword">if</span> (cur_pos == capacity - <span class="hljs-number">1</span>) {
    <span class="hljs-type">char</span> *new_buffer = <span class="hljs-built_in">malloc</span>(capacity * <span class="hljs-number">2</span>);

    <span class="hljs-comment">// copy everything what we have stored </span>
    <span class="hljs-comment">// to the new buffer</span>
    <span class="hljs-built_in">memcpy</span>(new_buffer, buffer, cur_pos);

    <span class="hljs-comment">// Don&#x27;t forget to free.</span>
    <span class="hljs-built_in">free</span>(buffer);

    capacity *= <span class="hljs-number">2</span>;

<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="example-2-reading-a-string-of-unknown-length-2">Example 2: Reading a String of Unknown Length</h2>
<h4 id="memcpy"><a href="https://en.cppreference.com/w/c/string/byte/memcpy"><code>memcpy</code></a></h4>
<p>Defined in header <code>&lt;string.h&gt;</code>:</p>
<pre><code class="language-c"><span class="hljs-type">void</span>* <span class="hljs-title function_">memcpy</span><span class="hljs-params">(<span class="hljs-type">void</span>* dest, <span class="hljs-type">const</span> <span class="hljs-type">void</span>* src, <span class="hljs-type">size_t</span> count)</span>; 
</code></pre>
<ul>
<li><strong>功能</strong>：将 <code>count</code> 个<strong>字符</strong>从 <code>src</code> 指向的内存位置复制到 <code>dest</code> 指向的内存位置。返回 <code>dest</code>。</li>
<li><strong>未定义行为</strong>：
<ul>
<li>如果 <code>dest</code> 没有足够的空间容纳 <code>count</code> 个字符</li>
<li>如果 <code>src</code>， 和 <code>dest</code> 的内存区域<strong>重叠</strong></li>
<li>如果 <code>src</code> 或 <code>dest</code> 是无效指针或空指针</li>
</ul>
</li>
<li><strong><code>memcpy</code> 比 <code>strcpy</code> 更快</strong>，因为 <code>strcpy</code> 遇到 <code>\0</code> 会停止复制，而 <code>memcpy</code> 会<strong>不检查数据内容</strong>地精确复制指定数量的字节</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" data-marpit-pagination="79" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
<header> <em>CS100</em> <em>Tutorial 4</em> <em>Fall 2025</em></header>
<h2 id="example-2-reading-a-string-of-unknown-length-3">Example 2: Reading a String of Unknown Length</h2>
<h4 id="ungetc"><a href="https://en.cppreference.com/w/c/io/ungetc"><code>ungetc</code></a></h4>
<pre><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">ungetc</span><span class="hljs-params">(<span class="hljs-type">int</span> ch, FILE* stream)</span>;   <span class="hljs-comment">// defined in header &lt;stdio.h&gt;</span>
</code></pre>
<ul>
<li><code>ungetc</code> 将字符 <code>ch</code> 推回输入流 <code>stream</code> 的缓冲区中。下一次从该流读取操作将会获取到这个被推回的字符。
<ul>
<li><strong>注意</strong>：此操作不会修改与流关联的外部设备。</li>
</ul>
</li>
<li><strong>缓冲区限制</strong>：
<ul>
<li>仅保证一个字符的推回（缓冲区大小为 1）。如果在读取或重新定位操作之前多次调用 <code>ungetc</code>，其行为是<strong>由实现定义的</strong>（implementation-defined），并且可能会失败。</li>
<li>如果进行了多次成功的 <code>ungetc</code> 调用，被推回的字符将以<strong>逆序</strong>被读取。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-header=" *CS100* *Tutorial 4* *Fall 2025*" data-class="lastpage" data-theme="1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh" lang="en-US" class="lastpage" data-marpit-pagination="80" style="--paginate:true;--header: *CS100* *Tutorial 4* *Fall 2025*;--class:lastpage;--theme:1kqnopqi3on3iaver1rx0a0kwd60ykhzxex5apgx4y7xh;" data-marpit-pagination-total="80" data-size="16:9">
