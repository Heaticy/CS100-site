<h2 id="%E6%A8%A1%E6%9D%BF">模板</h2>
<p>有模板函数、类模板、变量模板、别名模板。</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-function"><span class="hljs-type">const</span> T &amp;<span class="hljs-title">max</span><span class="hljs-params">(<span class="hljs-type">const</span> T &amp;a, <span class="hljs-type">const</span> T &amp;b)</span> </span>{
  <span class="hljs-keyword">return</span> a &lt; b ? b : a;
}

<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt; <span class="hljs-keyword">class</span> <span class="hljs-title class_">vector</span> { <span class="hljs-comment">/* ... */</span> };

<h2 id="%E6%A8%A1%E6%9D%BF%E4%B8%8D%E6%98%AF--%E8%80%8C%E6%98%AF">模板不是 ... ，而是 ...</h2>
<p>模板函数不是真正的函数，它只是提供给编译器的一份指导方案，编译器将根据该“方案”根据需要合成真正的函数。</p>
<p>当编译器看到一个模板函数时：</p>
<ul>
<li>它会对这个函数做基本的语法检查，缺少分号、自己发明运算符等错误会被发现。</li>
<li>它会对这个函数中<strong>与模板参数无关</strong>的部分做一些细致的语法、语义分析。</li>
<li>除此之外，什么都不做，也不会生成任何的代码。</li>
</ul>
<p>当这个模板函数被<strong>实例化</strong>时（伴随着相应的模板参数被提供）：</p>
<ul>
<li>编译器将模板实参代入模板函数中，得到一个真正的函数。</li>
<li>编译器对这个真正的函数做彻底的检查和分析，并生成相应的代码。</li>
</ul>
<p><a href="https://godbolt.org/z/b7TP5v8ca">https://godbolt.org/z/b7TP5v8ca</a></p>
</section>

<h2 id="%E6%A8%A1%E6%9D%BF%E4%B8%8D%E6%98%AF--%E8%80%8C%E6%98%AF-1">模板不是 ... ，而是 ...</h2>
<p>模板函数不是真正的函数，它只是提供给编译器的一份指导方案，编译器将根据该“方案”根据需要合成真正的函数。</p>
<p>类模板、变量模板、别名模板也是类似。</p>
<p>对于类模板，未被用到的成员函数也不会被实例化，哪怕这个类被实例化了。</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt; <span class="hljs-keyword">struct</span> <span class="hljs-title class_">A</span> {
  T x;
  <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">foo</span><span class="hljs-params">()</span> </span>{ ++x; } <span class="hljs-comment">// 不是什么类型都支持 ++ 的</span>
};
A&lt;std::string&gt; a; <span class="hljs-comment">// T = std::string 显然不支持 ++ ，</span>
                  <span class="hljs-comment">// 但是没关系，我们并未调用 a.foo()</span>
</code></pre>
</section>

<h2 id="%E6%A8%A1%E6%9D%BF%E5%AE%9E%E4%BE%8B%E5%8C%96-instantiation">模板实例化 (instantiation)</h2>
<p>比较常见的是<strong>隐式实例化</strong>：当某个实例被需要时，它会被自动实例化出来。</p>
<ul>
<li>比如，模板函数的某个实例被调用时，创建了类模板的某个实例的对象时。</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt; <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">f</span><span class="hljs-params">(T x)</span></span>;
<span class="hljs-built_in">f</span>(<span class="hljs-number">0</span>); <span class="hljs-comment">// 隐式实例化 f&lt;int&gt;(int)</span>
</code></pre>
<p>也可以<strong>显式实例化</strong>：可能是我预判到这个实例将被用到，所以先要求编译器把它实例化出来。</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> <span class="hljs-type">void</span> <span class="hljs-built_in">f</span>&lt;<span class="hljs-type">double</span>&gt;(<span class="hljs-type">double</span>); <span class="hljs-comment">// 显式实例化 f&lt;double&gt;(double)</span>
<span class="hljs-keyword">template</span> <span class="hljs-type">void</span> f&lt;&gt;(<span class="hljs-type">char</span>);         <span class="hljs-comment">// 显式实例化 f&lt;char&gt;(char) ，模板参数被推断</span>
<span class="hljs-function"><span class="hljs-keyword">template</span> <span class="hljs-type">void</span> <span class="hljs-title">f</span><span class="hljs-params">(<span class="hljs-type">int</span>)</span></span>;            <span class="hljs-comment">// 显式实例化 f&lt;int&gt;(int) ，模板参数被推断</span>
</code></pre>
</section>

" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--style:section::after {

<h2 id="%E6%A8%A1%E6%9D%BF%E6%98%AF%E7%BC%96%E8%AF%91%E6%97%B6%E7%9A%84%E6%B8%B8%E6%88%8F">模板是编译时的游戏</h2>
<p>模板实例化完全发生在<strong>编译时</strong>。左边这个 C++ 函数与右边的 Python （动态类型）函数有<strong>根本的区别</strong>。</p>
<div style="display: grid; grid-template-columns: 1fr 1fr;">
  <div>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-function">T <span class="hljs-title">add</span><span class="hljs-params">(T a, T b)</span> </span>{
  <span class="hljs-keyword">return</span> a + b;
}
</code></pre>
  </div>
  <div>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">add</span>(<span class="hljs-params">a, b</span>):
  <span class="hljs-keyword">return</span> a + b
</code></pre>
  </div>
</div>
<p>所有模板参数（在尖括号 <code>&lt;&gt;</code> 之间的内容）必须在<strong>编译时已知</strong>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-style="section::after {

" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--style:section::after {

;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="%E5%8F%AF%E5%8F%98%E5%8F%82%E6%95%B0%E6%A8%A1%E6%9D%BF-1">可变参数模板</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> First, <span class="hljs-keyword">typename</span>... Rest&gt; <span class="hljs-comment">// Rest 是一个模板参数包</span>
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">read</span><span class="hljs-params">(First &amp;first, Rest &amp;...rest)</span> </span>{    <span class="hljs-comment">// rest 是一个函数参数包</span>
  std::cin &gt;&gt; first;
  <span class="hljs-keyword">if</span> (<span class="hljs-comment">/* rest 不是空的 */</span>)
    <span class="hljs-built_in">read</span>(rest...); <span class="hljs-comment">// 包展开</span>
}
<span class="hljs-type">int</span> i; <span class="hljs-type">double</span> d; std::string s;
<span class="hljs-built_in">read</span>(i); <span class="hljs-comment">// First = int, Rest 和 rest 都是空的</span>
</code></pre>
<p><code>read(i, d, s)</code> 实例化出以下函数：</p>
<ul>
<li><code>void read(int &amp;first, double &amp;rest_1, std::string &amp;rest_2)</code></li>
<li><code>read(rest...)</code> 又会调用 <code>read(rest_1, rest_2)</code>，导致 <code>void read(double &amp;first, std::string &amp;rest_1)</code> 被实例化，而它的 <code>read(rest_1)</code> 会导致 <code>void read(std::string &amp;first)</code> 被实例化。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-style="section::after {

" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--style:section::after {

;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="sizeofpack"><code>sizeof...(pack)</code></h2>
<p>一个参数包里有几个参数？用 <code>sizeof...</code> 运算符。这个运算符在编译时求值。</p>
<p><strong>* 务必区分声明参数包时的 <code>...</code>、包展开时的 <code>...</code> 和 <code>sizeof...</code> 中的 <code>...</code>！</strong></p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> First, <span class="hljs-keyword">typename</span>... Rest&gt; <span class="hljs-comment">// Rest 是一个模板参数包</span>
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">read</span><span class="hljs-params">(First &amp;first, Rest &amp;...rest)</span> </span>{    <span class="hljs-comment">// rest 是一个函数参数包</span>
  std::cin &gt;&gt; first;
  <span class="hljs-keyword">if</span> (<span class="hljs-keyword">sizeof</span>...(Rest) &gt; <span class="hljs-number">0</span>)
    <span class="hljs-built_in">read</span>(rest...); <span class="hljs-comment">// 包展开</span>
}
</code></pre>
<p>报了个编译错误？它说我试图调用 <code>read()</code></p>
<pre><code>a.cpp: In instantiation of ‘void read(First&amp;, Rest&amp; ...) [with First = int; Rest = {}]’:
a.cpp:12:7:   required from here
a.cpp:7:9: error: no matching function for call to ‘read()’
    7 |     read(rest...); // 包展开
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-style="section::after {

" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--style:section::after {

}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="if-constexpr"><code>if constexpr</code></h2>
<p>不妨试着写出当 <code>Rest = {}</code> 时的函数长什么样：</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> First&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">read</span><span class="hljs-params">(First &amp;first)</span> </span>{
  std::cin &gt;&gt; first;
  <span class="hljs-keyword">if</span> (<span class="hljs-literal">false</span>) <span class="hljs-comment">// sizeof...(Rest) == 0</span>
    <span class="hljs-built_in">read</span>();  <span class="hljs-comment">// Ooops! read 接受至少一个参数！</span>
}
</code></pre>
<p>问题出在<strong>这个 <code>if</code> 是运行时的控制流</strong>，哪怕这个条件 100% 是 <code>false</code>，这个部分也必须能编译才行！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--style:section::after {

}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="if-constexpr-1"><code>if constexpr</code></h2>
<p><code>if constexpr (condition)</code>：<strong>编译时的 <code>if</code></strong> (since C++17)</p>
<ul>
<li>
<p><code>condition</code> 必须能在编译时求值</p>
</li>
<li>
<p>只有在 <code>condition</code> 为 <code>true</code> 时，<code>statements</code> 才会被编译。</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-keyword">if</span> <span class="hljs-title">constexpr</span> <span class="hljs-params">(condition)</span>
  statements
</span></code></pre>
</li>
<li>
<p>根据 <code>condition</code> 的值来决定编译 <code>statementsTrue</code> 还是 <code>statementsFalse</code>。</p>
<pre><code class="language-cpp"><span class="hljs-function"><span class="hljs-keyword">if</span> <span class="hljs-title">constexpr</span> <span class="hljs-params">(condition)</span>
  statementsTrue
<span class="hljs-keyword">else</span>
  statementsFalse
</span></code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--style:section::after {

<h2 id="if-constexpr-2"><code>if constexpr</code></h2>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> First, <span class="hljs-keyword">typename</span>... Rest&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">read</span><span class="hljs-params">(First &amp;first, Rest &amp;...rest)</span> </span>{
  std::cin &gt;&gt; first;
  <span class="hljs-function"><span class="hljs-keyword">if</span> <span class="hljs-title">constexpr</span> <span class="hljs-params">(<span class="hljs-keyword">sizeof</span>...(Rest) &gt; <span class="hljs-number">0</span>)</span>
    <span class="hljs-title">read</span><span class="hljs-params">(rest...)</span></span>;
}
</code></pre>
<p>如果没有 <code>if constexpr</code>，我们就需要通过重载来完成：（这里的重载决议不用搞清楚）</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt; <span class="hljs-comment">// 为一个参数的情况单独定义</span>
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">read</span><span class="hljs-params">(T &amp;x)</span> </span>{ std::cin &gt;&gt; x; }
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> First, <span class="hljs-keyword">typename</span>... Rest&gt;
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">read</span><span class="hljs-params">(First &amp;first, Rest &amp;...rest)</span> </span>{
  <span class="hljs-built_in">read</span>(first); <span class="hljs-built_in">read</span>(rest...);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-style="section::after {

<h1 id="%E4%B8%80%E4%BA%9B%E7%94%B1%E6%A8%A1%E6%9D%BF%E7%BC%96%E8%AF%91%E5%BC%95%E5%8F%91%E7%9A%84%E9%97%AE%E9%A2%98">一些由模板编译引发的问题</h1>

" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--style:section::after {

<h2 id="%E5%AE%9E%E7%8E%B0-dynarrayt-%E7%9A%84-operator">实现 <code>Dynarray&lt;T&gt;</code> 的 <code>operator&lt;</code></h2>
<p>不就是给各个地方都加上 <code>&lt;T&gt;</code> 么，我会！</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
  <span class="hljs-keyword">friend</span> <span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;, <span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;);
};
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt; <span class="hljs-comment">// 别忘了模板声明</span>
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;, <span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;) {
  <span class="hljs-comment">// 实现这个函数...</span>
}

Dynarray&lt;<span class="hljs-type">int</span>&gt; a, b;
<span class="hljs-keyword">if</span> (a &lt; b) <span class="hljs-comment">// ld 报错 undefined reference to operator&lt; ???</span>
  <span class="hljs-comment">// ...</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--style:section::after {

}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="%E9%9D%9E%E6%A8%A1%E6%9D%BF%E7%9A%84%E6%83%85%E5%BD%A2">非模板的情形</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
  <span class="hljs-keyword">friend</span> <span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Dynarray &amp;, <span class="hljs-type">const</span> Dynarray &amp;); <span class="hljs-comment">// (1)</span>
};
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Dynarray &amp;, <span class="hljs-type">const</span> Dynarray &amp;) { <span class="hljs-comment">// (2)</span>
  <span class="hljs-comment">// 实现这个函数...</span>
}
</code></pre>
<p>毫无疑问，(1) 处的声明和 (2) 处的定义是同一个函数。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="%E6%A8%A1%E6%9D%BF%E6%83%85%E5%BD%A2">模板情形</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt; <span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
  <span class="hljs-keyword">friend</span> <span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;, <span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;); <span class="hljs-comment">// (1)</span>
};
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;, <span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;) { <span class="hljs-comment">/* ... */</span> } <span class="hljs-comment">// (2)</span>
</code></pre>
<ul>
<li>当我们使用 <code>Dynarray&lt;int&gt;</code> 时，这个类被实例化出来。</li>
<li>这时它顺带声明了 (1) <code>friend bool operator&lt;(const Dynarray&lt;int&gt; &amp;, const Dynarray&lt;int&gt; &amp;)</code>，这个函数<strong>不是模板</strong>，而 (2) 是一个函数模板，<strong>编译器不认为 (1) 和 (2) 是同一个函数</strong>。</li>
<li>表达式 <code>a &lt; b</code> 对于 <code>operator&lt;</code> 做重载决议时，既能找到 (1) 又能找到 (2)，但是其它条件相同的情况下<strong>非模板优于模板</strong>，所以它选择了 (1) 而不是 (2)。</li>
<li>接下来压力给到链接器：(1) 只有声明而没有定义，遂报错。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="%E8%A7%A3%E5%86%B3%E6%96%B9%E6%A1%88-1%E4%B8%8D%E7%94%A8-friend">解决方案 1：不用 friend</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
  <span class="hljs-comment">// 不声明 operator&lt; 为 friend</span>
};
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;, <span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;) {
  <span class="hljs-comment">// 不访问 Dynarray&lt;T&gt; 的私有成员</span>
}
</code></pre>
<p>如果真的可以不借助 <code>friend</code> 实现它（而且不产生额外的代价），这当然也是个办法。</p>
<p>这时 <code>a &lt; b</code> 的 <code>operator&lt;</code> 正对应了这个模板函数，能够正确编译和链接。</p>
<p>这里只有一个 <code>operator&lt;</code>，不存在两个 <code>operator&lt;</code> 争宠的情况。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="%E8%A7%A3%E5%86%B3%E6%96%B9%E6%A1%88-2%E5%9C%A8%E5%A3%B0%E6%98%8E-friend-%E7%9A%84%E5%90%8C%E6%97%B6%E5%AE%9A%E4%B9%89%E5%AE%83">解决方案 2：在声明 <code>friend</code> 的同时定义它</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
  <span class="hljs-keyword">friend</span> <span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;, <span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;) {
    <span class="hljs-comment">// 直接在这里实现它</span>
  }
};
</code></pre>
<p>这里也只有一个 <code>operator&lt;</code>。</p>

<h2 id="%E8%A7%A3%E5%86%B3%E6%96%B9%E6%A1%88-3%E5%91%8A%E8%AF%89%E7%BC%96%E8%AF%91%E5%99%A8%E7%9C%9F%E7%9B%B8">解决方案 3：告诉编译器“真相”</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt; <span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
  <span class="hljs-keyword">friend</span> <span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;, <span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;); <span class="hljs-comment">// (1)</span>
};
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> U&gt; <span class="hljs-comment">// 为了不引起混淆，这里用 U</span>
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Dynarray&lt;U&gt; &amp;, <span class="hljs-type">const</span> Dynarray&lt;U&gt; &amp;) { <span class="hljs-comment">/* ... */</span> } <span class="hljs-comment">// (2)</span>
</code></pre>
<p>编译器认为：(1) 不是模板，(2) 是模板，(1) 和 (2) 不是同一个函数。</p>
<p>真相：(1) 和 (2) 应当是同一个函数。在 <code>T</code> 给定的情况下，(1) 其实是 (2) 的 <code>U = T</code> 情形的实例。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-style="section::after {

" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--style:section::after {

<h2 id="%E8%A7%A3%E5%86%B3%E6%96%B9%E6%A1%88-3%E5%91%8A%E8%AF%89%E7%BC%96%E8%AF%91%E5%99%A8%E7%9C%9F%E7%9B%B8-1">解决方案 3：告诉编译器“真相”</h2>
<pre><code class="language-cpp"><span class="hljs-comment">// 1. 在 `friend` 声明之前声明这个模板函数</span>
<span class="hljs-comment">//    为了声明 operator&lt; 的参数，还得再为 class Dynarray 补充一个声明</span>
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt; <span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span>;
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;, <span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;);
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt; <span class="hljs-keyword">class</span> <span class="hljs-title class_">Dynarray</span> {
  <span class="hljs-comment">// 2. 声明 friend 时在函数名后面加上 &lt;&gt;（或 &lt;T&gt;）</span>
  <span class="hljs-comment">//    说明它是先前声明过的一个模板函数的一个实例</span>
  <span class="hljs-keyword">friend</span> <span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt; &lt;&gt;(<span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;, <span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;);
};
<span class="hljs-comment">// 3. 正常给出 `operator&lt;` 的定义</span>
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-type">bool</span> <span class="hljs-keyword">operator</span>&lt;(<span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;, <span class="hljs-type">const</span> Dynarray&lt;T&gt; &amp;) {
  <span class="hljs-comment">// ...</span>
}
</code></pre>
</section>

<h1 id="%E5%AE%9E%E7%8E%B0%E4%B8%80%E4%B8%AA-stddistance">实现一个 <code>std::distance</code></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);

" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--style:section::after {

}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="stddistance"><code>std::distance</code></h2>
<p>定义于 <code>&lt;iterator&gt;</code> 中。相关的函数还有 <code>std::advance</code>, <code>std::next</code> 等。</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">distance</span><span class="hljs-params">(Iterator first, Iterator last)</span></span>;
</code></pre>
<p>计算从 <code>first</code> 到 <code>last</code> 的“距离”：</p>
<ul>
<li><code>Iterator</code> 至少得是 InputIterator。</li>
<li>对于 RandomAccessIterators，返回 <code>last - first</code>。</li>
<li>对于一般的 InputIterator，从 <code>first</code> 开始不断 <code>++</code>，直到碰到 <code>last</code> 为止。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="%E8%BF%94%E5%9B%9E%E5%80%BC%E7%B1%BB%E5%9E%8B%E6%98%AF%E4%BB%80%E4%B9%88">返回值类型是什么？</h2>
<p>通常情况下，一个迭代器应当具有一个类型别名成员 <code>difference_type</code>，表示两个迭代器的“距离”的类型。</p>
<p>这个类型通常是 <code>std::ptrdiff_t</code>（和指针相减的类型相同），但<a href="https://stackoverflow.com/questions/52371645/is-there-an-example-of-an-iterator-which-wouldnt-use-ptrdiff-t-as-its-differenc">这并不一定</a>。</p>
<p>为了写出最通用的 <code>distance</code>，我们应该使用这个 <code>difference_type</code>：</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt;
<span class="hljs-function"><span class="hljs-keyword">typename</span> Iterator::difference_type <span class="hljs-title">distance</span><span class="hljs-params">(Iterator first, Iterator last)</span></span>;
</code></pre>
<p>开头的这个 <code>typename</code> 是啥？如果 <code>Iterator</code> 是个指针怎么办？一会儿再说...</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="%E5%A6%82%E4%BD%95%E7%9F%A5%E9%81%93%E8%BF%AD%E4%BB%A3%E5%99%A8%E7%9A%84%E5%9E%8B%E5%88%AB">如何知道迭代器的型别？</h2>
<p>通常情况下，一个迭代器应当具有一个类型别名成员 <code>iterator_category</code>，它是以下五个类型之一的别名：</p>
<pre><code class="language-cpp"><span class="hljs-keyword">namespace</span> std {
  <span class="hljs-keyword">struct</span> <span class="hljs-title class_">input_iterator_tag</span> {};
  <span class="hljs-keyword">struct</span> <span class="hljs-title class_">output_iterator_tag</span> {};
  <span class="hljs-keyword">struct</span> <span class="hljs-title class_">forward_iterator_tag</span> : input_iterator_tag {};
  <span class="hljs-keyword">struct</span> <span class="hljs-title class_">bidirectional_iterator_tag</span> : forward_iterator_tag {};
  <span class="hljs-keyword">struct</span> <span class="hljs-title class_">random_access_iterator_tag</span> : bidirectional_iterator_tag {};
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="tag-dispatch">Tag dispatch</h2>
<p>将两种不同的实现写在两个函数里，<strong>分别加上一个 tag 参数</strong></p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">distance_impl</span><span class="hljs-params">(Iterator first, Iterator last,
                   std::random_access_iterator_tag)</span></span>; <span class="hljs-comment">// (1)</span>
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">distance_impl</span><span class="hljs-params">(Iterator first, Iterator last,
                   std::input_iterator_tag)</span></span>; <span class="hljs-comment">// (2)</span>

<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">distance</span><span class="hljs-params">(Iterator first, Iterator last)</span> </span>{
  <span class="hljs-keyword">using</span> category = <span class="hljs-keyword">typename</span> Iterator::iterator_category;
  <span class="hljs-comment">// 传一个 category 类型的对象作为第三个参数</span>
  <span class="hljs-comment">// 如果 category 是 std::random_access_iterator_tag，就会匹配 (1)，否则匹配 (2)</span>
  <span class="hljs-keyword">return</span> <span class="hljs-built_in">distance_impl</span>(first, last, category{});
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="tag-dispatch-1">Tag dispatch</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">distance_impl</span><span class="hljs-params">(Iterator first, Iterator last,
                   std::random_access_iterator_tag)</span> </span>{ <span class="hljs-comment">// (1)</span>
  <span class="hljs-keyword">return</span> last - first;
}
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">distance_impl</span><span class="hljs-params">(Iterator first, Iterator last,
                   std::input_iterator_tag)</span></span>; { <span class="hljs-comment">// (2)</span>
  <span class="hljs-keyword">typename</span> Iterator::difference_type result = <span class="hljs-number">0</span>;
  <span class="hljs-keyword">while</span> (first != last) { ++first; ++result; }
  <span class="hljs-keyword">return</span> result;
}
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">distance</span><span class="hljs-params">(Iterator first, Iterator last)</span> </span>{
  <span class="hljs-keyword">using</span> category = <span class="hljs-keyword">typename</span> Iterator::iterator_category;
  <span class="hljs-keyword">return</span> <span class="hljs-built_in">distance_impl</span>(first, last, category{});
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="%E6%8C%87%E9%92%88%E6%80%8E%E4%B9%88%E5%8A%9E">指针怎么办？</h2>
<p>以上实现依赖于 <code>Iterator::difference_type</code> 和 <code>Iterator::iterator_category</code>，如果 <code>Iterator</code> 根本不是类类型怎么办？</p>
<p>当然可以直接为指针做一个重载：</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">distance</span><span class="hljs-params">(T *first, T *last)</span> </span>{
  <span class="hljs-keyword">return</span> last - first;
}
</code></pre>
<p>但事实上有很多函数都面临这个问题，全都多加一份重载也太麻烦了。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="traits-%E6%8A%80%E6%9C%AF">Traits 技术</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt; <span class="hljs-comment">// 一般情况：Iterator 是一个类类型</span>
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">Traits</span> {
  <span class="hljs-keyword">using</span> difference_type = <span class="hljs-keyword">typename</span> Iterator::difference_type;
  <span class="hljs-keyword">using</span> iterator_category = <span class="hljs-keyword">typename</span> Iterator::iterator_category;
};
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt; <span class="hljs-comment">// 为指针做特化</span>
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">Traits</span>&lt;T *&gt; {
  <span class="hljs-keyword">using</span> difference_type = std::<span class="hljs-type">ptrdiff_t</span>;
  <span class="hljs-keyword">using</span> iterator_category = std::random_access_iterator_tag;
};
</code></pre>
<p>使用 <code>Traits&lt;Iterator&gt;::difference_type</code> 和 <code>Traits&lt;Iterator&gt;::iterator_category</code>，即可处理所有情况。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-style="section::after {

" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--style:section::after {

}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="iterator_traits"><code>iterator_traits</code></h2>
<p>上面的这个 <code>Traits</code> 正对应了标准库 <code>std::iterator_traits</code>。</p>
<pre><code class="language-cpp"><span class="hljs-keyword">namespace</span> std {
  <span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt; <span class="hljs-comment">// 一般情况：Iterator 是一个类类型</span>
  <span class="hljs-keyword">struct</span> <span class="hljs-title class_">iterator_traits</span> {
    <span class="hljs-keyword">using</span> value_type        = <span class="hljs-keyword">typename</span> Iterator::value_type;
    <span class="hljs-keyword">using</span> pointer           = <span class="hljs-keyword">typename</span> Iterator::pointer;
    <span class="hljs-keyword">using</span> reference         = <span class="hljs-keyword">typename</span> Iterator::reference;
    <span class="hljs-keyword">using</span> difference_type   = <span class="hljs-keyword">typename</span> Iterator::difference_type;
    <span class="hljs-keyword">using</span> iterator_category = <span class="hljs-keyword">typename</span> Iterator::iterator_category;
  };
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="iterator_traits-1"><code>iterator_traits</code></h2>
<p>上面的这个 <code>Traits</code> 正对应了标准库 <code>std::iterator_traits</code>。</p>
<pre><code class="language-cpp"><span class="hljs-keyword">namespace</span> std {
  <span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> T&gt; <span class="hljs-comment">// 为指针做特化</span>
  <span class="hljs-keyword">struct</span> <span class="hljs-title class_">iterator_traits</span>&lt;T *&gt; {
    <span class="hljs-keyword">using</span> value_type        = std::<span class="hljs-type">remove_cv_t</span>&lt;T&gt;; <span class="hljs-comment">// 这是啥？</span>
    <span class="hljs-keyword">using</span> pointer           = T *;
    <span class="hljs-keyword">using</span> reference         = T &amp;;
    <span class="hljs-keyword">using</span> difference_type   = std::<span class="hljs-type">ptrdiff_t</span>;
    <span class="hljs-keyword">using</span> iterator_category = std::random_access_iterator_tag;
  };
}
</code></pre>
<p><code>std::remove_cv_t&lt;T&gt;</code>：是 <code>T</code> 去除可能的顶层 <code>const</code> 或 <code>volatile</code> 后的类型，定义于 <code>&lt;type_traits&gt;</code>。</p>
</section>

<h2 id="%E7%94%A8-if-constexpr-%E5%AE%9E%E7%8E%B0">用 <code>if constexpr</code> 实现</h2>
<p>能不能直接这样写？</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">distance</span><span class="hljs-params">(Iterator first, Iterator last)</span> </span>{
  <span class="hljs-keyword">using</span> category = <span class="hljs-keyword">typename</span> std::iterator_traits&lt;Iterator&gt;::iterator_category;
  <span class="hljs-function"><span class="hljs-keyword">if</span> <span class="hljs-title">constexpr</span> <span class="hljs-params">(<span class="hljs-comment">/* category == std::random_access_iterator_tag */</span>)</span>
    <span class="hljs-keyword">return</span> last - first</span>;
  <span class="hljs-keyword">else</span> {
    <span class="hljs-keyword">typename</span> std::iterator_traits&lt;Iterator&gt;::difference_type result = <span class="hljs-number">0</span>;
    <span class="hljs-keyword">while</span> (first != last) {
      ++first; ++result;
    }
    <span class="hljs-keyword">return</span> result;
  }
}
</code></pre>
<p>如何判断两个类型相同？</p>
</section>

<h2 id="%E7%94%A8-if-constexpr-%E5%AE%9E%E7%8E%B0-1">用 <code>if constexpr</code> 实现</h2>
<p><code>std::is_same_v&lt;T, U&gt;</code>：<code>bool</code> 类型的编译期常量，当 <code>T</code> 和 <code>U</code> 是同一个类型时为 <code>true</code>，否则为 <code>false</code>。定义于 <code>&lt;type_traits&gt;</code>。</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> Iterator&gt;
<span class="hljs-function"><span class="hljs-keyword">auto</span> <span class="hljs-title">distance</span><span class="hljs-params">(Iterator first, Iterator last)</span> </span>{
  <span class="hljs-keyword">using</span> category = <span class="hljs-keyword">typename</span> std::iterator_traits&lt;Iterator&gt;::iterator_category;
  <span class="hljs-function"><span class="hljs-keyword">if</span> <span class="hljs-title">constexpr</span> <span class="hljs-params">(std::is_same_v&lt;category, std::random_access_iterator_tag&gt;)</span>
    <span class="hljs-keyword">return</span> last - first</span>;
  <span class="hljs-keyword">else</span> {
    <span class="hljs-keyword">typename</span> std::iterator_traits&lt;Iterator&gt;::difference_type result = <span class="hljs-number">0</span>;
    <span class="hljs-keyword">while</span> (first != last) {
      ++first; ++result;
    }
    <span class="hljs-keyword">return</span> result;
  }
}
</code></pre>
</section>

<h2 id="hello-world">Hello world</h2>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-type">unsigned</span> N&gt;
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">Factorial</span> {
  <span class="hljs-type">static</span> <span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> result = N * Factorial&lt;N - <span class="hljs-number">1</span>&gt;::result;
};
<span class="hljs-keyword">template</span> &lt;&gt;
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">Factorial</span>&lt;<span class="hljs-number">0u</span>&gt; {
  <span class="hljs-type">static</span> <span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> result = <span class="hljs-number">1u</span>;
};
<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">main</span><span class="hljs-params">()</span> </span>{
  <span class="hljs-type">const</span> <span class="hljs-keyword">auto</span> n = Factorial&lt;<span class="hljs-number">10</span>&gt;::result; <span class="hljs-comment">// 3628800</span>
  <span class="hljs-type">int</span> a[n]; <span class="hljs-comment">// 正确。n 是一个编译时常量，可以用来开数组。</span>
}
</code></pre>
<p>虽然在 modern C++ 它可以完全被 <code>constexpr</code> 函数替代，但是这仍是 TMP 的最经典的 hello world。</p>
</section>

<h2 id="stdtuple%E4%B8%80%E4%B8%AA%E7%BC%96%E8%AF%91%E6%9C%9F%E5%AE%B9%E5%99%A8"><a href="https://en.cppreference.com/w/cpp/utility/tuple"><code>std::tuple</code></a>：一个编译期容器</h2>
<p>可能的实现：</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> First&gt;
<span class="hljs-keyword">class</span> <span class="hljs-title class_">tuple</span>&lt;First&gt;;
<span class="hljs-keyword">template</span> &lt;<span class="hljs-keyword">typename</span> First, <span class="hljs-keyword">typename</span>... Rest&gt;
<span class="hljs-keyword">class</span> <span class="hljs-title class_">tuple</span>&lt;First, Rest...&gt; : <span class="hljs-keyword">public</span> tuple&lt;Rest...&gt;;
<span class="hljs-comment">// 例：tuple&lt;A, B, C&gt; 继承自 tuple&lt;B, C&gt;</span>
</code></pre>
<pre><code class="language-cpp">std::tuple&lt;<span class="hljs-type">int</span>, <span class="hljs-type">double</span>, <span class="hljs-type">int</span>&gt; t{<span class="hljs-number">0</span>, <span class="hljs-number">4.0</span>, <span class="hljs-number">42</span>};
</code></pre>

<h2 id="stdratio%E7%BC%96%E8%AF%91%E6%9C%9F%E6%9C%89%E7%90%86%E6%95%B0%E7%B1%BB"><a href="https://en.cppreference.com/w/cpp/numeric/ratio/ratio"><code>std::ratio</code></a>：编译期有理数类</h2>
<p>标准库 <code>&lt;chrono&gt;</code> 利用 <code>std::ratio</code> 来表示各种时间单位，并且保证了量纲的正确性</p>
<ul>
<li>例如，微秒和毫秒不能在数值上直接相加。</li>
</ul>
<p>一个经典的例子：将七大基本物理单位对应于七个模板参数</p>
<pre><code class="language-cpp"><span class="hljs-keyword">template</span> &lt;<span class="hljs-type">int</span> mass, <span class="hljs-type">int</span> length, <span class="hljs-type">int</span> time, <span class="hljs-type">int</span> charge,
          <span class="hljs-type">int</span> temperature, <span class="hljs-type">int</span> intensity, <span class="hljs-type">int</span> amount_of_substance&gt;
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">quantity</span>;
</code></pre>

<li>正确定义 <code>quantity</code> 之间的运算，就可以在<strong>编译时</strong>杜绝量纲错误。</li>

<h2 id="%E6%9B%B4%E7%96%AF%E7%8B%82%E7%9A%84%E4%BE%8B%E5%AD%90%E4%B8%8D%E6%AD%A2%E5%B1%80%E9%99%90%E4%BA%8E%E6%A8%A1%E6%9D%BF%E5%85%83%E7%BC%96%E7%A8%8B">更疯狂的例子（不止局限于模板元编程）</h2>
<p>C++ 的编译时计算能力非常强大 (turing-complete) 。</p>
<p>在 <code>r14</code> 文件夹下有</p>
<ul>
<li><code>merge_sort</code>: 编译时归并排序</li>
<li><code>ctjson</code>: 编译时 json parser （需要 C++20）</li>
</ul>
<p>更疯狂的：</p>
<p><a href="https://github.com/hanickadot/compile-time-regular-expressions">编译时正则表达式</a></p>
<p><a href="https://github.com/tcbrindle/raytracer.hpp">编译时 raytracer</a></p>
</section>

<h2 id="%E4%BB%A3%E7%A0%81%E6%98%AF%E4%BD%A0%E7%9A%84%E4%BD%9C%E5%93%81">代码是你的作品</h2>
<p>我们在本学期的几次作业中不断地传达这个思想（虽然没有明确地点出）。</p>
<ul>
<li>尝试<strong>读懂</strong>整个代码项目中的所有部分，而不是只看自己要写的一个函数或类。
<ul>
<li>理解程序的各个部分之间如何协作、有哪些隐式的约定。（记得 quiz1 的那个问题吗？）</li>
</ul>
</li>
<li>对你自己写的代码负责：<strong>保证你的代码的正确性应该是你自己的事</strong>。
<blockquote>
<p>“未经测试的代码都是错的。”——蒋炎岩</p>
</blockquote>
</li>
<li>代码不仅会被运行，<strong>还会被阅读</strong>，而且会被反复、仔细阅读。
<ul>
<li>要写可读性高的代码。</li>
<li>格式化。</li>
<li>正确、规范地维护注释和文档。</li>
<li><strong>组织好的、可读性高的代码才更有可能是正确的代码</strong>，而不是“先用笨办法把代码搞对，再去考虑写法问题”。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-style="section::after {

" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--style:section::after {

;--theme:rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma;" data-marpit-pagination-total="48">
<h2 id="%E5%B7%A5%E5%85%B7%E5%BE%88%E9%87%8D%E8%A6%81">工具很重要</h2>
<p>工欲善其事，必先利其器。工具的使用也是编程的一部分。</p>
<ul>
<li>VSCode 的那些 json 文件都是什么意思？每次“一键编译”甚至“一键编译运行”的时候，到底发生了什么？“Problems”、“Output”等面板里都是些啥？</li>
<li>编译指令怎么写？各个选项都是什么含义？</li>
<li>为什么你的一键格式化和我的一键格式化效果不同？</li>
</ul>
<p>为了舒适地写代码，花费一些时间在学习工具上是<strong>完全值得的</strong>，因为你的工具会陪伴你很多年。</p>
<p>“差生文具多”的观念并不可取。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-style="section::after {

}
" data-theme="rcm8cdiov08hvkde407zrvk1pv67ud6l8sswt1bma" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--style:section::after {

<h2 id="%E7%BC%96%E7%A8%8B%E8%AF%AD%E8%A8%80%E6%98%AF%E5%B7%A5%E5%85%B7%E5%90%97">编程语言是工具吗？</h2>
<p><s>有人说，编程语言不过是工具，不需要花太多时间学习语言特性；也有人认为不仅如此。你怎么看？</s></p>
<ul>
<li>
<p>语言特性<strong>很重要</strong>。就算你认为它只是工具，工具也很重要。</p>
</li>
<li>
<p>编程语言（PL）是一个很值得研究的领域，虽然在上科大搞的人很少。</p>
</li>
<li>
<p>语言特性的演化往往代表着“好的编程风格”的演化。</p>
<pre><code class="language-cpp"><span class="hljs-comment">// C++98</span>
<span class="hljs-keyword">for</span> (std::vector&lt;<span class="hljs-type">int</span>&gt;::reverse_iterator rit = v.<span class="hljs-built_in">rbegin</span>();
                                        rit != v.<span class="hljs-built_in">rend</span>(); ++rit) {}
<span class="hljs-comment">// C++11</span>
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> rit = v.<span class="hljs-built_in">rbegin</span>(); rit != v.<span class="hljs-built_in">rend</span>(); ++rit) {}
<span class="hljs-comment">// C++20</span>
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> x : v | std::views::reverse) {}
</code></pre>
</li>
</ul>
</section>

<h2 id="%E6%8F%90%E9%97%AE%E7%9A%84%E6%99%BA%E6%85%A7">提问的智慧</h2>
<p><a href="https://stackoverflow.com/help/how-to-ask">https://stackoverflow.com/help/how-to-ask</a></p>
<ul>
<li>搜索引擎/StackOverflow/文档/手册/教科书上能查到的问题不要问。
<ul>
<li>再强调一下 StackOverflow （以及 StackExchange 的各个分站）。不要因为“它是英语的”或者“加载缓慢”而拒绝它们，这些论坛里高手如云，回答的质量往往超乎想象。</li>
</ul>
</li>
<li>你的编译器和编译指令是什么？系统是什么？某个库的版本是什么？
<ul>
<li>必要时，完整地贴出相关信息。</li>
<li>不要只会说“报错了”。究竟报了<em>什么错</em>？尝试理解报错信息。</li>
</ul>
</li>
<li>正确使用 AI 。
<ul>
<li>谨慎判断 AI 所给出的回答。</li>
<li>不要让 AI 代替你本应经历的锻炼过程。</li>
</ul>
</li>
</ul>
</section>
