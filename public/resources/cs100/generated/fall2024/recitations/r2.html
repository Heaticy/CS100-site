<ul>
<li>
<p>A byte is 8 bits on most platforms.</p>
</li>
<li>
<p><code>sizeof(T)</code> is the number of <strong>bytes</strong> that <code>T</code> holds.</p>
<ul>
<li><code>sizeof()</code> returns a value of type <a href="https://en.cppreference.com/w/c/types/size_t"><code>size_t</code></a>. <em>(covered later)</em></li>
</ul>
</li>
<li>
<p>The conversion specifier for <code>size_t</code> is <code>%zu</code>:</p>
<pre><code class="language-c"><span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%zu\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
</code></pre>
</li>
<li>
<p>If MinGW has issues with <code>%zu</code>, cast the result to int and use <code>%d</code> instead.</p>
<pre><code class="language-c"><span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, (<span class="hljs-type">int</span>)<span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));
</code></pre>
</li>
</ul>
</section>

<h1 id="width-of-integer-types-and-sizeof-1">Width of integer types and <code>sizeof</code></h1>
<div align="center">
<table>
<thead>
<tr>
<th>type</th>
<th>width (at least)</th>
<th>width (usually)</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>short</code></td>
<td>16 bits</td>
<td>16 bits</td>
</tr>
<tr>
<td><code>int</code></td>
<td>16 bits</td>
<td>32 bits</td>
</tr>
<tr>
<td><code>long</code></td>
<td>32 bits</td>
<td>32 or 64 bits</td>
</tr>
<tr>
<td><code>long long</code></td>
<td>64 bits</td>
<td>64 bits</td>
</tr>
</tbody>
</table>
</div>

<h1 id="literals-overview">Literals: Overview</h1>
<ul>
<li>Every expression in C has a specific type determined at compile time.
<ul>
<li>An expression is a sequence of <em>operators</em> and their <em>operands</em>, that specifies a computation.</li>
</ul>
</li>
<li>For example, <code>int a = 42;</code> <code>double b = 3.14</code>
<ul>
<li>What are the types of <code>a</code> and <code>b</code>?</li>
<li>What are the types of <code>42</code> and <code>3.14</code>?</li>
</ul>
</li>
</ul>
</section>

<h1 id="literals-overview-1">Literals: Overview</h1>
<p>Writing values explicitly like <code>42</code> are known as literals.</p>
<ul>
<li>Literals are immutable.（unchangeable）</li>
<li>A literal is simply a value. (字面值-字面即是值；把值写在脸上的就是字面值)</li>
</ul>
</section>

<h1 id="integer-literals-42-100l-0ll-405ul">Integer literals: <code>42</code>, <code>100L</code>, <code>0ll</code>, <code>405ul</code></h1>
<ul>
<li>
<p>Suffix: <code>L</code>(long), <code>ll</code>(long long), <code>ul</code>(unsigned long) — these indicate the type of the literal and are case-insensitive.（大小写不敏感）</p>
<ul>
<li>It is recommended to avoid mixing <code>l and </code>L, such as in <code>lL</code> or <code>Ll</code>; instead, consistently use <code>L</code>.</li>
<li>Suffixes can be combined freely.</li>
</ul>
</li>
<li>
<p>If there's no suffix in an integer literal, the default type is <code>int</code>.</p>
<ul>
<li>If the value exceeds the range of <code>int</code>, it will incrementally match to <code>int</code>-&gt;<code>long</code>-&gt;<code>long long</code>-&gt;<code>__int128</code>. If <code>__int128</code> is not supported, an error will occur (ill-formed).</li>
</ul>
</li>
<li>
<p>&quot;Negative literals&quot; do <strong>not exist</strong>; for example, <code>-42</code> represents an expression formed by applying the unary minus operator <code>-</code> to the literal <code>42</code>.</p>
</li>
</ul>
</section>

<h1 id="base%E8%BF%9B%E5%88%B6-of-integer-literals">Base（进制） of Integer literals</h1>
<ul>
<li><code>0xBAADF00D</code>， <code>052</code>，<code>0b101010</code>（C23），……</li>
<li><strong>Prefixes</strong> (case-insensitive):
<ul>
<li>
<p>Hexadecimal literal: <code>0x</code></p>
</li>
<li>
<p>Octal literal: <code>0</code></p>
</li>
<li>
<p>Binary literal: <code>0b</code>(since C23)</p>
<ul>
<li>The C++ compiler has supported binary literal since C++14.</li>
</ul>
</li>
</ul>
</li>
</ul>

<h1 id="floating-point-literals">Floating-point Literals</h1>
<ul>
<li><code>3.14</code>, <code>3.14f</code>, <code>3.14l</code>, <code>1e8</code>, <code>3e-8</code></li>
<li>Suffixes <strong>(case-insensitive)</strong>：
<ul>
<li><em>default：</em>  <code>double</code></li>
<li><code>f</code> ： <code>float</code></li>
<li><code>l</code> ： <code>long double</code></li>
</ul>
</li>
<li><strong>Scientific notation is always a floating-point number.</strong>
<ul>

<h1 id="operators-precedence%E4%BC%98%E5%85%88%E7%BA%A7and-associativity%E7%BB%93%E5%90%88%E6%80%A7">Operators: Precedence（优先级）and Associativity（结合性）</h1>
<ul>
<li>
<p>Precedence: determines which operation to <strong>perform first</strong></p>
<ul>
<li>The expression <code>f() + g() * h()</code> is interpreted as <code>f() + (g() * h())</code>, not as <code>(f() + g()) * h()</code>.</li>
</ul>
</li>
<li>
<p>Associativity: how <strong>operators of the same precedence</strong> are grouped in an expression</p>
<ul>
<li>The expression <code>f() - g() + h()</code> is interpreted as <code>(f() - g()) + h()</code>, not as <code>f() - (g() + h())</code>.</li>
</ul>
</li>
<li>
<p><a href="https://en.cppreference.com/w/c/language/operator_precedence">Precedence and Associativity Tables - CppReference</a></p>
</li>
<li>
<p>a classic question: <a href="https://piazza.com/class/lszwrwj2s8231h/post/17">Piazza</a></p>
</li>
</ul>
</section>

<h1 id="operators-associativity">Operators: Associativity</h1>
<p>Associativity: how <strong>operators of the same precedence</strong> are grouped in an expression</p>
<ul>
<li>Left Associativity: operations are grouped from the left
<ul>
<li>Operators with the same precedence are associated from left to right; the operator that appears first binds first.</li>
<li>For example, the expression <code>f() - g() + h()</code> is interpreted as <code>(f() - g()) + h()</code>, not as <code>f() - (g() + h())</code>.</li>
</ul>
</li>
<li>Right Associativity: operations are grouped from the left
<ul>
<li>
<p>For example, the assignment operator <code>=</code>: <code>a = b = c</code></p>
<ul>
<li>
<p>Step 1: <code>a = (b = c)</code></p>
</li>
<li>
<p>Step 2: <code>b = c</code> returns <code>b</code>( equal to <code>c</code>)</p>
</li>
<li>
<p>Step 3: <code>a = b</code></p>
</li>
</ul>
</li>
</ul>
</li>
</ul>
</section>

<li><strong>Very important: Order of Evaluation is independent from both precedence and associativity.</strong></li>
<li><em><strong>Very Very important: Order of evaluation of the operands of any C operator is unspecified (except where mentioned later).</strong></em></li>

<h1 id="operators-order-of-evaluation">Operators: Order of Evaluation</h1>
<ul>
<li>
<p>What is the calling order for <code>f()</code>, <code>g()</code>, and <code>h()</code> in the previous examples? <br /> (<code>f() - g() + h()</code>, <code>f() - (g() + h())</code>, ... )</p>
<ul>
<li>It is <strong>unspecified（未指定）</strong>.</li>
<li>You most likely cannot define precisely what &quot;unspecified&quot; means; perhaps some students have already noted down &quot;this is unspecified&quot; in their notebooks.</li>
<li>I hope you can understand what truly happens during compilation; the answer is right at your fingertips <a href="https://en.cppreference.com/w/c/language/eval_order">order of evaluation-CppReference</a>.</li>
</ul>
</li>
<li>
<p>Another example: <code>func(f(), g(), h())</code></p>
<ul>
<li>The calling order of the functions <code>f()</code>, <code>g()</code>, and <code>h()</code> here is also unspecified.</li>
</ul>
</li>
</ul>
</section>

<h1 id="operators-order-of-evaluation-1">Operators: Order of Evaluation</h1>
<p>If the order of evaluation of two expressions <code>A</code> and <code>B</code> is unspecified, and they either:</p>
<ul>
<li>Both modify the value of a variable, or</li>
<li>One modifies the value of a variable and the other reads that value,</li>
</ul>
<p>then this constitutes <strong>undefined behavior</strong>.<br /></p>
<ul>
<li>Example: What is the result of <code>i = i++ + 2</code>?
<ul>
<li>Once you start analyzing whether it is <code>+1</code> or <code>+2</code>, you have fallen into the <strong>trap of undefined behavior</strong>.<br />
(just like to analyze <code>double pi = 3.14; printf(&quot;%d\n&quot;, pi);</code>)
<ul>
<li><code>++</code> modifies <code>i</code>, and the assignment also modifies <code>i</code>. The order of these modifications is unspecified, hence it is <strong>undefined behavior</strong>.</li>
</ul>
</li>
</ul>
</li>
</ul>
</section>

<h2 id="operators-with-determined-evaluation-order">Operators with <strong>determined evaluation order</strong></h2>
<p>Among common operators, only four have a determined evaluation order: <code>&amp;&amp;</code>, <code>||</code>, <code>?:</code>, and <code>,</code>.</p>
<ul>
<li>
<p><code>&amp;&amp;</code> &amp; <code>||</code>: short-circuit evaluation(or minimal evaluation, McCarthy evaluation)</p>
<ul>
<li>evaluate the left side first; <em><strong>the right side is not evaluated if not necessary</strong></em></li>
</ul>
</li>
<li>
<p><code>cond ? t : f</code></p>
<ul>
<li>evaluate <code>cond</code> first, then evaluate <code>t</code> or <code>f</code> based on the truth value of <code>cond</code></li>
<li>only one of <code>t</code> or <code>f</code> is evaluated</li>
</ul>
</li>
<li>
<p><code>,</code>: Executes multiple expressions in sequence, with <strong>the whole comma expression's value being that of the <em>last expression</em> in the series</strong>.</p>
</li>
</ul>
</section>

<h1 id="operators-bitwise-operators%E4%BD%8D%E8%BF%90%E7%AE%97%E7%AC%A6">Operators: Bitwise Operators（位运算符）</h1>
<p><code>~</code>, <code>&amp;</code>, <code>^</code>, <code>|</code>, <code>&lt;&lt;</code>, <code>&gt;&gt;</code>, and compound assignment operators（复合赋值运算符） <code>&amp;=</code>, <code>|=</code>, <code>^=</code>, <code>&lt;&lt;=</code>, <code>&gt;&gt;=</code></p>
<div align="center">
<table>
<thead>
<tr>
<th>Operator</th>
<th>Operator Name</th>
<th>Example</th>
<th>Result</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>~</code></td>
<td>Bitwise NOT</td>
<td><code>~a</code></td>
<td>the bitwise NOT of <code>a</code></td>
</tr>
<tr>
<td><code>&amp;</code></td>
<td>Bitwise AND</td>
<td><code>a &amp; b</code></td>
<td>the bitwise AND of <code>a</code> and <code>b</code></td>
</tr>
<tr>
<td><code>|</code></td>
<td>Bitwise OR</td>
<td><code>a | b</code></td>
<td>the bitwise OR of <code>a</code> and <code>b</code></td>
</tr>
<tr>
<td><code>^</code></td>
<td>Bitwise XOR</td>
<td><code>a ^ b</code></td>
<td>the bitwise XOR of <code>a</code> and <code>b</code></td>
</tr>
<tr>
<td><code>&lt;&lt;</code></td>
<td>Bitwise Left Shift</td>
<td><code>a &lt;&lt; i</code></td>
<td><code>a</code> left-shifted by <code>i</code></td>
</tr>
<tr>
<td><code>&gt;&gt;</code></td>
<td>Bitwise Right Shift</td>
<td><code>a &gt;&gt; i</code></td>
<td><code>a</code> right-shifted by <code>i</code></td>
</tr>
</tbody>
</table>
</div>

<h1 id="bitwise-operators-1">Bitwise Operators: <code>&lt;&lt;</code>, <code>&gt;&gt;</code></h1>
<p>Assume <code>a</code> is an unsigned integer.</p>
<ul>
<li><code>a &lt;&lt; i</code> returns the result of <strong>shifting the binary bits of <code>a</code> to the left by <code>i</code> positions</strong>.
<ul>
<li>For example, <code>a &lt;&lt; 1</code> is equivalent to <code>a * 2</code>, and <code>a &lt;&lt; i</code> is equivalent to multiplying <code>a</code> by <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.871ex" height="1.879ex" role="img" focusable="false" viewBox="0 -830.4 827 830.4"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g><g data-mml-node="mi" transform="translate(533,363) scale(0.707)"><path data-c="1D456" d="M184 600Q184 624 203 642T247 661Q265 661 277 649T290 619Q290 596 270 577T226 557Q211 557 198 567T184 600ZM21 287Q21 295 30 318T54 369T98 420T158 442Q197 442 223 419T250 357Q250 340 236 301T196 196T154 83Q149 61 149 51Q149 26 166 26Q175 26 185 29T208 43T235 78T260 137Q263 149 265 151T282 153Q302 153 302 143Q302 135 293 112T268 61T223 11T161 -11Q129 -11 102 10T74 74Q74 91 79 106T122 220Q160 321 166 341T173 380Q173 404 156 404H154Q124 404 99 371T61 287Q60 286 59 284T58 281T56 279T53 278T49 278T41 278H27Q21 284 21 287Z"></path></g></g></g></g></svg></mjx-container>.</li>
<li><em><strong>Bits that overflow on the left are discarded.</strong></em></li>
</ul>
</li>
<li><code>a &gt;&gt; i</code> returns the result of <strong>shifting the binary bits of <code>a</code> to the right by <code>i</code> positions</strong>.
<ul>
<li>For example, <code>a &gt;&gt; 1</code> is equivalent to <code>a / 2</code>.</li>
<li><em><strong>Bits that overflow on the right are discarded.</strong></em></li>
</ul>
</li>
</ul>
</section>

<h2 id="magic-of-xor---answer-2">Magic of XOR - Answer</h2>
<blockquote>
<p>Given <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.357ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 600 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container> non-negative 32-bit integers, among which <strong>one number appears an odd number of times, while others appear an even number of times</strong>. Find the number that appears an odd number of times.</p>
</blockquote>
<p>Another intepretation of the answer: Consider the number <code>r</code> that appears an odd number of times.</p>
<ul>
<li>If the <code>i</code>th bit of <code>r</code> is <code>1</code>, it implies there are an odd number of <code>1</code>s in the <code>i</code>th bit of all the numbers.</li>
<li>If the <code>i</code>th bit of <code>r</code> is <code>0</code>, it implies there are an even number of <code>1</code>s in the <code>i</code>th bit of all the numbers.</li>
</ul>
<p>Thus, we need an operation that turns an even number of <code>1</code>s into <code>0</code> and an odd number of <code>1</code>s into <code>1</code>. Essentially, this is <em>addition without carrying</em> in binary context.</p>
<ul>
<li>The addtion is XOR.</li>
</ul>
