<h1 id="conditional-statement-if-else">Conditional Statement: <code>if</code>-<code>else</code></h1>
<div class="columns">
<div class="columns-left">
<p><strong>Syntax:</strong> <code>if (condition) statementT else statementF</code></p>
<ul>
<li><strong><code>condition</code></strong>: An <strong>expression</strong> of scalar types (either arithmetic or pointer types).
<ul>
<li><a href="https://en.cppreference.com/w/c/language/arithmetic_types">Arithmetic types</a>: Integer and floating-point types.
<ul>
<li>Example: <code>if (a &gt; 0)</code></li>
</ul>
</li>
<li><a href="https://en.cppreference.com/w/c/language/pointer">Pointer types</a>: Pointers to objects, functions, etc.
<ul>
<li>Example: <code>if (ptr) {...}</code> is equivalent to <code>if (ptr != NULL)</code>.</li>
</ul>
</li>
</ul>
</li>
</ul>

<h1 id="conditional-statement-switch-case">Conditional Statement: <code>switch</code>-<code>case</code></h1>
<div class="columns">
<div class="columns-left">
<p>Syntax:</p>
<pre><code class="language-c"><span class="hljs-keyword">switch</span> (expression)
{
    <span class="hljs-keyword">case</span> constant1:
      <span class="hljs-comment">// statements</span>
      <span class="hljs-keyword">break</span>;

    <span class="hljs-keyword">case</span> constant2:
      <span class="hljs-comment">// statements</span>
      <span class="hljs-keyword">break</span>;
    .
    .
    .
    <span class="hljs-keyword">default</span>:
      <span class="hljs-comment">// default statements</span>
}
</code></pre>
</div>
<div class="columns-right">
<ul>
<li>
<p><strong><code>expression</code></strong>: Any expression of integer type (char, signed or unsigned integer, or enumeration)</p>
</li>
<li>
<p><strong>Expression in a <code>case</code> label</strong>: An <a href="https://en.cppreference.com/w/c/language/">integer constant expression</a></p>
<ul>
<li><a href="https://en.cppreference.com/w/c/language/integer_constant">integer constants</a>: <code>42</code></li>
<li><a href="https://en.cppreference.com/w/c/language/character_constant">character constants</a>: <code>a</code></li>
<li><code>true</code>, ...</li>
</ul>
</li>
<li>
<p>The expression's value is known at compile time.</p>
</li>
</ul>
</div>
</div>
</section>

<h1 id="switch-case-control-flow%E6%8E%A7%E5%88%B6%E6%B5%81"><code>switch</code>-<code>case</code>: Control Flow（控制流）</h1>
<p>Once control flow jumps to the statement corresponding to a <code>case</code> label, it continues to <strong>execute downwards until</strong> a <code>break;</code> is encountered or the end of the <code>switch</code> block is reached.</p>
<ul>
<li>The control flow will <strong>NOT</strong> stop if there isn't a <code>break;</code> before the next <code>case</code>.</li>
</ul>
</div>

<h1 id="switch-case-scope-1"><code>switch</code>-<code>case</code>: Scope</h1>
<pre><code class="language-c"><span class="hljs-keyword">switch</span> (expr) {
  <span class="hljs-keyword">case</span> <span class="hljs-number">1</span>: { <span class="hljs-comment">// Use {} to limit `x` to this block.</span>
    <span class="hljs-type">int</span> x = <span class="hljs-number">42</span>;
    do_something(x, expr);
  }
  <span class="hljs-keyword">case</span> <span class="hljs-number">2</span>:
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, x); <span class="hljs-comment">// Error: `x` is not declared in this scope.</span>
}
</code></pre>
<ul>
<li>
<p>If <code>expr == 2</code>, the control flow skips <code>int x = 42;</code>, but <code>x</code> is still visible due to name lookup rules.</p>
<ul>
<li>The declaration of <code>x</code> is still in the <code>switch</code> scope, because it’s in the <code>{}</code> block.</li>
</ul>
</li>
<li>
<p>To avoid this, variables declared inside a <code>case</code> should be placed in their own block.</p>
<ul>
<li>In short, use <code>{}</code> to limit the scope.</li>
</ul>
</li>
</ul>

<h1 id="preprocessor-directives---control-the-preprocessor">Preprocessor Directives  - Control the preprocessor</h1>
<p><strong>Examples:</strong></p>
<ul>
<li>
<p><strong>Source file inclusion</strong>: <code>#include</code></p>
</li>
<li>
<p><strong>Replacing text macros（宏）</strong>: <code>#define</code>, *<code>#undef</code>(cancels a previous definition by <code>#define</code>)</p>

<li><strong>Macro</strong>: a piece of code in a program that is replaced by the value of the macro</li>

</li>
<li>

</li>
<li>
<p>*Implementation defined behavior control: <code>#pragma</code></p>
</li>
<li>

</li>
</ul>

<h1 id="source-file-inclusion-include">Source File Inclusion: <code>#include</code></h1>
<p><strong>Syntax</strong>:</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;filename&gt;</span> (newline)</span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&quot;filename&quot;</span> (newline)</span>
</code></pre>
<p>The <code>#include</code> directive is used for <strong>text replacement</strong> in C programming. It locates the specified file and <strong>inserts its contents into the source file</strong> at the point where the directive appears, following the <strong>rules</strong> <em>provided on the next page</em>.</p>
<ul>
<li><strong>Difference between <code>#include</code> and <code>import</code></strong>:<br />
The <strong><code>import</code></strong> statement is found in other programming languages, such as Python and Java, and is used to include modules or packages. It often includes additional features like namespace management and module loading. <strong>C++ has included support for <a href="https://en.cppreference.com/w/cpp/language/modules">modules</a> since the C++20 standard</strong>.</li>
</ul>
</section>

<h2 id="search-path-of-include">Search Path of <code>#include</code></h2>
<ul>
<li>
<p><strong><code>#include &lt;file&gt;</code></strong>: This form is typically used for standard library headers.</p>
<ul>
<li><strong>Default behavior (of the GCC preprocessor)</strong>: It searches only in standard system directories, which are preconfigured and may vary depending on the system and GCC configuration.</li>
<li><strong>Command-line options</strong> can be utilized to add additional directories to the search path. The most commonly used option is <code>-Idir</code>, which can be specified as follows: <code>gcc a.c -o a -I/home/liuxiao/my_awesome_library/include</code></li>
</ul>
</li>
<li>
<p><strong><code>#include &quot;file&quot;</code></strong>: This form is commonly used for user-defined headers.</p>
<ul>
<li>The preprocessor first searches in the directory of the current file, treating the file as a <strong>relative path</strong>, and then continues to search in the standard system directories.</li>
<li>Example: <code>#include &quot;../my_library/include/my_header.h&quot;</code></li>
</ul>
</li>
</ul>
</section>

<h1 id="replacing-text-macros-define"><strong>Replacing text</strong> macros: <code>#define</code></h1>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">define</span> N 1000</span>
<span class="hljs-meta">#<span class="hljs-keyword">define</span> MAX(A, B) A &lt; B ? B : A</span>
</code></pre>
<p>After this, all occurrences of <code>N</code> will be replaced with <code>1000</code>, and all occurrences of <code>MAX(expr1, expr2)</code> will be replaced with <code>expr1 &lt; expr2 ? expr2 : expr1</code>.</p>
<ul>
<li>The form <code>#define MACRO_NAME text_to_be_replaced</code> is called <strong>object-like macro</strong>. It replaces every occurrence of a defined <code>MACRO_NAME</code> with <code>text_to_be_replaced</code>.</li>
<li>The other form <code>#define MACRO_NAME (parameters, ...) text_to_be_replaced</code> is called <strong>function-like macro</strong>.</li>
</ul>
<p>Note: <strong>Redefining</strong> a macro previously defined is not legal, unless the new definition is precisely the same as the old. This means that <em><strong>two files</strong></em>, each with a definition of a certain macro, <em><strong>must be consistent in that definition</strong></em>.</p>
</section>

<h1 id="define-scope"><code>#define</code>: Scope</h1>
<ul>
<li>
<p>A macro is <strong>active</strong> from the point of its <code>#define</code> directive.</p>
</li>
<li>
<p>It becomes <strong>inactive</strong> when it reaches a corresponding <code>#undef</code> directive or the end of the current file.</p>
</li>
</ul>
</div>
<div class="columns-right">
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-meta">#<span class="hljs-keyword">define</span> APPLE (10 + PEAR)</span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>{
<span class="hljs-meta">#<span class="hljs-keyword">define</span> PEAR 15</span>
    <span class="hljs-type">int</span> x = APPLE;
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;x is %d.\n&quot;</span>, x); 
    <span class="hljs-comment">// x is 25.</span>
<span class="hljs-meta">#<span class="hljs-keyword">undef</span> PEAR</span>

<span class="hljs-meta">#<span class="hljs-keyword">define</span> PEAR 100</span>
    <span class="hljs-type">int</span> y = APPLE;
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;y is %d.\n&quot;</span>, y);
    <span class="hljs-comment">// y is 110.</span>
}

<h1 id="conditional-inclusion-ifdef-ifndef-endif">Conditional Inclusion: <code>#ifdef</code>, <code>#ifndef</code>, <code>#endif</code></h1>
<div class="columns">
<div class="columns-left">
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">ifdef</span> MACRO_NAME</span>
  <span class="hljs-comment">// Text block</span>
<span class="hljs-meta">#<span class="hljs-keyword">endif</span></span>
</code></pre>
</div>
<div class="columns-right">
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">ifndef</span> MACRO_NAME</span>
  <span class="hljs-comment">// Text block</span>
<span class="hljs-meta">#<span class="hljs-keyword">endif</span></span>
</code></pre>
</div>
</div>
<ul>
<li>The <code>#ifdef</code> (or <code>#ifndef</code>) directives, along with <code>#endif</code>, form a block of text. These directives should be placed within a file and must appear in pairs.</li>
<li>Whether the text block is included in the compiler's input depends on the definition of <code>MACRO_NAME</code>:
<ul>
<li>If <code>MACRO_NAME</code> is defined with <code>#define</code>, the text between <code>#ifdef</code> and <code>#endif</code> will be included. Otherwise, it will be excluded.</li>
<li>The <code>#ifndef</code> directive works in the opposite manner.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-background-image="url('remote-assets/f9a6594de46966d1b146b3a2.png')" data-paginate="true" data-style="section::after {

<h1 id="conditional-inclusion-if-elif-else-endif">Conditional inclusion: <code>#if</code>, <code>#elif</code>, <code>#else</code>, <code>#endif</code></h1>
<div class="columns">
<div class="columns-left">
<ul>
<li>
<p>One and only one text block of the 3 block<code>Text block 1</code>, <code>Text block 2</code><em>(optional)</em>, <code>Text block 3</code><em>(optional)</em> will be included due to the <code>macro_condition</code>'s value.</p>
</li>
<li>
<p><code>expression</code> is a constant expression using only constants and identifiers, defined using <code>#define</code> directives.</p>
</li>
</ul>
</div>
<div class="columns-right">
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">if</span> macro_condition</span>
   <span class="hljs-comment">// Text block 1</span>
<span class="hljs-meta">#<span class="hljs-keyword">elif</span> macro_condition</span>
   <span class="hljs-comment">// Text block 2</span>
<span class="hljs-meta">#<span class="hljs-keyword">else</span></span>
   <span class="hljs-comment">// Text block 3</span>
<span class="hljs-meta">#<span class="hljs-keyword">endif</span></span>
</code></pre>
</div>
</div>
<ul>
<li><code>#ifdef identifier</code> is essentially equivalent to <code>#if defined identifier</code>.</li>
<li><code>#ifndef identifier</code> is essentially equivalent to <code>#if !defined identifier</code>.</li>
</ul>
</section>

<li>
<p>If you happen to include one header twice in your source file, like</p>

#include &quot;</span>my_header.h`</span>
</code></pre>
<p>the consequence is diasterous: All the definitions in <code>my_header.h</code> (variables/functions) wiil appear twice which will make the program elaspsd.</p>
</li>
<li>
<p>You may think it will never happen, but do NOT forget you can nest any layers of header files. So do stardard libraries do. How they prevent the above crashes?</p>
<ul>
<li>Add header guards. It's also suggested to do this in all your header files.<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">ifndef</span> HEADER_GUARDS</span>

<li>In C and C++ programming terminology, a translation unit is the final <strong>input</strong> to a <strong>C or C++ compiler</strong>, from which an object file is generated.</li>

<div class="columns-right">
<p><img src="img/multi_files.svg" alt="" /></p>
</div>
</div>
<ul>

<h1 id="scope-and-lifetime">Scope and Lifetime</h1>
<ul>
<li>
<p><strong>Scope</strong>: The section of <strong>code</strong> where a variable is accessible.</p>
<ul>
<li>Each <a href="https://en.cppreference.com/w/c/language/identifier">identifier（标识符）</a> that appears in a C program is visible (that is, may be used) only in some possibly discontiguous portion of the source code.</li>
</ul>
</li>
<li>
<p><strong>Lifetime(<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0.124ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="0.968ex" role="img" focusable="false" viewBox="0 -483 778 428"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2248" d="M55 319Q55 360 72 393T114 444T163 472T205 482Q207 482 213 482T223 483Q262 483 296 468T393 413L443 381Q502 346 553 346Q609 346 649 375T694 454Q694 465 698 474T708 483Q722 483 722 452Q722 386 675 338T555 289Q514 289 468 310T388 357T308 404T224 426Q164 426 125 393T83 318Q81 289 69 289Q55 289 55 319ZM55 85Q55 126 72 159T114 210T163 238T205 248Q207 248 213 248T223 249Q262 249 296 234T393 179L443 147Q502 112 553 112Q609 112 649 141T694 220Q694 249 708 249T722 217Q722 153 675 104T555 55Q514 55 468 76T388 123T308 170T224 192Q164 192 125 159T83 84Q80 55 69 55Q55 55 55 85Z"></path></g></g></g></svg></mjx-container> storage duration)</strong>: The <strong>time duration</strong> during program execution when an <em><strong>object</strong></em> is valid (exists, has a constant address, retains its last-stored value) and can be used.</p>
<ul>
<li>Accessing an object outside of its lifetime results in <strong>undefined behavior</strong>.</li>
</ul>
</li>
</ul>
</section>

<h1 id="example-static-local-variable-inside-a-function">Example: Static local variable inside a function</h1>
<div class="columns">
<div class="columns-left">
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-type">void</span> <span class="hljs-title function_">count_calls</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-comment">// static local variable</span>
    <span class="hljs-type">static</span> <span class="hljs-type">int</span> count = <span class="hljs-number">0</span>;  
    count++;
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d times\n&quot;</span>, count);
}
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    count_calls();  <span class="hljs-comment">// First call</span>
    count_calls();  <span class="hljs-comment">// Second call</span>
    count_calls();  <span class="hljs-comment">// Third call</span>
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<pre><code>called 1 times
called 2 times
called 3 times
</code></pre>
</div>
<div class="columns-right">
<ul>
<li>
<p>Scope:<br />
The <code>count</code> variable is declared inside the <code>count_calls()</code> function, so its scope is limited to this function. It cannot be accessed or modified directly outside of this function.</p>
</li>
<li>
<p>Lifetime:<br />
The lifetime of the static variable <code>count</code> begins when the program starts, and it remains in memory until the program terminates. Its value persists between function calls.</p>
</li>
</ul>
</div>
</div>

<h1 id="example-accessing-an-object-outside-of-its-lifetime">Example: Accessing an object outside of its <strong>lifetime</strong></h1>
<pre><code class="language-c"><span class="hljs-type">int</span>* <span class="hljs-title function_">dangling_pointer</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">int</span> x = <span class="hljs-number">5</span>;  /
    <span class="hljs-keyword">return</span> &amp;x; 
}

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">int</span> *ptr = dangling_pointer();  
    <span class="hljs-comment">// ptr points to a local variable that no longer exists</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, *ptr);

    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<p>The behavior to access the return value of <code>dangling_pointer()</code> in the <code>main</code> function is <strong>undefined</strong> since the variable <code>x</code>'s lifetime has ended before the <code>dangling_pointer</code> return to its caller <code>main</code>.</p>

<h1 id="scope">Scope</h1>
<p><strong>When scopes overlap, the declaration in the inner scope <strong>hides</strong> the declaration from the outer scope.</strong></p>
<ul>
<li><strong>Block scope</strong>: Applies to function bodies, <code>if</code>, <code>switch</code>, <code>for</code>, <code>while</code>, <code>do-while</code> statements, and the parameter list of a function definition.
<ul>
<li>Begins at the point of declaration and ends at the end of the block or statement where it was declared.</li>
</ul>
</li>
<li><strong>File scope</strong>: Applies to identifiers declared outside of any block or parameter list.
<ul>
<li>Begins at the point of declaration and ends at the end of <strong>the translation unit</strong>.</li>
</ul>
</li>
<li><strong>*Function prototype scope</strong>: <code>int f(int n, int a[n]);</code><br />
Refers to a name introduced in the parameter list of a function declaration (not definition).
<ul>
<li>Ends at the end of the function <a href="https://en.cppreference.com/w/c/language/declarations">declarator</a>.</li>
</ul>
</li>
<li><em><strong>*Function scope</strong></em>, <em><strong>*Point of declaration</strong></em>: Beyond the class’s scope.</li>
</ul>
</section>

<h1 id="storage-duration---limiting-the-object-lifetime">Storage duration - limiting the object <strong>lifetime</strong></h1>
<ul>
<li><strong>automatic storage duration</strong>: exist only at certain points during execution
<ul>
<li>Applies to function parameters, non-<code>static</code> block-scope objects, etc.</li>
<li>Storage is allocated when the block where the object was decalred is entered and deallocated when it is exited</li>
</ul>
</li>
<li><strong>static storage duration</strong>:  have entire program life duration
<ul>
<li>The storage duration is the entire execution of the program.</li>
<li>The value stored in the object is initialized <strong>only once</strong>, prior to main function.</li>
<li>Applies to all objects declared <code>static</code>, etc.</li>
</ul>
</li>
<li><strong>allocated storage duration</strong>: have a lifetime determined by the programmer
<ul>
<li>Allocated and deallocated by request(dynamic memory allocation functions).</li>
</ul>
</li>
<li><strong>*thread storage duration</strong>: <em>beyond the class's scope</em></li>
</ul>
</section>

<h1 id="linkage-the-ability-to-be-referenced-in-other-scope">Linkage: <strong>the ability to be referenced</strong> in other scope</h1>
<p>Linkage refers to <strong>the ability of an identifier</strong> (variable or function) to be referenced <strong>in other scopes</strong>. The following types of linkage are recognized:</p>
<ul>
<li>
<p><strong>No linkage</strong>: The identifier can only be referenced <strong>from within its own scope</strong>.</p>
<ul>
<li>Applies to all function parameters and all non-<code>extern</code> block-scope variables (including the ones declared <code>static</code>).</li>
</ul>
</li>
<li>
<p><strong>Internal linkage</strong>: The identifier can be referenced <strong>within the current translation unit</strong>.</p>
<ul>
<li>Applies to all <code>static</code> <strong>file-scope</strong> identifiers (both functions and variables).</li>
</ul>
</li>
<li>
<p><strong>External linkage</strong>: The identifier can be referenced <strong>from any other translation units</strong>.</p>
<ul>
<li>Applies to all non-<code>static</code> functions, all <code>extern</code> variables (unless earlier declared <code>static</code>), and all file-scope non-<code>static</code> variables.</li>
</ul>
</li>
</ul>
</section>

<div class="columns">
  <div class="columns-left">
<h1 id="linkage">Linkage</h1>
<ul>
<li>
<p>In a C program with multiple source files, each file is compiled one at a time and linked into a single executable.</p>
</li>
<li>
<p>Until the compilation process, the scope of a variable defines its visibility and accessibility.</p>
<ul>
<li>The compiler utilizes the property of scope</li>
</ul>
</div>
<div class="columns-right">
<p><img src="img/Compilation-Process-in-C.png" alt="center" style="width:300px;" /></p>
</div>
</li>
</ul>
</div>
<ul>
<li>It is during the linking process that the linkage property comes into play:
<ul>
<li>Should a variable be accessible for use in another file?</li>
<li>Should a variable be restricted to use only within the file it was declared?</li>
</ul>
</li>
</ul>
</section>

<h1 id="scope-storage-duration-and-linkage-1">Scope, Storage duration and Linkage</h1>
<ul>
<li>All objects with either internal or external linkage have static sotrage duration.</li>
<li>Block-scope variables have no linkage and automatic storage duration by default.
<ul>
<li>Storage duration for local variables begins when the block is entered, but until the declaration is seen, the variable is not in scope and cannot be accessed.</li>
</ul>
</li>
<li>File-scope identifiers have external linkage and static storage duration by default.
<ul>
<li>How are these identifiers referred to from other translation units, given that their scopes are only within their own translation unit?</li>
</ul>
<blockquote>
<p>CppReference:<br />
If a variable or function with the same <strong>identifier</strong> is declared in several scopes, but cannot be referred to from all of them, then <strong>several instances of the variable are generated</strong>.</p>
</blockquote>
</li>
</ul>

<h2 id="internal-linkage-static-keyword">Internal Linkage: <code>static</code> Keyword</h2>
<div class="columns">
<div class="columns-left">
<ul>
<li>For block-scope variables,
<ul>
<li>grant them static storage duration</li>
<li>ensure them to be initialized once</li>
</ul>
</li>
</ul>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">void</span> <span class="hljs-title function_">counter</span><span class="hljs-params">()</span> {
  <span class="hljs-type">static</span> <span class="hljs-type">int</span> count = <span class="hljs-number">0</span>;

<h1 id="variables-implicit-initialization">Variables: Implicit Initialization</h1>
<p>If a variable is declared without explicit initialization:</p>
<ul>
<li>Ojects <strong>with automatic storage duration</strong> (e.g., local non-<code>static</code> variables) are initialized to <strong>indeterminate values</strong>. In other words, they are <strong>uninitialized</strong>.</li>
<li>For objects with static storage duration(e.g., global or local <code>static</code> variables), they are <a href="https://en.cppreference.com/w/c/language/initialization#Empty_initialization"><strong>empty-initialized</strong></a> (called <a href="https://en.cppreference.com/w/cpp/language/zero_initialization">zero-initialization</a> in C++):
<ul>
<li><strong>Pointers are initialized to <em>null pointer values</em> of their types.</strong></li>
<li>Objects of integral types are initialized to <code>0</code>.</li>
<li>Objects of floating types are initialized to positive zero (<code>0.0</code>).</li>
<li>All elements of arrays, all members of structs, and the first members of unions are empty-initialized, recursively, plus all padding bits are initialized to zero.</li>
</ul>
</li>
</ul>
</section>
