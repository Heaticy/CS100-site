<p>假设我们现在有一个文件 &quot;hello.c&quot;.</p>
<ul>
<li>Firstly, we compile it.
<ul>
<li>Command: <code>gcc hello.c -o hello</code>
<ul>
<li><code>-o</code>&quot; 即为指定输出文件的名字</li>
<li>如果没有<code>-o</code>，文件名就默认为&quot;a&quot;</li>
</ul>
</li>
<li>编译之后，<strong>可执行文件</strong>被生成
<ul>
<li>On Windows, it will be named &quot;hello.exe&quot;.</li>
<li>On Linux/MacOS, it will be named &quot;hello&quot;.</li>
</ul>
</li>
</ul>
</li>
</ul>
</section>

" data-theme="u3s2grhm01l1wtoazn4bzlrttyfhk81zc12w7m69hfmr" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--style:section::after {

<p>Now we have got the compiled file &quot;hello.exe&quot; or &quot;hello&quot;.</p>
<ul>
<li>Secondly, we run it.
<ul>
<li>Command: Linux/MacOS <code>./hello</code>; Windows: <code>.\hello</code></li>
<li>当然你也可以双击它，但它会“一闪而过”。（因为运行结束后窗口就会关闭）</li>
</ul>
</li>
</ul>
</section>

<h4 id="we-should-type-gcc-helloc--o-hello-and-hello-in-the-terminal%E7%BB%88%E7%AB%AF-to-compile-and-run">We should type <code>gcc hello.c -o hello</code> and <code>./hello</code> in the <strong>terminal（终端）</strong> to compile and run.</h4>
<ul>
<li>终端是一个CLI（命令行界面），允许您与操作系统通信。</li>
<li>您必须要求<strong>操作系统</strong>为您运行可执行文件。</li>
</ul>
<h4 id="%E5%9C%A8-vscodeclion-%E7%9A%84%E7%BB%88%E7%AB%AF%E4%B8%AD%E6%89%A7%E8%A1%8C%E4%BB%A5%E4%B8%8A%E6%8C%87%E4%BB%A4">在 VSCode/CLion 的终端中执行以上指令</h4>
<ul>
<li>
<p>VSCode: <code>ctrl</code>+<code>`</code> 开启终端，默认 working directory 为当前打开的文件夹。</p>
</li>
<li>
<p>CLion: 最下面 &quot;Terminal&quot;/“终端”，或 <code>Alt</code>+<code>F12</code></p>

<h2 id="%E5%AE%9A%E4%B9%89%E4%B8%80%E4%B8%AA%E5%87%BD%E6%95%B0-3">定义一个函数</h2>
<p>一个函数可以没有返回值，这样的函数返回值类型为 <code>void</code>。</p>
<p>和数学函数不同，C 函数不仅仅是“接受一些参数、返回一个值”，它实际上就是将一小段具有特定功能的代码单独拎出来，并且给它起个名字。</p>

<p>一个函数可以不接受参数（<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.464ex;" xmlns="http://www.w3.org/2000/svg" width="10.003ex" height="2.059ex" role="img" focusable="false" viewBox="0 -705 4421.1 910"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D453" d="M118 -162Q120 -162 124 -164T135 -167T147 -168Q160 -168 171 -155T187 -126Q197 -99 221 27T267 267T289 382V385H242Q195 385 192 387Q188 390 188 397L195 425Q197 430 203 430T250 431Q298 431 298 432Q298 434 307 482T319 540Q356 705 465 705Q502 703 526 683T550 630Q550 594 529 578T487 561Q443 561 443 603Q443 622 454 636T478 657L487 662Q471 668 457 668Q445 668 434 658T419 630Q412 601 403 552T387 469T380 433Q380 431 435 431Q480 431 487 430T498 424Q499 420 496 407T491 391Q489 386 482 386T428 385H372L349 263Q301 15 282 -47Q255 -132 212 -173Q175 -205 139 -205Q107 -205 81 -186T55 -132Q55 -95 76 -78T118 -61Q162 -61 162 -103Q162 -122 151 -136T127 -157L118 -162Z"></path></g><g data-mml-node="mo" transform="translate(827.8,0)"><path data-c="3A" d="M78 370Q78 394 95 412T138 430Q162 430 180 414T199 371Q199 346 182 328T139 310T96 327T78 370ZM78 60Q78 84 95 102T138 120Q162 120 180 104T199 61Q199 36 182 18T139 0T96 17T78 60Z"></path></g><g data-mml-node="mi" transform="translate(1383.6,0)"><path data-c="2205" d="M624 470Q624 468 639 446T668 382T683 291Q683 181 612 99T437 -1Q425 -2 387 -2T337 -1Q245 18 193 70L179 81L131 39Q96 8 89 3T75 -3Q55 -3 55 17Q55 24 61 30T111 73Q154 113 151 113Q151 114 140 130T115 177T95 241Q94 253 94 291T95 341Q112 431 173 495Q265 587 385 587Q410 587 437 581Q522 571 582 513L595 501L642 541Q689 586 695 586Q696 586 697 586T699 587Q706 587 713 583T720 568Q720 560 711 551T664 510Q651 499 642 490T628 475T624 470ZM564 477Q517 522 448 539Q428 546 375 546Q290 546 229 492T144 370Q133 332 133 279Q136 228 151 195Q157 179 168 160T184 141Q186 141 375 307T564 477ZM642 290Q642 318 637 343T625 386T611 416T598 436 <pre><code class="language-c">ReturnType <span class="hljs-title function_">do_some_work</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-comment">// ...</span>
}
</code></pre>
<p>和 C++ 不同，<strong>参数列表空着并不代表不接受参数</strong>，而是表示 &quot;accepting unknown parameters&quot;。这项规则自 C23 起才被删除。</p>
<ul>
<li>这是 C 的一个历史遗留问题。上古时期的 C 并不注重参数类型检查，这可能更接近汇编的风格，但也更容易出错。</li>
</ul>
</section>

" data-theme="u3s2grhm01l1wtoazn4bzlrttyfhk81zc12w7m69hfmr" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--style:section::after {

<h2 id="%E5%8F%A6%E4%B8%80%E4%B8%AA%E5%8E%86%E5%8F%B2%E9%81%97%E7%95%99%E9%97%AE%E9%A2%98">另一个历史遗留问题</h2>
<p>在 C99 之前，一个函数如果不写返回值类型，则返回值类型默认为 <code>int</code>。</p>
<p>事实上在旧的 C 语言中存在着大量的“默认为 <code>int</code>”的规则，在很多场合下这种写法极易引发难以预料的问题。</p>
<ul>
<li>不幸的是，为了兼容已经存在的上亿行旧代码，编译器大概率会允许这种写法，并仅仅给出一个 warning。</li>
</ul>
<p>你可能见过一些人写这样的 <code>main</code> 函数：</p>
<pre><code class="language-c">main() {
  <span class="hljs-comment">// ...</span>
}
</code></pre>
<p><strong>这不符合现代 C 语言的语法，也是极不推荐的写法。</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="u3s2grhm01l1wtoazn4bzlrttyfhk81zc12w7m69hfmr" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:u3s2grhm01l1wtoazn4bzlrttyfhk81zc12w7m69hfmr;" data-marpit-pagination-total="53">
<h2 id="%E6%9B%B4%E7%B3%9F%E7%B3%95%E7%9A%84%E5%8E%86%E5%8F%B2%E9%81%97%E7%95%99%E9%97%AE%E9%A2%98">更糟糕的历史遗留问题</h2>
<p>如果你调用了一个未经声明的函数</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> x = my_mysterious_function();
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, x);
}
</code></pre>
<p>C++ 编译器会给出一个十分正常的报错: &quot;... was not declared in this scope&quot;</p>
<pre><code>a.cpp: In function ‘int main()’:
a.cpp:4:11: error: ‘my_mysterious_function’ was not declared in this scope
    4 |   int x = my_mysterious_function();
      |           ^~~~~~~~~~~~~~~~~~~~~~
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="u3s2grhm01l1wtoazn4bzlrttyfhk81zc12w7m69hfmr" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--style:section::after {

;--theme:u3s2grhm01l1wtoazn4bzlrttyfhk81zc12w7m69hfmr;" data-marpit-pagination-total="53">
<h2 id="%E6%9B%B4%E7%B3%9F%E7%B3%95%E7%9A%84%E5%8E%86%E5%8F%B2%E9%81%97%E7%95%99%E9%97%AE%E9%A2%98-1">更糟糕的历史遗留问题</h2>
<p>如果你调用了一个未经声明的函数</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> x = my_mysterious_function();
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, x);
}
</code></pre>
<p>而 C 编译器会允许，并且给出一个令人困惑的 warning: &quot;implicit declaration&quot;</p>
<pre><code>a.c: In function ‘main’:
a.c:4:11: warning: implicit declaration of function ‘my_mysterious_function’
[-Wimplicit-function-declaration]
    4 |   int x = my_mysterious_function();
      |           ^~~~~~~~~~~~~~~~~~~~~~
</code></pre>
<p>当然，它是无法运行的，链接器会抱怨“找不到名为 <code>my_mysterious_function</code> 的函数”。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-style="section::after {

" data-theme="u3s2grhm01l1wtoazn4bzlrttyfhk81zc12w7m69hfmr" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--style:section::after {

<h2 id="%E6%9B%B4%E7%B3%9F%E7%B3%95%E7%9A%84%E5%8E%86%E5%8F%B2%E9%81%97%E7%95%99%E9%97%AE%E9%A2%98-2">更糟糕的历史遗留问题</h2>
<p>如果你调用了一个未经声明的函数</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">int</span> x = my_mysterious_function();
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, x);
}
</code></pre>
<p>C 标准认为你“隐式地声明” (implicitly declare) 了这个函数，于是压力全都给到链接器。</p>
<p>这一规则 C99 起被删除，但为了向后兼容 (backward compatibility)，编译器很可能仍然支持，只是给一个 warning。</p>
</section>

<p>函数的<strong>返回值</strong>是传给它的调用者的。</p>

<h2 id="main-%E5%87%BD%E6%95%B0%E7%9A%84%E8%BF%94%E5%9B%9E%E5%80%BC-1"><code>main</code> 函数的返回值</h2>
<p>函数的<strong>返回值</strong>是传给它的调用者的。</p>
<ul>
<li><code>main</code> 的“调用者”是谁？——程序的调用者/“宿主环境” (hosted environment)</li>
</ul>
<p><code>main</code> 函数返回 <code>0</code> ——程序正常退出</p>
<p><code>main</code> 函数返回其它值——代表某种错误</p>
<ul>
<li>一些程序会用不同的返回值表达不同的含义。</li>
<li>也有的程序只是在“任何错误”发生时都返回 <code>1</code> 。</li>
</ul>
</section>

<ul>
<li><code>scanf(&quot;%d\n%d\n&quot;, &amp;a, &amp;b)</code> 会发生什么？试一试。</li>
</ul>

<h2 id="ab-problem-2">A+B Problem</h2>
<p>约定输入格式：两行，每行一个整数，分别表示 <code>a</code> 和 <code>b</code>。</p>
<ul>
<li>
<p><code>scanf(&quot;%d\n%d\n&quot;, &amp;a, &amp;b)</code> 会卡住，<strong>直到你输入了一个非空白字符为止</strong>。</p>
</li>
<li>
<p>看看标准：</p>
<blockquote>
<p>whitespace characters: any single whitespace character in the format string <strong>consumes all available consecutive whitespace characters</strong> from the input (determined as if by calling isspace in a loop). Note that <strong>there is no difference</strong> between <code>&quot;\n&quot;</code>, <code>&quot; &quot;</code>, <code>&quot;\t\t&quot;</code>, or other whitespace in the format string.</p>
</blockquote>
</li>
<li>
<p>whitespace character: “空白字符”，包括空格、换行、回车、制表等。</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-style="section::after {

<p>约定输入格式：两行，每行一个整数，分别表示 <code>a</code> 和 <code>b</code>。</p>
<ul>
<li><code>scanf(&quot;%d%d&quot;, &amp;a, &amp;b)</code> 可以吗？试一试。</li>

<h2 id="ab-problem-4">A+B Problem</h2>
<p>约定输入格式：两行，每行一个整数，分别表示 <code>a</code> 和 <code>b</code>。</p>
<ul>
<li>
<p><code>scanf(&quot;%d%d&quot;, &amp;a, &amp;b)</code> 可以。</p>
</li>
<li>
<p>中间的换行符不写也可以？看看标准：</p>
<blockquote>
<p><code>&quot;%d&quot;</code> matches a decimal integer.</p>
</blockquote>
<blockquote>
<p>The format of the number is the same as expected by <code>strtol</code> with the value 10 for the base argument.</p>
</blockquote>
</li>
<li>
<p><code>strtol</code> 是什么鬼？<a href="https://en.cppreference.com/w/c/string/byte/strtol">点进去看看</a>：</p>
<blockquote>
<p>Interprets an integer value in a byte string pointed to by str.</p>
</blockquote>
<blockquote>
<p><strong>Discards any whitespace characters</strong> (as identified by calling <code>isspace</code>) until the first non-whitespace character is found, then...</p>
</blockquote>
</li>
</ul>

<p><code>double</code> 需要用 <code>%lf</code> 输出。如果我用 <code>%d</code> 输出，会怎样？</p>
<pre><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
  <span class="hljs-type">double</span> pi = <span class="hljs-number">3.14</span>;
  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d\n&quot;</span>, pi);
  <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<p>它和先将 <code>pi</code> 转换为 <code>int</code>（小数部分截去）再输出的效果一样吗？</p>
<pre><code class="language-c"><span class="hljs-type">double</span> pi = <span class="hljs-number">3.14</span>;
<span class="hljs-type">int</span> pi_int = pi; <span class="hljs-comment">// pi_int 值为 3</span>

<h2 id="printf-1"><code>printf</code></h2>
<p>在 <code>scanf</code> 和 <code>printf</code> 中，conversion specifier 与对应的变量类型不匹配是 <a href="https://en.cppreference.com/w/c/language/behavior"><strong>undefined behavior</strong></a>：<strong>你不能对程序的行为做任何假定。</strong></p>
<p>以下说法统统是错的：</p>
<ul>
<li><s>它会进行某种类型转换再输出</s></li>
<li><s>它会输出一个值，只是我不知道它是多少罢了</s></li>
</ul>
<p>程序完全有可能在这里直接崩溃。此外，编译器可以假定你的程序不含 undefined behavior，所以它如果发现这里有 undefined behavior，就可以直接把这行代码删掉，这完全符合语言标准。</p>

<li>*CMake: 一个跨平台的项目构建工具，在多文件编译的时候用到</li>
<li>*Git:  一个帮助你管理代码版本和查看代码改动的工具</li>
<li>...</li>

<h1 id="debugger">*Debugger</h1>
<ul>
<li><strong>breakpoint断点</strong>：在特定代码行设置暂停执行，以便更仔细地查看<strong>程序在某一行代码执行前的状态</strong>。</li>
<li><strong>监视变量</strong>：在程序运行时监视变量或表达式的值。</li>
<li><strong>逐步执行</strong>：一步一步地运行程序，可以逐行（Step Over），进入函数（Step into），也可以执行函数的剩余部分并在该函数执行结束之后暂停（Step Out）。</li>
<li>...</li>
</ul>
</section>
