<h2 id="iostream">IOStream</h2>
<p><code>ifstream</code>, <code>ofstream</code>: 文件输入流，文件输出流，定义在 <code>&lt;fstream&gt;</code> 里</p>
<p>一般的文件流（默认情况下既可输入又可输出）：<code>fstream</code></p>
<p>从文件读入：</p>
<pre><code class="language-cpp"><span class="hljs-function">std::ifstream <span class="hljs-title">ifs</span><span class="hljs-params">(<span class="hljs-string">&quot;path/to/myfile.ext&quot;</span>)</span></span>;
<span class="hljs-type">int</span> ival; std::string s;
ifs &gt;&gt; ival &gt;&gt; s;
</code></pre>
<p>向文件写入：</p>
<pre><code class="language-cpp"><span class="hljs-function">std::ofstream <span class="hljs-title">ofs</span><span class="hljs-params">(<span class="hljs-string">&quot;path/to/myfile.ext&quot;</span>)</span></span>;
ofs &lt;&lt; <span class="hljs-string">&quot;hello world&quot;</span> &lt;&lt; std::endl;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-style="section::after {

<h2 id="fstream">fstream</h2>
<p>打开文件的模式：<code>app</code>, <code>binary</code>, <code>in</code>, <code>out</code>, <code>trunc</code>, <code>ate</code>, (since C++23) <code>noreplace</code></p>
<p><a href="https://en.cppreference.com/w/cpp/io/basic_ifstream#Member_types_and_constants">https://en.cppreference.com/w/cpp/io/basic_ifstream#Member_types_and_constants</a></p>
<p>通过 <code>|</code> 可以将多个模式并起来，例如 <code>std::ios::out | std::ios::binary</code>。</p>
<p>默认情况下：<code>ifstream</code> 使用 <code>in</code>，<code>ofstream</code> 使用 <code>out</code>，<code>fstream</code> 使用 <code>in | out</code>。</p>
<ul>
<li>假如你传入的打开模式是 <code>mode</code>，<code>ifstream</code> 会以 <code>mode | in</code> 打开，<code>ofstream</code> 会以 <code>mode | out</code> 打开。</li>
<li><code>out</code> 会清空这个文件原来的内容，而 <code>app</code> 是将输出追加到原来的内容的后面。</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-function">std::ofstream <span class="hljs-title">file</span><span class="hljs-params">(<span class="hljs-string">&quot;myfile.txt&quot;</span>, std::ios::app)</span></span>;
file &lt;&lt; <span class="hljs-string">&quot;hello world&quot;</span> &lt;&lt; std::endl;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-style="section::after {

<h2 id="fstream-1">fstream</h2>
<p>可以在构造的时候打开文件，并同时指定打开模式；也可以在稍后用 <code>open</code> 打开一个文件，或用 <code>close</code> 关闭打开的文件：</p>
<pre><code class="language-cpp"><span class="hljs-function">std::ifstream <span class="hljs-title">file</span><span class="hljs-params">(<span class="hljs-string">&quot;myfile.txt&quot;</span>, std::ios::binary)</span></span>;
<span class="hljs-keyword">if</span> (!file.<span class="hljs-built_in">is_open</span>()) {
  <span class="hljs-comment">// myfile.txt is not found or cannot be opened.</span>
  <span class="hljs-comment">// handle this error.</span>
  file.<span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;myfile.txt&quot;</span>, std::ios::binary);
}
<span class="hljs-comment">// do something with the file</span>
file.<span class="hljs-built_in">close</span>();
file.<span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;another_file.txt&quot;</span>);
<span class="hljs-comment">// ...</span>
</code></pre>
<p><code>file</code> 的析构函数会关闭打开的文件。</p>

<h2 id="stl-%E6%A6%82%E8%A7%88">STL 概览</h2>
<p>诞生于 1994</p>
<ul>
<li>容器 containers：顺序 (sequence) 容器，关联 (associative) 容器</li>
<li>迭代器 iterators</li>
<li>算法 algorithms</li>
<li>适配器 adaptors：iterator adaptors, container adaptors</li>
<li>仿函数 function objects (functors)</li>
<li>空间分配器 allocators</li>
</ul>

<h2 id="%E9%A1%BA%E5%BA%8F%E5%AE%B9%E5%99%A8">顺序容器</h2>
<ul>
<li><code>vector&lt;T&gt;</code>：可变长数组，支持在末尾快速地添加、删除元素，支持随机访问 (random access)</li>
</ul>

<ul>
<li><code>deque&lt;T&gt;</code>：双端队列 (<strong>d</strong>ouble <strong>e</strong>nded <strong>que</strong>ue)，支持在开头和末尾快速地添加、删除元素，支持随机访问</li>
</ul>
<a align="center">

<h2 id="%E9%A1%BA%E5%BA%8F%E5%AE%B9%E5%99%A8-1">顺序容器</h2>
<ul>
<li><code>list&lt;T&gt;</code>：双向链表，支持在任意位置快速地添加、删除元素，支持双向遍历，不支持随机访问</li>
</ul>
<a align="center">
  <img src="img/list.png", width=470 />
</a>
<ul>
<li><code>forward_list&lt;T&gt;</code>：单向链表，支持在任意位置快速地添加、删除元素，仅支持单向遍历，不支持随机访问</li>
</ul>
<a align="center">
  <img src="img/forward_list.png", width=470 />
</a>
<ul>
<li><code>array&lt;T, N&gt;</code>：内置数组 <code>T[N]</code> 的套壳，提供和其它 STL 容器一致的接口（包括迭代器等），可以直接拷贝，不会退化为 <code>T *</code>。</li>
<li>特别的：<code>string</code> 不是容器，但非常像一个容器</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-style="section::after {

<h2 id="%E7%BB%9F%E4%B8%80%E7%9A%84%E6%8E%A5%E5%8F%A3%E6%9E%84%E9%80%A0">统一的接口：构造</h2>
<ol>
<li><code>Container c</code>：一个空的容器</li>
<li><code>Container c(n, x)</code>：<code>n</code> 个 <code>x</code></li>
<li><code>Container c(n)</code>：<code>n</code> 个元素，每个元素都被值初始化
<ul>
<li><code>string</code> 不支持这一操作，为什么？</li>
</ul>
</li>
<li><code>Container c(begin, end)</code>：从迭代器范围 <code>[begin, end)</code> 中拷贝元素。</li>
</ol>
<p><code>array&lt;T, N&gt;</code> 只支持 1 ，为什么？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-style="section::after {

" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--style:section::after {

<h2 id="%E7%BB%9F%E4%B8%80%E7%9A%84%E6%8E%A5%E5%8F%A3%E5%AE%8C%E6%95%B4%E5%88%97%E8%A1%A8">统一的接口：<a href="https://en.cppreference.com/w/cpp/container#Member_function_table">完整列表</a></h2>
<p>相同的功能在所有容器上都具有相同的接口（除了 <code>forward_list</code> 有一点点特殊）</p>
<ul>
<li>拷贝构造、拷贝赋值、移动构造、移动赋值</li>
<li><code>c.size()</code>, <code>c.empty()</code>, <code>c.resize(n)</code></li>
<li><code>c.capacity()</code>, <code>c.reserve(n)</code>, <code>c.shrink_to_fit()</code></li>
<li><code>c.push_back(x)</code>, <code>c.emplace_back(args...)</code>, <code>c.pop_back()</code></li>
<li><code>c.push_front(x)</code>, <code>c.emplace_front(args...)</code>, <code>c.pop_front()</code></li>
<li><code>c.at(i)</code>, <code>c[i]</code>, <code>c.front()</code>, <code>c.back()</code></li>
<li><code>c.insert(pos, ...)</code>, <code>c.emplace(pos, args...)</code>, <code>c.erase(...)</code>, <code>c.clear()</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-style="section::after {

<h2 id="%E7%BB%9F%E4%B8%80%E7%9A%84%E6%8E%A5%E5%8F%A3">统一的接口</h2>
<p>记忆的关键：</p>
<ol>
<li>理解每一种容器的底层数据结构，自然就明白为何支持/不支持某种操作
<ul>
<li>为何链表不支持下标访问？为何 <code>vector</code> 不支持在开头添加元素？</li>
</ul>
</li>
<li>记住这些接口的名字</li>
<li>如果一个操作应该被支持，它就必然叫那个名字、是那个用法</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-style="section::after {

" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--style:section::after {

<h2 id="string-%E5%92%8C-vector-%E7%9A%84%E5%AE%B9%E9%87%8F"><code>string</code> 和 <code>vector</code> 的“容量”</h2>
<p><code>string</code> 大概率和 <code>vector</code> 采用类似的增长方式，分配的内存可能比当前存储的元素所占用的内存大。</p>
<ul>
<li>当前所拥有的内存能放下多少个元素，称为“容量” (capacity)，可以通过 <code>c.capacity()</code> 查询。</li>
<li><code>c.reserve(n)</code> 为至少 <code>n</code> 个元素预留内存。
<ul>
<li>如果 <code>n &lt;= c.capacity()</code>，什么都不会发生。</li>
<li>否则，重新分配内存使得 <code>c</code> 能装得下至少 <code>n</code> 个元素。</li>
<li><strong>务必区分 <code>reserve</code> 和 <code>resize</code>。</strong></li>
</ul>
</li>
<li><code>c.shrink_to_fit()</code>：<strong>请求</strong> <code>c</code> 释放多余的容量（可能重新分配一块更小的内存）
<ul>
<li>这个函数在 <code>deque</code> 上也有。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-style="section::after {

" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--style:section::after {

<h2 id="insert-%E5%92%8C-erase"><code>insert</code> 和 <code>erase</code></h2>
<p><code>c.insert(pos, ...)</code>, <strong><code>c.emplace(pos, args...)</code></strong> ，其中 <code>pos</code> 是一个迭代器。</p>
<p>在 <code>pos</code> 所指的位置<strong>之前</strong>添加元素。</p>
<ul>
<li><code>insert</code> 有很多种写法，可以 <code>c.insert(pos, x)</code>, <code>c.insert(pos, begin, end)</code>, <code>c.insert(pos, {a, b, c, ...})</code> 等等，用到的时候再查。</li>
</ul>
<p><code>c.erase(...)</code> 也有很多种写法，用到的时候再查。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-style="section::after {

<h2 id="%E7%89%B9%E6%AE%8A%E7%9A%84-forward_list">特殊的 <code>forward_list</code></h2>
<p><code>forward_list</code> 的功能完全被 <code>list</code> 包含，那为何我们还需要 <code>forward_list</code>？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-style="section::after {

" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--style:section::after {

<h2 id="%E7%89%B9%E6%AE%8A%E7%9A%84-forward_list-1">特殊的 <code>forward_list</code></h2>
<p><code>forward_list</code> 的功能完全被 <code>list</code> 包含，那为何我们还需要 <code>forward_list</code>？</p>
<p><strong>为了省时间，省空间。</strong></p>
<ul>
<li>单向链表的结点比双向链表的结点少存一个指针</li>
<li>维护单向链表上的链接关系也比维护双向链表少一些操作</li>
</ul>
<p>因此，<code>forward_list</code> 采取最简的实现：能省则省</p>
<ul>
<li>它不能 <code>push_back</code>/<code>pop_back</code>。
<ul>
<li>如果需要，你可以自己保存指向末尾元素的迭代器，然后用 <code>insert_after</code></li>
</ul>
</li>
<li>它甚至不支持 <code>size()</code>。如果需要，你可以自己用一个变量记录。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--style:section::after {

}
;--theme:ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc;" data-marpit-pagination-total="41">
<h2 id="%E7%89%B9%E6%AE%8A%E7%9A%84-forward_list-2">特殊的 <code>forward_list</code></h2>
<p><code>insert</code>, <code>emplace</code> 和 <code>erase</code> 变成了 <code>insert_after</code>, <code>emplace_after</code> 和 <code>erase_after</code></p>
<ul>
<li>单向链表上，操作“下一个元素”比操作“当前元素”或“前一个元素”更方便。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-style="section::after {

" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--style:section::after {

;--theme:ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc;" data-marpit-pagination-total="41">
<h2 id="%E8%B6%8A%E7%95%8C%E6%A3%80%E6%9F%A5">越界检查</h2>
<p><code>c.at(i)</code> 在越界时抛出 <code>std::out_of_range</code> 异常</p>
<p><code>c[i]</code>, <code>c.front()</code>, <code>c.back()</code>, <code>c.pop_back()</code>, <code>c.pop_front()</code> 统统不检查越界，一切为了效率。</p>
<p>但是我们在自己设计自己的容器时，不一定要采用标准库的这种方式。</p>
<ul>
<li>
<p>也许下面这种设计更合理？</p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> &amp;<span class="hljs-keyword">operator</span>[](size_type n) {
  <span class="hljs-built_in">assert</span>(n &lt; <span class="hljs-built_in">size</span>());
  <span class="hljs-keyword">return</span> data[n];
}
</code></pre>
<ul>
<li><code>assert</code> 在 Debug 模式下生效，而在 Release 模式下（定义了 <code>NDEBUG</code> 宏）无效，不会影响 Release 模式下的效率。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-style="section::after {

</ul>
<p>无序关联容器（<code>unordered</code>）：</p>
<ul>
<li>元素是无序的（因为底层数据结构是哈希表）</li>
<li>支持平均情况下 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="4.618ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2041 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g><g data-mml-node="mo" transform="translate(763,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="mn" transform="translate(1152,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g><g data-mml-node="mo" transform="translate(1652,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z"></path></g></g></g></svg></mjx-container> 地插入、删除、查找元素</li>

<h1 id="%E8%BF%AD%E4%BB%A3%E5%99%A8">迭代器</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--style:section::after {

}
;--theme:ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc;" data-marpit-pagination-total="41">
<h2 id="%E5%A4%8D%E4%B9%A0%E5%81%87%E5%A6%82%E6%B2%A1%E6%9C%89%E8%BF%AD%E4%BB%A3%E5%99%A8">复习：假如没有迭代器...</h2>
<p>不同的容器，根据底层数据结构不同，遍历方式自然也不同：</p>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (std::<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i != a.<span class="hljs-built_in">size</span>(); ++i)
  <span class="hljs-built_in">do_something</span>(a[i]);
<span class="hljs-comment">// 可能的方式：通过指向结点的“句柄”（指针）遍历一个链表</span>
<span class="hljs-keyword">for</span> (node_handle node = l.<span class="hljs-built_in">first_node</span>(); node; node = node.<span class="hljs-built_in">next</span>())
  <span class="hljs-built_in">do_something</span>(node.<span class="hljs-built_in">value</span>())
</code></pre>
<p>如果是个更复杂的容器呢，比如基于哈希表/红黑树实现的关联容器？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc;" data-marpit-pagination-total="41">
<h2 id="%E5%A4%8D%E4%B9%A0%E4%BD%BF%E7%94%A8%E7%BB%9F%E4%B8%80%E7%9A%84%E6%96%B9%E5%BC%8F%E8%AE%BF%E9%97%AE%E5%85%83%E7%B4%A0%E9%81%8D%E5%8E%86%E5%AE%B9%E5%99%A8">复习：使用统一的方式访问元素、遍历容器</h2>
<p>所有容器都有其对应的迭代器类型 <code>Container::iterator</code>，例如 <code>std::string::iterator</code>, <code>std::vector&lt;int&gt;::iterator</code>。</p>
<p>所有容器都支持 <code>c.begin()</code>, <code>c.end()</code>，分别返回指向<strong>首元素</strong>和指向<strong>尾后位置</strong>的迭代器。</p>
<a align="center">
  <img src="img/range-begin-end.svg", width=900 />
</a>
<p><strong>* 我们总是使用左闭右开区间 <code>[begin, end)</code> 表示一个“迭代器范围”</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc;" data-marpit-pagination-total="41">
<h2 id="%E5%A4%8D%E4%B9%A0%E4%BD%BF%E7%94%A8%E7%BB%9F%E4%B8%80%E7%9A%84%E6%96%B9%E5%BC%8F%E8%AE%BF%E9%97%AE%E5%85%83%E7%B4%A0%E9%81%8D%E5%8E%86%E5%AE%B9%E5%99%A8-1">复习：使用统一的方式访问元素、遍历容器</h2>
<ul>
<li><code>it1 != it1</code> 比较两个迭代器是否相等（指向相同位置）</li>
<li><code>++it</code> 让 <code>it</code> 指向下一个位置。</li>
<li><code>*it</code> 获取 <code>it</code> 指向的元素的<strong>引用</strong>。</li>
</ul>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> it = c.<span class="hljs-built_in">begin</span>(); it != c.<span class="hljs-built_in">end</span>(); ++it)
  <span class="hljs-built_in">do_something</span>(*it);
</code></pre>
<p>基于范围的 <code>for</code> 语句：完全等价于上面的使用迭代器的遍历</p>
<pre><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> &amp;x : c)
  <span class="hljs-built_in">do_something</span>(x);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc;" data-marpit-pagination-total="41">
<h2 id="const_iterator"><code>const_iterator</code></h2>
<p>带有“<strong>底层 <code>const</code></strong>”的迭代器。</p>
<ul>
<li><code>Container::const_iterator</code></li>
<li><code>c.cbegin()</code>, <code>c.cend()</code></li>
<li>在一个 <code>const</code> 对象上，<code>c.begin()</code> 和 <code>c.end()</code> <strong>也返回 <code>const_iterator</code></strong>。</li>
</ul>
<p>对 <code>const_iterator</code> 解引用会得到 <code>const T &amp;</code> 而非 <code>T &amp;</code>，无法通过它修改元素的值。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc;" data-marpit-pagination-total="41">
<h2 id="begin-end-cbegin-cend"><code>begin</code>, <code>end</code>, <code>cbegin</code>, <code>cend</code></h2>
<p>再次出现了 <code>const</code> 和 non-<code>const</code> 的重载。</p>
<pre><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">MyContainer</span> {
<span class="hljs-keyword">public</span>:
  <span class="hljs-keyword">using</span> iterator = <span class="hljs-comment">/* unspecified */</span>;
  <span class="hljs-keyword">using</span> const_iterator = <span class="hljs-comment">/* unspecified */</span>;
  <span class="hljs-function">iterator <span class="hljs-title">begin</span><span class="hljs-params">()</span></span>;
  <span class="hljs-function">const_iterator <span class="hljs-title">begin</span><span class="hljs-params">()</span> <span class="hljs-type">const</span></span>;
  <span class="hljs-function">iterator <span class="hljs-title">end</span><span class="hljs-params">()</span></span>;
  <span class="hljs-function">const_iterator <span class="hljs-title">end</span><span class="hljs-params">()</span> <span class="hljs-type">const</span></span>;
  <span class="hljs-function">const_iterator <span class="hljs-title">cbegin</span><span class="hljs-params">()</span> <span class="hljs-type">const</span></span>;
  <span class="hljs-function">const_iterator <span class="hljs-title">cend</span><span class="hljs-params">()</span> <span class="hljs-type">const</span></span>;
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc;" data-marpit-pagination-total="41">
<h2 id="%E5%A4%8D%E4%B9%A0%E8%BF%AD%E4%BB%A3%E5%99%A8%E5%9E%8B%E5%88%AB-iterator-category">复习：迭代器型别 (iterator category)</h2>
<ul>
<li>ForwardIterator: 支持 <code>*it</code>, <code>it-&gt;mem</code>, <code>++it</code>, <code>it++</code>, <code>it1 == it2</code>, <code>it1 != it2</code></li>
<li>BidirectionalIterator: 在 ForwardIterator 的基础上，支持 <code>--it</code>, <code>it--</code>。</li>
<li>RandomAccessIterator: 在 BidirectionalIterator 的基础上，支持 <code>it[n]</code>, <code>it + n</code>, <code>it += n</code>, <code>n + it</code>, <code>it - n</code>, <code>it -= n</code>, <code>it1 - it2</code>, <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>。</li>
</ul>
<p><code>vector</code>, <code>string</code>, <code>array</code>, <code>deque</code> 的迭代器是 RandomAccessIterator；<code>list</code> 的迭代器是 BidirectionalIterator；<code>forward_list</code> 的迭代器是 ForwardIterator。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc;" data-marpit-pagination-total="41">
<h2 id="%E5%A4%8D%E4%B9%A0%E8%BF%AD%E4%BB%A3%E5%99%A8%E5%9E%8B%E5%88%AB-iterator-category-1">复习：迭代器型别 (iterator category)</h2>
<p>还有两种迭代器型别：InputIterator 和 OutputIterator。</p>
<ul>
<li>
<p>InputIterator 表示<strong>可以通过这个迭代器获得元素</strong>（不要求能修改它所指向的元素）</p>
</li>
<li>
<p>OutputIterator 表示<strong>可以通过这个迭代器写入元素</strong>（不要求能获得它所指向的元素）</p>
</li>
<li>
<p>A ForwardIterator <strong>is an</strong> InputIterator.</p>
</li>
</ul>
<p>稍后我们会看到一些例子。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--style:section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
;--theme:ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc;" data-marpit-pagination-total="41">
<h2 id="%E8%BF%AD%E4%BB%A3%E5%99%A8%E7%9A%84%E8%BE%85%E5%8A%A9%E5%87%BD%E6%95%B0">迭代器的辅助函数</h2>
<ul>
<li><code>std::advance(iter, n)</code> 将 <code>iter</code> 前进 <code>n</code> 步。 <code>n</code> 也可以是负的。</li>
<li><code>std::distance(iter1, iter2)</code> 返回 <code>iter</code> 和 <code>iter2</code> 之间的<strong>距离</strong>：相距几个元素。</li>
<li><code>std::next(iter)</code> 返回 <code>iter</code> 的“下一个位置”， <code>std::prev(iter)</code> 返回 <code>iter</code> 的“上一个位置”，它们都不会改变 <code>iter</code> 本身。
<ul>
<li>用来代替手动的 <code>auto tmp = iter; ++tmp;</code> 。</li>
</ul>
</li>
</ul>
<p>以上函数对于<strong>各类迭代器型别</strong>都有支持，并且会针对不同的型别提供不同的实现。</p>
<ul>
<li>不管 <code>iter1</code> 和 <code>iter2</code> 是什么型别，你都可以用 <code>std::distance(iter1, iter2)</code> 获取它们的距离，不用担心 <code>iter1 - iter2</code> 这个表达式能不能编译之类的问题。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-style="section::after {
  content: attr(data-marpit-pagination) '/' attr(data-marpit-pagination-total);
}
" data-theme="ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--style:section::after {

}
;--theme:ounif7vcc8bypg06p1mqsrphmawf2tu8zj0d44q7zrc;" data-marpit-pagination-total="41">
<h1 id="%E8%BF%AD%E4%BB%A3%E5%99%A8%E9%80%82%E9%85%8D%E5%99%A8-iterator-adaptors">迭代器适配器 (iterator adaptors)</h1>
</section>

<h2 id="%E8%BF%AD%E4%BB%A3%E5%99%A8%E9%80%82%E9%85%8D%E5%99%A8-iterator-adaptors-1">迭代器适配器 (iterator adaptors)</h2>
<p>一种用起来像迭代器的东西</p>
<ul>
<li>可能是根据某个迭代器和/或一些别的东西“变出来”的</li>
<li>用起来像迭代器，但多多少少有点区别，比如
<ul>
<li>反向迭代： <code>++</code> 实际上是 <code>--</code></li>
<li>帮助移动元素： <code>*iter</code> 返回右值引用</li>
<li>看似迭代，实则插入元素： <code>*iter++ = x</code> 会被“变”成 <code>c.push_back(x)</code></li>
<li>将某些特殊的过程也抽象为“迭代”： <code>x = *iter++</code> 被“变”成 <code>std::cin &gt;&gt; x</code></li>
<li>......</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-style="section::after {

<h2 id="%E5%8F%8D%E5%90%91%E8%BF%AD%E4%BB%A3%E5%99%A8-reverse_iterator">反向迭代器 <code>reverse_iterator</code></h2>
<p>每个容器都有自己的反向迭代器： <code>Container::reverse_iterator</code> 和 <code>Container::const_reverse_iterator</code> ，通常被这样定义：</p>
<pre><code class="language-cpp"><span class="hljs-keyword">using</span> reverse_iterator = std::reverse_iterator&lt;iterator&gt;;
<span class="hljs-keyword">using</span> const_reverse_iterator = std::reverse_iterator&lt;const_iterator&gt;;
</code></pre>
<ul>
<li><code>c.rbegin()</code>, <code>c.rend()</code>, <code>c.crbegin()</code>, <code>c.crend()</code></li>
<li><code>++</code> 和 <code>--</code> 在反向迭代器上都是反的。</li>
</ul>
<pre><code class="language-cpp">std::vector v{<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>, <span class="hljs-number">5</span>};
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> rit = v.<span class="hljs-built_in">rbegin</span>(); rit != v.<span class="hljs-built_in">rend</span>(); ++rit)
  std::cout &lt;&lt; *rit &lt;&lt; <span class="hljs-string">&#x27; &#x27;</span>;
</code></pre>
<p>输出：<code>5 4 3 2 1 </code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-style="section::after {

<h2 id="%E7%A7%BB%E5%8A%A8%E8%BF%AD%E4%BB%A3%E5%99%A8-move_iterator">移动迭代器 <code>move_iterator</code></h2>
<ul>
<li><code>std::make_move_iterator(iter)</code> 从一个普通的迭代器 <code>iter</code> 变出一个“移动迭代器”</li>
<li><code>*mit</code> 会得到右值引用而非左值引用，从而元素更可能被移动而非被拷贝。</li>
</ul>
<pre><code class="language-cpp">std::vector&lt;std::string&gt; words = <span class="hljs-built_in">someValues</span>();
<span class="hljs-function">std::vector&lt;std::string&gt; <span class="hljs-title">v</span><span class="hljs-params">(words.size())</span></span>;
std::<span class="hljs-built_in">copy</span>(std::<span class="hljs-built_in">make_move_iterator</span>(words.<span class="hljs-built_in">begin</span>()),
          std::<span class="hljs-built_in">make_move_iterator</span>(words.<span class="hljs-built_in">end</span>()), v.<span class="hljs-built_in">begin</span>());
</code></pre>
<p><code>words</code> 中的每个 <code>string</code> 被<strong>移动</strong>进了 <code>v</code>，而不是拷贝。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-style="section::after {

<h2 id="%E4%BB%8E%E8%BF%AD%E4%BB%A3%E5%99%A8%E5%90%91%E8%BF%AD%E4%BB%A3%E5%99%A8%E7%9A%84%E6%98%A0%E5%B0%84">从迭代器向迭代器的映射</h2>
<p>对于一个给定的迭代器类型 <code>Iter</code> ， <code>std::reverse_iterator&lt;Iter&gt;</code> 和 <code>std::move_iterator&lt;Iter&gt;</code> 都是一个新的迭代器类型:</p>
<ul>
<li>它们是 <code>Iter</code> 的“wrapper”：在内部保存一个 <code>Iter</code> 类型的原始迭代器，可以通过 <code>rit.base()</code> 访问。</li>
<li>它们基于 <code>Iter</code> 的接口定义自己的接口： <code>++rit</code> 会调用 <code>--it</code> ， <code>*mit</code> 会返回 <code>std::move(*it)</code></li>
</ul>
<p>C++23 还有个 <code>std::basic_const_iterator&lt;Iter&gt;</code> ，用类似的方式定义了 <code>Iter</code> 的带有底层 <code>const</code> 的版本。</p>
<p>你当然可以用类似的方式实现自己的特殊迭代器。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-style="section::after {

<h2 id="%E6%8F%92%E5%85%A5%E8%BF%AD%E4%BB%A3%E5%99%A8">插入迭代器</h2>
<p><code>insert_iterator</code>, <code>front_insert_iterator</code>, <code>back_insert_iterator</code></p>
<p>典型的 OutputIterator：</p>
<ul>
<li>只可向 <code>*iter</code> 写入元素，不能从 <code>*iter</code> 读取元素</li>
<li>它们会调用容器的 <code>insert</code>, <code>push_front</code> 或 <code>push_back</code>，将“写入”的元素插入容器</li>
</ul>
<pre><code class="language-cpp">std::vector&lt;<span class="hljs-type">int</span>&gt; numbers = <span class="hljs-built_in">someValues</span>();
std::vector&lt;<span class="hljs-type">int</span>&gt; v;
std::<span class="hljs-built_in">copy</span>(numbers.<span class="hljs-built_in">begin</span>(), numbers.<span class="hljs-built_in">end</span>(), v.<span class="hljs-built_in">begin</span>()); <span class="hljs-comment">// 错误！</span>
std::<span class="hljs-built_in">copy</span>(numbers.<span class="hljs-built_in">begin</span>(), numbers.<span class="hljs-built_in">end</span>(), std::<span class="hljs-built_in">back_inserter</span>(v)); <span class="hljs-comment">// 正确</span>
</code></pre>
<p><code>std::back_inserter(c)</code> 生成一个 <code>std::back_insert_iterator&lt;Container&gt;</code>，它内部保存一个 <code>Container &amp;r = c</code> ，会不断调用 <code>r.push_back(x)</code> 将向它“写入”的元素添加进 <code>c</code>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-style="section::after {

<h2 id="%E6%B5%81%E8%BF%AD%E4%BB%A3%E5%99%A8">流迭代器</h2>
<p>读入一串数存进一个 <code>vector&lt;int&gt;</code>：</p>
<pre><code class="language-cpp"><span class="hljs-function">std::vector&lt;<span class="hljs-type">int</span>&gt; <span class="hljs-title">v</span><span class="hljs-params">(std::istream_iterator&lt;<span class="hljs-type">int</span>&gt;(std::cin),
                   std::istream_iterator&lt;<span class="hljs-type">int</span>&gt;{})</span></span>;
</code></pre>
<p>利用 <code>std::copy</code> 将 <code>v</code> 中的元素输出，并且每个后面跟一个 <code>&quot;, &quot;</code>：</p>
<pre><code class="language-cpp">std::<span class="hljs-built_in">copy</span>(v.<span class="hljs-built_in">begin</span>(), v.<span class="hljs-built_in">end</span>(), std::<span class="hljs-built_in">ostream_iterator</span>&lt;<span class="hljs-type">int</span>&gt;(std::cout, <span class="hljs-string">&quot;, &quot;</span>));
</code></pre>
<ul>
<li><code>istream_iterator</code> 是一种 InputIterator，它不断从输入流中获取元素</li>
<li><code>ostream_iterator</code> 是一种 OutputIterator，它不断将向它“写入”的元素写进输出流</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-style="section::after {

<h2 id="%E8%BF%AD%E4%BB%A3%E5%99%A8%E5%9E%8B%E5%88%AB">迭代器型别</h2>
<p>InputIterator 和 ForwardIterator 都要求支持 <code>++it</code>, <code>it++</code>, <code>*it</code>, <code>it-&gt;mem</code>, <code>==</code>, <code>!=</code>。</p>
<p>这两类迭代器的区别究竟是什么？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-style="section::after {

<h2 id="%E8%BF%AD%E4%BB%A3%E5%99%A8%E5%9E%8B%E5%88%AB-1">迭代器型别</h2>
<p>InputIterator 和 ForwardIterator 都要求支持 <code>++it</code>, <code>it++</code>, <code>*it</code>, <code>it-&gt;mem</code>, <code>==</code>, <code>!=</code>。</p>
<p>这两类迭代器的区别究竟是什么？—— ForwardIterator 提供 <strong>multi-pass guarantee</strong></p>
<pre><code class="language-cpp"><span class="hljs-keyword">auto</span> original = iter;       <span class="hljs-comment">// 对当前的 iter 做个拷贝</span>
<span class="hljs-keyword">auto</span> value = *iter;         <span class="hljs-comment">// 现在 iter 指向的元素是 value</span>
++iter;
<span class="hljs-built_in">assert</span>(*original == value);
</code></pre>
<p>对于一个 ForwardIterator 来说，<code>original</code> 指向了 <code>iter</code> 在递增之前指向的位置，那个位置上的值始终是 <code>value</code>。</p>
<p>InputIterator 不这么认为，它只保证能“input”：<code>++iter</code> 就意味着我们打算获取“下一个值”了，先前的值也就无法再被获取了。（考虑“输入”的过程）</p>
</section>
