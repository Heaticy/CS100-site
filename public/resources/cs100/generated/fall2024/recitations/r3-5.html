<h1 id="tell-a-story">tell a story</h1>
<ul>
<li>
<p>有一天小李和小刘CS100大作业组队，他们要写一个植物大战僵尸的游戏。</p>
</li>
<li>
<p>他们约好一个人写植物，一个人写僵尸，写完自己的part就用微信把plant.c文件和zombie.c文件用微信传过去看看能不能work</p>
</li>
<li>
<p>小李下载了小刘写的zombie.c，然后发现不能work，然后改了自己写的plant.c然后微信传给小刘</p>
</li>
<li>
<p>小刘下载了小李的plant.c以后又发现自己少写了个僵尸，补上以后正准备给小李时候收到了来自他的plant.c，然后替换了plants.c到最新版本以后发现又不能和自己新写的一起work了，于是他把自己zombie.c发过去让小李改好自己的plants.....</p>
</li>
</ul>
</section>

<h1 id="bad-ending">bad ending</h1>
<ul>
<li>此时小李已经感到有些生理不适了，但他还是按着最新的zombie.c改好了自己的plant.c并微信发过去</li>
<li>但是小刘是个完美主义者，他一定要把自己的僵尸弄好看点于是又弄了一版zombie.c然后发给lcf让他提交</li>
<li>提交时候小李手滑没弄错了版本，把初代zombie.c用zip压缩后提交了</li>
<li>当然这个zip编译都编译不了的，两人天神下凡怒砍一个B，小刘对这次合作非常生气，删掉了小李的好友</li>
